<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>荒原</title>
<style>
/* base.css — 设计变量/字体/木漆鎏金基底（江湖风云录风）。时辰换色由 body[data-lut] 驱动。 */
:root {
    --wood: #241708;
    --wood-2: #33230f;
    --wood-3: #4a3418;
    --gold: #c9a227;
    --gold-2: #e6c868;
    --paper: #e8dab5;
    --paper-2: #d8c48f;
    --ink: #17100a;
    --blood: #8b1a1a;
    --blood-2: #c03a3a;
    --cold: #5f8a92;
    --ok: #6e8f4f;
    --font-serif: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    --font-mono: "Consolas", "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
    margin: 0;
    font-family: var(--font-serif);
    color: var(--paper);
    background: var(--wood);
    transition: background 1.2s ease;
}

/* ── 时辰色调：黎明/白昼/黄昏/入夜/血色（mapBoard.css 同步格子换色）── */
body[data-lut="dawn"] { background: linear-gradient(180deg, #4a3a44 0%, var(--wood) 70%); }
body[data-lut="day"] { background: linear-gradient(180deg, #5a4322 0%, var(--wood) 75%); }
body[data-lut="dusk"] { background: linear-gradient(180deg, #5c3a1c 0%, #241108 80%); }
body[data-lut="night"] { background: linear-gradient(180deg, #101822 0%, #0a0704 85%); }
body[data-lut="blood"] { background: linear-gradient(180deg, #2a0a0a 0%, #0a0505 85%); }

h3 {
    margin: 10px 0 6px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--gold-2);
    border-bottom: 1px solid var(--wood-3);
    padding-bottom: 3px;
}

button {
    font-family: var(--font-serif);
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--paper);
    background: linear-gradient(180deg, var(--wood-3), var(--wood-2));
    border: 1px solid var(--gold);
    border-radius: 3px;
    padding: 5px 12px;
    cursor: pointer;
}

button:hover:not(:disabled) {
    background: linear-gradient(180deg, var(--gold), var(--gold-2));
    color: var(--ink);
}

button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

button.go {
    border-color: var(--gold-2);
    box-shadow: 0 0 6px rgba(230, 200, 104, 0.35);
}

input, select {
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--gold);
    border-radius: 3px;
    padding: 3px 6px;
}

.mono {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--paper-2);
    line-height: 1.7;
}

</style>
<style>
/* panelLayout.css — 顶栏状态/侧栏/荒原记事/弹窗/结局页。 */

/* ── 顶栏 ── */
#topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 8px 14px;
    background: linear-gradient(180deg, var(--wood-3), var(--wood-2));
    border-bottom: 2px solid var(--gold);
    position: sticky;
    top: 0;
    z-index: 20;
}

#topbar .brand {
    font-size: 18px;
    letter-spacing: 6px;
    color: var(--gold-2);
    text-shadow: 0 1px 2px #000;
}

#phaseTag, #meterTag {
    font-size: 12.5px;
    color: var(--paper-2);
    letter-spacing: 1px;
}

#axes {
    display: grid;
    grid-template-columns: repeat(4, 90px);
    gap: 2px 12px;
    font-size: 11px;
}

#axes .row {
    display: flex;
    justify-content: space-between;
    color: var(--paper-2);
}

#axes .bar {
    height: 5px;
    background: var(--ink);
    border: 1px solid var(--wood-3);
    border-radius: 2px;
    overflow: hidden;
}

#axes .bar > i {
    display: block;
    height: 100%;
    transition: width 0.5s ease;
}

.boot-area {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
}

.boot-lab { color: var(--paper-2); }
.boot-lab input { width: 84px; }

/* ── 三栏主体 ── */
#stage {
    display: grid;
    grid-template-columns: 250px minmax(320px, 1fr) 340px;
    gap: 10px;
    padding: 10px;
    min-height: calc(100vh - 56px);
}

#side, #center, #right {
    background: rgba(18, 11, 5, 0.55);
    border: 1px solid var(--wood-3);
    border-radius: 4px;
    padding: 8px 10px;
}

/* ── 幸存者名录 ── */
#npcs { display: flex; flex-direction: column; gap: 3px; }

#npcs .npc {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 5px;
    border: 1px solid transparent;
    border-radius: 3px;
    cursor: pointer;
}

#npcs .npc:hover {
    border-color: var(--gold);
    background: rgba(201, 162, 39, 0.12);
}

#npcs .npc.gone {
    opacity: 0.42;
    cursor: default;
    filter: grayscale(0.8);
}

#npcs .seal {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--gold);
    background: radial-gradient(circle at 35% 30%, var(--blood-2), var(--blood) 65%, #4a0d0d);
    color: var(--paper);
    font-size: 14px;
    text-shadow: 0 1px 1px #000;
}

#npcs .nm { font-size: 13px; letter-spacing: 1px; }
#npcs .sub { font-size: 10.5px; color: var(--paper-2); }
#npcs .rt {
    margin-left: auto;
    font-size: 10.5px;
    color: var(--gold-2);
    letter-spacing: 1px;
}

/* ── 行旅 kv ── */
#pstat .kv {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    line-height: 1.8;
    border-bottom: 1px dotted var(--wood-3);
    color: var(--paper-2);
}

/* ── 行囊（物品格子 + 详情弹窗）── */
#bag { max-height: 34vh; overflow-y: auto; }

#bag h3 { margin: 8px 0 3px; font-size: 12px; letter-spacing: 2px; color: var(--gold-2); }

.bag-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
    gap: 5px;
}

.slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 5px 2px 4px;
    background: rgba(10, 6, 2, 0.5);
    border: 1px solid var(--wood-3);
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
}

.slot:hover {
    border-color: var(--gold);
    background: rgba(201, 162, 39, 0.14);
}

.slot .nm {
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 10.5px;
    color: var(--paper);
}

.slot .ct { font-size: 10px; color: var(--gold-2); }

#bag .row { color: var(--paper-2); font-size: 11px; line-height: 1.6; }

/* ── 物品详情弹窗 ── */
.item-box { width: 380px; text-align: center; }

.item-box .btns { justify-content: center; }

.item-hero {
    display: flex;
    justify-content: center;
    padding: 6px 0 2px;
}

.item-desc {
    font-size: 12.5px;
    line-height: 1.8;
    color: var(--paper);
    margin: 6px 0;
    text-align: left;
}

.item-meta {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--gold-2);
    border-bottom: 1px dotted var(--wood-3);
    padding-bottom: 6px;
}

.item-body {
    margin-top: 8px;
    text-align: left;
    max-height: 28vh;
    overflow-y: auto;
}

.item-line {
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--paper-2);
    border-bottom: 1px dotted var(--wood-3);
    padding: 3px 0;
}

/* ── 荒原记事（文字流）── */
#right { display: flex; flex-direction: column; }

#flowWrap { flex: 1; display: flex; flex-direction: column; min-height: 200px; }

#flow {
    flex: 1;
    min-height: 200px;
    max-height: 62vh;
    overflow-y: auto;
    padding: 4px 6px;
    background: rgba(10, 6, 2, 0.5);
    border: 1px solid var(--wood-3);
    border-radius: 3px;
}

#flow .p {
    font-size: 13px;
    line-height: 1.75;
    margin: 4px 0;
    padding-left: 8px;
    border-left: 2px solid var(--wood-3);
    color: var(--paper);
}

#flow .p.horror {
    border-left-color: var(--blood-2);
    color: var(--blood-2);
    text-shadow: 0 0 8px rgba(139, 26, 26, 0.4);
}

#flow .p.clue { border-left-color: var(--gold); color: var(--gold-2); }
#flow .p.dead { border-left-color: var(--paper-2); opacity: 0.75; }

/* ── 荒原记事翻篇（R101：每日清空，新的一天从这一行起）── */
#flow .p.page {
    border-left: none;
    text-align: center;
    color: var(--gold-2);
    letter-spacing: 3px;
    font-size: 11px;
    opacity: 0.85;
    margin: 10px 0 6px;
}

/* ── 荒原记事：点一行写日记（R99 记事制）── */
.flow-hint {
    font-size: 11px;
    font-weight: normal;
    color: var(--gold-2);
    letter-spacing: 1px;
    opacity: 0.8;
}

#flow .p.noteable { cursor: pointer; }
#flow .p.noteable:hover { background: rgba(212, 175, 55, 0.08); }
#flow .p.noted { cursor: default; }
#flow .p.noted:hover { background: none; }

#flow .note-ask {
    display: flex;
    gap: 6px;
    align-items: center;
    margin: 2px 0 6px 10px;
    padding: 3px 8px;
    font-size: 12px;
    color: var(--gold-2);
    border: 1px dotted var(--wood-3);
    border-radius: 3px;
    background: rgba(212, 175, 55, 0.06);
}

#flow .note-ask button { font-size: 11px; padding: 1px 8px; }
#flow .note-mark { color: var(--gold); margin-left: 6px; font-size: 12px; letter-spacing: 1px; }

/* ── 命令栏 ── */
#actbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-top: 8px;
    min-height: 38px;
}

#actbar .mono { width: 100%; color: var(--paper-2); }

/* ── 弹窗（立绘/模型设置通用）── */
.modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(5, 3, 1, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
}

.modal-box {
    background: linear-gradient(180deg, var(--wood-2), var(--wood));
    border: 2px solid var(--gold);
    border-radius: 5px;
    box-shadow: 0 8px 30px #000;
    padding: 14px 18px;
    max-width: 420px;
    max-height: 86vh;
    overflow-y: auto;
}

.modal-box h3 { border-bottom-color: var(--gold); }
.modal-box .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

.cfg-box { width: 380px; }

.cfg-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin: 8px 0;
    font-size: 12.5px;
}

.cfg-warn {
    min-height: 18px;
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--gold-2);
}

/* ── 结局页 ── */
#endbox { padding: 0 10px 20px; }

.end {
    border: 2px solid var(--blood-2);
    border-radius: 5px;
    background: rgba(20, 6, 6, 0.85);
    padding: 14px 18px;
    margin-top: 10px;
}

.end h3 { color: var(--blood-2); letter-spacing: 3px; }
.end .mono { max-width: 720px; }
.end .btns { display: flex; gap: 10px; margin-top: 12px; }

@media (max-width: 1080px) {
    #stage { grid-template-columns: 1fr; }
}

</style>
<style>
/* itemIcons.css — 物品贴图（R97）：纯 CSS 程序化图标，与立绘/地图同路（零素材文件，单文件可发）。
   每个图标 1em 见方，容器 font-size 控大小（格子 34px / 弹窗 72px），只用渐变+圆角+阴影。 */

.item-ico {
    display: inline-block;
    position: relative;
    width: 1em;
    height: 1em;
    font-size: 34px;
    vertical-align: middle;
    flex: 0 0 auto;
}

.item-ico.big { font-size: 72px; }

.item-ico::before, .item-ico::after {
    content: '';
    position: absolute;
    display: block;
}

/* ── 日记本：深红封面 + 鎏金书脊 + 三道装订线 ── */
.ico-diary::before {
    left: .14em; top: .08em; width: .72em; height: .84em;
    background: linear-gradient(150deg, #8c3222 0%, #6a2117 55%, #4b130d 100%);
    border-radius: .06em .12em .12em .06em;
    box-shadow: inset -.05em 0 .02em rgba(0, 0, 0, .45),
        inset 0 0 0 .02em rgba(217, 180, 106, .25), .03em .04em .06em rgba(0, 0, 0, .55);
}
.ico-diary::after {
    left: .10em; top: .12em; width: .10em; height: .76em;
    background: linear-gradient(90deg, #e6c67e, #a8823c);
    border-radius: .02em;
    box-shadow: .22em .10em 0 -.03em #e6c67e, .22em .34em 0 -.03em #e6c67e, .22em .58em 0 -.03em #e6c67e;
}

/* ── 木柴捆：三根柴 + 捆绳 ── */
.ico-firewood::before {
    left: .08em; top: .30em; width: .84em; height: .17em;
    background: linear-gradient(180deg, #a2703c, #6f441f);
    border-radius: .09em;
    box-shadow: 0 .20em 0 #7d5027, 0 -.20em 0 #b98449, .02em .03em .05em rgba(0, 0, 0, .4);
}
.ico-firewood::after {
    left: .40em; top: .10em; width: .12em; height: .78em;
    background: repeating-linear-gradient(180deg, #d8b072 0 .05em, #b98c4e .05em .1em);
    border-radius: .03em;
}

/* ── 野果：绿叶 + 两颗红果 ── */
.ico-berry::before {
    left: .30em; top: .06em; width: .40em; height: .22em;
    background: linear-gradient(140deg, #6fa84e, #3d6b28);
    border-radius: 0 .22em 0 .22em;
    transform: rotate(-18deg);
}
.ico-berry::after {
    left: .18em; top: .36em; width: .30em; height: .30em;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e0574b, #9c2119 70%);
    box-shadow: .32em .18em 0 -.01em #b32c22;
}

/* ── 浆果干：陶碟 + 三粒干果 ── */
.ico-driedBerry::before {
    left: .08em; top: .46em; width: .84em; height: .34em;
    background: linear-gradient(180deg, #cbb08a, #8b6c45);
    border-radius: 0 0 .34em .34em;
    box-shadow: inset 0 .04em .05em rgba(0, 0, 0, .3);
}
.ico-driedBerry::after {
    left: .22em; top: .34em; width: .16em; height: .16em;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #93372c, #57180f);
    box-shadow: .22em -.06em 0 -.01em #6f2015, .44em .04em 0 -.02em #7d281b;
}

/* ── 生肉：粉红肉块 + 脂纹 ── */
.ico-rawMeat::before {
    left: .10em; top: .28em; width: .80em; height: .44em;
    background: linear-gradient(160deg, #d9655c, #a32d2b);
    border-radius: .24em .30em .22em .28em;
    box-shadow: inset 0 .06em .08em rgba(255, 255, 255, .22), .02em .03em .05em rgba(0, 0, 0, .45);
}
.ico-rawMeat::after {
    left: .22em; top: .38em; width: .42em; height: .06em;
    background: rgba(255, 236, 226, .85);
    border-radius: .03em;
    box-shadow: .06em .13em 0 -.01em rgba(255, 236, 226, .7);
}

/* ── 熟食：焦褐肉块 + 烤痕 + 热气 ── */
.ico-cookedFood::before {
    left: .10em; top: .32em; width: .80em; height: .40em;
    background-image: repeating-linear-gradient(115deg, rgba(0, 0, 0, .28) 0 .05em, transparent .05em .16em),
        linear-gradient(160deg, #a2652f, #6c3a17);
    border-radius: .22em;
    box-shadow: .02em .03em .05em rgba(0, 0, 0, .45);
}
.ico-cookedFood::after {
    left: .30em; top: .10em; width: .06em; height: .18em;
    background: rgba(240, 230, 215, .6);
    border-radius: .03em;
    box-shadow: .16em .04em 0 -.01em rgba(240, 230, 215, .45), .32em -.02em 0 -.01em rgba(240, 230, 215, .35);
}

/* ── 清水壶：陶壶 + 壶盖 ── */
.ico-waterFlask::before {
    left: .22em; top: .30em; width: .56em; height: .56em;
    border-radius: 50% 50% 46% 46%;
    background: radial-gradient(circle at 35% 28%, #9fb6c4, #4c6577 70%);
    box-shadow: .02em .03em .05em rgba(0, 0, 0, .45);
}
.ico-waterFlask::after {
    left: .40em; top: .12em; width: .20em; height: .22em;
    border-radius: .06em .06em 0 0;
    background: linear-gradient(180deg, #cbb894, #8d7448);
    box-shadow: 0 -.07em 0 -.01em #6f5a35;
}

/* ── 湿泥鞋印拓片：宣纸 + 靴印 ── */
.ico-shoes::before {
    left: .10em; top: .08em; width: .80em; height: .84em;
    background: linear-gradient(160deg, #f0e2c0, #cbb386);
    border-radius: .04em;
    box-shadow: .02em .03em .05em rgba(0, 0, 0, .5);
}
.ico-shoes::after {
    left: .30em; top: .22em; width: .34em; height: .42em;
    background: rgba(74, 53, 36, .85);
    border-radius: .16em .16em .10em .10em;
    box-shadow: 0 .46em 0 -.05em rgba(74, 53, 36, .85);
}

/* ── 带泥的布片：破口布 + 泥污 ── */
.ico-cloth::before {
    left: .14em; top: .18em; width: .72em; height: .62em;
    background: linear-gradient(150deg, #7c8896, #4a5663);
    clip-path: polygon(0 12%, 26% 0, 62% 8%, 100% 0, 92% 78%, 64% 100%, 22% 88%, 4% 100%);
}
.ico-cloth::after {
    left: .34em; top: .42em; width: .22em; height: .18em;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #6b4c2e, #3d2714);
}

/* ── 凶器残件：木柄 + 铁锤头 ── */
.ico-tool::before {
    left: .16em; top: .12em; width: .20em; height: .74em;
    background: linear-gradient(90deg, #8a5c2f, #5b3819);
    border-radius: .06em;
    transform: rotate(18deg);
}
.ico-tool::after {
    left: .32em; top: .10em; width: .46em; height: .28em;
    background: linear-gradient(160deg, #8d939b, #4c525a);
    border-radius: .06em;
    box-shadow: inset 0 -.05em .04em rgba(0, 0, 0, .4);
}

/* ── 火堆余烬：炭堆 + 火光 ── */
.ico-time::before {
    left: .12em; top: .34em; width: .76em; height: .42em;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 60%, rgba(226, 120, 48, .95), rgba(120, 42, 18, .9) 60%, rgba(50, 20, 10, 0) 75%);
}
.ico-time::after {
    left: .34em; top: .14em; width: .32em; height: .36em;
    border-radius: 50% 50% 40% 40%;
    background: radial-gradient(circle at 50% 80%, #f5c15c, #d1622a 60%, rgba(209, 98, 42, 0) 75%);
}

/* ── 拖拽痕拓片：宣纸 + 两道拖痕 ── */
.ico-drag::before {
    left: .10em; top: .08em; width: .80em; height: .84em;
    background: linear-gradient(160deg, #f0e2c0, #cbb386);
    border-radius: .04em;
    box-shadow: .02em .03em .05em rgba(0, 0, 0, .5);
}
.ico-drag::after {
    left: .16em; top: .38em; width: .70em; height: .07em;
    background: linear-gradient(90deg, rgba(74, 53, 36, 0), #4a3524 25%, rgba(74, 53, 36, .2));
    border-radius: .04em;
    transform: rotate(-8deg);
    box-shadow: 0 .18em 0 -.01em rgba(74, 53, 36, .55);
}

/* ── 现场物证（兜底）：宣纸 + 红印 ── */
.ico-generic::before {
    left: .10em; top: .08em; width: .80em; height: .84em;
    background: linear-gradient(160deg, #f0e2c0, #cbb386);
    border-radius: .04em;
    box-shadow: .02em .03em .05em rgba(0, 0, 0, .5);
}
.ico-generic::after {
    left: .52em; top: .50em; width: .24em; height: .24em;
    border-radius: 50%;
    border: .04em solid #a5281f;
    background: rgba(165, 40, 31, .18);
}

/* ══════════════════════════════════════════════════════════════

<style>
/* mapBoard.css — 走格子地图/地块高亮/时辰换色（黎明/白昼/黄昏/入夜/血色）。 */

#map {
    display: grid;
    gap: 3px;
    padding: 6px;
    background: rgba(10, 6, 2, 0.5);
    border: 1px solid var(--wood-3);
    border-radius: 3px;
}

.cell {
    position: relative;
    aspect-ratio: 1 / 1;
    min-height: 26px;   /* 18 列宽格：1280 屏下格宽 ~33px，不许被 min 顶成扁格 */
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--wood-3);
    border-radius: 3px;
    font-size: 11px;
    color: var(--paper-2);
    transition: background 1.2s ease, border-color 0.3s ease;
}

/* 地块类型 */
.cell.k-walk { background: rgba(64, 45, 20, 0.55); }
.cell.k-home { background: rgba(110, 84, 40, 0.75); border-color: var(--gold); }
.cell.k-gather { background: rgba(46, 66, 34, 0.6); }
.cell.k-watch { background: rgba(40, 58, 70, 0.7); }
.cell.k-block {
    background: repeating-linear-gradient(45deg, #1a1208, #1a1208 4px, #241708 4px, #241708 8px);
    color: #5a4a30;
}

.cell .tg {
    position: absolute;
    top: 1px;
    left: 3px;
    font-size: 10px;
    opacity: 0.75;
}

/* 相邻可走格：金边可点 */
.cell.adj {
    cursor: pointer;
    border-color: var(--gold-2);
    box-shadow: 0 0 6px rgba(230, 200, 104, 0.4) inset;
}

.cell.adj:hover { background: rgba(201, 162, 39, 0.3); }

.cell.home-in { box-shadow: 0 0 8px rgba(230, 200, 104, 0.5) inset; }

/* 人物棋子 */
.tk {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 17px;
    height: 17px;
    margin: 0 1px;
    border-radius: 50%;
    font-size: 10px;
    border: 1px solid var(--gold);
    background: var(--wood-2);
    color: var(--paper);
    z-index: 2;
}

.tk.npc-tk { cursor: pointer; background: radial-gradient(circle at 35% 30%, var(--blood-2), var(--blood) 70%); }
.tk.npc-tk:hover { transform: scale(1.25); }
.tk.me-tk { background: var(--gold); color: var(--ink); border-color: var(--paper); }

/* 尸标（R103）：案发现场留下的尸首，方印形与人棋区分 */
.tk.body-tk {
    border-radius: 2px;
    background: #2b1414;
    border-color: var(--blood);
    color: #e8c9a8;
}

/* ── 时辰换色：格子随 body[data-lut] 明暗 ── */
body[data-lut="dawn"] .cell.k-walk { background: rgba(88, 68, 52, 0.5); }
body[data-lut="day"] .cell.k-walk { background: rgba(96, 74, 34, 0.55); }
body[data-lut="dusk"] .cell.k-walk { background: rgba(84, 48, 18, 0.6); }
body[data-lut="night"] .cell {
    filter: brightness(0.55) saturate(0.8);
}
body[data-lut="night"] .tk.me-tk,
body[data-lut="night"] .cell.adj {
    filter: brightness(1.8);
}
body[data-lut="blood"] .cell {
    filter: brightness(0.5) sepia(0.4) hue-rotate(-30deg) saturate(1.6);
}

<style>
/* portraitLayer.css — 立绘层叠（底图/表情层/污渍层/饰品层）与查看弹窗。
   运行时不生图（P2）：全部程序化分层，污渍带 refs 回溯提示。 */

.portrait {
    position: relative;
    width: 220px;
    height: 300px;
    margin: 8px auto;
    border: 2px solid var(--gold);

    background: linear-gradient(180deg, var(--wood-3), var(--wood));

    box-shadow: 0 4px 18px #000 inset;
}

.portrait .layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

/* ── 底图层：身形剪影 + 衣色（--cloth 由 JS 注入）── */
.layer-base {
    background:
        radial-gradient(circle at 50% 30%, var(--cloth, #6a5335) 0 34px, transparent 35px),
        radial-gradient(ellipse 62px 74px at 50% 74%, var(--cloth, #6a5335) 0 61%, transparent 62%);
    opacity: 0.92;
}

.layer-base::after {
    content: attr(data-glyph);
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 30px;
    color: var(--paper);
    text-shadow: 0 1px 3px #000;
}

/* ── 表情层：眉目情绪 ── */
.layer-emotion::after {
    position: absolute;

    left: 0;
    right: 0;
    text-align: center;
    font-size: 20px;
    color: var(--ink);
}

.portrait[data-emotion="calm"] .layer-emotion::after { content: '— —'; }

.portrait[data-emotion="anger"] .layer-emotion::after { content: '﹥ ﹤'; color: var(--paper); }
.portrait[data-emotion="deflect"] .layer-emotion::after { content: '⇀ ⇀'; color: var(--paper); }
.portrait[data-emotion="grief"] .layer-emotion::after { content: '⌒ ⌒'; color: var(--paper); }

}

<!-- 装载顺序 = test/loader.js 的依赖序：契约 → 数值 → 内容 → 真相层 → 表演层 → 界面层 → 装配 -->
<script>
/* contract.js — 契约层【冻结 v5】。真相只在 sim/；perform/ 只做文本化；ui/ 只渲染注册事件。
   变更铁律（v1 R79）：改契约必须升 CONTRACT.v 并同步所有层，禁单侧改。v3：删玩家指控（accuse 指令与 meeting.accusation 事件）。
   v4（R94）：晨会共享线索由 NPC 当众讲出——meeting.speech 增 verbatim 载荷（线索卡原文照念，禁模型改写）；删开场行踪套话。
   v5（R98）：删出示线索（present 指令与 meetingSystem.present）；投票改带线索起票——vote 指令带 clueIds（必附 5 条），
   说服力在 sim 内部结算并影响 NPC 跟票概率，视图不下发（玩家看不见）。
   v6（R99）：删竹简记事（ui/journalBoard 面板与按线索誊写的入口）；日记改记事制——act write 带原句文本，
   荒原记事任意一行可点开写进日记（不耗时、不限相位、同句只记一次），日记条目只带 text/day/hour。
   v7（R100）：写日记改耗时——act write 记成功花 30 分（timeCost.write）：白天当场推时钟（走全套行动结算），
   晨会里写的先记账、散会开工时补推（=晚开工）；拒记（空句/超长/同句重复）不扣时。指令与事件形状不变。
   v8（R101）：荒原记事每日清空 + 投票只认日记——act write 带 line（记事行 id，只认今天这一页，翻篇即拒记），
   日记条目带 clueId（这句记的是哪条线索）；vote 起票附的线索必须都在日记里写过，没记的当没有；
   meeting.speech 共享线索带 clueId（会上念出来的才抄得进当天日记）。
   v9（R110）：起票全放行——vote 的 clueIds 改为凭据 id（线索 id 或日记条目的记事行 line id），
   写进日记的任何一句都举得起票；日记条目带 claimId（问话证言行），判定（线索/证言/札记三类）仍在 sim 内，
   视图只加行号 line，不下发说法真假。
   v10（R112）：晨会记日记不耗时——act write 在 meeting 相位记成功花 0 分，不记 diaryDebt（原先记账、散会开工补扣）；
   白天仍当场推时钟扣 timeCost.write，黄昏/夜晚仍记账到次日散会补扣。指令与事件形状不变。 */
window.CONTRACT = {
    v: 10,
    /* 后端 → 前端 事件类型注册表。ui 只允许渲染下列已注册类型，EV 对未注册类型立即抛错。 */
    EVENTS: [
        'world.snapshot', 'day.open', 'phase.change', 'meeting.open',
        'map.move', 'map.interact', 'time.tick', 'time.warn', 'stranded',
        'task.result', 'survival.task', 'resource.change', 'crisis.warning',
        'npc.behavior', 'npc.dialogue', 'meeting.speech',
        'clue.discovered', 'testimony.diff', 'stakeout.report',
        'night.kill', 'night.near', 'daytime.death', 'accident.event',
        'sanity.flavor', 'vote.cast', 'vote.result', 'game.end'
    ],
    /* 表情六态：立绘表情层按此对齐 */
    EMOTION: ['calm', 'fear', 'anger', 'deflect', 'grief', 'suspicious'],
    /* 可信度标签：claim=说法 / testimony=证言 / concession=被迫承认 / accusation=指控性发言 */
    CRED: ['claim', 'testimony', 'concession', 'accusation'],
    /* 前端 → 后端 指令类型（v5：vote 带 clueIds=起票附的凭据，说服力只在 sim 内结算；v9：凭据 id＝线索 id 或日记行 id） */
    CMD: ['move', 'act', 'talk', 'ask', 'vote', 'endDay'],
    /* 五种结束态 */
    END: ['solved_vote', 'murder_won', 'player_dead', 'crisis', 'timeout']
};

/* 事件构造器：未注册类型立即抛错，防止两个模型各自发明字段。
 * @param {string} type 事件类型（必须在 CONTRACT.EVENTS 内）
 * @param {object} payload 事件载荷（白名单字段由 sim 层负责）
 * @param {number} t 逻辑时刻（分钟序）
 * @returns {{v:number,type:string,t:number,payload:object}}
 * @throws {Error} 未注册事件类型 */
window.EV = function (type, payload, t) {
    if (!window.CONTRACT.EVENTS.includes(type)) {
        throw new Error('契约违规: 未注册事件 ' + type);
    }
    return { v: window.CONTRACT.v, type, t: t || 0, payload: payload || {} };
};

/* 行为事件卡的确定性结构（sim 产出，perform 负责念成话）：偷懒/争吵/帮手/藏匿/窥视 */
window.BehaviorKind = {
    SHIRK: 'shirk',
    ARGUE: 'argue',
    HELP: 'help',
    HIDE: 'hide',
    WATCH: 'watch'
};

/* LLM 输出的 typed block 结构（M3）：前端只渲染 text/emotion，refs 用于对质跳转。
 * @typedef {{npcId:string,text:string,emotion:string,cred:string,refs:string[],speakMs:number}} TypedBlock */
window.TYPED_BLOCK_FIELDS = ['npcId', 'text', 'emotion', 'cred', 'refs', 'speakMs'];

</script>

<script>
/* rng.js — 带种子随机（mulberry32）：整局可复现。sim 纯函数禁用 Math.random。 */
(function (root) {
    'use strict';

    const RNG_A = 0x6D2B79F5;                 // mulberry32 增量常数
    const UINT32_RANGE = 4294967296;

    /**
     * 构造可复现随机流。
     * @param {number} seed 32 位种子
     * @returns {function():number} 返回 [0,1) 均匀随机数的函数 */
    function createRng(seed) {
        let a = (seed >>> 0) || 1;
        return function next() {
            a += RNG_A;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / UINT32_RANGE;
        };
    }

    /**
     * 从数组取随机元素（空数组回 null，R26 禁 null 兼容器例外仅限此查询语义）。
     * @param {function():number} rnd 随机流
     * @param {Array} arr 池子
     * @returns {*} 元素 */
    function pick(rnd, arr) {
        if (!Array.isArray(arr) || !arr.length) {
            return null;
        }
        return arr[Math.floor(rnd() * arr.length)];
    }

    /**
     * 取 [a,b] 闭区间随机整数。
     * @param {function():number} rnd 随机流
     * @param {number} a 下界
     * @param {number} b 上界
     * @returns {number} 整数 */
    function rint(rnd, a, b) {
        return a + Math.floor(rnd() * (b - a + 1));
    }

    /**
     * 加权抽取：weights 与 items 等长，权重<=0 视为 0。
     * @param {function():number} rnd 随机流
     * @param {Array} items 候选
     * @param {number[]} weights 权重
     * @returns {*} 元素 */
    function pickWeighted(rnd, items, weights) {
        if (!Array.isArray(items) || !items.length) {
            return null;
        }
        let total = 0;
        for (let i = 0; i < items.length; i++) {
            total += Math.max(0, weights[i] || 0);
        }
        if (total <= 0) {
            return pick(rnd, items);
        }
        let roll = rnd() * total;
        for (let i = 0; i < items.length; i++) {
            roll -= Math.max(0, weights[i] || 0);
            if (roll < 0) {
                return items[i];
            }
        }
        return items[items.length - 1];
    }

    root.Rng = { createRng, pick, rint, pickWeighted };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* validators.js — 契约校验 + 文本校验规则实现。跨模块数据先过校验再用（R29/R58）。 */
(function (root) {
    'use strict';
    const CONTRACT = root.CONTRACT;

    /**
     * 校验事件对象是否合法（类型已注册、载荷为对象）。
     * @param {{type:string,payload:object}} ev 事件
     * @throws {Error} 契约违规 */
    function assertEvent(ev) {
        if (!ev || typeof ev !== 'object') {
            throw new Error('契约违规: 事件不是对象');
        }
        if (!CONTRACT.EVENTS.includes(ev.type)) {
            throw new Error('契约违规: 未注册事件 ' + ev.type);
        }
        if (!ev.payload || typeof ev.payload !== 'object') {
            throw new Error('契约违规: 事件载荷缺失 ' + ev.type);
        }
    }

    /**
     * 校验指令是否合法。
     * @param {{type:string}} cmd 指令
     * @throws {Error} 契约违规 */
    function assertCmd(cmd) {
        if (!cmd || !CONTRACT.CMD.includes(cmd.type)) {
            throw new Error('契约违规: 未注册指令 ' + (cmd && cmd.type));
        }
    }

    /**
     * 校验 LLM typed block（M3）。emotion/cred 必须落契约枚举。
     * @param {object} block 候选块
     * @returns {boolean} 是否合法 */
    function isTypedBlock(block) {
        if (!block || typeof block !== 'object') {
            return false;
        }
        const textOk = typeof block.text === 'string' && block.text.length > 0;
        const emoOk = CONTRACT.EMOTION.includes(block.emotion);
        const credOk = CONTRACT.CRED.includes(block.cred);
        const refsOk = Array.isArray(block.refs);
        return textOk && emoOk && credOk && refsOk;
    }

    /* ── 文本质量闸门规则（第 6 节 T1-T4 的判定实现，textGuard 只调用不重复写）── */
    const LATIN_RUN = /[A-Za-z]{2,}/;
    const LOW_QUALITY_WORDS = ['突然', '似乎', '一切', '命运', '仿佛', '莫名'];
    const LOW_QUALITY_LIMIT = 3;

    /**
     * T1 纯中文：正文出现连续 2+ 拉丁字母即违规（接口/模型名在白名单外由调用方规避）。
     * @param {string} text 文本
     * @returns {boolean} 是否通过 */
    function isPureChinese(text) {
        return !LATIN_RUN.test(String(text || ''));
    }

    /**
     * T2 去重：8-gram 集合相似度（交并比）> 0.6 判重复。
     * @param {string} text 待查文本
     * @param {string[]} recent 最近台词
     * @param {number} threshold 相似度阈值
     * @returns {boolean} 是否通过（不重复） */
    function isFreshText(text, recent, threshold) {
        const limit = threshold === undefined ? 0.6 : threshold;
        const grams = toGrams(text);
        if (!grams.size) {
            return false;
        }
        for (let i = 0; i < recent.length; i++) {
            const other = toGrams(recent[i]);
            let hit = 0;
            for (const g of grams) {
                if (other.has(g)) {
                    hit++;
                }
            }
            const union = grams.size + other.size - hit;
            if (union > 0 && hit / union > limit) {
                return false;
            }
        }
        return true;
    }

    /**
     * @param {string} text 文本
     * @returns {Set<string>} 8-gram 集合（不足 8 字按整句） */
    function toGrams(text) {
        const s = String(text || '').replace(/\s/g, '');
        const out = new Set();
        if (s.length < 8) {
            if (s) {
                out.add(s);
            }
            return out;
        }
        for (let i = 0; i + 8 <= s.length; i++) {
            out.add(s.slice(i, i + 8));
        }
        return out;
    }

    /**
     * T3 长度带：dialogue 8-26 字/句、meeting 2-4 句、narr 20-60 字、recap（终局指控分析）20-300 字。
     * @param {string} text 文本
     * @param {'dialogue'|'meeting'|'narr'|'recap'} band 长度带类型
     * @returns {boolean} 是否在带内 */
    function isInLengthBand(text, band) {
        const s = String(text || '').trim();
        const chars = s.replace(/[\s，。！？、；：“”‘’…—]/g, '').length;
        const sentences = s.split(/[。！？…]/).filter(x => x.trim()).length;
        if (band === 'dialogue') {
            return chars >= 8 && chars <= 26;
        }
        if (band === 'meeting') {
            return sentences >= 1 && sentences <= 4 && chars >= 8 && chars <= 120;
        }
        if (band === 'recap') {
            return chars >= 20 && chars <= 300;
        }
        return chars >= 20 && chars <= 60;
    }

    /**
     * T4 低质拦截：空泛词堆砌超过阈值判低质。
     * @param {string} text 文本
     * @returns {boolean} 是否通过 */
    function isQualityText(text) {
        const s = String(text || '');
        let hit = 0;
        for (let i = 0; i < LOW_QUALITY_WORDS.length; i++) {
            const word = LOW_QUALITY_WORDS[i];
            let from = 0;
            while (true) {
                const at = s.indexOf(word, from);
                if (at < 0) {
                    break;
                }
                hit++;
                from = at + word.length;
            }
        }
        return hit < LOW_QUALITY_LIMIT;
    }

    root.Validators = {
        assertEvent, assertCmd, isTypedBlock,
        isPureChinese, isFreshText, isInLengthBand, isQualityText
    };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* worldMap.js — 格子地图：地块类型/相邻规则/合法动作表（日志⑫）。纯几何，零副作用。 */
(function (root) {
    'use strict';

    /* 地图 18×12：H=木屋 W=林地 F=林缘 A=河岸 V=崖口 T=瞭望台 #=峭壁 .=荒地
       （搜查地块已删：物证只在案发现场的尸体旁搜得，见 deathSystem/S.corpses）
       木屋群居中（3×3）；资源近带 步数 水3/食3/柴4，远岛 柴11/食9/水9（一整天够跑一个来回），
       崖口/瞭望台最远 8 步。峭壁只封四缘、不留内墙——贪心走位（npcSchedule）任何格回屋都不会被堵死。 */
    const MAP_ROWS = [
        '####TT..........##',
        '#.............WWW#',
        '#.V.WW.........WW#',
        '#...WW......A.....',
        '..V.........A.....',
        '...FF..HHH..A.V...',
        '...FF..HHH..A..V..',
        '.......HHH..A.....',
        '#.....V......A...#',
        '#FF...V.......A..#',
        '#FFF.......####A##',
        '######..##########'
    ].map(function (row) { return row.padEnd(18, '.'); });

    const TILES = {
        H: { name: '木屋', kind: 'home', key: 'home', hint: '天黑必回' },
        W: { name: '林地', kind: 'gather', key: 'wood', hint: '砍柴' },
        F: { name: '林缘', kind: 'gather', key: 'food', hint: '采食' },
        A: { name: '河岸', kind: 'gather', key: 'water', hint: '取水' },
        V: { name: '崖口', kind: 'watch', key: null, hint: '蹲守' },
        T: { name: '瞭望台', kind: 'watch', key: null, hint: '蹲守' },
        '#': { name: '峭壁', kind: 'block', key: null },
        '.': { name: '荒地', kind: 'walk', key: null }
    };

    const FALLBACK_TILE = TILES['.'];
    const W = MAP_ROWS[0].length;
    const H = MAP_ROWS.length;
    const DIRECTIONS = { n: [0, -1], s: [0, 1], w: [-1, 0], e: [1, 0] };
    const DIR_NAME = { n: '北', s: '南', w: '西', e: '东' };

    /**
     * 取 (x,y) 的地块字符，越界视作峭壁。
     * @returns {string} 地块字符 */
    function ch(x, y) {
        return (x < 0 || y < 0 || x >= W || y >= H) ? '#' : MAP_ROWS[y][x];
    }

    /**
     * 取 (x,y) 的地块定义。
     * @returns {{name:string,kind:string,key:?string}} 地块 */
    function tile(x, y) {
        return TILES[ch(x, y)] || FALLBACK_TILE;
    }

    /**
     * @returns {boolean} 是否可走 */
    function walkable(x, y) {
        return tile(x, y).kind !== 'block';
    }

    /**
     * @returns {boolean} 是否木屋 */
    function isHome(x, y) {
        return tile(x, y).kind === 'home';
    }

    /**
     * @returns {Array<{x:number,y:number}>} 该类型全部地块坐标 */
    function tilesOf(kind) {
        const out = [];
        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                if (tile(x, y).kind === kind) {
                    out.push({ x, y });
                }
            }
        }
        return out;
    }

    /**
     * 按地块名取全部地块坐标（案发现场定位用：地名 → 地图格）。
     * @returns {Array<{x:number,y:number}>} 坐标列表 */
    function tilesNamed(name) {
        const out = [];
        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                if (tile(x, y).name === name) {
                    out.push({ x, y });
                }
            }
        }
        return out;
    }

    /**
     * 曼哈顿距离。
     * @returns {number} 距离 */
    function dist(a, b) {
        return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    /**

/* stateMachine.js — 相位机：晨会→白天→黄昏→夜晚；禁跳夜、禁自主开会（日志⑨）。
   唯一推进按钮 = 晨会后【散会开工】；18:00 自动天黑；晨会只在出现死亡后的清晨 08:00 自动召开（R87）。 */

    const PHASES = ['meeting', 'day', 'dusk', 'night'];

    /* 合法相位转移表：只有这些转移存在，"跳夜/自主开会"在结构上不可能 */
    const TRANSITIONS = {
        meeting: ['day'],     // 散会开工
        day: ['dusk'],        // 18:00 自动天黑
        dusk: ['night'],      // 入夜结算
        night: ['meeting', 'day']  // 次日 08:00：有死亡→晨会；无死亡→直接开工（R87）
    };

    /* 每相位允许的指令（未列即禁用）：无"开会"、无"跳夜"、无白天"收工过夜"命令 */
    const CMD_WHITELIST = {
        meeting: ['ask', 'vote', 'talk', 'endDay'],   // R98：出示线索已删
        day: ['move', 'act', 'talk'],
        dusk: ['talk'],
        night: [],
        ended: []
    };

    /**
     * 相位中文名。
     * @returns {string} 名称 */
    function phaseName(phase) {
        return ({ meeting: '晨会', day: '白天', dusk: '黄昏', night: '夜晚' })[phase] || phase;
    }

    /**
     * 指令在当前相位是否可用。
     * @returns {boolean} 是否允许 */
    function allowsCmd(S, type) {
        const key = S.end ? 'ended' : S.phase;
        const list = CMD_WHITELIST[key] || [];
        return list.includes(type);
    }

    /**
     * 相位转移是否合法（禁跳相位）。
     * @returns {boolean} 是否合法 */
    function canTransition(from, to) {
        return (TRANSITIONS[from] || []).includes(to);
    }

    /**
     * 执行相位转移；非法转移直接抛错（契约级防跳夜）。
     * @throws {Error} 非法相位转移 */
    function transition(S, to) {
        if (!canTransition(S.phase, to)) {
            throw new Error('相位违规: ' + S.phase + ' → ' + to + '（禁跳夜/禁自主开会）');
        }
        S.phase = to;
    }

    root.StateMachine = { PHASES, TRANSITIONS, CMD_WHITELIST, phaseName, allowsCmd, canTransition, transition };

<script>
/* causalLedger.js — 时/空/人台账（R91 因果真值源）：每人每时每地一条记录，谁在哪、在做什么。
   时间、空间、人物一一对应以台账为唯一依据：真线索与 NPC 台词必须与台账对账，假线索豁免（R92）。
   记录来源：killerSystem 夜间剧本（recordNight）+ npcSchedule 白天位移（时段快照）。 */
(function (root) {
    'use strict';

    /* 夜间时段（与 killerSystem.NIGHT_HOURS 同口径）＋白天时段（与 timeSystem.slotName 同口径） */
    const NIGHT_HOURS = ['上半夜', '三更', '后半夜', '天快亮时'];
    const DAY_HOURS = ['上午', '午后', '黄昏'];
    const VAGUE_HOURS = ['夜里', '昨晚', '昨夜', '半夜', '整晚', '当晚', '那晚', '夜里头', '白日', '白天', '今天', '当天'];

    /**
     * 时刻 → 白天时段（08:00-18:00）。
     * @param {number} clock 分钟序
     * @returns {string} 时段名 */
    function dayBucket(clock) {
        return clock < 12 * 60 ? '上午' : clock < 16 * 60 ? '午后' : '黄昏';
    }

    /**
     * 时辰词归一：夜里四更/白天三段/模糊词。
     * @param {string} hour 原文时辰
     * @returns {{kind:'night'|'day'|'vague'|'clock',bucket:string}} 归一结果 */
    function hourKind(hour) {
        const h = String(hour || '').trim();
        if (NIGHT_HOURS.indexOf(h) >= 0) {
            return { kind: 'night', bucket: h };
        }
        if (DAY_HOURS.indexOf(h) >= 0) {
            return { kind: 'day', bucket: h };
        }
        if (/^\d{1,2}:\d{2}$/.test(h)) {
            const min = parseInt(h.slice(0, h.indexOf(':')), 10) * 60 + parseInt(h.slice(h.indexOf(':') + 1), 10);
            return { kind: 'day', bucket: dayBucket(min) };
        }
        return { kind: 'vague', bucket: h };
    }

    /**
     * 落一条台账记录（sim 内部真相，不下发）。
     * @returns {object} 台账条目 */
    function record(X, entry) {
        const S = X.S;
        S.ledgerSeq += 1;
        const row = Object.assign({
            id: 'l' + S.ledgerSeq, day: S.day, hour: '', site: '',
            personId: '', action: '', src: ''
        }, entry);
        S.ledger.push(row);
        return row;
    }

    /**
     * 某人某日某时段的行踪。
     * @returns {Array<object>} 台账条目 */
    function whereWas(S, personId, day, hour) {
        const k = hourKind(hour);
        return S.ledger.filter(function (r) {
            if (r.personId !== personId) {
                return false;
            }
            if (day !== undefined && day !== null && day !== 'any' && r.day !== day) {
                return false;
            }
            if (!hour) {
                return true;
            }
            return hourMatch(r.hour, k);
        });
    }

    /**
     * 某地某日某时段的在场者。
     * @returns {string[]} 人员 id */
    function whoAt(S, site, day, hour) {
        const k = hourKind(hour);
        const out = [];
        S.ledger.forEach(function (r) {
            if (r.site !== site) {
                return;
            }
            if (day !== undefined && day !== null && day !== 'any' && r.day !== day) {
                return;
            }
            if (hour && !hourMatch(r.hour, k)) {
                return;
            }
            if (out.indexOf(r.personId) < 0) {
                out.push(r.personId);
            }
        });
        return out;
    }

    /**
     * 时段相容：精确同段，或任一侧是模糊词（"夜里"可对三更）。
     * @returns {boolean} 是否相容 */
    function hourMatch(rowHour, k) {
        const rk = hourKind(rowHour);
        if (k.kind === 'vague' || rk.kind === 'vague') {
            return true;
        }
        return k.kind === rk.kind && k.bucket === rk.bucket;
    }

    /**
     * 时/空/人一一对账（R91 核心）：某人某时是否真在某地。
     * @param {object} S 真相态
     * @param {{personId:string,site:string,hour:string,day?:number|string}} claim 说法
     * @returns {{ok:boolean,why:string,truth:?object}} 判定（truth=台账里的真实行踪） */
    function checkClaim(S, claim) {
        const personId = claim && claim.personId;
        const npc = S.npcs.find(function (n) { return n.id === personId; });
        if (!npc) {
            return { ok: true, why: '', truth: null };   /* 非名录人物无从对账 */
        }
        const day = claim.day;
        const rows = whereWas(S, personId, day === undefined ? 'any' : day, claim.hour);
        if (!rows.length) {
            return { ok: true, why: '', truth: null };   /* 时段无记录=无从对账，不拦 */
        }
        if (!claim.site) {
            return { ok: true, why: '', truth: rows[rows.length - 1] };
        }
        const hit = rows.find(function (r) { return r.site === claim.site; });
        if (hit) {
            return { ok: true, why: '', truth: hit };
        }
        return {
            ok: false,
            why: '台账里' + npc.name + '那时在' + rows[rows.length - 1].site + '，不在' + claim.site + '。',
            truth: rows[rows.length - 1]
        };
    }

    /**
     * 整条文本里的说法批量对账（给因果闸门用）。
     * @returns {{ok:boolean,why:string}} 判定 */
    function checkClaims(S, claims) {
        for (let i = 0; i < (claims || []).length; i++) {
            const r = checkClaim(S, claims[i]);
            if (!r.ok) {
                return r;
            }
        }
        return { ok: true, why: '' };
    }

    root.CausalLedger = {
        NIGHT_HOURS, DAY_HOURS, VAGUE_HOURS,
        dayBucket, hourKind, record, whereWas, whoAt, checkClaim, checkClaims
    };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* logicProfile.js — Architect 逻辑档案（R90，推理游戏法则落地）：开局锁定凶手假设，
   生成逻辑树（树根=核心谜题、树干=三条推理方向、树枝=线索槽）与真假线索配额。
   Host（perform/plotGen）只许在这份档案的骨架上实时开展剧情；档案本身是 sim 纯数据，不下发。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;

    /**
     * 开局建档案：凶手假设 + 逻辑树 + 线索配额（假线索概率/上限进配额）。
     * @param {object} X 结算上下文
     * @returns {object} 逻辑档案 */
    function build(X) {
        const S = X.S;
        const K = S.npcs.find(function (n) { return n.id === S.killer.killerId; }) || {};
        return {
            killerId: S.killer.killerId,
            tool: S.killer.tool,
            motive: K.motive || '',
            tree: {
                root: '夜里那条人命是谁做的',
                branches: [
                    { id: 'phys', name: '物证线', node: '现场留痕对到唯一的人', need: Cfg.logic.minCluesPerNode, got: 0 },
                    { id: 'alibi', name: '行踪线', node: '案发前后谁在哪、对不对得上', need: Cfg.logic.minCluesPerNode, got: 0 },
                    { id: 'testimony', name: '证言线', node: '谁的说法经不起对质', need: Cfg.logic.minCluesPerNode, got: 0 }
                ]
            },
            quota: {
                falseChance: Cfg.logic.falseClueChance,
                falseMax: Cfg.logic.falseClueMax,
                falseUsed: 0
            },
            beats: []
        };
    }

    /**
     * 线索入档：归到逻辑树的分支上，累计"每节点 ≥2 条"的闭环支撑数。
     * @param {object} S 真相态
     * @param {object} clue 线索 */
    function registerClue(S, clue) {
        const p = S.profile;
        if (!p || !clue) {
            return;
        }
        const branch = (clue.kind === 'phys' || clue.kind === 'item') ? 'phys'
            : (clue.kind === 'sight' || clue.kind === 'night') ? 'alibi' : 'testimony';
        const node = p.tree.branches.find(function (b) { return b.id === branch; });
        if (node && clue.truth !== false) {
            node.got += 1;
        }
    }

    /**
     * 闭环状态（复盘/验收用）：哪些推理节点已有 ≥2 条真线索支撑。
     * @returns {Array<{id:string,name:string,need:number,got:number,closed:boolean}>} 节点状态 */
    function closure(S) {
        const p = S.profile;
        if (!p) {
            return [];
        }
        return p.tree.branches.map(function (b) {
            return { id: b.id, name: b.name, need: b.need, got: b.got, closed: b.got >= b.need };
        });
    }

    /**
     * 本格公平性（线索-假设-验证闭环）：物证线 + 行踪线都闭合，真相才可推导。
     * @returns {boolean} 是否可推导 */
    function solvable(S) {
        const c = closure(S);
        return c.filter(function (b) { return b.id !== 'testimony'; })
            .every(function (b) { return b.closed; });
    }

    /**
     * 剧情节拍指令（Host 写作骨架）：本类事件在推理闭环里的位置与禁区。
     * @param {string} evType 事件类型
     * @returns {string} 节拍指令 */
    function beatOf(evType) {
        const table = {
            'clue.discovered': '线索释出：这是逻辑树上的一根树枝。只描述已发现之物，' +
                '不得点评它指向谁、不得写"这是关键证据"一类定性语（不剧透，验证留给玩家）。',
            'night.kill': '案发拍：只写发现与现场，不写凶手身份、不写凶手动机（谜底锁死）。',
            'daytime.death': '白日死拍：写众目之下的混乱与恐惧，不写凶手身份。',
            'meeting.open': '晨会拍：宣布死者、开题。这是"假设"环节的开场，' +
                '引导众人摆线索，不替任何人下结论。',
            'day.open': '过场拍：新的一天，气氛与生活质感，不引入新的案件事实。',
            'vote.result': '验证拍：票已计完。写人心与后果，不评价票对票错。',
            'game.end': '终局拍：收束气氛，不复述案情（复盘另有其文）。',
            'night.near': '恐怖拍：只写声音与影子的错觉，不写具体的人。',
            'stakeout.report': '蹲守拍：只写盯到的行踪（已发生的动作），不得推断动机。',
            'accident.event': '遇险拍：意外伤情，与凶案无涉，不得暗示关联。',
            'stranded': '留夜拍：孤独与危险的氛围，不得引入新的人名行踪。'
        };

<script>
/* npcRosterSystem.js — 读取 npcRoster 档案：鞋码/衣色/体格/习惯 → 可对到人的特征（日志⑪）。
   硬线索交叉锁定（R107）：衣色单独只锁到 2-3 人，(衣色 × 脚型档) 才唯一；口头禅/习惯用于戳穿冒名证言。
   身份模糊化（V22）：鞋码数字是内部真相，只用于排序/断言/求解；玩家可见层只给模糊脚型措辞
   与"比谁大一圈"的相对表述，具体脚型要靠交谈/蹲守观察才摸得到。 */
(function (root) {
    'use strict';

    /* 脚型档措辞（模糊，禁数字）：由内部鞋码换算，档位只作口径，不作锁人依据 */
    const FOOT_WORD = ['小巧', '中等', '偏大', '特大'];
    const FOOT_PHRASE = [
        '小巧，泥地里只留浅浅一点印',
        '不大不小，踩出的印子和常人差不多',
        '偏大，泥地里的印子比你的深一圈',
        '特大，一脚下去陷得极深'
    ];

    /**
     * 脚型档（内部鞋码 → 模糊档位）。
     * @param {number} shoes 鞋码（内部真相）
     * @returns {number} 0小巧 / 1中等 / 2偏大 / 3特大 */
    function footTier(shoes) {
        if (shoes <= 37) {
            return 0;
        }
        if (shoes <= 41) {
            return 1;
        }
        if (shoes <= 44) {
            return 2;
        }
        return 3;
    }

    /**
     * 脚型档措辞（模糊，禁数字）。
     * @param {number} shoes 鞋码（内部真相）
     * @returns {string} 小巧/中等/偏大/特大 */
    function footWord(shoes) {
        return FOOT_WORD[footTier(shoes)];
    }

    /**
     * 外观印象（观察渠道：交谈/蹲守才摸得到）：只给模糊脚型措辞，禁数字。
     * @param {object} npc 人物
     * @returns {string} 观察行 */
    function impression(npc) {
        return npc.name + '脚上那双鞋' + FOOT_PHRASE[footTier(npc.shoes)] + '。';
    }

    /**
     * 鞋印线索的相对表述（无数字）：与脚码最近邻比大小，取候选面更小的一侧。
     * 候选面=按内部鞋码落在参照人该侧的人数；玩家靠观察印象排序后自行收窄。
     * R107 交叉锁定：preferIds 传同衣色的搭子——参照人取衣色搭子，鞋印+衣色交集才锁到唯一的人；
     * 无搭子（独色）回落全局最近邻（衣色一条即可锁人）。
     * @param {Array<object>} roster 名册
     * @param {object} npc 被指认者
     * @param {Array<string>} [preferIds] 优先参照人（衣色搭子）
     * @returns {{anchorId:string,anchorName:string,dir:string,word:string}} 相对表述包 */
    function shoeCompare(roster, npc, preferIds) {
        let others = (roster || []).filter(function (x) { return x.id !== npc.id; });
        const prefer = others.filter(function (x) { return (preferIds || []).indexOf(x.id) >= 0; });
        if (prefer.length) {
            others = prefer;
        }
        const below = others.filter(function (x) { return x.shoes < npc.shoes; })
            .sort(function (a, b) { return b.shoes - a.shoes; })[0];
        const above = others.filter(function (x) { return x.shoes > npc.shoes; })
            .sort(function (a, b) { return a.shoes - b.shoes; })[0];
        const candBig = below ? others.filter(function (x) { return x.shoes > below.shoes; }).length : Infinity;
        const candSmall = above ? others.filter(function (x) { return x.shoes < above.shoes; }).length : Infinity;
        const useBig = candBig <= candSmall;
        const anchor = useBig ? below : above;
        return {
            anchorId: anchor.id, anchorName: anchor.name,
            dir: useBig ? '大出一圈' : '小出一圈',
            word: FOOT_WORD[footTier(npc.shoes)]
        };
    }

    /**
     * 全员硬特征表（鞋码/衣色）。
     * @returns {Array<{id:string,name:string,shoes:number,cloth:string}>} 特征表 */
    function hardTraits(roster) {
        return (roster || []).map(function (n) {
            return { id: n.id, name: n.name, shoes: n.shoes, cloth: n.cloth };
        });
    }

    /**
     * 鞋码对人：返回全部匹配者（R107：鞋码唯一是内部真相，玩家侧只看脚型档）。
     * @returns {Array<object>} 匹配者 */
    function matchByShoe(roster, shoes) {
        return (roster || []).filter(function (n) { return n.shoes === shoes; });
    }

    /**
     * 衣色对人：返回全部匹配者（R107：同色 2-3 人，需与脚型档交叉）。
     * @returns {Array<object>} 匹配者 */

        return (roster || []).filter(function (n) { return n.cloth === cloth; });
    }

    /**
     * 交叉唯一断言（R107）：鞋码两两不同（内部真相）；(衣色, 脚型档) 对两两不同——
     * 衣色单独只锁到 2-3 人，配上脚型档（鞋印相对表述 + 打量印象）才唯一。
     * @throws {Error} 特征撞车 */
    function assertUniqueHardTraits(roster) {
        const shoes = new Set();
        const pairs = new Set();
        (roster || []).forEach(function (n) {
            if (shoes.has(n.shoes)) {
                throw new Error('名册违规: 鞋码撞车 ' + n.shoes);
            }
            const pair = n.cloth + '/' + footTier(n.shoes);
            if (pairs.has(pair)) {
                throw new Error('名册违规: 衣色×脚型档撞车 ' + pair + '（' + n.name + '）');
            }
            shoes.add(n.shoes);
            pairs.add(pair);
        });
    }

    /**
     * 软特征（体格/惯用手/口头禅/习惯）：用于冒名证言与污渍旁证。
     * @returns {object} 软特征 */
    function softTraits(npc) {
        return {
            build: npc.build, hand: npc.hand, tell: npc.tell,
            habit: npc.habit, catchphrase: npc.catchphrase
        };
    }

    /**
     * 立绘污渍层映射（P2/P4）：污渍必须可回溯到 sim 事件（refs），无事件即无污渍。
     * @param {object} npc 人物
     * @returns {Array<{stain:string,refs:string[]}>} 污渍层清单 */
    function stainLayers(npc) {
        return (npc.stains || []).map(function (s) {
            return { stain: s.stain, refs: s.refs || [] };
        });
    }

    root.NpcRosterSystem = {
        hardTraits, matchByShoe, matchByCloth, assertUniqueHardTraits, softTraits, stainLayers,
        footTier, footWord, impression, shoeCompare
    };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* npcSchedule.js — NPC 岗位/时段/位移表：行动必须与所在格一致（日志⑫）。
   偏离岗位 = 偷懒等行为事件，本身即线索。 */
(function (root) {
    'use strict';

    const Map = root.WorldMap;
    const Cfg = root.CONFIG;

    /**
     * 岗位分散指派（V24）：同工种 NPC 领到互不相同的资源格，按离木屋远近跨开——
     * 13 人不再扎堆最近的一片，找人/撞见/对行踪都得吃地图。开局指派一次，全程固定。
     * @returns {Array<{x:number,y:number}>} 各自岗位 */
    function assignPosts(S) {
        const homes = Map.tilesOf('home');
        const groups = {};
        S.npcs.forEach(function (n) {
            if (!groups[n.workKey]) {
                groups[n.workKey] = [];
            }
            groups[n.workKey].push(n);
        });
        Object.keys(groups).forEach(function (key) {
            const spots = Map.tilesOf('gather').filter(function (t) {
                return Map.tile(t.x, t.y).key === key;
            }).sort(function (a, b) {
                const da = Map.dist(a, Map.nearest(homes, a.x, a.y));
                const db = Map.dist(b, Map.nearest(homes, b.x, b.y));
                return da - db || a.x - b.x || a.y - b.y;
            });
            const group = groups[key];
            group.forEach(function (n, i) {
                n.post = spots.length ? spots[Math.floor(i * spots.length / group.length)] : null;
            });
        });
        return S.npcs.map(function (n) { return n.post; });
    }

    /**
     * 当前时段该去的岗位地块（16:00 后回木屋；远岗按路程提前收工，天黑前必到家——
     * 夜戏记的是"全员在木屋过夜"，人不能留在荒地上过夜跟剧本对不上账）。
     * @returns {{x:number,y:number}} 目标点 */
    function postTarget(S, npc) {
        const homes = Map.tilesOf('home');
        const home = Map.nearest(homes, npc.x, npc.y);
        const walkHome = Map.dist(npc, home) * Cfg.npcStepMinute;
        if (S.clock >= Cfg.npcGoHomeAt || S.clock + walkHome >= Cfg.dayEndMinute) {
            return home;
        }
        if (npc.post) {
            return npc.post;
        }
        const kind = ({ wood: 'gather', food: 'gather', water: 'gather' })[npc.workKey] || 'gather';
        const spots = Map.tilesOf(kind).filter(function (t) {
            return Map.tile(t.x, t.y).key === npc.workKey;
        });
        const pool = spots.length ? spots : homes;
        return Map.nearest(pool, npc.x, npc.y);
    }

    /**
     * 空间一致断言（3.5）：动作必须发生在行动者所在格。
     * @throws {Error} 空间违规 */
    function assertLocation(S, npc, site) {
        const here = Map.tile(npc.x, npc.y).name;
        if (here !== site) {
            throw new Error('空间违规: ' + npc.id + ' 声称在' + site + '，实际在' + here);
        }
    }

    /**
     * NPC 走一步（20 分钟一格）；到岗即记工分。返回位移播报（只在同一格时下发，R89）。
     * @returns {Array<object>} 事件 */
    function npcStepAll(X) {
        const S = X.S;
        const out = [];
        S.npcs.forEach(function (n) {
            if (!n.alive) {
                return;
            }
            /* 白天行踪入台账（R91）：位移落定后打点（先走后记——落脚点必须在当段台账里，目击线索才对得上账） */
            const stamp = function () {
                const key = S.day + '|' + root.CausalLedger.dayBucket(S.clock) + '|' + n.at;
                if (n.ledKey !== key) {
                    n.ledKey = key;
                    root.CausalLedger.record(X, {
                        day: S.day, hour: root.CausalLedger.dayBucket(S.clock),
                        site: n.at, personId: n.id, action: 'day', src: 'schedule'
                    });
                }
            };
            const t = postTarget(S, n);
            if (!t || (n.x === t.x && n.y === t.y)) {
                if (S.clock >= Cfg.npcGoHomeAt) {
                    n.at = '木屋';
                } else {
                    n.work += 1;
                    n.at = Map.tile(n.x, n.y).name;
                }
                stamp();
                return;
            }
            const step = [
                { x: n.x + (t.x > n.x ? 1 : t.x < n.x ? -1 : 0), y: n.y },
                { x: n.x, y: n.y + (t.y > n.y ? 1 : t.y < n.y ? -1 : 0) }
            ].filter(function (c) { return (c.x !== n.x || c.y !== n.y) && Map.walkable(c.x, c.y); });
            /* 直行被峭壁堵死时绕行相邻格（防卡死：大地图远岗回程不许冻在原地） */
            const cand = step.length ? step : [
                { x: n.x, y: n.y - 1 }, { x: n.x, y: n.y + 1 },
                { x: n.x - 1, y: n.y }, { x: n.x + 1, y: n.y }
            ].filter(function (c) { return Map.walkable(c.x, c.y); });
            if (!cand.length) {
                stamp();
                return;
            }
            const nx = X.rnd() < 0.5 ? cand[0] : cand[cand.length - 1];
            const ox = n.x, oy = n.y;
            const from = Map.tile(n.x, n.y).name;
            n.x = nx.x;
            n.y = nx.y;
            n.at = Map.tile(n.x, n.y).name;
            n.movedToday = (n.movedToday || 0) + 1;
            stamp();
            /* 身影播报只在与 NPC 同一格时下发（R89）：远处的位移照常结算，玩家看不见 */
            const seen = Map.dist(S.player, { x: ox, y: oy }) <= Cfg.sightRadius ||
                Map.dist(S.player, n) <= Cfg.sightRadius;
            if (seen && n.at !== from && X.rnd() < 0.25) {
                /* R93：身影播报不报地点（旁白也只说大概） */
                out.push(X.emit('map.move', {
                    who: n.id,
                    text: n.name + '的身影往别处挪了过去。'
                }));
            }
        });
        return out;
    }

    /**
     * 夜间岗位剧本（killerSystem/蹲守用）：谁在何时该在哪，偏离即异常。
     * @returns {Array<{hour:string,site:string}>} 时段表 */
    function nightSlots(npc) {
        return [
            { hour: '上半夜', site: '木屋' },
            { hour: '三更', site: npc.watchSite || '木屋' },
            { hour: '后半夜', site: '木屋' }
        ];
    }

    root.NpcSchedule = { assignPosts, postTarget, assertLocation, npcStepAll, nightSlots };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* timeSystem.js — 08:00-18:00 时间预算：移动 15/采集 40/交谈 25/搜查 40/蹲守 50/休息 60（`Cfg.timeCost`，勿在此写死）。
   时间来自 state，禁 Date.now()（L3）。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;
    const Map = root.WorldMap;
    const Schedule = root.NpcSchedule;

    const HUNGER_MOVE_LINE = 10;

    /**
     * 分钟 → HH:MM。
     * @returns {string} 时刻 */
    function hhmm(min) {
        const m = Math.max(0, Math.floor(min));
        return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    }

    /**
     * 动作耗时（饥饿 <10 移动 +50%）。
     * @returns {number} 分钟 */
    function costOf(S, actId) {
        const base = Cfg.timeCost[actId] || Cfg.timeCost.move;
        const hungry = (actId === 'move') && S.player.hunger < HUNGER_MOVE_LINE;
        return hungry ? Math.round(base * Cfg.hungerMoveTimeMul) : base;
    }

    /**
     * 距天黑剩余分钟。
     * @returns {number} 分钟 */
    function leftMinutes(S) {
        return Math.max(0, Cfg.dayEndMinute - S.clock);
    }

    /**
     * 是否已天黑。
     * @returns {boolean} 天黑 */
    function isDark(S) {
        return S.clock >= Cfg.dayEndMinute;
    }

    /**
     * 推进世界时间：NPC 同步走格子（每 20 分一格）、视野清扫、时间播报与天黑预警。
     * @returns {Array<object>} 事件 */
    function spend(X, minutes) {
        const S = X.S;
        S.clock += minutes;
        S.stepAcc += minutes;
        let steps = Math.floor(S.stepAcc / Cfg.npcStepMinute);
        S.stepAcc -= steps * Cfg.npcStepMinute;
        const ev = [];
        while (steps-- > 0) {
            Schedule.npcStepAll(X).forEach(function (e) { ev.push(e); });
        }
        ev.push(X.emit('time.tick', { clock: S.clock, text: '' }));
        const warnAt = Cfg.dayEndMinute - Cfg.timeWarnBeforeDark;
        if (S.clock >= warnAt && S.clock - minutes < warnAt) {
            ev.push(X.emit('time.warn', {
                text: '日头偏西了（' + hhmm(S.clock) + '）。天黑前最好回到木屋。'
            }));
        }
        return ev;
    }

    /**
     * 时段名（凌晨/白昼/黄昏）。
     * @returns {string} 时段 */
    function slotName(S) {
        return S.clock < 12 * 60 ? '上午' : S.clock < 16 * 60 ? '午后' : '黄昏';
    }

    root.TimeSystem = { hhmm, costOf, leftMinutes, isDark, spend, slotName, HUNGER_MOVE_LINE };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* resourceSystem.js — 木/食/水库存 + 背包物品 + 团队消耗 + 饥饿值（日志③⑦）。
   采集产出具体物品入背包；木屋交公入库；进食结算走背包。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;

    const STOCK_NAME = { wood: '木', food: '食', water: '水' };
    const ITEMS = {
        firewood: { name: '木柴捆', stock: 'wood', per: 1 },
        berry: { name: '野果', stock: 'food', per: 1 },
        driedBerry: { name: '浆果干', stock: 'food', per: 1 },
        rawMeat: { name: '生肉', stock: 'food', per: 1 },
        cookedFood: { name: '熟食', stock: 'food', per: 1 },
        waterFlask: { name: '清水壶', stock: 'water', per: 1 }
    };
    const EATABLE = ['berry', 'driedBerry', 'rawMeat', 'cookedFood'];

    /**
     * 库存中文名。
     * @returns {string} 名称 */
    function stockName(key) {
        return STOCK_NAME[key] || key;
    }

    /**
     * 加库存（封顶 cfg.stockCapacity）。
     * @returns {number} 实际增量 */
    function addStock(S, key, amount) {
        const before = S.stocks[key];
        S.stocks[key] = Math.max(0, Math.min(Cfg.stockCapacity, before + amount));
        return S.stocks[key] - before;
    }

    /**
     * 加物品入背包。
     * @returns {number} 新计数 */
    function addItem(S, itemId, count) {
        const bag = S.player.inventory;
        bag[itemId] = Math.max(0, (bag[itemId] || 0) + count);
        return bag[itemId];
    }

    /**
     * 背包清单（空项不计）。
     * @returns {Array<{id:string,name:string,count:number}>} 物品 */
    function listBag(S) {
        return Object.keys(S.player.inventory)
            .filter(function (id) { return (S.player.inventory[id] || 0) > 0; })
            .map(function (id) {
                return { id, name: (ITEMS[id] || { name: id }).name, count: S.player.inventory[id] };
            });
    }

    /**
     * 采集产出：按配置的概率分布产出具体物品入背包，并推进当日生存任务。
     * @returns {Array<object>} 事件 */
    function collect(X, kind) {
        const S = X.S;
        const conf = Cfg.itemYield[kind];
        const tasks = root.SurvivalTask;
        if (kind === 'food') {
            const pickTable = conf;
            let roll = X.rnd();
            let chosen = pickTable[0];
            for (let i = 0; i < pickTable.length; i++) {
                roll -= pickTable[i].weight;
                if (roll < 0) {
                    chosen = pickTable[i];
                    break;
                }
            }
            const amount = root.Rng.rint(X.rnd, chosen.range[0], chosen.range[1]);
            addItem(S, chosen.id, amount);
            if (tasks) {
                tasks.progress(X, 'food', amount);
            }
            return [X.emit('task.result', {
                text: '你采到了 ' + chosen.name + ' ×' + amount + '，进了背包。',
                axis: 'food', item: chosen.id, gain: amount
            })];
        }
        const amount = root.Rng.rint(X.rnd, conf.range[0], conf.range[1]);
        addItem(S, conf.id, amount);
        if (tasks) {
            tasks.progress(X, kind, amount);
        }
        return [X.emit('task.result', {
            text: '你备下了 ' + conf.name + ' ×' + amount + '，进了背包。',
            axis: kind, item: conf.id, gain: amount
        })];
    }

    /**
     * 交公入库：背包物品按 1:1 转库存（木屋内）。
     * @returns {Array<object>} 事件 */
    function depositAll(X) {
        const S = X.S;
        const notes = [];
        Object.keys(ITEMS).forEach(function (id) {
            const count = S.player.inventory[id] || 0;
            if (count <= 0) {
                return;
            }
            addStock(S, ITEMS[id].stock, count * ITEMS[id].per);
            S.player.inventory[id] = 0;
            notes.push(ITEMS[id].name + '×' + count);
        });
        if (!notes.length) {
            return [X.emit('task.result', { text: '背包里没有可以入库的东西。' })];
        }
        return [X.emit('resource.change', {
            text: '你把 ' + notes.join('、') + ' 交进了公家库存。',
            stocks: Object.assign({}, S.stocks)
        })];
    }

    /**
     * 进食结算：野果 +15 / 浆果干 +20 / 生肉 +25（30% 染病）/ 熟食 +35。
     * @returns {Array<object>} 事件 */
    function eat(X, itemId) {
        const S = X.S;
        const gain = Cfg.hungerEatGain[itemId];
        if (!gain || (S.player.inventory[itemId] || 0) <= 0) {
            return [X.emit('task.result', { text: '背包里没有能直接吃的东西。' })];
        }
        S.player.inventory[itemId] -= 1;
        S.player.hunger = Math.min(100, S.player.hunger + gain);
        const ev = [X.emit('resource.change', {
            text: '你吃下了' + (ITEMS[itemId] || { name: itemId }).name + '，饥饿 +' + gain + '。',
            hunger: S.player.hunger, item: itemId
        })];
        if (itemId === 'rawMeat' && X.rnd() < Cfg.rawMeatSickChance) {
            S.player.sick = true;
            S.player.sickDays = Cfg.accidentInjuryDays;
            ev.push(X.emit('accident.event', {
                text: '生肉不干净。你的肚子绞痛起来——染了病（遇险率 +' +
                    Math.round(Cfg.sickRiskBonus * 100) + '%/天）。',
                kind: 'sick'
            }));
        }
        return ev;
    }

    /**
     * 烹饪：木屋内生肉 → 熟食（耗 1 木柴捆）。
     * @returns {Array<object>} 事件 */
    function cook(X) {
        const S = X.S;
        if ((S.player.inventory.rawMeat || 0) <= 0) {
            return [X.emit('task.result', { text: '没有生肉可做。' })];
        }
        if ((S.player.inventory.firewood || 0) <= 0) {
            return [X.emit('task.result', { text: '没有木柴，生不起火。' })];
        }
        S.player.inventory.rawMeat -= 1;
        S.player.inventory.firewood -= 1;
        addItem(S, 'cookedFood', 1);
        return [X.emit('resource.change', { text: '你烤熟了一块肉（熟食 ×1，木柴 -1）。', item: 'cookedFood' })];
    }

    /**
     * 团队日耗结算：库存扣 cfg.stockDailyNeed（全营每日用度含伙食，不再按人头重复扣）；
     * NPC 各自吃库存同步饥饿（饥饿增益走配置）。
     * @returns {Array<object>} 事件 */
    function dailyConsume(X) {
        const S = X.S;
        const need = Cfg.stockDailyNeed;
        ['wood', 'food', 'water'].forEach(function (k) {
            S.stocks[k] = Math.max(0, S.stocks[k] - need[k]);
        });
        S.npcs.forEach(function (n) {
            if (!n.alive) {
                return;
            }
            const fed = S.stocks.food > 0;
            if (fed) {
                n.hunger = Math.min(100, n.hunger + Cfg.hungerNpcFeedGain);
            } else {
                n.hunger = Math.max(0, n.hunger - Math.abs(Cfg.hungerDaily));
            }
        });
        S.player.hunger = Math.max(0, S.player.hunger + Cfg.hungerDaily);
        if (S.player.hunger < Cfg.hungerRiskThreshold) {
            S.player.harrowed = true;
        }
        const empty = ['wood', 'food', 'water'].filter(function (k) { return S.stocks[k] <= 0; });
        const ev = [X.emit('resource.change', {
            text: '一夜用度：木 -' + need.wood + ' 食 -' + need.food + ' 水 -' + need.water +
                '。库存 木' + S.stocks.wood + ' 食' + S.stocks.food + ' 水' + S.stocks.water +
                '。你的饥饿 ' + Math.round(S.player.hunger) + '。',
            stocks: Object.assign({}, S.stocks), hunger: S.player.hunger
        })];
        if (empty.length) {
            S.emptyStreakDays += 1;
            ev.push(X.emit('crisis.warning', {
                text: empty.map(stockName).join('、') + '彻底断了。今晚开始挨饿受冻。',
                streak: S.crisisCount
            }));
        } else {
            S.emptyStreakDays = 0;
        }
        return ev;
    }

    /**
     * 三库存全空或告急判定。
     * @returns {{empty:string[],low:string[]}} 分类 */
    function stockStatus(S) {
        const empty = [], low = [];
        ['wood', 'food', 'water'].forEach(function (k) {
            if (S.stocks[k] <= 0) {
                empty.push(k);
            } else if (S.stocks[k] < 15) {
                low.push(k);
            }
        });
        return { empty, low };
    }

    root.ResourceSystem = {
        ITEMS, EATABLE, stockName, addStock, addItem, listBag,
        collect, depositAll, eat, cook, dailyConsume, stockStatus
    };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* journalPage.js — 荒原记事（R101）：当天这一本记事，每日清晨清空。
   记事只留今天这一页——昨夜的字迹抄不回来，所以想留档就得当天写进日记（InventorySystem）。
   本模块只管"这一页上有没有这一行"：sim 发事件时落行，写日记时查行，清晨翻篇时清空。
   L4：页面只带行号与线索号，正文由前端从事件本身拿（LLM 换词后的字面以视图为准）。 */
(function (root) {
    'use strict';

    /**
     * 记一行（sim 发事件时调用；空行不入册，time.tick 这类只推时钟的不留字迹）。
     * @param {object} S 真相态
     * @param {object} ev 事件（带 id 与 payload.clueId / payload.claimId） */
    function record(S, ev) {
        if (!ev || !ev.id || !ev.payload || !ev.payload.text) {
            return;
        }
        S.stream.push({
            line: ev.id,
            clueId: ev.payload.clueId || null,
            claimId: ev.payload.claimId || null
        });
    }

    /**
     * 这一行还在记事上吗（= 今天这一页，未翻篇）。
     * @returns {boolean} 是否在册 */
    function has(S, lineId) {
        return S.stream.some(function (l) { return l.line === lineId; });
    }

    /**
     * 这一行记的是哪条线索（非线索行返回 null）。
     * @returns {?string} 线索 id */
    function clueOf(S, lineId) {
        const l = S.stream.find(function (x) { return x.line === lineId; });
        return l ? l.clueId : null;
    }

    /**
     * 这一行是谁的说法（问话证言行；非证言行返回 null，R110）。
     * @returns {?string} 说法 id */
    function claimOf(S, lineId) {
        const l = S.stream.find(function (x) { return x.line === lineId; });
        return l ? (l.claimId || null) : null;
    }

    /**
     * 每日清晨清空（R101 设定：荒原记事每日清空）。
     * @param {object} S 真相态 */
    function clear(S) {
        S.stream = [];
    }

    root.JournalPage = { record, has, clueOf, claimOf, clear };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* inventorySystem.js — 行囊（R96/R99/R101）：日记本 + 物证 + 采集物三格。
   日记本开局自带、不可交公：荒原记事里的任何一句都能【写进日记】留档（R99 记事制，不限句子出处；
   R100 起记成功花 30 分钟——耗时由 sim 结算，本模块只管记不记得下（R112 晨会里记不花时辰）；
   R101 荒原记事每日清空，只有还在今天这一页上的句子抄得进来，且起票只认写进日记的线索）。
   物证＝现场/搜查落成的实物，与线索卡 id 绑定，直接摆在物品栏里。
   采集物仍走 ResourceSystem 的背包，本模块不碰（三格只在 UI 侧合成一栏）。
   L4：日记条目与物证条目只带 id/名称/正文/日期/线索号/贴图，禁带 tags/val 等对人真相字段。
   投票双轨：实物类线索（物证/掉落物）免记直接可引，话语类维持 R101 起票只认写进日记的。
   R110 起票全放行：写进日记的任何一句都是凭据——带线索号的按线索判，带说法号的证言按说法真假/指向判，
   打量家常行为札记中性（不加不罚）；撞车键＝正文＋线索号（同句不同线索各记各的，同句补号不重记）。 */
(function (root) {
    'use strict';

    const DIARY_NAME = '日记本';
    const NOTE_MAX = 200;
    /* 物证件名：与 clueTemplates.hard 的 k 对齐 */
    const EVID_NAME = {
        shoes: '湿泥鞋印拓片', cloth: '带泥的布片', tool: '凶器残件',
        time: '火堆余烬', drag: '拖拽痕拓片'
    };

    /**
     * 开局随身之物：一本日记 + 空的物证袋。
     * @param {object} S 真相态 */
    function init(S) {
        S.player.diary = { name: DIARY_NAME, entries: [] };
        S.player.evidence = [];
    }

    /**
     * 物证落袋（genHard 落线索卡时同步进物品栏）。
     * @returns {object} 物证条目 */
    function addEvidence(S, clue, from) {
        const item = {
            id: 'ev' + (S.player.evidence.length + 1),
            clueId: clue.id,
            k: clue.k,
            name: clue.itemName || EVID_NAME[clue.k] || '现场物证',
            icon: clue.icon || clue.k || 'generic',
            text: clue.text,
            day: S.day,
            from: from || '现场'
        };
        S.player.evidence.push(item);
        return item;
    }

    /**
     * 同一句是否已写进日记（撞车键＝正文＋线索号：同句但记的是不同线索，各记各的；
     * 同句先记了没线索号的一条、后来这句带着线索号再出现＝同一回事，把线索号补上即可）。
     * @returns {?object} 日记条目 */
    function noteOf(S, text, clueId) {
        return S.player.diary.entries.find(function (e) {
            return e.text === text && (e.clueId || null) === (clueId || null);
        }) || null;
    }

    /**
     * 记事的这一行是否已写进日记。
     * @returns {?object} 日记条目 */
    function noteLine(S, lineId) {
        return S.player.diary.entries.find(function (e) { return e.line === lineId; }) || null;
    }

    /**
     * 日记里记下的线索（起票只认这些，R101）。
     * @returns {Array<string>} 线索 id */
    function citedClueIds(S) {
        const out = [];
        S.player.diary.entries.forEach(function (e) {
            if (e.clueId && out.indexOf(e.clueId) < 0) {
                out.push(e.clueId);
            }
        });
        return out;
    }

    /**
     * 这条凭据能不能拿到投票上去用。双轨：实物类线索（物证 phys / 掉落物 item）是攥在手里的东西，
     * 不随记事淡忘——免写日记直接可引；话语类线索维持 R101，没写进日记当没有。
     * R110：日记条目本身（记事行 id）也是凭据——能写进日记的每一句都举得起票。
     * @returns {boolean} 是否可作凭据 */
    function canCite(S, cid) {
        const clue = (S.clues || []).find(function (c) { return c.id === cid; });
        if (clue && (clue.kind === 'phys' || clue.kind === 'item')) {
            return true;
        }
        return S.player.diary.entries.some(function (e) {
            return e.clueId === cid || e.line === cid;
        });
    }

    /**
     * 线索对应的物证件。
     * @returns {?object} 物证条目 */
    function evidenceOf(S, clueId) {
        return S.player.evidence.find(function (e) { return e.clueId === clueId; }) || null;
    }

    /**
     * 把荒原记事里的一页写进日记（同一行只记一次；耗时由 sim 按记成功与否结算，R100）。
     * R101：只认还在记事上的那一页——荒原记事每日清空，昨天的字迹抄不回来，ref.line 查无此行即拒记。
     * 记下的若是一条线索（ref.clueId），它才算"写进日记的线索"，投票时才取得出来（R101）。
     * R110：撞车键＝正文＋线索号——同句先记下的那条没带线索号、这句带着线索号回来，是同一回事，
     * 给旧条目补上线索号（拒记不扣时，但线索从此举得起）；同句记的是别的线索则各记各的。
     * @param {object} S 真相态
     * @param {string} text 记下的原句
     * @param {string} hour 写下时刻
     * @param {{line:string,clueId:?string,claimId:?string}} [ref] 记事行出处
     * @returns {{ok:boolean,why:string,entry:?object}} 结果 */
    function write(S, text, hour, ref) {
        const line = String(text || '').trim();
        const rid = (ref && ref.line) || '';
        const cid = (ref && ref.clueId) || null;
        if (!line) {
            return { ok: false, why: '空着的字没法记。', entry: null };
        }
        if (line.length > NOTE_MAX) {
            return { ok: false, why: '这句太长，日记写不下。', entry: null };
        }
        if (!rid) {
            return { ok: false, why: '得从荒原记事里点一句，才抄得进日记。', entry: null };
        }
        if (!root.JournalPage.has(S, rid)) {
            return { ok: false, why: '这句已经翻篇了——荒原记事每天清晨清空，昨天的字迹抄不回来。', entry: null };
        }
        if (noteLine(S, rid)) {
            return { ok: false, why: '这句已经在日记里了。', entry: null };
        }
        const twin = noteOf(S, line, cid);
        if (twin) {
            return { ok: false, why: '这句已经在日记里了。', entry: null };
        }
        if (cid) {
            const plain = noteOf(S, line, null);
            if (plain) {
                plain.clueId = cid;
                return {
                    ok: false, why: '这句已经在日记里了——日记给它补上了线索号，这回举得起票了。', entry: plain
                };
            }
        }
        const entry = {
            text: line, day: S.day, hour: hour || '',
            line: rid, clueId: cid,
            claimId: (ref && ref.claimId) || null
        };
        S.player.diary.entries.push(entry);
        return { ok: true, why: '', entry };
    }

    /**
     * 拿一个凭据 id 换出可判定的凭据（R110 起票全放行）：id 可以是线索 id，
     * 也可以是日记条目的记事行 id（=写进日记的那一句）。
     * 线索→按线索判；条目带线索号→归到那条线索上判；带说法号→证言（按说法真假/指向判）；其余→札记（中性）。
     * @returns {?{kind:string,clue:?object,claim:?object,entry:?object}} 凭据 */
    function cite(S, id) {
        const clue = (S.clues || []).find(function (c) { return c.id === id; });
        if (clue) {
            return { kind: 'clue', clue: clue, claim: null, entry: null };
        }
        const e = S.player.diary.entries.find(function (x) { return x.line === id; });
        if (!e) {
            return null;
        }
        if (e.clueId) {
            const c = (S.clues || []).find(function (x) { return x.id === e.clueId; });
            if (c) {
                return { kind: 'clue', clue: c, claim: null, entry: e };
            }
        }
        if (e.claimId) {
            const claim = (S.claims || []).find(function (x) { return x.id === e.claimId; });
            if (claim) {
                return { kind: 'claim', clue: null, claim: claim, entry: e };
            }
        }
        return { kind: 'note', clue: null, claim: null, entry: e };
    }

    /**
     * 行囊视图（L4 白名单：只给 id/名称/正文/日期/线索号/行号）。
     * 行号（line）＝这句在记事上的行 id，也是起票引用日记句的凭据号；说法号与真假判定留在真相态，不下发。
     * @returns {{diary:object,evidence:Array<object>}} 行囊 */
    function viewBag(S) {
        return {
            diary: {
                name: S.player.diary.name,
                entries: S.player.diary.entries.map(function (e) {
                    return { text: e.text, day: e.day, hour: e.hour, clueId: e.clueId, line: e.line };
                })
            },
            evidence: S.player.evidence.map(function (e) {
                return {
                    id: e.id, clueId: e.clueId, k: e.k, name: e.name,
                    icon: e.icon, text: e.text, day: e.day, from: e.from
                };
            })
        };
    }

    root.InventorySystem = {
        DIARY_NAME, EVID_NAME, NOTE_MAX,
        init, addEvidence, noteOf, noteLine, citedClueIds, canCite, cite, evidenceOf,
        write, viewBag
    };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* survivalTask.js — 每日生存任务与完成度；低于阈值 → 危机计数（日志④）。
   完成度 = 完成项 / 总项；<50% 连续 2 天 → 危机警告；<30% 当日即危机计数 +1。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;

    const TASK_KINDS = [
        { kind: 'wood', label: '补木' },
        { kind: 'food', label: '找食' },
        { kind: 'water', label: '取水' }
    ];

    /**
     * 掷当日任务：每类一项，需求量随机落区间。
     * @returns {Array<object>} 事件 */
    function rollDaily(X) {
        const S = X.S;
        S.tasks = TASK_KINDS.map(function (t, i) {
            const range = Cfg.dailyTaskNeed[t.kind];
            return {
                id: 'task' + i, kind: t.kind, label: t.label,
                need: root.Rng.rint(X.rnd, range[0], range[1]),
                got: 0, done: false
            };
        });
        S.taskHistory = S.taskHistory || [];
        return [X.emit('survival.task', {
            text: '今日活计：' + S.tasks.map(function (t) {
                return t.label + ' ' + t.need;
            }).join(' / ') + '。做不完，晚上就要饿肚子。',
            tasks: S.tasks.map(function (t) { return { kind: t.kind, need: t.need, got: t.got }; })
        })];
    }

    /**
     * 采集即计入当日任务进度。
     * @returns {boolean} 是否完成了一项 */
    function progress(X, kind, amount) {
        const S = X.S;
        const t = (S.tasks || []).find(function (x) { return x.kind === kind; });
        if (!t || t.done) {
            return false;
        }
        t.got += amount;
        if (t.got >= t.need) {
            t.done = true;
            return true;
        }
        return false;
    }

    /**
     * 当日完成度 = 完成项 / 总项。
     * @returns {number} 0..1 */
    function completion(S) {
        const list = S.tasks || [];
        if (!list.length) {
            return 1;
        }
        const done = list.filter(function (t) { return t.done; }).length;
        return done / list.length;
    }

    /**
     * 黄昏结算完成度 + 危机计数（<50% 连续 2 天告警；<30% 当日 +1）。
     * @returns {Array<object>} 事件 */
    function settle(X) {
        const S = X.S;
        let rate = completion(S);
        if (S.player.strandedToday) {
            rate = Math.max(0, rate + Cfg.strandedCompletion);
        }
        S.taskHistory.push(rate);
        S.completion = rate;
        const ev = [];
        ev.push(X.emit('survival.task', {
            text: '今日完成度 ' + Math.round(rate * 100) + '%（' +
                (S.tasks || []).filter(function (t) { return t.done; }).length + '/' + (S.tasks || []).length + ' 项）。',
            completion: rate
        }));
        if (rate < Cfg.taskCrisisLine) {
            S.crisisCount += 1;
            ev.push(X.emit('crisis.warning', {
                text: '今天几乎没干活。危机计数 +1（已 ' + S.crisisCount + '/' + Cfg.crisisCountLimit + '）。',
                streak: S.crisisCount
            }));
        } else if (rate < Cfg.taskCompleteGoodLine) {
            S.taskFailStreak += 1;
            if (S.taskFailStreak >= Cfg.taskFailStreakLimit) {
                S.crisisCount += 1;
                ev.push(X.emit('crisis.warning', {
                    text: '连续 ' + Cfg.taskFailStreakLimit + ' 天活计不济。营地人心惶惶，危机计数 +1。',
                    streak: S.crisisCount
                }));
                S.taskFailStreak = 0;
            }
        } else {
            S.taskFailStreak = 0;
        }
        return ev;
    }

    root.SurvivalTask = { TASK_KINDS, rollDaily, progress, completion, settle };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* beliefSystem.js — NPC 信念记录：亲历行踪/成见（图灵证言，日志①③）。
   每个 NPC 只知道自己亲历（seenBy=本人）与当众听到的事；系统不开天窗。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;

    /**
     * 记一条亲历事实（谁看见了什么）。
     * @returns {object} 事实 */
    function addFact(X, kind, subj, who, site, to, hour, seenBy, hard) {
        const S = X.S;
        const f = {
            id: 'f' + (S.facts.length + 1),
            kind, subj, who, site, to, hour, seenBy,
            day: S.day, t: S.clock, hard: !!hard, public: false
        };
        S.facts.push(f);
        if (seenBy !== 'ALL' && seenBy !== 'PLAYER') {
            const npc = S.npcs.find(function (n) { return n.id === seenBy; });
            if (npc && npc.belief) {
                npc.belief.sightings.push(f.id);
            }
        }
        return f;
    }

    /**
     * 本人信念视图（供 perform 组 prompt / 供证言生成）：只含亲历 + 当众。
     * @returns {{sightings:Array,claims:Array,prejudice:Array}} 信念 */
    function beliefOf(S, npcId) {
        const npc = S.npcs.find(function (n) { return n.id === npcId; });
        return (npc && npc.belief) ? npc.belief : { sightings: [], claims: [], prejudice: [] };
    }

    /**
     * 某人亲历的事实列表。
     * @returns {Array<object>} 事实 */
    function ownFacts(S, npcId) {
        return S.facts.filter(function (f) { return f.seenBy === npcId || f.seenBy === 'ALL'; });
    }

    /**
     * 当众开腔：此人把亲历目击讲了出来（"欲言又止"的目击只有被问讯才公开，3.6）。
     * @param {object} S 真相态
     * @param {string} npcId 说话人 */
    function revealFacts(S, npcId) {
        S.facts.forEach(function (f) {
            if (f.seenBy === npcId) {
                f.public = true;
            }
        });
    }

    /**
     * 记录一句对外说法（供日后对质：说法与亲历事实比对）。
     * @param {object|null} claimObj 结构化说法 {personId,site,hour,day}（对质走台账比对，R91）
     * @returns {object} 说法记录 */
    function addClaim(X, npcId, text, lie, claimObj) {
        const S = X.S;
        const claim = {
            id: 'claim' + (S.claims.length + 1),
            npcId, day: S.day, hour: S.clock, text, lie: !!lie, refuted: false,
            claim: claimObj || null
        };
