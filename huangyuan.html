    }

    /* 收尾：理智氛围、危机检查、天黑自动收工 */
    function finishTurn(X, out) {
        if (!S.end && S.player.sanity < Cfg.sanityFlavorLine && X.rnd() < Cfg.sanityFlavorChance) {
            out.push(X.emit('sanity.flavor', {
                text: root.Rng.pick(X.rnd, root.CONTENT.sanityFlavor || []) || '你数不清火堆里有几根柴了。'
            }));
        }
        const status = Res.stockStatus(S);
        if (status.low.length) {
            out.push(X.emit('crisis.warning', {
                text: status.low.map(Res.stockName).join('、') + '快见底了，照今天的用法撑不过两天。',
                streak: S.crisisCount
            }));
        }
        Ending.checkEnd(X).forEach(push(out));
        if (!S.end && S.phase === 'day' && dayOver(S)) {
            if (!Time.isDark(S)) {
                out.push(X.emit('time.warn', { text: '剩下的光景不够再做一件事了。天擦黑，收工回屋。' }));
            }
            settleNight(X, out);
        }
        return out;
    }

    /* ── 对前端的唯一出口：白名单视图（L4）。行踪按玩家视野裁剪（3.5）── */
    function view() {
        const p = S.player;
        const visibleNpcs = S.npcs.map(function (n) {
            const near = n.alive && Map.dist({ x: p.x, y: p.y }, n) <= Cfg.sightRadius;
            const atMeeting = S.phase === 'meeting';
            const visible = near || atMeeting;
            const pub = {
                id: n.id, name: n.name, glyph: n.glyph, role: n.role,
                cloth: n.cloth,
                alive: n.alive, stress: n.stress, broke: n.broke,
                emotion: n.emotion, stains: Roster.stainLayers(n),
                visible, at: visible ? n.at : '不明'
            };
            if (visible) {
                pub.x = n.x;   /* 坐标=行踪：只带同一格的人，视野外不下发（R89） */
                pub.y = n.y;
            }
            return pub;
        });
        return {
            seed: S.seed, day: S.day, phase: S.phase, clock: S.clock,
            end: S.end, ended: S.ended,
            dayCount: Cfg.dayCount,
            player: {
                x: p.x, y: p.y, alive: p.alive, sanity: p.sanity,
                hunger: p.hunger, sick: p.sick, injuryDays: p.injuryDays,
                inventory: Object.assign({}, p.inventory),
                stakeoutTarget: p.stakeoutTarget, strandedToday: p.strandedToday
            },
            bag: Inv.viewBag(S),     /* R96 行囊：日记本 + 物证（白名单字段，禁 tags/val） */
            stocks: Object.assign({}, S.stocks),
            tasks: S.tasks.map(function (t) {
                return { id: t.id, kind: t.kind, label: t.label, need: t.need, got: t.got, done: t.done };
            }),
            taskHistory: S.taskHistory.slice(),
            completion: S.completion, crisisCount: S.crisisCount,
            worsen: S.worsen, misvote: S.misvote,
            npcs: visibleNpcs,
            clues: S.clues.map(function (c) {
                /* tags/val 是对人标签=真相侧，只留内部（L4）；玩家靠文本+名录特征自己对人 */
                return {
                    id: c.id, kind: c.kind, k: c.k, text: c.text,
                    day: c.day, hard: !!c.hard
                };
            }),
            testimonyBook: S.testimonyBook.slice(),
            meet: {
                open: S.meet.open, full: S.meet.full,
                asked: Object.assign({}, S.meet.asked),
                heat: S.meet.heat,
                clueMin: Cfg.persuade.clueMin,      /* 起票线索下限/上限（说服力本身不下发） */
                clueCount: Cfg.persuade.clueCount
            },
            victims: S.victims.slice(), exiled: S.exiled.slice(),
            /* R103 尸体留现场：只下发摆在明面上的（谁/在哪格/哪天/翻过没有），死因时辰不下发 */
            corpses: S.corpses.map(function (c) {
                return {
                    id: c.id, name: c.name, x: c.x, y: c.y,
                    site: c.site, day: c.day, searched: c.searched
                };
            })
        };
    }

    /* 结局后才允许揭晓真相。未结束时返回空对象（R26）。 */
    function reveal() {
        if (!S.end) {
            return {};
        }
        const K = S.npcs.find(function (n) { return n.id === S.killer.killerId; }) || {};
        return {
            killerId: S.killer.killerId, killerName: K.name,
            murderSite: S.killer.sceneSite, murderHour: S.killer.sceneHour,
            murderTool: S.killer.tool,
            nightActions: S.killer.nightActions.slice()
        };
    }

    /* 本人合法知识切片（perform 组 prompt 用）：只给这个人该知道的 */
    function mind(id) {
        const n = S.npcs.find(function (x) { return x.id === id; });
        if (!n) {
            return null;
        }
        return {
            id: n.id, name: n.name, role: n.role, style: n.style,
            motive: n.motive, secret: n.secret, tell: n.tell,
            isKiller: n.id === S.killer.killerId,
            myFacts: Belief.ownFacts(S, id).map(function (f) {
                return { kind: f.kind, who: f.who, site: f.site, to: f.to, hour: f.hour };
            }),
            day: S.day, victims: S.victims.length,
            stressed: n.stress > 25, broke: n.broke
        };
    }

    /* 指令分发：先克隆再结算，返回 [新状态, 事件]（R42 纯函数契约） */
    function handle(cmd) {
        root.Validators.assertCmd(cmd);
        S = structuredClone(S);
        let ev = [];
        switch (cmd.type) {
            case 'move': ev = cmdMove(cmd.dir); break;
            case 'act': ev = cmdAct(cmd.actId, cmd.arg, cmd.line); break;
            case 'talk': ev = cmdTalk(cmd.npcId); break;
            case 'ask': ev = cmdAsk(cmd.npcId); break;
            case 'vote': ev = cmdVote(cmd.targetId, cmd.clueIds); break;
            case 'endDay': ev = cmdEndDay(); break;
            default:
                throw new Error('契约违规: 未处理指令 ' + cmd.type);
        }
        ev = uniq(ev);
        ev.forEach(root.Validators.assertEvent);
        return [view(), ev];
    }

    /**
     * 契约主入口：(state, cmd) => [state, events]。
     * @param {object} _state 占位（真相在内部，视图即状态）
     * @param {object} cmd 指令
     * @returns {Array} [状态视图, 事件列表] */
    function step(_state, cmd) {
        return handle(cmd);
    }

    root.SIM = {
        newGame, step, handle, view, reveal, mind,
        state: function () { return S ? view() : null; },
        aliveN: function () { return S.npcs.filter(function (n) { return n.alive; }); },
        trace: function () { return Ending.traceExport(S); },
        recap: function () { return Ending.recapData(S); },
        byId: function (id) { return S.npcs.find(function (n) { return n.id === id; }) || null; },
        geo: { W: Map.W, H: Map.H, ch: Map.ch, tile: Map.tile, walkable: Map.walkable, isHome: Map.isHome },
        /* 因果闸门专用（perform/causalGuard 调用，UI 禁用 L4）：台账对账 + 线索真伪查询 */
        ledgerCheck: function (claim) { return root.CausalLedger.checkClaim(S, claim); },
        clueTruthOf: function (clueId) {
            const c = S.clues.find(function (x) { return x.id === clueId; });
            return c ? c.truth : null;
        },
        /* R108：交谈文本 ≠ 线索原文（perform 对模型抄稿兜底用；UI 禁用 L4） */
        isClueText: function (text) {
            return !!S && S.clues.some(function (c) { return c.text === text; });
        },
        /* 测试钩子（静默档专用）：直接读内部真相，生产 UI 不得调用 */
        internals: function () { return S; }
    };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* llmAdapter.js — BYOK OpenAI 兼容接入（M1）：排队 4 并发/30s 超时/429-5xx 重试 ≤3/思考开关兼容。
   key 只存浏览器本地（R70：禁进 bundle、禁进仓库）；架构预留薄服务器代理切换（D1-B）。 */
(function (root) {
    'use strict';
    const LLM = root.CONFIG.llm;

    const CFG_KEY = 'n4cfg';
    const stat = { ok: 0, fail: 0, err: '' };
    let warned = false;
    let inflight = 0;
    const waiting = [];
    const strictHost = {};   // base|model → 这家不接受附加参数（记住后不再带思考开关）

    /**
     * 读模型配置 {base, model, key, noThink}。
     * @returns {object} 配置 */
    function cfg() {
        try {
            return JSON.parse(localStorage.getItem(CFG_KEY)) || {};
        } catch (e) {
            return {};
        }
    }

    /**
     * 保存模型配置（只存玩家自己的浏览器）。
     * @param {object} c 配置 */
    function saveCfg(c) {
        try {
            localStorage.setItem(CFG_KEY, JSON.stringify(c));
        } catch (e) {
            console.error('[llmAdapter] 配置保存失败', e);   // R54 禁吞错
        }
    }

    /**
     * @returns {boolean} 是否已配置 */
    function ready() {
        const c = cfg();
        return !!(c.key && c.base && c.model);
    }

    function pump() {
        while (inflight < LLM.concurrency && waiting.length) {
            inflight++;
            waiting.shift()();
        }
    }

    /**
     * 一次对话调用（M4 可靠性：排队/超时/有限重试/思考开关剥离重打）。
     * @param {string} sys 系统提示（R72：与用户文本模板化隔离）
     * @param {string} user 用户/事件文本
     * @param {function(?Error,string)} cb 回调
     * @param {object} [conf] 覆盖配置
     * @param {number} [attempt] 重试序号 */
    function chat(sys, user, cb, conf, attempt) {
        const c = conf || cfg();
        if (!c.key || !c.base || !c.model) {
            return cb(new Error('未配置模型'));
        }
        waiting.push(function () {
            const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
            const timer = ctl ? setTimeout(function () { ctl.abort(); }, LLM.timeoutMs) : null;
            const fin = function (err, out) {
                if (timer) {
                    clearTimeout(timer);
                }
                inflight--;
                pump();
                if (err && err.restrip) {
                    setTimeout(function () { chat(sys, user, cb, conf, attempt); });   // 去开关重打不计重试
                    return;
                }
                if (err && err.retry && (attempt || 0) < LLM.retryMax) {
                    setTimeout(function () {
                        chat(sys, user, cb, conf, (attempt || 0) + 1);
                    }, LLM.retryBackoffMs * Math.pow(2, attempt || 0));
                    return;
                }
                cb(err, out);
            };
            /* 三家叫法不同的"关思考"开关一起带上；服务商 400 时自动剥掉重打并记住 */
            const hkey = String(c.base) + '|' + c.model;
            const wantOff = c.noThink !== false && !strictHost[hkey];
            const extra = wantOff ? {
                enable_thinking: false,
                thinking: { type: 'disabled' },
                chat_template_kwargs: { enable_thinking: false }
            } : {};
            fetch(String(c.base).replace(/\/+$/, '') + '/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
                signal: ctl ? ctl.signal : undefined,
                body: JSON.stringify(Object.assign({
                    model: c.model,
                    temperature: LLM.temperature,
                    max_tokens: LLM.maxTokens
                }, extra, {
                    messages: [
                        { role: 'system', content: sys },
                        { role: 'user', content: user }
                    ]
                }))
            }).then(function (r) {
                if (!r.ok) {
                    return r.text().catch(function () { return ''; }).then(function (txt) {
                        const e = new Error('HTTP ' + r.status + (txt ? ' ' + txt.slice(0, 120) : ''));
                        e.retry = r.status === 429 || r.status >= 500;
                        if (wantOff && (r.status === 400 || r.status === 422)) {
                            strictHost[hkey] = true;
                            e.retry = false;
                            e.restrip = true;
                        }
                        throw e;
                    });
                }
                return r.json();
            }).then(function (j) {
                const ch0 = j && j.choices && j.choices[0];
                const msg = (ch0 && ch0.message) || {};
                let out = msg.content;
                if (Array.isArray(out)) {
                    out = out.map(function (p) { return (p && p.text) || ''; }).join('');
                }
                if (out && String(out).trim()) {
                    stat.ok++;
                    return fin(null, out);
                }
                if (msg.reasoning_content || (ch0 && ch0.finish_reason === 'length')) {
                    return fin(new Error('正文为空：输出额度被"思考"吃掉了。勾选放弃思考或换非思考模型'));
                }
                if (ch0 && ch0.finish_reason === 'content_filter') {
                    return fin(new Error('被服务商的内容审核拦掉了这一句'));
                }
                fin(new Error('空回复'));
            }).catch(function (e) {
                if (e && e.name === 'TypeError') {
                    const n = new Error('网络不通或跨域(CORS)被拦截');
                    n.retry = true;
                    return fin(n);
                }
                if (e && e.name === 'AbortError') {
                    const n = new Error('超时（' + (LLM.timeoutMs / 1000) + ' 秒没回话）');
                    n.retry = true;
                    return fin(n);
                }
                fin(e);
            });
        });
        pump();
    }

    /**
     * 失败计数 + 首次可见告警（顶栏 LLM ✓/✗ 的 ✗ 来源）。
     * @param {?Error} e 错误 */
    function fail(e) {
        stat.fail++;
        stat.err = (e && e.message) || '未知错误';
    }

    /**
     * 连接自检：最小请求探一次，原始报错原样带回。
     * @param {object} nc 候选配置
     * @param {function(?Error,string)} cb 回调 */
    function testConn(nc, cb) {
        chat('你是连接测试，只回复两个字：正常。', 'ping', cb, nc);
    }

    /**
     * 思考型模型按命名惯例识别（deepseek-reasoner / -thinking / qwq / o1 o3 o4 / r1 / z1）。
     * @returns {boolean} 是否思考型 */
    function isReasoner(name) {
        return /reasoner|thinking|qwq|(^|[-_./])(o1|o3|o4|r1|z1)([-_./]|$)/i.test(String(name || ''));
    }

    root.LlmAdapter = {
        chat, cfg, saveCfg, ready, fail, testConn, isReasoner,
        stat: function () { return stat; },
        consumeWarn: function () { const w = warned; warned = true; return !w; }
    };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* textGuard.js — 文本闸门（第 6 节 T1-T5）：纯中文/去重/长度带/低质拦截/兜底。
   规则实现在 util/validators.js，这里只做编排：校验→截断→兜底。 */
(function (root) {
    'use strict';
    const V = root.Validators;
    const TG = root.CONFIG.textGuard;

    const BAND = {
        dialogue: 'dialogue',
        meeting: 'meeting',
        narr: 'narr',
        recap: 'recap'
    };

    /**
     * 全套校验：T1 纯中文 → T2 去重 → T3 长度带 → T4 低质。
     * @param {string} text 文本
     * @param {string} band 长度带
     * @param {string[]} recent 最近台词
     * @returns {{ok:boolean,reason:string}} 判定 */
    function check(text, band, recent) {
        const s = String(text || '').trim();
        if (!s) {
            return { ok: false, reason: 'empty' };
        }
        if (!V.isPureChinese(s)) {
            return { ok: false, reason: 'T1-latin' };
        }
        if (!V.isFreshText(s, recent || [], TG.freshThreshold)) {
            return { ok: false, reason: 'T2-duplicate' };
        }
        if (!V.isInLengthBand(s, band)) {
            return { ok: false, reason: 'T3-band' };
        }
        if (!V.isQualityText(s)) {
            return { ok: false, reason: 'T4-lowquality' };
        }
        return { ok: true, reason: '' };
    }

    /**
     * 闸门主入口：合格→原样放行；超长→截断后再验；不合格→回落模板（T5）。
     * @param {string} text 模型输出
     * @param {string} band 长度带
     * @param {string[]} recent 最近台词
     * @param {string} fallback 兜底模板文本
     * @returns {{text:string,used:'llm'|'fallback',reason:string}} 结果 */
    function admit(text, band, recent, fallback) {
        let s = String(text || '').trim().replace(/^[「"“]|["”」]$/g, '');
        let r = check(s, band, recent);
        if (!r.ok && r.reason === 'T3-band') {
            /* 超带截断（对白 26 字/旁白 60 字/指控分析 300 字）后重验一次 */
            const cap = band === BAND.recap ? 300 : band === BAND.meeting ? 120 : band === BAND.narr ? 60 : 26;
            s = s.slice(0, cap);
            r = check(s, band, recent);
        }
        if (r.ok) {
            return { text: s, used: 'llm', reason: '' };
        }
        return { text: fallback || s, used: 'fallback', reason: r.reason };
    }

    root.TextGuard = { BAND, check, admit };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* causalGuard.js — 因果闸门（R91，T6）：LLM 输出的时/空/人必须一一对得上素材包。
   文本形态的"一一对应"：输出里出现的专名（人名/地名/具体时辰）必须原样出现在素材里（模板事实+知识切片），
   禁发明；模糊时辰（夜里/昨晚一类）不设限。说法级对账走 sim 的 CausalLedger（真线索断言在 clueSystem）。
   假线索文本可违反对应（R92）：opts.allowBreak 时放行。 */
(function (root) {
    'use strict';
    const TG = root.CONFIG.causalGuard;

    /* 具体时辰（禁发明）：夜里四更 + 白天三段 + 钟点；模糊词（夜里/昨晚…）因果上无害，不设限 */
    const SPECIFIC_HOURS = ['上半夜', '三更', '后半夜', '天快亮时', '上午', '午后', '黄昏', '清晨', '晌午'];
    const CLOCK = /\d{1,2}:\d{2}/g;

    /**
     * 可对账的专名表（人名/地名）。
     * @returns {{names:string[],sites:string[]}} 专名表 */
    function lexicon() {
        const names = (root.CONTENT.npcRoster || []).map(function (n) { return n.name; });
        const sites = (root.CONTENT.sites || []).concat(['木屋']);
        return { names, sites };
    }

    /**
     * 抽文本里的专名（人名/地名/具体时辰/钟点）。
     * @returns {{names:string[],sites:string[],hours:string[]}} 专名 */
    function tokens(text) {
        const s = String(text || '');
        const lx = lexicon();
        return {
            names: lx.names.filter(function (n) { return s.indexOf(n) >= 0; }),
            sites: lx.sites.filter(function (n) { return s.indexOf(n) >= 0; }),
            hours: SPECIFIC_HOURS.filter(function (h) { return s.indexOf(h) >= 0; })
                .concat(s.match(CLOCK) || [])
        };
    }

    /**
     * 因果对账：输出的每个专名必须在素材里出现过（时/空/人一一对应的文本形态）。
     * @param {string} out 模型输出
     * @param {Array<string>} material 素材包（模板事实/知识切片原文）
     * @param {{allowBreak:boolean,extraNames:string[]}} [opts] 假线索豁免/自指豁免
     * @returns {{ok:boolean,reason:string}} 判定 */
    function check(out, material, opts) {
        if (!TG.enabled) {
            return { ok: true, reason: '' };
        }
        if (opts && opts.allowBreak) {
            return { ok: true, reason: '' };
        }
        const mat = (material || []).join('\n');
        const extra = (opts && opts.extraNames) || [];
        const ot = tokens(out);
        const mt = tokens(mat);
        const miss = [];
        ot.names.forEach(function (n) {
            if (mt.names.indexOf(n) < 0 && extra.indexOf(n) < 0) {
                miss.push('人:' + n);
            }
        });
        ot.sites.forEach(function (n) {
            if (mt.sites.indexOf(n) < 0) {
                miss.push('地:' + n);
            }
        });
        ot.hours.forEach(function (h) {
            if (mt.hours.indexOf(h) < 0) {
                miss.push('时:' + h);
            }
        });
        return miss.length
            ? { ok: false, reason: 'causal-时空人:' + miss.join('/') }
            : { ok: true, reason: '' };
    }

    /**
     * 台账级对账（说法 vs 真实行踪）：某人某时是否真在某地（假线索豁免）。
     * @returns {{ok:boolean,why:string}} 判定 */
    function checkClaim(claim, allowBreak) {
        if (allowBreak || !root.SIM || !root.SIM.ledgerCheck) {
            return { ok: true, why: '' };
        }
        return root.SIM.ledgerCheck(claim);
    }

    root.CausalGuard = { SPECIFIC_HOURS, tokens, check, checkClaim, lexicon };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* plotGen.js — Host 剧情层（R90）：全程调用 LLM 实时开展剧情，写作骨架=Architect 逻辑档案节拍。
   推理游戏法则进系统提示（线索-假设-验证闭环 / 逻辑树 / 本格公平 / 时·空·人一一对应 / 假线索=干扰非谜底）；
   产出先过因果闸门（causalGuard）再过文本闸门（textGuard），坏稿回落模板——LLM 全失败游戏照常可玩。 */
(function (root) {
    'use strict';
    const adapter = root.LlmAdapter;

    const RULES = '你在为推理游戏《荒原》就地开展剧情。推理游戏法则，逐条遵守：' +
        '一、线索—假设—验证闭环：只写已经发生的事（发现、声响、行踪、反应），不替玩家归纳假设、不下结论、不剧透；' +
        '二、逻辑树：树根是"那条人命是谁做的"，你的每一句只许挂在既定树枝上（物证/行踪/证言），不得引入新的案件事实；' +
        '三、本格公平：真相必须能从线索推导出来，禁写指向任何具体人物的定性语（"他最可疑"一类），' +
        '不许替玩家排除任何嫌疑人；' +
        '四、时间、空间、人物一一对应：人名、地点、时辰只许原样照抄素材，禁出现素材之外的人名/地点/时辰，' +
        '禁写尚未发生的事（先果后因）；' +
        '五、素材里的假线索照实写内容，不点破真假——甄别是玩家的事。' +
        '只输出正文，不加引号与前缀，不出现任何英文。';

    /**
     * 场景卡（时/空/人 三元组的开场给定）。
     * @returns {string} 场景卡 */
    function sceneCard(ev) {
        const p = ev.payload || {};
        const st = root.SIM && root.SIM.state ? root.SIM.state() : null;
        const who = p.who && p.who !== 'sys' && p.who !== 'player' ? '人物：' + nameOf(p.who) + '。' : '';
        return '场景卡：第 ' + (st ? st.day : 1) + ' 天 ' + (st ? hhmm(st.clock) : '') +
            '，' + (p.site || (st ? '木屋' : '')) + '。' + who;
    }

    function hhmm(min) {
        const m = Math.max(0, Math.floor(min));
        return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    }

    function nameOf(id) {
        if (!id || id === 'player') {
            return '你';
        }
        const n = root.SIM && root.SIM.byId ? root.SIM.byId(id) : null;
        return n ? n.name : id;
    }

    /**
     * 亲历事实的口述素材（R93）：只说大概，不带地名/时辰——防模型把具体坐标复述进台词。
     * @param {object} f 事实
     * @returns {string} 素材行 */
    function factLine(f) {
        return f.kind === 'act'
            ? nameOf(f.who) + '举止反常'
            : '大概那会儿在外头一带见过' + nameOf(f.who) + (f.to ? '，像是往远处去了' : '');
    }

    /**
     * 素材包（因果闸门的对账基准）：事件原文 + 本人知识切片。素材外的专名=幻觉，直接拦。
     * @returns {Array<string>} 素材行 */
    function material(ev) {
        const p = ev.payload || {};
        const out = [p.text || ''];
        if (p.diff) {
            out.push(p.diff);
        }
        if (p.who && p.who !== 'sys' && p.who !== 'player' && root.SIM && root.SIM.mind) {
            const m = root.SIM.mind(p.who);
            (m && m.myFacts ? m.myFacts : []).slice(-6).forEach(function (f) {
                out.push(factLine(f));
            });
        }
        return out;
    }

    /**
     * 本事件是否是假线索文本（R92 因果豁免通道）。
     * @returns {boolean} 是否豁免因果闸门 */
    function allowsBreak(ev) {
        const p = ev.payload || {};
        return !!(root.SIM && root.SIM.clueTruthOf && p.clueId &&
            root.SIM.clueTruthOf(p.clueId) === false);
    }

    /**
     * 剧情提示组装：法则 + 节拍 + 场景卡 + 素材 + 事件原文。
     * @returns {{sys:string,user:string}} 提示 */
    function prompt(ev) {
        const beat = root.LogicProfile && root.LogicProfile.beatOf ? root.LogicProfile.beatOf(ev.type) : '';
        const sys = RULES + (beat ? '\n本场节拍：' + beat : '');
        const user = sceneCard(ev) + '\n素材（只许用这些专名）：\n' + material(ev).join('\n') +
            '\n请把这件【已经发生的事】写成一句剧情正文：只换写法，不得添新事件、不得改事实（人名、地点、时辰一字不动）。';
        return { sys, user };
    }

    /**
     * 全程剧情出口：失败/被闸门拦 → 回落原文（调用方处理）。
     * @param {object} ev 事件
     * @param {function(?Error,string,object)} cb 回调（err, out, meta） */
    function narrate(ev, cb) {
        if (!adapter.ready()) {
            return cb(new Error('未配置模型'), null, { used: 'fallback' });
        }
        const p = prompt(ev);
        adapter.chat(p.sys, p.user, function (err, out) {
            cb(err, out, { material: material(ev), allowBreak: allowsBreak(ev) });
        });
    }

    root.PlotGen = { RULES, sceneCard, material, factLine, allowsBreak, prompt, narrate, nameOf };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ensembleMeeting.js — 晨会合奏（M6/D3-A）：一次调用产全场发言，会议 token 省约 92%。
   输出 = typed block 数组（M3）；逐块过契约校验与 textGuard，坏块回落模板。 */
(function (root) {
    'use strict';

    const SYS = '你是荒原营地晨会的记录者。给你若干人的【已发生的事实】，请为每人写一句公开发言。' +
        '铁律：只许换口气转述给定事实，不得添新事件、不得改事实（人名/地点/时辰/数字一字不动），' +
        '不得说出本人不可能知道的事，不得出现英文。' +
        '台词只说大概：不许出现具体地名、钟点与四更名，只用"夜里""那边""外头"这类大概说法。' +
        '输出 JSON 数组，每项 {"npcId":"nX","text":"台词","emotion":"calm|fear|anger|deflect|grief|suspicious",' +
        '"cred":"claim|testimony|concession|accusation","refs":[]}，每人恰好一项，台词不加引号和名字前缀。';

    /**
     * 从模型输出里抠出 JSON 数组（禁 eval，R75）。
     * @returns {Array} 候选块列表 */
    function parseBlocks(out) {
        const s = String(out || '');
        const start = s.indexOf('[');
        const end = s.lastIndexOf(']');
        if (start < 0 || end <= start) {
            return [];
        }
        try {
            const arr = JSON.parse(s.slice(start, end + 1));
            return Array.isArray(arr) ? arr : [];
        } catch (e) {
            console.warn('[ensembleMeeting] 输出不是合法 JSON，回落模板', e);
            return [];
        }
    }

    /**
     * 合奏一次调用生成全场发言。
     * @param {Array<{npcId:string,role:string,style:string,facts:string,scene:string}>} cast 演员表
     * @param {function(Array)} cb 回调：[{npcId,text,emotion,cred,refs,speakMs,used}] */
    function perform(cast, cb) {
        const adapter = root.LlmAdapter;
        const guard = root.TextGuard;
        if (!adapter.ready()) {
            return cb([]);
        }
        const user = cast.map(function (m) {
            return '【' + m.npcId + '｜' + m.role + '｜说话风格：' + m.style + '】亲历事实：' +
                (m.facts || '暂无') + '。场合：' + (m.scene || '晨会公开发言') + '。';
        }).join('\n');
        adapter.chat(SYS, user, function (err, out) {
            if (err || !out) {
                adapter.fail(err);
                return cb([]);
            }
            const blocks = parseBlocks(out);
            const recent = [];
            const results = cast.map(function (m) {
                const raw = blocks.find(function (b) { return b && b.npcId === m.npcId; }) || {};
                const admitted = guard.admit(raw.text, guard.BAND.meeting, recent, m.fallback);
                if (admitted.used === 'llm') {
                    recent.push(admitted.text);
                }
                return {
                    npcId: m.npcId,
                    text: admitted.text,
                    emotion: root.CONTRACT.EMOTION.includes(raw.emotion) ? raw.emotion : 'calm',
                    cred: root.CONTRACT.CRED.includes(raw.cred) ? raw.cred : 'testimony',
                    refs: Array.isArray(raw.refs) ? raw.refs : [],
                    speakMs: 700 + admitted.text.length * 62,
                    used: admitted.used
                };
            });
            cb(results);
        });
    }

    root.EnsembleMeeting = { parseBlocks, perform };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* perform.js — 事件→表演调度：选模板/选 LLM 策略/打字机节奏。
   铁律（L6/R84）：LLM 只做化妆——文本化事件/按立场说话/候选里 1 选 1；判定语（diff）永不交给模型。
   R108：交谈文本 ≠ 线索原文——模型改写撞上线索卡正文一字不差即弃稿回落模板。
   R109：终局指控分析只依据参与投票的证据（recapAnalysis），不许复述凶手档案。 */
(function (root) {
    'use strict';
    const adapter = root.LlmAdapter;
    const guard = root.TextGuard;
    const STYLE = ['冷硬短句', '带点土话味', '压着嗓子的短句', '省掉主语的白描', '带一个短比喻'];
    const NARR_SYS = '你是《荒原》纪事的旁白，白描转述营地里已发生的事。只许换一种说法重写给你的那句事实：' +
        '不得添新事件、不得改事实（人名、地点、时辰、数字一字不动），不得添任何死亡字眼（除非原句本来就有），' +
        '不得出现英文。只输出一句话，不加引号和前缀。';
    /* R109 终局指控分析：只依据参与投票的证据说话，不许替凶手建档（动机/秘密/习惯一概不复述） */
    const RECAP_SYS = '你在为推理游戏《荒原》写结案的指控分析。终局会议上玩家起票指控，' +
        '下面只给你【参与投票的证据】。请只依据这些证据，分析为什么它们足以指控被指控者：' +
        '哪条是硬证、哪条是旁证、它们怎样互相印证；伪造或对不上的证据要说清为什么不算数。' +
        '只许照抄素材里的人名与字句，不得引入证据之外的新事实，' +
        '不得复述被指控者的动机、秘密、习惯、体貌等个人档案，不得出现英文。' +
        '只输出正文，不加引号与前缀，不用小标题、不分段。';

    const recent = [];        // M7 防雷同滚动窗
    let styleN = 0;

    /**
     * 滚动记住最近台词（上限 llm.recentLineWindow）。
     * @param {string} s 台词 */
    function remember(s) {
        recent.push(s);
        while (recent.length > root.CONFIG.llm.recentLineWindow) {
            recent.shift();
        }
    }

    /**
     * 笔法轮换 + 雷同规避尾巴。
     * @returns {string} 指令尾巴 */
    function styleTail() {
        return '本句笔法要求：' + STYLE[styleN++ % STYLE.length] + '。' +
            (recent.length ? '最近已出口的说法（务必拉开差别）：' +
                recent.slice(-30).join(' / ') + '。' : '');
    }

    /**
     * 事件卡头（模板层）。
     * @returns {string} 卡头 */
    function head(ev) {
        const p = ev.payload || {};
        const who = p.who === 'sys' ? '—' : nameOf(p.who);
        const table = {
            'npc.dialogue': who + '：',
            'meeting.speech': p.who === 'sys' ? '〔会〕' : who + '：',
            'meeting.open': '〔会〕',
            'testimony.diff': who + '：',
            'night.kill': '〔夜〕',
            'night.near': '〔夜·你〕',
            'daytime.death': '〔昼·死〕',
            'vote.cast': '〔票〕',
            'vote.result': '〔决〕',
            'clue.discovered': '〔证〕',
            'stakeout.report': '〔盯〕',
            'crisis.warning': '〔危〕',
            'npc.behavior': '〔营〕',
            'sanity.flavor': '〔恍〕',
            'game.end': '〔终〕',
            'map.move': '〔行〕',
            'map.interact': '〔见〕',
            'stranded': '〔夜·留〕',
            'time.warn': '〔时〕',
            'task.result': '〔作〕',
            'survival.task': '〔活〕',
            'resource.change': '〔仓〕',
            'accident.event': '〔伤〕',
            'day.open': '〔晓〕',
            'phase.change': '〔时〕'
        };
        return table[ev.type] || '〔·〕';
    }

    function nameOf(id) {
        if (!id || id === 'player') {
            return '你';
        }
        const n = root.SIM && root.SIM.byId ? root.SIM.byId(id) : null;
        return n ? n.name : id;
    }

    /**
     * 模板出口：判定语（diff）逐字保真拼接。
     * @returns {string} 完整一行 */
    function speak(ev) {
        const p = ev.payload || {};
        let body = p.text || '';
        if (p.diff) {
            body += '　→ ' + p.diff;
        }
        return head(ev) + body;
    }

    /**
     * 哪些文本交给 LLM（R90 全程剧情）：persona=npc 本人台词 / plot=剧情开展 / narr=旁白。
     * 证据原文（verbatim）与判定语不进模型（§11/R94）。
     * @returns {?string} 'persona' | 'plot' | 'narr' | null */
    function lmKind(ev) {
        const p = ev.payload || {};
        const w = p.who;
        if (ev.type === 'npc.dialogue' || ev.type === 'testimony.diff' || ev.type === 'meeting.speech') {
            /* R94：共享线索=证据原文（verbatim）——鞋印相对表述/坐标一字不许模型动，永远走模板 */
            return w && w !== 'sys' && w !== 'player' && !p.verbatim ? 'persona' : null;
        }
        if ((root.CONFIG.plot.narrateTypes || []).indexOf(ev.type) >= 0) {
            return 'plot';
        }
        if (ev.type === 'npc.behavior') {
            return 'narr';
        }
        return null;
    }

    function personaPrompt(m) {
        return '你是「' + m.name + '」，' + m.role + '。说话风格：' + m.style + '。你的秘密：' + m.secret +
            '。你的动机：' + m.motive + '。习惯小动作：' + m.tell + '。' +
            (m.isKiller ? '你就是做下那件事的人：绝不承认，被追问就含糊其辞或把话引向别人。'
                : '你不是凶手，但有自己的难言之隐，不愿全盘托出。') +
            (m.stressed ? '你现在很紧张。' : '') +
            (m.broke ? '你的说法刚被人戳穿过，说话底气不足。' : '') +
            (m.victims ? '营地里人心惶惶，已经少了 ' + m.victims + ' 个人，你在害怕。'
                : '目前还太平，别提任何不吉利的字眼。') +
            '今天是第 ' + m.day + ' 天。只输出台词本身，不加引号、不加名字前缀。';
    }

    /**
     * 单事件演出（R90）：plot=剧情开展 / persona=npc 本人台词 / narr=旁白。
     * 管线：LLM → 因果闸门（时/空/人一一对应对账，R91，违规点名重写 1 次）→ 文本闸门（T1-T5）→ 回落模板。
     * 假线索文本走豁免通道（R92）：可违反一一对应（破绽留给玩家甄别）。
     * @param {object} ev 事件
     * @param {function(?string)} cb 回调（null=沿用模板） */
    function say(ev, cb) {
        const p = ev.payload || {};
        const kind = lmKind(ev);
        if (!kind || !p.text || !adapter.ready()) {
            return cb(null);
        }
        const fallback = p.text;
        const allowBreak = root.PlotGen.allowsBreak(ev);
        const material = root.PlotGen.material(ev);
        const extraNames = (p.who && p.who !== 'sys' && p.who !== 'player')
            ? [root.PlotGen.nameOf(p.who)] : [];
        let tries = 0;
        let lastSys = '';
        let lastUser = '';
        const done = function (err, out) {
            if (err || !out) {
                adapter.fail(err);
                remember(fallback);
                return cb(null);
            }
            const cg = root.CausalGuard.check(out, material, { allowBreak, extraNames });
            if (!cg.ok) {
                if (tries < root.CONFIG.causalGuard.retryOnBreak) {
                    tries += 1;
                    return adapter.chat(lastSys,
                        lastUser + '\n（上一稿被因果闸门拦下：' + cg.reason +
                        '。人名、地点、时辰只能一字不动地用素材里的，重写。）', done);
                }
                remember(fallback);
                return cb(null);
            }
            const band = kind === 'persona' ? guard.BAND.dialogue
                : (ev.type === 'meeting.open' || ev.type === 'vote.result' || ev.type === 'game.end')
                    ? guard.BAND.meeting : guard.BAND.narr;
            const admitted = guard.admit(out, band, recent, fallback);
            if (admitted.used === 'llm' && root.SIM && root.SIM.isClueText && root.SIM.isClueText(admitted.text)) {
                /* R108：交谈文本 ≠ 线索原文——模型一字不差抄了线索卡就弃稿，回落模板 */
                remember(fallback);
                return cb(head(ev) + fallback + (p.diff ? '　→ ' + p.diff : ''));
            }
            if (admitted.used === 'llm') {
                remember(admitted.text);
            }
            cb(head(ev) + admitted.text + (p.diff ? '　→ ' + p.diff : ''));
        };
        if (kind === 'plot') {
            const pr = root.PlotGen.prompt(ev);
            lastSys = pr.sys;
            lastUser = pr.user;
            adapter.chat(lastSys, lastUser, done);
            return;
        }
        if (kind === 'narr') {
            lastSys = NARR_SYS;
            lastUser = '请改写：\n「' + p.text + '」\n' + styleTail();
            adapter.chat(lastSys, lastUser, done);
            return;
        }
        const m = root.SIM.mind(p.who);
        if (!m) {
            return cb(null);
        }
        const scene = ev.type === 'meeting.speech' ? '晨会上的公开发言'
            : ev.type === 'testimony.diff' ? '被人当面对质，你要回应'
                : '私下交谈';
        const facts = (m.myFacts || []).slice(-6).map(function (f) {
            return root.PlotGen.factLine(f);
        }).join('；') || '暂无';
        lastSys = personaPrompt(m);
        lastUser = '你亲历/亲耳所知（仅限这些）：' + facts + '。\n' +
            '场合：' + scene + '。\n' +
            '请把下面这句【已经发生的事实】用你的口气改写：只许换口气，不得添新事件、' +
            '不得改事实、不得说出你不可能知道的事，也不许说出具体地名、钟点与四更名：\n「' + p.text + '」\n' + styleTail();
        adapter.chat(lastSys, lastUser, done);
    }

    /**
     * 晨会合奏：一次调用生成全场发言（M6/D3-A）。
     * @param {Array} events meeting.speech 事件列表
     * @param {function(Array)} cb 回调：[{ev, text}] */
    function sayEnsemble(events, cb) {
        const cast = events.map(function (ev) {
            const m = root.SIM.mind(ev.payload.who);
            return m ? {
                npcId: m.id, role: m.role, style: m.style,
                facts: (m.myFacts || []).slice(-4).map(function (f) {
                    return root.PlotGen.factLine(f);
                }).join('；'),
                scene: '晨会公开发言', fallback: ev.payload.text
            } : null;
        }).filter(Boolean);
        if (!cast.length || !adapter.ready()) {
            return cb([]);
        }
        root.EnsembleMeeting.perform(cast, function (blocks) {
            cb(blocks.map(function (b) {
                const ev = events.find(function (e) { return e.payload.who === b.npcId; });
                const slot = cast.find(function (c) { return c.npcId === b.npcId; }) || {};
                /* 因果闸门（R91）：合奏单块同样要过时/空/人对账，坏块回落模板 */
                const cg = root.CausalGuard.check(b.text, [slot.fallback || '', slot.facts || ''], {
                    extraNames: [root.PlotGen.nameOf(b.npcId)]
                });
                const text = cg.ok ? b.text : (slot.fallback || b.text);
                remember(text);
                return { ev, text: head(ev) + text, used: cg.ok ? b.used : 'fallback' };
            }));
        });
    }

    /**
     * 逐字浮现节奏。
     * @returns {{speakMs:number,cls:string}} 节奏与样式 */
    function pace(ev) {
        const t = (ev.payload && ev.payload.text) || '';
        const cls = ({
            'night.kill': 'horror', 'night.near': 'horror', 'stranded': 'horror',
            'daytime.death': 'horror', 'accident.event': 'horror',
            'clue.discovered': 'clue', 'testimony.diff': 'clue', 'stakeout.report': 'clue',
            'vote.result': 'clue', 'game.end': 'dead',
            'sanity.flavor': 'sys', 'map.move': 'sys', 'map.interact': 'sys',
            'time.warn': 'sys', 'crisis.warning': 'sys', 'npc.behavior': 'sys',
            'resource.change': 'sys', 'survival.task': 'sys', 'task.result': 'sys',
            'phase.change': 'sys', 'day.open': 'sys', 'vote.cast': 'sys',
            'meeting.speech': 'meet', 'meeting.open': 'meet',
            'npc.dialogue': 'talk'
        })[ev.type] || '';
        return { speakMs: Math.min(4200, 700 + t.length * 62), cls };
    }

    /**
     * 复盘话术（结局页，R109）：只报身份 + 参与投票的证据 + 指控分析（模板兜底）。
     * @returns {{end:?string,accused:string,lines:Array<string>,analysis:string,material:Array<string>}} 复盘 */
    function recap() {
        return root.SIM.recap();
    }

    /**
     * 终局指控分析（R109）：只在票出凶手那局，按参与投票的证据写"为什么能指控"。
     * 管线同演出：LLM → 因果闸门（人名/地名/时辰只许素材里有）→ 文本闸门 → 回落模板小结。
     * @param {function(string)} cb 回调（恒回正文；没配模型/坏稿即回模板小结，好结局之外回空串） */
    function recapAnalysis(cb) {
        const rc = root.SIM.recap();
        if (!rc || !rc.analysis) {
            return cb('');
        }
        const fallback = rc.analysis;
        if (!adapter.ready()) {
            return cb(fallback);
        }
        const user = rc.material.join('\n') + '\n请分析这些证据为什么足以指控' + rc.accused + '。';
        adapter.chat(RECAP_SYS, user, function (err, out) {
            if (err || !out) {
                adapter.fail(err);
                return cb(fallback);
            }
            const cg = root.CausalGuard.check(out, rc.material, { extraNames: [rc.accused] });
            if (!cg.ok) {
                return cb(fallback);
            }
            const admitted = guard.admit(out, guard.BAND.recap, [], fallback);
            cb(admitted.used === 'llm' ? admitted.text : fallback);
        });
    }

    root.Perform = { speak, say, sayEnsemble, pace, recap, recapAnalysis, head, lmKind, remember, styleTail };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* textStream.js — 荒原记事文字流：打字机 + 最近台词防雷同展示 + 点行写日记（R99 记事制，R101 每日翻篇）。
   全部 textContent 渲染（R76 防 XSS）。 */
(function (root) {
    'use strict';

    let flowEl = null;

    /**
     * 绑定文字流容器。
     * @param {HTMLElement} el 容器 */
    function bind(el) {
        flowEl = el;
    }

    /**
     * 追加一行（打字机逐字浮现；节奏数据来自 perform.pace）。
     * @param {string} cls 样式类
     * @param {string} text 文本
     * @param {number} speakMs 浮现时长
     * @param {function(?string)} [onTyped] 打完回调（LLM 换词用） */
    function append(cls, text, speakMs, onTyped) {
        if (!flowEl) {
            return null;
        }
        const d = document.createElement('div');
        d.className = 'p ' + (cls || '');
        const span = document.createElement('span');
        span.className = 't';
        d.appendChild(span);
        flowEl.appendChild(d);
        flowEl.scrollTop = flowEl.scrollHeight;
        typeInto(span, text, speakMs || 700, onTyped);
        return span;
    }

    /**
     * 打字机：逐字浮现；节点被移除即中止（R43 节奏只在本组件内）。
     * @param {HTMLElement} span 目标
     * @param {string} text 文本
     * @param {number} ms 总时长
     * @param {function(?string)} [onTyped] 完成回调 */
    function typeInto(span, text, ms, onTyped) {
        const s = String(text || '');
        const step = Math.max(12, Math.floor(ms / Math.max(1, s.length)));
        let i = 0;
        span.textContent = '';
        (function tick() {
            if (!span.isConnected) {
                return;
            }
            i += 1;
            span.textContent = s.slice(0, i);
            if (i < s.length) {
                setTimeout(tick, step);
            } else if (onTyped) {
                onTyped(s);
            }
        })();
    }

    /**
     * 换词（LLM 回来后替换占位行）。
     * @param {HTMLElement} span 目标
     * @param {string} text 新文本 */
    function swap(span, text) {
        if (span && span.isConnected) {
            span.textContent = text;
            span.dataset.final = text;
            const box = span.closest('.flow');
            if (box) {
                box.scrollTop = box.scrollHeight;
            }
        }
    }

    let asking = null;

    /**
     * 让一行可点击：点开选择是否把这句写进日记（R99）。
     * @param {HTMLElement} d 行容器
     * @param {HTMLElement} span 文本节点
     * @param {function(string,object):boolean} onNote 写入日记（带出处 ref）；返回是否真记上了
     * @param {object} [ref] 出处（记事行 id / 该行记的线索，R101） */
    function noteable(d, span, onNote, ref) {
        if (!d || !span) {
            return;
        }
        d.classList.add('noteable');
        d.title = '点一下，可选把这句写进日记';
        d.onclick = function () {
            if (d.classList.contains('noted') || !span.textContent) {
                return;
            }
            ask(d, span, onNote, ref);
        };
    }

    /**
     * 询问行：要 / 不要 记进日记。
     * @param {HTMLElement} d 行容器
     * @param {HTMLElement} span 文本节点
     * @param {function(string,object):boolean} onNote 写入日记
     * @param {object} [ref] 出处 */
    function ask(d, span, onNote, ref) {
        closeAsk();
        const row = document.createElement('div');
        row.className = 'note-ask';
        const q = document.createElement('span');
        const st = root.SIM && root.SIM.state();
        q.textContent = (st && st.phase === 'meeting')
            ? '要把这句写进日记吗？（晨会里写不花时辰）'
            : '要把这句写进日记吗？（花 ' + root.CONFIG.timeCost.write + ' 分钟）';
        const yes = document.createElement('button');
        yes.textContent = '写进日记';
        yes.onclick = function (e) {
            e.stopPropagation();
            const text = String(span.dataset.final || span.textContent).trim();
            if (text && onNote(text, ref)) {
                markNoted(d);
            }
            closeAsk();
        };
        const no = document.createElement('button');
        no.textContent = '不记';
        no.onclick = function (e) {
            e.stopPropagation();
            closeAsk();
        };
        row.append(q, yes, no);
        d.after(row);
        asking = row;
    }

    /**
     * 记上了：就地打标记，这一行不再可点。
     * @param {HTMLElement} d 行容器 */
    function markNoted(d) {
        d.classList.add('noted');
        const tag = document.createElement('span');
        tag.className = 'note-mark';
        tag.textContent = '〔已记〕';
        d.appendChild(tag);
    }

    function closeAsk() {
        if (asking && asking.isConnected) {
            asking.remove();
        }
        asking = null;
    }

    root.TextStream = { bind, append, typeInto, swap, noteable };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* statusBoard.js — 顶栏：天数/时辰/木食水/饥饿/完成度/危机计数/LLM ✓✗。纯渲染，禁游戏规则。 */
(function (root) {
    'use strict';

    const STOCK_NAME = { wood: '木', food: '食', water: '水' };

    /**
     * 分钟 → HH:MM。
     * @returns {string} 时刻 */
    function fmtClock(m) {
        return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    }

    /**
     * 渲染顶栏两行 + 侧栏物资条。
     * @param {object} S 状态视图 */
    function render(S) {
        const phaseTag = document.getElementById('phaseTag');
        const meterTag = document.getElementById('meterTag');
        const axes = document.getElementById('axes');
        if (!S || !phaseTag) {
            return;
        }
        const phaseName = ({ meeting: '晨会', day: '行动', dusk: '黄昏', night: '入夜' })[S.phase] || S.phase;
        phaseTag.textContent = '第 ' + S.day + ' / ' + S.dayCount + ' 天 · ' + phaseName + ' · ' + fmtClock(S.clock);

        const st = root.LlmAdapter ? root.LlmAdapter.stat() : { ok: 0, fail: 0, err: '' };
        const hasKey = root.LlmAdapter && root.LlmAdapter.ready();
        const completion = S.taskHistory && S.taskHistory.length
            ? Math.round(S.taskHistory[S.taskHistory.length - 1] * 100) : 100;
        const llmTag = hasKey ? ' · LLM ✓' + st.ok + '/✗' + st.fail + (st.fail ? '（回落模板）' : '') : ' · 模板档';
        meterTag.textContent = '饥饿 ' + Math.round(S.player.hunger) + ' · 理智 ' + Math.round(S.player.sanity) +
            ' · 完成度 ' + completion + '%' +
            (S.crisisCount ? ' · 危机!' + S.crisisCount : '') +
            (S.worsen ? ' · 恶化' + S.worsen : '') + llmTag;
        if (st.fail) {
            meterTag.title = '最近失败原因：' + (st.err || '');
        }

        if (axes) {
            axes.textContent = '';
            ['wood', 'food', 'water'].forEach(function (k) {
                const v = S.stocks[k];
                const row = document.createElement('div');
                row.className = 'row';
                const l = document.createElement('span');
                l.textContent = STOCK_NAME[k];
                const r = document.createElement('span');
                r.textContent = String(Math.round(v));
                row.append(l, r);
                const bar = document.createElement('div');
                bar.className = 'bar';
                const fill = document.createElement('i');
                fill.style.width = Math.max(0, Math.min(100, v)) + '%';
                fill.style.background = v < 15 ? 'var(--blood)' : v < 40 ? 'var(--gold)' : 'var(--cold)';
                bar.appendChild(fill);
                axes.append(row, bar);
            });
            const hRow = document.createElement('div');
            hRow.className = 'row';
            const hl = document.createElement('span');
            hl.textContent = '饥饿';
            const hr = document.createElement('span');
            hr.textContent = String(Math.round(S.player.hunger));
            hRow.append(hl, hr);
            const hBar = document.createElement('div');
            hBar.className = 'bar';
            const hFill = document.createElement('i');
            hFill.style.width = Math.max(0, Math.min(100, S.player.hunger)) + '%';
            hFill.style.background = S.player.hunger < 30 ? 'var(--blood)' : 'var(--gold)';
            hBar.appendChild(hFill);
            axes.append(hRow, hBar);
        }
    }

    root.StatusBoard = { render, fmtClock };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* portraitSystem.js — 点击人物→分层立绘：底图/表情层/污渍层/饰品层（日志⑪）。
   污渍=可推理细节：显示时带 refs 回溯提示（P4 禁无中生有）；运行时不生图（P2）。 */
(function (root) {
    'use strict';

    const EMOTION_NAME = {
        calm: '平静', fear: '惊惧', anger: '愠怒',
        deflect: '闪躲', grief: '哀戚', suspicious: '起疑'
    };
    const STAIN_NAME = { blood: '血点', mud: '泥污', sweat: '汗渍', tear: '撕口' };

    /**
     * 打开立绘弹窗。
     * @param {string} npcId 人物 id */
    function open(npcId) {
        const S = root.SIM.state();
        const n = S.npcs.find(function (x) { return x.id === npcId; });
        if (!n) {
            return;
        }
        close();
        const mask = document.createElement('div');
        mask.className = 'modal-mask';
        mask.id = 'portraitMask';
        const box = document.createElement('div');
        box.className = 'modal-box';

        const h = document.createElement('h3');
        h.textContent = n.name + ' · ' + n.role;
        box.appendChild(h);

        /* 分层合成：底图 + 表情 + 污渍 + 饰品 */
        const p = document.createElement('div');
        p.className = 'portrait';
        p.dataset.emotion = n.emotion || 'calm';
        const base = document.createElement('div');
        base.className = 'layer layer-base';
        base.dataset.glyph = n.glyph;
        base.style.setProperty('--cloth', clothHex(n.cloth));
        const emo = document.createElement('div');
        emo.className = 'layer layer-emotion';
        p.append(base, emo);
        (n.stains || []).forEach(function (s) {
            const layer = document.createElement('div');
            layer.className = 'layer layer-stain ' + s.stain;
            layer.title = '污渍来源事件：' + ((s.refs || []).join('、') || '无') + '（可回溯）';
            p.appendChild(layer);
        });
        box.appendChild(p);

        /* 身份模糊化（V22）：卡片只出 名字/职业/衣色，体格·脚型·习惯·小动作不落卡——
           底细要靠【交谈/蹲守】当面打量才摸得到；污渍与神情是当下的观察，不算身份 */
        const row = document.createElement('div');
        row.className = 'ptrait-row';
        [
            { t: n.cloth + '衣', hard: true },
            { t: '底细不明：走近了交谈、蹲守盯一夜才能打量清楚' }
        ].forEach(function (x) {
            const chip = document.createElement('span');
            chip.className = 'ptrait' + (x.hard ? ' hard' : '');
            chip.textContent = x.t;
            row.appendChild(chip);
        });
        box.appendChild(row);

        const emoRow = document.createElement('div');
        emoRow.className = 'row';
        emoRow.style.marginTop = '8px';
        emoRow.textContent = '神情：' + (EMOTION_NAME[n.emotion] || '平静') +
            (n.stains && n.stains.length ? ' · 衣上有' + n.stains.map(function (s) {
                return STAIN_NAME[s.stain] || s.stain;
            }).join('、') : ' · 衣着整洁');
        box.appendChild(emoRow);

        const btns = document.createElement('div');
        btns.className = 'btns';
        const closeBtn = document.createElement('button');
        closeBtn.textContent = '合上';
        closeBtn.onclick = close;
        btns.appendChild(closeBtn);
        box.appendChild(btns);

        mask.appendChild(box);
        mask.onclick = function (e) {
            if (e.target === mask) {
                close();
            }
        };
        document.body.appendChild(mask);
    }

    function close() {
        const old = document.getElementById('portraitMask');
        if (old) {
            old.remove();
        }
    }

    /**
     * 衣色 → 剪影用色。
     * @returns {string} 颜色 */
    function clothHex(cloth) {
        const table = {
            '靛蓝': '#3b4a7a', '灰褐': '#5a4c3c', '米白': '#c9c2ae', '军绿': '#4a5a3c',
            '赭石': '#8a4c33', '鸦青': '#2c3a44', '藏蓝': '#2c3550', '月白': '#b9c4c9',
            '竹青': '#4c6a55', '绛紫': '#5c3a52', '秋香': '#7a7a3c', '鸦黄': '#8a7a33',
            '玄墨': '#2b2b30'
        };
        return table[cloth] || '#3b4a5a';
    }

    root.PortraitSystem = { open, close };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* mapBoard.js — 地图交互：走格子/采集/搜查/蹲守/交谈入口。
   视野白名单（3.5）：只画玩家 + 视野内的 NPC，禁全局实时小地图人标。 */
(function (root) {
    'use strict';

    const TILE_G = { home: '屋', watch: '崖', block: '▲', walk: '' };
    const KEY_G = { wood: '柴', food: '果', water: '水' };
    const DIRS = { '0,-1': 'n', '0,1': 's', '-1,0': 'w', '1,0': 'e' };

    /**
     * 渲染地图格子（点击相邻格 = move 指令）。
     * @param {object} S 状态视图
     * @param {function(object)} send 发指令 */
    function render(S, send) {
        const box = document.getElementById('map');
        const G = root.SIM.geo;
        if (!box || !S) {
            return;
        }
        box.textContent = '';
        box.style.gridTemplateColumns = 'repeat(' + G.W + ', minmax(0, 1fr))';
        for (let y = 0; y < G.H; y++) {
            for (let x = 0; x < G.W; x++) {
                const t = G.tile(x, y);
                const cell = document.createElement('div');
                cell.className = 'cell k-' + t.kind +
                    (G.isHome(x, y) && S.player.x === x && S.player.y === y ? ' home-in' : '');
                const d = (x - S.player.x) + ',' + (y - S.player.y);
                const adj = S.phase === 'day' && !S.end &&
                    Math.abs(x - S.player.x) + Math.abs(y - S.player.y) === 1 && G.walkable(x, y);
                if (adj) {
                    cell.classList.add('adj');
                    cell.dataset.dir = DIRS[d] || '';
                }
                const g = document.createElement('span');
                g.className = 'tg';
                g.textContent = KEY_G[t.key] || TILE_G[t.kind] || '';
                cell.appendChild(g);
                /* 只画视野内的 NPC（visible 才带坐标） */
                S.npcs.filter(function (n) {
                    return n.alive && n.visible && n.x === x && n.y === y;
                }).forEach(function (n) {
                    const tk = document.createElement('span');
                    tk.className = 'tk npc-tk';
                    tk.textContent = n.glyph;
                    tk.title = n.name + '（' + n.role + '）· 点击看立绘';
                    tk.onclick = function (ev2) {
                        ev2.stopPropagation();
                        root.PortraitSystem.open(n.id);
                    };
                    cell.appendChild(tk);
                });
                /* 尸体留在案发现场（R103）：案发格画尸标，走到这格可搜查物证 */
                (S.corpses || []).filter(function (c) {
                    return c.x === x && c.y === y;
                }).forEach(function (c) {
                    const tk = document.createElement('span');
                    tk.className = 'tk body-tk';
                    tk.textContent = '尸';
                    tk.title = c.name + '的尸首（案发现场·' +
                        ((c.clueStage || 0) >= 2 ? '已搜过' : (c.clueStage ? '还有物证没搜全' : '可搜查物证')) + '）';
                    cell.appendChild(tk);
                });
                if (S.player.x === x && S.player.y === y) {
                    const tk = document.createElement('span');
                    tk.className = 'tk me-tk';
                    tk.textContent = '我';
                    cell.appendChild(tk);
                }
                cell.title = t.name + (adj ? '（点击前往）' : '');
                if (adj) {
                    cell.onclick = function () {
                        send({ type: 'move', dir: cell.dataset.dir });
                    };
                }
                box.appendChild(cell);
            }
        }
    }

    /**
     * 当前地块可做的动作（合法动作表 → 按钮数据）。
     * R103：搜查只在案发现场（这格有尸首）亮出，搜查地块已删。
     * @returns {Array<{id:string,label:string}>} 动作 */
    function actionsHere(S) {
        const G = root.SIM.geo;
        const t = G.tile(S.player.x, S.player.y);
        const table = {
            gather: [{ id: 'collect', label: '采集（' + (t.hint || '') + '）' }],
            watch: [{ id: 'stakeout', label: '蹲守观察' }],
            home: [{ id: 'rest', label: '休息' }, { id: 'cook', label: '烹饪' }, { id: 'deposit', label: '交公入库' }],
            walk: [],
            block: []
        };
        const out = table[t.kind] || [];
        const body = (S.corpses || []).find(function (c) {
            return c.x === S.player.x && c.y === S.player.y && (c.clueStage || 0) < 2;
        }) || (S.corpses || []).find(function (c) {
            return c.x === S.player.x && c.y === S.player.y;
        });
        if (body) {
            const stage = body.clueStage || 0;
            out.push({
                id: 'search',
                label: stage === 0 ? '搜查现场（' + body.name + '）'
                    : stage === 1 ? '再搜现场（' + body.name + '）' : '再翻一遍现场'
            });
        }
        return out;
    }

    /**
     * 同一格可交谈的人（行踪白名单，R89：视野只覆盖同一格，x/y 只对可见者下发）。
     * @returns {Array<object>} NPC */
    function talkable(S) {
        return S.npcs.filter(function (n) {
            return n.alive && n.visible && n.x === S.player.x && n.y === S.player.y;
        });
    }

    root.MapBoard = { render, actionsHere, talkable };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* inventoryBoard.js — 行囊（R97）：物品格子（每件带贴图）+ 点开详情弹窗 + 快捷动作。
   纯渲染 + 发契约指令（eat），禁游戏规则、禁真相（只用视图里的字段）。 */
(function (root) {
    'use strict';

    let sendFn = null;

    /* 物品小传（静态文案；数值一律引 config，不在此处写死） */
    const DESC = {
        diary: '一本跟了你一路的线装册子。荒原记事每天清晨就清空，昨天的字迹抄不回来——' +
            '只有抄进这本册子的才留得下来。投票起票时，写进日记的每一句都拿得出手' +
            '（线索、听来的说法、札记都算），手里的实物（物证/掉落物）免记就能举证。' +
            '在【荒原记事】里点中意的那句，选【写进日记】就抄进来留档。',
        firewood: '砍好码齐的柴火。回木屋交公入库，做饭也要烧它。',
        berry: '林缘摘的野果，酸得倒牙。',
        driedBerry: '晒干的浆果，轻且顶饿。',
        rawMeat: '生的肉。能吃，但不干净。',
        cookedFood: '架在火上烤熟的肉，最顶饿。',
        waterFlask: '灌满的清水壶。交公入库补公家的水。',
        shoes: '从湿泥上拓下来的鞋印，大小轮廓清清楚楚——比谁的鞋大一圈，得自己去对。',
        cloth: '从荆棘上取下的布片，颜色和破口都还在。',
        tool: '现场留下的凶器残件，柄上有磨旧的痕迹。',
        time: '火堆的余烬，能推出动手的时辰。',
        drag: '拓下来的拖拽痕，宽窄可量。',
        item: '现场翻出来的旧物。看不出主人是谁，磨损和布色只留着点影子——跟谁的习惯对得上，才敢拿它去指人。',
        generic: '现场捡到的实物。'
    };

    /**
     * 渲染行囊：日记 / 物证 / 采集物 三组物品格子。
     * @param {object} S 状态视图
     * @param {function(object)} send 发指令 */
    function render(S, send) {
        sendFn = send;
        const box = document.getElementById('bag');
        if (!S || !box || !S.bag) {
            return;
        }
        box.textContent = '';
        const bag = root.ResourceSystem.listBag(S);
        const diarySlots = [slot({
            icon: 'diary', name: S.bag.diary.name,
            count: S.bag.diary.entries.length ? S.bag.diary.entries.length + ' 条' : '空',
            title: '点开读日记'
        }, function () { open('diary', null); })];
        const evidSlots = S.bag.evidence.length
            ? S.bag.evidence.map(function (e) {
                return slot({
                    icon: e.icon || e.k || 'generic', name: e.name,
                    count: '第' + e.day + '天', title: '点开看正文'
                }, function () { open('evidence', e.clueId); });
            })
            : [hint('案发现场搜查到的物证与掉落物会摆在这里。')];
        const itemSlots = bag.length
            ? bag.map(function (it) {
                return slot({
                    icon: it.id, name: it.name,
                    count: '×' + it.count, title: '点开看用途'
                }, function () { open('item', it.id); });
            })
            : [hint('空。采集到的东西先装在这里。')];
        box.append(group('日记', diarySlots), group('物证', evidSlots), group('采集物', itemSlots));
    }

    /**
     * 打开物品详情弹窗。
     * @param {string} kind diary | evidence | item
     * @param {string} [key] 物证=线索 id；采集物=物品 id */
    function open(kind, key) {
        const S = root.SIM.state();
        if (!S) {
            return;
        }
        close();
        let icon = 'generic';
        let name = '';
        let desc = '';
        let meta = '';
        const actions = [];
        let body = null;

        if (kind === 'diary') {
            icon = 'diary';
            name = S.bag.diary.name + ' ×1';
            desc = DESC.diary + (S.phase === 'meeting'
                ? '晨会里写一句不花时辰。'
                : '写一句要花 ' + root.CONFIG.timeCost.write + ' 分钟，扣的是你干活的时辰。');
            meta = '随身之物 · 交不得公';
            body = function (host) {
                host.textContent = '';
                const es = S.bag.diary.entries;
                (es.length ? es.map(function (e) {
                    return '第 ' + e.day + ' 天 ' + e.hour + '　' + e.text +
                        (e.clueId ? '　〔凭据 ' + e.clueId + '〕' : '　〔札记〕');
                }) : ['还没有记下任何一句。']).forEach(function (t) {
                    const row = document.createElement('div');
                    row.className = 'item-line';
                    row.textContent = t;
                    host.appendChild(row);
                });
            };
            actions.push({ label: '读日记', run: body });
        } else if (kind === 'evidence') {
            const e = S.bag.evidence.find(function (x) { return x.clueId === key; });
            if (!e) {
                return;
            }
            icon = e.icon || e.k || 'generic';
            name = e.name;
            desc = e.text + (e.k === 'item' ? '　' + DESC.item : '');
            meta = '第 ' + e.day + ' 天 · ' + e.from + ' · 〔' + e.id + '〕';
        } else {
            const it = root.ResourceSystem.listBag(S).find(function (x) { return x.id === key; });
            if (!it) {
                return;
            }
            icon = it.id;
            name = it.name + ' ×' + it.count;
            const gain = (root.CONFIG.hungerEatGain || {})[it.id];
            desc = (DESC[it.id] || '') + (gain ? ' 吃下饥饿 +' + gain + '。' : '');
            meta = '采集物 · 回木屋可交公入库';
            if (root.ResourceSystem.EATABLE.indexOf(it.id) >= 0) {
                actions.push({
                    label: '吃一口',
                    title: '吃掉一份，饥饿 +' + gain,
                    run: function () {
                        sendFn({ type: 'act', actId: 'eat', arg: it.id });
                        close();
                    }
                });
            }
        }

        const mask = document.createElement('div');
        mask.className = 'modal-mask';
        mask.id = 'itemMask';
        mask.onclick = function (ev) {
            if (ev.target === mask) {
                close();
            }
        };
        const box = document.createElement('div');
        box.className = 'modal-box item-box';

        const h = document.createElement('h3');
        h.textContent = name;
        const hero = document.createElement('div');
        hero.className = 'item-hero';
        const ico = document.createElement('i');
        ico.className = 'item-ico big ico-' + icon;
        hero.appendChild(ico);
        const d = document.createElement('p');
        d.className = 'item-desc';
        d.textContent = desc;
        const m = document.createElement('div');
        m.className = 'item-meta';
        m.textContent = meta;
        const host = document.createElement('div');
        host.className = 'item-body';

        const btns = document.createElement('div');
        btns.className = 'btns';
        actions.forEach(function (a) {
            const b = document.createElement('button');
            b.textContent = a.label;
            b.disabled = !!a.disabled;
            if (a.title) {
                b.title = a.title;
            }
            b.onclick = function () { a.run(host); };
            btns.appendChild(b);
        });
        const back = document.createElement('button');
        back.textContent = '合上';
        back.onclick = close;
        btns.appendChild(back);

        box.append(h, hero, d, m, btns, host);
        mask.appendChild(box);
        document.body.appendChild(mask);
    }

    function close() {
        const old = document.getElementById('itemMask');
        if (old) {
            old.remove();
        }
    }

    function iconOf(cls, title) {
        const i = document.createElement('i');
        i.className = 'item-ico ico-' + cls;
        if (title) {
            i.title = title;
        }
        return i;
    }

    function slot(o, onclick) {
        const b = document.createElement('button');
        b.className = 'slot';
        b.title = o.title || '';
        b.appendChild(iconOf(o.icon, o.name));
        const nm = document.createElement('div');
        nm.className = 'nm';
        nm.textContent = o.name;
        const ct = document.createElement('div');
        ct.className = 'ct';
        ct.textContent = o.count || '';
        b.append(nm, ct);
        b.onclick = onclick;
        return b;
    }

    function hint(text) {
        const d = document.createElement('div');
        d.className = 'row';
        d.textContent = text;
        return d;
    }

    function group(title, children) {
        const wrap = document.createElement('div');
        const h = document.createElement('h3');
        h.textContent = title;
        wrap.appendChild(h);
        const grid = document.createElement('div');
        grid.className = 'bag-grid';
        children.forEach(function (c) { grid.appendChild(c); });
        wrap.appendChild(grid);
        return wrap;
    }

    root.InventoryBoard = { render, open, close };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* meetingRoom.js — 晨会交互：问话 / 起票（附线索）投票 + 亮票板。
   只发契约指令（ask/vote），只画视图里的东西（L4 禁真相：线索对错、说服力一律不显示）。
   R98：删出示线索；投票必须附 persuade.clueMin~clueCount 条线索才能起票——选哪几条就是你的论证。
   R101：起票只认写进日记的线索（荒原记事每日清空，没留档的线索到了会上拿不出手）。
   R110：起票全放行——写进日记的任何一句都举得起票（凭据＝线索 id 或日记句行 id）；线索对错、证言真假
   与说服力一律在 sim 内判，视图不下发（L4）。
   R111：一场晨会只有一轮投票、投完自动散会——亮票板散会后留住（谁投谁只在这块板上）。 */
(function (root) {
    'use strict';

    let cast = [];        // 本会已亮的票 [{who,target,clues}]
    let resultInfo = null; // {text, target}
    let picked = {};      // 起票勾选的线索 {clueId:true}
    let whoId = null;     // 记住对谁开口（重渲染时下拉不回跳）

    /** 新一轮会议/新局清空亮票板与勾选。 */
    function reset() {
        cast = [];
        resultInfo = null;
        picked = {};
        whoId = null;
    }

    /**
     * 记一票（vote.cast 事件路由进来）。
     * @param {object} ev 事件 */
    function noteCast(ev) {
        cast.push({ who: ev.payload.who, target: ev.payload.target, clues: ev.payload.clues || null });
    }

    /**
     * 记投票结果（vote.result 事件路由进来）。
     * @param {object} ev 事件 */
    function noteResult(ev) {
        resultInfo = { text: ev.payload.text, target: ev.payload.target, tie: !!ev.payload.tie };
    }

    function nameOf(id) {
        if (id === 'player') {
            return '你';
        }
        const n = root.SIM && root.SIM.byId ? root.SIM.byId(id) : null;
        return n ? n.name : id;
    }

    function pickedIds() {
        return Object.keys(picked);
    }

    /* 亮票板：每人一格，亮票即点灯；结果出来后标出被放逐者的票（R111 散会后照样留着） */
    function paintBallot() {
        const frag = document.createDocumentFragment();
        const board = document.createElement('div');
        board.className = 'ballot-board';
        cast.forEach(function (b) {
            const cell = document.createElement('div');
            cell.className = 'ballot open' + (resultInfo && !resultInfo.tie && b.target === resultInfo.target ? ' hit' : '');
            cell.textContent = nameOf(b.who) + ' → ' + nameOf(b.target) +
                (b.clues ? '（附 ' + b.clues.length + ' 条凭据）' : '');
            board.appendChild(cell);
        });
        if (!cast.length) {
            const cell = document.createElement('div');
            cell.className = 'ballot';
            cell.textContent = '尚未亮票';
            board.appendChild(cell);
        }
        frag.appendChild(board);
        if (resultInfo) {
            const r = document.createElement('div');
            r.className = 'speech-line ' + (resultInfo.tie ? 'conc' : 'acc');
            r.textContent = resultInfo.text;
            frag.appendChild(r);
        }
        return frag;
    }

    /**
     * 渲染公堂面板（问话/起票投票 + 亮票板）。
     * @param {object} S 状态视图
     * @param {function(object)} send 发指令 */
    function render(S, send) {
        const box = document.getElementById('quizbox');
        if (!box) {
            return;
        }
        if (S.phase !== 'meeting' || !S.meet.open) {
            box.textContent = '';
            const wait = document.createElement('p');
            wait.className = 'agenda';
            wait.textContent = S.end ? '会已经散了。'
                : (cast.length || resultInfo)
                    ? '这场晨会投完票就散了——今天各自去干活，明早出了命案才再围到火堆边。'
                    : '此刻不是晨会——出了人命后的清晨，所有人才会围到火堆边。';
            box.appendChild(wait);
            /* R111：投票即散会，亮票板留住——谁投谁只在这块板上，散会就没了 */
            if (cast.length || resultInfo) {
                box.appendChild(paintBallot());
            }
            return;
        }
        box.textContent = '';
        if (!S || S.end || S.phase !== 'meeting' || !S.meet || !S.meet.open) {
            const row = document.createElement('div');
            row.className = 'row';
            row.textContent = S && S.end ? '本局已结束。' : '白天走格子、到案发现场搜查物证；出人命后的晨会才能质询与投票。';
            box.appendChild(row);
            return;
        }

        const hall = document.createElement('div');
        hall.className = 'meeting-hall';
        const agenda = document.createElement('div');
        agenda.className = 'agenda';
        agenda.textContent = '完整议程：宣布死者 → 共享线索 → 问话 → 投票（一轮即散会）';
        hall.appendChild(agenda);

        const live = root.SIM.aliveN().filter(function (n) { return n.visible !== false; });
        const m = S.meet;
        const need = m.clueCount || root.CONFIG.persuade.clueCount;
        const min = m.clueMin || root.CONFIG.persuade.clueMin || 1;

        const lab1 = document.createElement('label');
        lab1.className = 'lab';
        lab1.textContent = '对谁开口（问话对象 / 投票对象）';
        const whoSel = document.createElement('select');
        whoSel.id = 'mWho';
        live.forEach(function (n) {
            const o = document.createElement('option');
            o.value = n.id;
            o.textContent = n.name + '（' + n.role + '）' + (m.asked[n.id] ? ' · 已问过' : '');
            whoSel.appendChild(o);
        });
        if (whoId) {
            whoSel.value = whoId;
        }

        /* 起票凭据（R110 全放行）：实物类（物证/掉落物）免记直接可引；写进日记的每一句都举得起——
           带线索号的那句由线索行代表（按线索判对错），其余日记句（问话证言/打量家常行为札记）各占一行 */
        const noted = {};
        (S.bag.diary.entries || []).forEach(function (e) {
            if (e.clueId) {
                noted[e.clueId] = true;
            }
        });
        const isPhys = function (c) { return c.kind === 'phys' || c.kind === 'item'; };
        const citable = S.clues.filter(function (c) { return noted[c.id] || isPhys(c); })
            .map(function (c) {
                return {
                    id: c.id,
                    text: '〔' + c.id + '〕' + c.text +
                        (c.hard ? '（硬线索·实物免记）' : (c.kind === 'item' ? '（掉落物·实物免记）' : ''))
                };
            })
            .concat((S.bag.diary.entries || [])
                .filter(function (e) { return !e.clueId && e.line; })
                .map(function (e) {
                    return { id: e.line, text: '〔记〕' + e.text + '（日记）' };
                }));
        const lab2 = document.createElement('label');
        lab2.className = 'lab';
        lab2.textContent = '起票附凭据：实物免记可举证，写进日记的每一句都举得起（证言看说法站不站得住，札记只是陪衬），勾 ' +
            min + '~' + need + ' 条（至少 ' + min + ' 条）为你指控的人作凭据（选哪几条就是你的论证）';
        const clueBox = document.createElement('div');
        clueBox.className = 'clue-pick';
        const rowBoxes = [];
        if (citable.length) {
            citable.forEach(function (c) {
                const row = document.createElement('label');
                row.className = 'clue-row';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = !!picked[c.id];
                cb.disabled = !cb.checked && pickedIds().length >= need;
                cb.onchange = function () {
                    if (cb.checked) {
                        picked[c.id] = true;
                    } else {
                        delete picked[c.id];
                    }
                    sync();
                };
                const span = document.createElement('span');
                span.textContent = c.text;
                row.append(cb, span);
                clueBox.appendChild(row);
                rowBoxes.push(cb);
            });
        } else {
            const o = document.createElement('div');
            o.className = 'row';
            o.textContent = S.clues.length || (S.bag.diary.entries || []).length
                ? '手里没有举得起的凭据——起不了票。实物（物证/掉落物）免记可引，说的话得当天写进日记（晨会里记不花时辰，白天记一句 30 分钟）。'
                : '线索册还是空的——出了人命，到案发格搜查尸首、问话，才会留下可查的东西。';
            clueBox.appendChild(o);
        }

        const btns = document.createElement('div');
        btns.className = 'btns';
        const bAsk = mkBtn('问话', false);
        const bVote = mkBtn('投票（众人同投）', true);
        bVote.classList.add('go');
        btns.append(bAsk, bVote);

        const quota = document.createElement('div');
        quota.className = 'quota';
        const paintQuota = function () {
            const have = pickedIds().length;
            quota.textContent = '问话每会限 ' + root.CONFIG.askTotalLimit + ' 次（已用 ' +
                Object.keys(m.asked).length + '，每人限 ' + root.CONFIG.askLimit + ' 次）· ' +
                '追问热度 ' + m.heat + '（不休会让人生疑，票会飘向你）· ' +
                '起票已勾 ' + have + '/' + need + ' 条' +
                (have < min ? '——至少勾 ' + min + ' 条才起得了票'
                    : (have >= need ? '——够立案了（已到上限）' : '——够立案了')) +
                '· 一场晨会只有一轮投票，投完自动散会';
        };

        hall.append(lab1, whoSel, lab2, clueBox, btns, quota);

        /* 亮票板：每人一格，亮票即点灯；结果出来后标出被放逐者的票 */
        if (cast.length || resultInfo) {
            hall.appendChild(paintBallot());
        }

        box.appendChild(hall);

        const who = function () { return whoSel.value; };
        const sync = function () {
            const have = pickedIds().length;
            rowBoxes.forEach(function (cb) {
                cb.disabled = !cb.checked && have >= need;
            });
            paintQuota();
            bAsk.disabled = !!m.asked[who()] || Object.keys(m.asked).length >= root.CONFIG.askTotalLimit;
            bVote.disabled = !S.meet.full || have < min || have > need;
        };
        whoSel.onchange = function () { whoId = whoSel.value; sync(); };
        bAsk.onclick = function () { send({ type: 'ask', npcId: who() }); };
        bVote.onclick = function () {
            const names = pickedIds().map(function (id) {
                return '〔' + id + '〕';
            }).join('');
            if (root.confirm('把你的一票投给 ' + nameOf(who()) + '，并附上 ' + names + ' 这 ' +
                pickedIds().length +
                ' 条凭据？附的证据站得住，别人才肯跟你的票；摆错了反而没人信你。' +
                '投票只有这一轮，投完会议随即散场——问话的机会也就没了。')) {
                send({ type: 'vote', targetId: who(), clueIds: pickedIds() });
            }
        };
        sync();
    }

    function mkBtn(label, gh) {
        const b = document.createElement('button');
        b.textContent = label;
        if (gh) {
            b.classList.add('gh');
        }
        return b;
    }

    root.MeetingRoom = { render, reset, noteCast, noteResult };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* commandBar.js — 指令按钮：按相位/权限/时间预算启禁。
   铁律：没有"开会"、没有"跳夜"、没有"收工过夜"按钮——唯一的推进按钮是晨会的【散会开工】(endDay)。 */
(function (root) {
    'use strict';

    const ITEM_NAME = function (id) {
        const items = (root.ResourceSystem && root.ResourceSystem.ITEMS) || {};
        return (items[id] && items[id].name) || id;
    };

    /**
     * 渲染指令栏。
     * @param {object} S 状态视图
     * @param {function(object)} send 发指令 */
    function render(S, send) {
        const bar = document.getElementById('actbar');
        if (!bar || !S) {
            return;
        }
        bar.textContent = '';
        if (S.end) {
            const span = document.createElement('span');
            span.className = 'mono';
            span.textContent = '本局结束。点右上「重开新局」。';
            bar.appendChild(span);
            return;
        }

        const hint = document.createElement('span');
        hint.className = 'mono';
        bar.appendChild(hint);

        const add = function (label, cmd, minCost, title) {
            const b = document.createElement('button');
            b.textContent = label;
            if (title) {
                b.title = title;
            }
            const left = (root.CONFIG.dayEndMinute || 1080) - S.clock;
            if (minCost && left < minCost) {
                b.disabled = true;
                b.title = '时间不够（需 ' + minCost + ' 分，距天黑 ' + left + ' 分）';
            }
            b.onclick = function () { send(cmd); };
            bar.appendChild(b);
        };

        if (S.phase === 'meeting') {
            hint.textContent = '晨会中。在右侧【公堂】问话、起票投票——投票要附 1~' +
                (root.CONFIG.persuade.clueCount || 5) + ' 条线索作凭据（至少 1 条）；' +
                '一场晨会只有一次投票，投完自动散会，先问清楚再起票。宁少勿滥，摆错的线索会砸掉你的说服力。';
            const b = document.createElement('button');
            b.className = 'go';
            b.textContent = '散会开工 →';
            b.onclick = function () { send({ type: 'endDay' }); };
            bar.appendChild(b);
            return;
        }
        if (S.phase !== 'day') {
            hint.textContent = '夜里了。结算自动进行——蹲守的报告天亮后见。';
            return;
        }

        const t = root.SIM.geo.tile(S.player.x, S.player.y);
        const C = root.CONFIG;
        hint.textContent = '你在【' + t.name + '】。点地图相邻格移动（' + C.timeCost.move + ' 分/格）。'
            + '18:00 天黑自动收工结算。';

        /* 当前地块的合法动作（查表，不写 if 链） */
        root.MapBoard.actionsHere(S).forEach(function (a) {
            const cost = C.timeCost[{ collect: 'collect', search: 'search', stakeout: 'stakeout', rest: 'rest' }[a.id]]
                || C.timeCost.move;
            /* R103：搜查按钮只在案发现场（这格有尸首）亮出 */
            const title = a.id === 'search'
                ? '搜查案发现场：首搜得凶案物证（' + cost + ' 分）'
                : '耗时 ' + cost + ' 分';
            add(a.label, { type: 'act', actId: a.id }, cost, title);
        });

        /* 进食：背包里能吃的都亮出来 */
        Object.keys(S.player.inventory || {}).forEach(function (itemId) {
            if (root.ResourceSystem && root.ResourceSystem.EATABLE.includes(itemId) && S.player.inventory[itemId] > 0) {
                add('吃' + ITEM_NAME(itemId) + '×' + S.player.inventory[itemId],
                    { type: 'act', actId: 'eat', arg: itemId }, 0, '恢复饥饿，不占时间');
            }
        });

        /* 交谈：同一格的人（行踪白名单，R89） */
        root.MapBoard.talkable(S).forEach(function (n) {
            add('与' + n.name + '交谈', { type: 'talk', npcId: n.id }, C.timeCost.talk,
                '耗时 ' + C.timeCost.talk + ' 分');
        });

    }

    root.CommandBar = { render };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ui.js — 面板框架与事件渲染路由：只渲染 CONTRACT.EVENTS 注册类型（L7）。
   全部 textContent 渲染（R76）；LLM 台词先出占位、回来换词；判定语（diff）逐字保真。 */
(function (root) {
    'use strict';
    const P = root.Perform;

    let send = function (cmd) {
        const r = root.SIM.handle(cmd);
        pushAll(r[1]);
    };

    /* ── 时辰色调：黎明/白昼/黄昏/入夜/血色 ── */
    let lastKind = null;
    function setLut(ev) {
        if (ev) {
            lastKind = ev.type;
        }
        const S = root.SIM.state();
        if (!S) {
            return;
        }
        let lut;
        if (lastKind === 'game.end') { lut = 'blood'; }
        else if (S.phase === 'night' || (lastKind && lastKind.indexOf('night') === 0)) { lut = 'night'; }
        else if (S.phase === 'dusk') { lut = 'dusk'; }
        else if (S.player.sanity < 45) { lut = 'night'; }
        else { lut = S.day === 1 ? 'dawn' : 'day'; }
        document.body.dataset.lut = lut;
    }

    /**
     * 单事件入流：打字机 + LLM 换词占位。
     * @param {object} ev 契约事件
     * @param {boolean} [batched] 已并入合奏批（只上占位，换词交给 sayEnsemble） */
    function push(ev, batched) {
        if (!ev || !root.CONTRACT.EVENTS.includes(ev.type)) {
            return;                       // 只渲染注册类型（L7）
        }
        if (root.TRACE) {
            root.TRACE.events.push(ev);   // 供结局页导出整局流
        }
        setLut(ev);
        /* 亮票板/公堂数据路由 */
        if (ev.type === 'meeting.open') { root.MeetingRoom.reset(); }
        if (ev.type === 'vote.cast') { root.MeetingRoom.noteCast(ev); }
        if (ev.type === 'vote.result') { root.MeetingRoom.noteResult(ev); }

        if (ev.type === 'time.tick') { render(); return; }   // 时间流逝只走时钟，不刷屏
        if (ev.type === 'day.open') { newPage(); }            // R101：荒原记事每日清空，翻到今天这一页

        const flow = document.getElementById('flow');
        const r = P.pace(ev), tmpl = P.speak(ev), kind = P.lmKind(ev);
        const d = document.createElement('div');
        d.className = 'p ' + r.cls;
        const span = document.createElement('span');   // textContent：不解析任何标记
        span.className = 't';
        span.dataset.final = tmpl;
        d.appendChild(span);
        flow.appendChild(d);
        flow.scrollTop = flow.scrollHeight;
        /* R99/R101：点这一行可选写进日记——只认还在记事上的这行，记的是线索就带线索号 */
        root.TextStream.noteable(d, span, noteText, {
            line: ev.id, clueId: ev.payload.clueId || null
        });
        if (kind && root.LlmAdapter && root.LlmAdapter.ready()) {
            span.textContent = P.head(ev) + '……';       // 先出占位，LLM 回来再换
            if (!batched) {
                P.say(ev, function (s) {
                    root.TextStream.swap(span, s || tmpl);   // 失败回落模板文本
                    render();
                });
            }
        } else {
            span.textContent = tmpl;
        }
        render();
    }

    /* ── 荒原记事翻篇（R101 设定：每日清空）：昨天这一页撕了，只剩今天 ── */
    function newPage() {
        const flow = document.getElementById('flow');
        if (!flow) {
            return;
        }
        flow.textContent = '';
        const S = root.SIM.state();
        const head = document.createElement('div');
        head.className = 'p page';
        head.textContent = '══ 荒原记事翻篇 · 第 ' + (S ? S.day : 1) + ' 天 ══';
        flow.appendChild(head);
    }
