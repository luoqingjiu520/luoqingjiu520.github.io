        S.claims.push(claim);
        beliefOf(S, npcId).claims.push(claim.id);
        return claim;
    }

    /**
     * NPC 当前谎言率（票错后信任崩坏 → 谎言率上升）。
     * @returns {number} 0..1 */
    function lieRate(S) {
        return S.misvote ? Cfg.lieRateAfterWrongVote : Cfg.lieRateBase;
    }

    root.BeliefSystem = { addFact, beliefOf, ownFacts, revealFacts, addClaim, lieRate };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* npcBehavior.js — 自然行为：偷懒/争吵/帮手/藏匿/窥视（BehaviorKind 五类），产出行为事件卡。
   偏离岗位的偷懒本身就是线索；藏匿会动公家库存。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;
    const Kind = root.BehaviorKind;
    const Map = root.WorldMap;

    /* 五类行为的权重与后果表（L5） */
    const RECIPE = {};
    RECIPE[Kind.SHIRK] = {
        weight: 0.26, stressSelf: -5, workDelta: -2, template: 'shirk',
        note: '偷懒=偏离岗位，本身就是行踪线索'
    };
    RECIPE[Kind.ARGUE] = {
        weight: 0.24, stressSelf: 12, stressOther: 12, template: 'argue',
        note: '争吵：双方结怨，投票倾向互扣'
    };
    RECIPE[Kind.HELP] = {
        weight: 0.22, stressSelf: -8, stressOther: -8, foodBonus: 2, template: 'help',
        note: '帮手：互增信任'
    };
    RECIPE[Kind.HIDE] = {
        weight: 0.14, stressSelf: -3, foodLoss: 2, template: 'hide',
        note: '藏匿口粮：公家的少了'
    };
    RECIPE[Kind.WATCH] = {
        weight: 0.14, stressSelf: 4, template: 'watch',
        note: '窥视：盯着别人的行踪'
    };

    /**
     * 按权重掷一种行为。
     * @returns {string} BehaviorKind */
    function rollKind(rnd) {
        const kinds = Object.keys(RECIPE);
        const weights = kinds.map(function (k) { return RECIPE[k].weight; });
        return root.Rng.pickWeighted(rnd, kinds, weights);
    }

    /**
     * 自然行为掷骰 + 结算，产出行为事件卡（perform 负责念成话）。
     * @returns {Array<object>} 事件 */
    function roll(X) {
        const S = X.S;
        const live = S.npcs.filter(function (n) { return n.alive; });
        if (live.length < 2 || X.rnd() > Cfg.behaviorChance) {
            return [];
        }
        const kind = rollKind(X.rnd);
        const rec = RECIPE[kind];
        const w = root.Rng.pick(X.rnd, live);
        const others = live.filter(function (n) { return n.id !== w.id; });
        const w2 = root.Rng.pick(X.rnd, others);
        const tpl = (root.CONTENT.behaviorTemplates || {})[rec.template] || [];
        const text = root.Rng.pick(X.rnd, tpl) || (w.name + '举止反常。');
        const filled = text.replace(/\{who\}/g, w.name).replace(/\{who2\}/g, w2 ? w2.name : '旁人');

        w.stress = Math.max(0, w.stress + rec.stressSelf);
        if (rec.stressOther && w2) {
            w2.stress = Math.max(0, w2.stress + rec.stressOther);
        }
        if (rec.workDelta) {
            w.work = Math.max(0, w.work + rec.workDelta);
        }
        if (rec.foodBonus) {
            root.ResourceSystem.addStock(S, 'food', rec.foodBonus);
        }
        if (rec.foodLoss) {
            root.ResourceSystem.addStock(S, 'food', -rec.foodLoss);
        }
        if (kind === Kind.ARGUE && w2) {
            w.grudge = w.grudge || {};
            w.grudge[w2.id] = (w.grudge[w2.id] || 0) + 1;
            w2.grudge = w2.grudge || {};
            w2.grudge[w.id] = (w2.grudge[w.id] || 0) + 1;
        }
        /* 偷懒/藏匿 = 偏离岗位的事实，记为可对质线索来源 */
        const f = root.BeliefSystem.addFact(X, 'act', kind, w.id, w2 ? w2.id : null,
            w.at, root.TimeSystem.hhmm(S.clock), 'ALL', false);
        /* 行为照常发生（结怨/口粮/行踪事实一条不少）；玩家只在与行为人同一格时才看得见（R89），
           远处发生的事留在 belief，靠问话/证言带出来。 */
        if (Map.dist(S.player, w) > Cfg.sightRadius) {
            return [];
        }
        return [X.emit('npc.behavior', {
            text: filled, kind, who: w.id, who2: w2 ? w2.id : null,
            emotion: kind === Kind.ARGUE ? 'anger' : 'calm', refs: [f.id]
        })];
    }

    root.NpcBehavior = { RECIPE, rollKind, roll };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* clueSystem.js — 线索生成 + 真假双轨（R90-R92 重构）：
   真线索（truth:true）：只描述已发生、与因果台账一一对账（时/空/人），refs 指向真实事件，违规抛错；
   假线索（truth:false，R92）：伪造物/栽赃物/失真转述，可违反时/空/人一一对应（其"对不上的说法"就是甄别破绽），
   生成概率仅 falseClueChance（20%）且每局 ≤ falseClueMax 条，假线索永不进物证硬线索渠道（保唯一可解）。
   线索锁（死亡前零线索）与因果门（先果后因抛错）对真假线索一体生效。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;
    const Res = root.ResourceSystem;

    /**
     * 线索的前置事件引用：指向最近的 n 条真实事件（因果门锚点）。
     * @returns {string[]} 事件 id 列表 */
    function lastEventIds(S, n) {
        return S.eventLog.slice(-n).map(function (e) { return e.id; });
    }

    /**
     * 事件是否已发生（因果门）。
     * @returns {boolean} 前置是否满足 */
    function prereqMet(S, prereq) {
        const ids = (prereq && prereq.eventIds) || [];
        for (let i = 0; i < ids.length; i++) {
            const ev = S.eventLog.find(function (e) { return e.id === ids[i]; });
            if (!ev) {
                return false;
            }
            if (prereq.afterDay !== undefined && ev.day < prereq.afterDay) {
                return false;
            }
        }
        return true;
    }

    /**
     * 解析因果锚点：refs 可指向事件（eventLog）或既存事实（facts），两者都必须先于线索。
     * @returns {number} 该锚点的发生时刻 */
    function resolveRef(S, rid) {
        const ev = S.eventLog.find(function (e) { return e.id === rid; });
        if (ev) {
            return ev.t;
        }
        const f = S.facts.find(function (x) { return x.id === rid; });
        return f ? f.t : null;
    }

    /**
     * 因果断言（causalTest 用）：线索 refs 的事件必须真实存在且早于线索生成（真假线索同罚——
     * 假线索豁免的是"时/空/人一一对应"，不是"先果后因"）。
     * @throws {Error} 因果违规 */
    function assertCausal(S, clue) {
        (clue.refs || []).forEach(function (rid) {
            const at = resolveRef(S, rid);
            if (at === null) {
                throw new Error('因果违规: 线索 ' + clue.id + ' 引用了不存在的事件 ' + rid);
            }
            if (at > clue.t) {
                throw new Error('因果违规: 线索 ' + clue.id + ' 先果后因（事件 ' + rid + ' 更晚）');
            }
        });
    }

    /**
     * 真线索的台账断言（R91）：线索若带结构化说法（claim），必须与台账对得上。
     * @throws {Error} 因果违规 */
    function assertLedger(S, clue) {
        if (!clue.claim) {
            return;
        }
        const r = root.CausalLedger.checkClaim(S, clue.claim);
        if (!r.ok) {
            throw new Error('因果违规: 真线索 ' + clue.id + ' 与台账不符（' + r.why + '）');
        }
    }

    /**
     * 线索锁：死亡发生前不解锁（无死者=无案件=无线索）。
     * @returns {boolean} 线索是否已解锁 */
    function unlocked(S) {
        return !!S.deathHappened;
    }

    /**
     * R108 交谈文本 ≠ 线索原文：交谈/问话/打量的出口文本一律先过这道闸，
     * 与线索卡正文一字不差就抛错（案发前零线索的文本面，个人情报也不许抄线索原文）。
     * @param {object} S 真相态
     * @param {string} text 交谈出口文本
     * @param {string} src 出口名（报错定位用）
     * @throws {Error} 文案违规 */
    function assertNotClueText(S, text, src) {
        const hit = (S.clues || []).find(function (c) { return c.text === text; });
        if (hit) {
            throw new Error('文案违规: ' + src + ' 与线索原文同字（' + hit.id + '）——交谈不许把线索原文送出去');
        }
    }

    /**
     * R108 话术库互不重字：交谈话术库（目击/证言/行踪/家常）与线索话术库（物证/背景/红鲱鱼/伪造）
     * 归一化后（{占位符}并成 *、去空白）不得同句，否则交谈就把线索原文送出去了。
     * @throws {Error} 文案违规 */
    function assertTalkClueDisjoint() {
        const T = root.CONTENT.clueTemplates || {};
        const clueSide = [].concat(T.bg || [], T.redHerring || [], T.forged || [],
            (T.hard || []).map(function (h) { return h && h.tpl ? h.tpl : h; }));
        const talkSide = [].concat(T.sight || [],
            (root.CONTENT.meetingTemplates || {}).alibi || [],
            (root.CONTENT.meetingTemplates || {}).lie || [],
            root.CONTENT.smalltalk || []);
        const norm = function (s) {
            return String(s).replace(/\{[^}]*\}/g, '*').replace(/\s/g, '');
        };
        const seen = {};
        clueSide.forEach(function (s) {
            seen[norm(s)] = s;
        });
        talkSide.forEach(function (s) {
            const k = norm(s);
            if (seen[k]) {
                throw new Error('文案违规: 交谈话术与线索话术同句（' + seen[k] + ' / ' + s + '）');
            }
        });
    }

    /**
     * 假线索掷骰（R92）：生成概率仅 falseClueChance（20%）；每局绝对上限 falseClueMax。
     * 独立确定性流（种子+序号），不动主随机流——平衡基准不受影响。
     * @returns {boolean} 本条是否落成假线索 */
    function rollFalse(S) {
        if (S.falseSeq === undefined) {
            S.falseSeq = 0;
        }
        S.falseSeq += 1;
        if ((S.falseUsed || 0) >= Cfg.logic.falseClueMax) {
            return false;
        }
        const r = root.Rng.createRng(S.seed * 7919 + S.falseSeq * 104729);
        return r() < Cfg.logic.falseClueChance;
    }

    /**
     * 伪造说法：挑一条"此人当时不在那里"的时/空/人组合（与台账相反），返回伪造说法与被违反的台账条目。
     * @returns {{claim:object,contradicts:string,site:string,hour:string}} 伪造包 */
    function forgeClaim(X, targetId) {
        const S = X.S;
        const led = root.CausalLedger;
        const hours = led.NIGHT_HOURS.concat(led.DAY_HOURS);
        const sites = (root.CONTENT.sites || ['林缘']).concat(['木屋']);
        const r = root.Rng.createRng(S.seed * 31337 + (S.falseSeq || 0));
        for (let i = 0; i < 24; i += 1) {
            const hour = hours[Math.floor(r() * hours.length)];
            const site = sites[Math.floor(r() * sites.length)];
            const claim = { personId: targetId, site, hour, day: 'any' };
            const res = led.checkClaim(S, claim);
            if (!res.ok) {
                return { claim, contradicts: res.truth ? res.truth.id : '', site, hour };
            }
        }
        return null;
    }

    /**
     * 落一条线索：真=掷骰 80%（或渠道强制真）+台账对账；假=掷骰 20%（或豁免台账，留伪造痕迹）。
     * @param {object} X 结算上下文
     * @param {object} partial 线索字段（truth 强制真渠道传 true）
     * @returns {?object} 线索；线索锁未开（死亡前）返回 null */
    function push(X, partial) {
        const S = X.S;
        if (!unlocked(S)) {
            return null;
        }
        const forced = partial.truth === true || partial.truth === false;
        const truth = forced ? partial.truth === true : !rollFalse(S);
        const clue = Object.assign({
            id: 'c' + (S.clues.length + 1),
            day: S.day, t: S.clock,
            kind: 'bg', k: 'motive', text: '',
            tags: [], w: Cfg.bgClueWeight, susp: 1, val: null, refs: [], redHerring: false,
            truth: true, forgedBy: null, contradicts: '', claim: null, refuted: false, shared: false
        }, partial, { truth });
        assertCausal(S, clue);
        if (truth) {
            assertLedger(S, clue);
        } else {
            clue.forgedBy = S.killer.killerId;
            S.falseUsed = (S.falseUsed || 0) + 1;
        }
        S.clues.push(clue);
        root.LogicProfile.registerClue(S, clue);
        return clue;
    }

    /**
     * 伪造线索统一出口：凶手栽赃/伪造的说法（可违反时/空/人一一对应），落袋伪造痕迹供复盘揭示。
     * @returns {?object} 线索 */
    function forgedClue(X, targetId, kind, textTpl) {
        const S = X.S;
        const forged = forgeClaim(X, targetId);
        const tpl = root.Rng.pick(X.rnd, textTpl || (root.CONTENT.clueTemplates || {}).forged || []);
        const target = S.npcs.find(function (n) { return n.id === targetId; });
        const text = (tpl || '{who}的字条，落款说{hour}在{site}见过死者。')
            .replace(/\{who\}/g, target ? target.name : '有人')
            .replace(/\{site\}/g, forged ? forged.site : '河岸')
            .replace(/\{hour\}/g, forged ? forged.hour : '三更');
        return push(X, {
            kind: kind || 'bg', k: 'forged', text, tags: [targetId],
            w: 1, susp: 2, redHerring: true, truth: false,
            claim: forged ? forged.claim : null,
            contradicts: forged ? forged.contradicts : '',
            refs: lastEventIds(S, 1)
        });
    }

    /**
     * 搜查背景线索（旧物/恩怨/习惯）：真=过去既存事实；假=栽赃旧物（伪造说法可违反时/空/人）。
     * @returns {Array<object>} 事件 */
    function genBg(X, from) {
        const S = X.S;
        const live = S.npcs.filter(function (n) { return n.alive; });
        if (!unlocked(S) || !live.length) {
            return [];
        }
        const target = root.Rng.pick(X.rnd, live);
        if (rollFalse(S)) {
            return finishDiscovered(X, forgedClue(X, target.id, 'bg'), from);
        }
        const tpl = root.Rng.pick(X.rnd, (root.CONTENT.clueTemplates || {}).bg || []);
        const text = (tpl || '一件旧物，和{who}有关。').replace(/\{who\}/g, target.name);
        const clue = push(X, {
            kind: 'bg', k: 'motive', text, tags: [target.id],
            w: Cfg.bgClueWeight, susp: 1, truth: true, refs: lastEventIds(S, 1)
        });
        return finishDiscovered(X, clue, from);
    }

    /**
     * 线索落册后的事件化（真假同口；假线索的伪造说法随文落袋）。
     * @returns {Array<object>} 事件 */
    function finishDiscovered(X, clue, from) {
        if (!clue) {
            return [];
        }
        const body = {
            text: from + '发现：' + clue.text, clueId: clue.id, kind: clue.kind,
            weight: clue.w, refs: clue.refs
        };
        return [X.emit('clue.discovered', body)];
    }

    /**
     * 案发后物证：搜查尸体现场按次产出（R103）；R107 拆对——首搜只出鞋印、再搜只出衣色布片，
     * 一对锁要跑两趟现场才凑齐（物证不再一次拿全）。
     * R107 交叉锁定：衣色撞车（同色 2-3 人），鞋印只出相对表述（比{anchor}大/小一圈）且参照人
     * 取同衣色搭子——单条物证只锁 2-3 人，鞋印×衣色交集才唯一。码数只进 val（内部真相，不下发）。
     * 物证线恒真（R92：假线索永不进硬线索渠道，保唯一可解与本格公平）。
     * silent=true 只落册不发〔证〕卡（R95：夜间现场线索统一次晨由人嘴念出）。
     * @param {'shoes'|'cloth'} [onlyK] 本次只出哪件（默认鞋印）
     * @returns {Array<object>} 事件 */
    function genHard(X, from, silent, scene, onlyK) {
        const S = X.S;
        const killer = S.npcs.find(function (n) { return n.id === S.killer.killerId; });
        const sc = scene || {
            site: S.killer.sceneSite, hour: S.killer.sceneHour,
            day: S.killer.sceneDay === undefined ? S.day : S.killer.sceneDay
        };
        const pool = (root.CONTENT.clueTemplates || {}).hard || [];
        const wantShoe = onlyK !== 'cloth';
        const tpl = root.Rng.pick(X.rnd, pool.filter(function (t) {
            return wantShoe ? t.k === 'shoes' : t.k === 'cloth';
        })) || pool[0] || { k: 'shoes', tpl: '{site}的湿泥上留着一双鞋印，比{anchor}那双鞋{dir}。' };
        const mates = S.npcs.filter(function (n) {
            return n.id !== killer.id && n.cloth === killer.cloth;
        }).map(function (n) { return n.id; });
        const cmp = root.NpcRosterSystem.shoeCompare(S.npcs, killer, mates);
        const val = {
            site: sc.site, shoe: killer.shoes, cloth: killer.cloth,
            tool: S.killer.tool, hour: sc.hour, day: sc.day,
            width: root.Rng.rint(X.rnd, 3, 6),
            anchorId: cmp.anchorId, anchorName: cmp.anchorName,
            dir: cmp.dir, footWord: cmp.word
        };
        const text = tpl.tpl
            .replace(/\{site\}/g, val.site || '现场')
            .replace(/\{anchor\}/g, val.anchorName)
            .replace(/\{dir\}/g, val.dir)
            .replace(/\{cloth\}/g, val.cloth)
            .replace(/\{tool\}/g, val.tool || '钝器')
            .replace(/\{hour\}/g, val.hour || '后半夜')
            .replace(/\{width\}/g, String(val.width));
        const clue = push(X, {
            kind: 'phys', k: tpl.k, text,
            tags: [killer.id], w: Cfg.hardClueWeight, susp: 3, val,
            hard: true, truth: true,
            claim: { personId: killer.id, site: val.site, hour: val.hour, day: sc.day },
            refs: lastEventIds(S, 1)
        });
        const out = [];
        if (clue) {
            root.InventorySystem.addEvidence(S, clue, from);   /* R96：物证同袋，实物进物品栏 */
            if (!silent) {
                finishDiscovered(X, clue, from).forEach(function (e) { out.push(e); });
            }
        }
        return out;
    }

    /**
     * 红鲱鱼/现场翻查（R92 双轨）：真=指向无辜者的既存旧物；假=凶手栽赃物（伪造说法可违反时/空/人）。
     * @returns {?object} 线索 */
    function genRedHerring(X) {
        const S = X.S;
        const live = S.npcs.filter(function (n) {
            return n.alive && n.id !== S.killer.killerId;
        });
        if (!live.length) {
            return null;
        }
        const target = root.Rng.pick(X.rnd, live);
        if (rollFalse(S)) {
            return forgedClue(X, target.id, 'bg');
        }
        const tpl = root.Rng.pick(X.rnd, (root.CONTENT.clueTemplates || {}).redHerring || []);
        const text = (tpl || '一件容易看错的旧物。').replace(/\{who\}/g, target.name);
        return push(X, {
            kind: 'bg', k: 'redherring', text, tags: [target.id],
            w: 1, susp: 2, redHerring: true, truth: true,
            refs: lastEventIds(S, 1)
        });
    }

    /**
     * 遇险/伤情线索机会：伤情也是旁证（可回溯事件）；死亡前不入册。真伪掷骰同源。
     * @returns {?object} 线索 */
    function genInjuryClue(X, npcId, site) {
        const S = X.S;
        const npc = S.npcs.find(function (n) { return n.id === npcId; });
        if (!npc) {
            return null;
        }
        if (rollFalse(S)) {
            return forgedClue(X, npcId, 'bg');
        }
        const text = npc.name + '在' + site + '添了新伤，衣襟上蹭了泥。';
        return push(X, {
            kind: 'bg', k: 'injury', text, tags: [npcId],
            w: 1, susp: 1, truth: true, refs: lastEventIds(S, 1)
        });
    }

    /**
     * 局内假线索清单（复盘揭示用）。
     * @returns {Array<object>} 假线索 */
    function falseOnes(S) {
        return S.clues.filter(function (c) { return c.truth === false; });
    }

    root.ClueSystem = {
        lastEventIds, prereqMet, assertCausal, assertLedger, unlocked, push,
        assertNotClueText, assertTalkClueDisjoint,
        genBg, genHard, genRedHerring, genInjuryClue, finishDiscovered,
        rollFalse, forgeClaim, falseOnes
    };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* itemDropSystem.js — 案发现场掉落物品（再搜掷骰）：
   首搜仍只出物证硬线索，物品只在再搜（翻现场）时掷骰掉落——与物证/背景线索两条通道互不挤占（不与掉落线索冲突）。
   掉落物来源两路：真凶之物（凶手物品池）/ 混淆物（无辜者物品池，红鲱鱼）——
   混淆物是别人遗落的真东西（truth 恒真，不进 R92 假线索配额），指错人是玩家的误读，不是伪造。
   物品文案模糊（itemTemplates 硬约束：禁职业/身份词），落成 kind:'item' 线索卡 + 实物进物品栏；
   实物免记可引（投票双轨，见 InventorySystem.canCite），且每具尸首现场限量掉落（防反复刷）。
   掉落/混淆掷骰走独立确定性流（种子+序号），不动主随机流——同 R92 口径。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;

    /**
     * 掉落掷骰（独立确定性流）。
     * @returns {number} 0..1 随机数 */
    function roll(S, salt) {
        if (S.itemSeq === undefined) {
            S.itemSeq = 0;
        }
        S.itemSeq += 1;
        return root.Rng.createRng(S.seed * 6151 + S.itemSeq * 104729 + salt * 31);
    }

    /**
     * 归属人：真凶之物归凶手；混淆物归一名无辜者（优先活着的，好让玩家对得上习惯）。
     * @returns {?object} NPC */
    function pickOwner(X, confuse) {
        const S = X.S;
        const killerId = S.killer.killerId;
        if (!confuse) {
            return S.npcs.find(function (n) { return n.id === killerId; }) || null;
        }
        const pool = S.npcs.filter(function (n) {
            return n.id !== killerId && n.alive;
        });
        return root.Rng.pick(X.rnd, pool) || null;
    }

    /**
     * 再搜现场的掉落掷骰：chance 出物品，其中 confuseChance 是混淆物（指向无辜者）。
     * 每具尸首现场最多掉落 itemDrop.maxPerCorpse 件。
     * @param {object} X 结算上下文
     * @param {object} body 尸首（corpses 条目，带 site/hour/day 与 itemDrops 计数）
     * @returns {Array<object>} 事件 */
    function drop(X, body) {
        const S = X.S;
        const D = Cfg.itemDrop || {};
        if (!root.ClueSystem.unlocked(S) || !body) {
            return [];
        }
        if ((body.itemDrops || 0) >= (D.maxPerCorpse === undefined ? 2 : D.maxPerCorpse)) {
            return [];
        }
        if (roll(S, 1)() >= (D.chance === undefined ? 0.5 : D.chance)) {
            return [];
        }
        const confuse = roll(S, 2)() < (D.confuseChance === undefined ? 0.5 : D.confuseChance);
        const owner = pickOwner(X, confuse);
        if (!owner) {
            return [];
        }
        const pool = (root.ITEM_TEMPLATES_BY_OWNER
            ? root.ITEM_TEMPLATES_BY_OWNER(owner.id) : (root.ITEM_TEMPLATES || []).filter(function (it) {
                return it.owner === owner.id;
            }));
        if (!pool.length) {
            return [];
        }
        const tpl = root.Rng.pick(X.rnd, pool);
        body.itemDrops = (body.itemDrops || 0) + 1;
        const clue = root.ClueSystem.push(X, {
            kind: 'item', k: 'item', text: tpl.text,
            tags: [owner.id], w: (D.clueWeight === undefined ? 2 : D.clueWeight), susp: 1,
            val: null, hard: false, truth: true, redHerring: confuse,
            itemName: tpl.name, icon: tpl.icon,
            refs: root.ClueSystem.lastEventIds(S, 1)
        });
        if (!clue) {
            return [];
        }
        root.InventorySystem.addEvidence(S, clue, '现场');
        return root.ClueSystem.finishDiscovered(X, clue, '现场');
    }

    root.ItemDropSystem = { roll, pickOwner, drop };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* killerSystem.js — 凶手：候选池随机（R85 随机只进候选池）→ 行为剧本 → 夜间行动记录（actorId 真值）。
   蹲守产出必须来自当晚真实行动记录，禁预设脚本（日志⑮）。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;

    const NIGHT_HOURS = ['上半夜', '三更', '后半夜'];
    const ACTION_KINDS = ['patrol', 'stash', 'meet', 'murder', 'sleep'];

    /**
     * 从候选池随机选凶手（结果仍可推理：硬线索唯一对人）。
     * @returns {string} 凶手 id */
    function electKiller(X) {
        const S = X.S;
        const pool = S.npcs.filter(function (n) { return n.alive; });
        const chosen = root.Rng.pick(X.rnd, pool);
        S.killer = {
            killerId: chosen.id,
            tool: root.Rng.pick(X.rnd, (root.CONTENT.tools || ['柴刀'])),
            sceneSite: null, sceneHour: null,
            plan: [], nightActions: [], actSeq: 0
        };
        return chosen.id;
    }

    /**
     * 记一条夜间真实行动（真相字段：actorId 真值只存 sim 内部）。
     * @returns {object} 行动记录 */
    function recordNight(X, actorId, hour, action, site, targetId) {
        const S = X.S;
        S.killer.actSeq += 1;
        const rec = {
            id: 'a' + S.killer.actSeq,
            day: S.day, hour, actorId, action, site,
            targetId: targetId || null, visibleFrom: site
        };
        S.killer.nightActions.push(rec);
        /* 时/空/人台账（R91）：夜间剧本逐条入账，真线索与 NPC 台词以此对账 */
        root.CausalLedger.record(X, {
            day: S.day, hour, site, personId: actorId, action, src: 'night'
        });
        return rec;
    }

    /**
     * 某人某夜的全部行动（蹲守数据源）。
     * @returns {Array<object>} 行动记录 */
    function nightLog(S, day, actorId) {
        return (S.killer.nightActions || []).filter(function (a) {
            return a.day === day && (!actorId || a.actorId === actorId);
        });
    }

    /**
     * 生成一夜全员行动剧本：凶手按剧本行事，无辜者过作息。全部落真实记录。
     * @returns {Array<object>} 行动记录 */
    function planNight(X) {
        const S = X.S;
        const made = [];
        S.npcs.forEach(function (n) {
            if (!n.alive) {
                return;
            }
            if (n.id === S.killer.killerId) {
                /* 凶手剧本：外出→藏匿→回屋；动手夜含 murder（第 3 夜起按概率动手，非凶手剩 killStopAt 人停手） */
                const spares = S.npcs.filter(function (x) {
                    return x.alive && x.id !== S.killer.killerId;
                }).length;
                const killNight = S.day >= Cfg.nightKillStartDay && spares > Cfg.killStopAt &&
                    X.rnd() < Cfg.killNightChance;
                S.killer.killTonight = killNight;
                const site = root.Rng.pick(X.rnd, (root.CONTENT.sites || ['林缘']));
                made.push(recordNight(X, n.id, '上半夜', 'stash', site, null));
                if (killNight) {
                    S.killer.sceneSite = site;
                    S.killer.sceneHour = root.Rng.pick(X.rnd, ['后半夜', '三更', '天快亮时']);
                    S.killer.sceneDay = S.day;
                    made.push(recordNight(X, n.id, S.killer.sceneHour, 'murder', site, null));
                } else {
                    made.push(recordNight(X, n.id, '三更', 'patrol', site, null));
                }
                made.push(recordNight(X, n.id, '后半夜', 'sleep', '木屋', null));
            } else {
                const watchSite = root.Rng.pick(X.rnd, ['木屋', '木屋', '林缘', '河岸']);
                made.push(recordNight(X, n.id, '上半夜', 'sleep', '木屋', null));
                if (X.rnd() < 0.35) {
                    made.push(recordNight(X, n.id, '三更', 'patrol', watchSite, null));
                } else {
                    made.push(recordNight(X, n.id, '三更', 'sleep', '木屋', null));
                }
                made.push(recordNight(X, n.id, '后半夜', 'sleep', '木屋', null));
            }
        });
        return made;
    }

    /**
     * 蹲守报告（3.5 修）：只回放目标当晚真实行动记录。
     * 目标是真凶且当晚有 murder 行动 → 凶案级目击；否则最多作息证言。
     * 目击入册受线索锁约束：死亡发生前只有叙述、不落线索。
     * @returns {Array<object>} 事件 */
    function stakeoutReport(X, targetId) {
        const S = X.S;
        const logs = nightLog(S, S.day, targetId);
        const npc = S.npcs.find(function (n) { return n.id === targetId; });
        if (!npc) {
            return [X.emit('stakeout.report', { text: '没盯到人。', who: null, refs: [] })];
        }
        const murderer = logs.find(function (a) { return a.action === 'murder'; });
        const wander = logs.find(function (a) { return a.action !== 'sleep'; });
        /* 身份模糊化（V22）：盯一整夜顺带打量——脚型这类底细只在观察渠道出现，禁数字 */
        const look = '（打量）' + root.NpcRosterSystem.impression(npc);
        if (murderer) {
            const f = root.BeliefSystem.addFact(X, 'sight', S.killer.killerId, targetId,
                murderer.site, null, murderer.hour, 'PLAYER', true);
            const clue = root.ClueSystem.push(X, {
                kind: 'sight', k: 'night', hard: true, truth: true,
                text: '夜里 ' + murderer.hour + '，' + npc.name + '独自在' + murderer.site + '，回来时袖口颜色不对。',
                tags: [targetId], w: 3, susp: 3,
                claim: { personId: targetId, site: murderer.site, hour: murderer.hour, day: S.day },
                refs: [f.id]
            });
            const payload = {
                /* R93：盯梢旁白只说大概，精确时辰/地点只落在线索卡正文里 */
                text: '你盯着' + npc.name + '一整夜：他/她独自出去过一趟，很久才回来。那个当口，正是命案前后。' + look,
                who: targetId, hard: true, refs: [f.id]
            };
            if (clue) {
                payload.clueId = clue.id;
            }
            return [X.emit('stakeout.report', payload)];
        }
        if (wander) {
            const f = root.BeliefSystem.addFact(X, 'sight', wander.action, targetId,
                wander.site, null, wander.hour, 'PLAYER', false);
            const clue = root.ClueSystem.push(X, {
                kind: 'sight', k: 'night', hard: false, truth: true,
                text: npc.name + '夜里' + wander.hour + '醒过，在' + wander.site + '转了一圈。',
                tags: [targetId], w: 1, susp: 1,
                claim: { personId: targetId, site: wander.site, hour: wander.hour, day: S.day },
                refs: [f.id]
            });
            const payload = {
                text: '你盯着' + npc.name + '一整夜：他/她半夜起来转了一圈就回去了，没别的动静。' + look,
                who: targetId, hard: false, refs: [f.id]
            };
            if (clue) {
                payload.clueId = clue.id;
            }
            return [X.emit('stakeout.report', payload)];
        }
        return [X.emit('stakeout.report', {
            text: '你盯着' + npc.name + '一整夜：他/她睡得很沉，一夜没翻身。' + look,
            who: targetId, hard: false, refs: []
        })];
    }

    root.KillerSystem = { NIGHT_HOURS, ACTION_KINDS, electKiller, recordNight, nightLog, planNight, stakeoutReport };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* deathSystem.js — 夜间/白天/遇险死亡判定，加权随机（玩家降权）+ 风险修正（3.3/3.2）。
   第 3 夜起才可能出现死者（概率动手、剩 killStopAt 人停手）；白天死仅在票错后解锁。
   每次死亡落 deathHappened：线索锁的开关（死亡发生前零线索）。
   R103 尸体留现场：非投票导致的死亡（夜杀/白天死）把尸首留在案发格上（S.corpses），
   凶案物证不再夜里自动落册——玩家到现场搜查才取得出（放逐不留尸，投票死无现场可搜）。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;

    /**
     * 尸体留在案发现场（地图格），供玩家现场搜查物证（R103）。
     * @returns {object} 尸体记录 */
    function placeCorpse(S, victim, x, y, site, hour, kind) {
        const body = {
            id: 'body' + (S.corpses.length + 1),
            npcId: victim.id, name: victim.name,
            x: x, y: y, site: site, day: S.day, hour: hour,
            kind: kind, searched: false
        };
        S.corpses.push(body);
        return body;
    }

    /**
     * 被害权重（3.3）：玩家 0.35、他人 1.0；留夜 ×3、饥饿<30 ×1.5、恶化度每级 ×1.15、平票余波 ×1.1。
     * @returns {Array<{target:object,w:number}>} 权重表 */
    function victimWeights(S) {
        const rows = [];
        S.npcs.forEach(function (n) {
            if (!n.alive || n.id === S.killer.killerId) {
                return;
            }
            let w = Cfg.othersKillWeight;
            if (n.hunger < Cfg.hungerRiskThreshold) {
                w *= Cfg.hungerKillWeightMul;
            }
            w *= Math.pow(Cfg.worsenKillWeightMul, S.worsen);
            if (S.tieTension) {
                w *= Cfg.tieKillWeightMul;
            }
            rows.push({ target: n, w });
        });
        let pw = Cfg.playerKillWeight;
        if (S.player.alive) {
            if (S.player.strandedToday) {
                pw *= Cfg.strandedWeightMul;
            }
            if (S.player.hunger < Cfg.hungerRiskThreshold) {
                pw *= Cfg.hungerKillWeightMul;
            }
            pw *= Math.pow(Cfg.worsenKillWeightMul, S.worsen);
            if (S.tieTension) {
                pw *= Cfg.tieKillWeightMul;
            }
            rows.push({ target: { id: 'player', name: '你' }, w: pw });
        }
        return rows;
    }

    /**
     * 夜杀（第 3 夜起、按 killNightChance 动手、剩 killStopAt 人停手）：加权选 victim，
     * 动手事实落 killerSystem 真实记录；未动手之夜按 nightNearChance 留徘徊氛围。
     * @returns {Array<object>} 事件 */
    function rollNightKill(X) {
        const S = X.S;
        const ev = [];
        if (!S.killer || !S.killer.killTonight) {
            if (S.day >= Cfg.nightKillStartDay && X.rnd() < Cfg.nightNearChance) {
                ev.push(X.emit('night.near', {
                    text: root.Rng.pick(X.rnd, (root.CONTENT.killTemplates || {}).near || [])
                        || '夜里有脚步声，近了，又远了。'
                }));
            }
            return ev;
        }
        const rows = victimWeights(S).filter(function (r) { return r.w > 0; });
        if (!rows.length) {
            return ev;
        }
        const victim = root.Rng.pickWeighted(X.rnd, rows.map(function (r) { return r.target; }),
            rows.map(function (r) { return r.w; }));
        /* 凶手的动手记录已由 killerSystem.planNight 在入夜时落下（蹲守数据源） */
        const site = S.killer.sceneSite;
        const hour = S.killer.sceneHour;
        S.murderHappened = true;      // 排序锁：命案之后才解锁凶案物证
        S.deathHappened = true;       // 线索锁：死亡发生后才可能有任何线索
        if (victim.id === 'player') {
            S.player.alive = false;
            ev.push(X.emit('night.kill', {
                text: '有人在你铺位边站了很久。你睁眼的瞬间，钝器已经落了下来。',
                who: 'player', kind: 'murder', site, mode: 'night'
            }));
        } else {
            victim.alive = false;
            S.victims.push(victim.id);
            const tpl = root.Rng.pick(X.rnd, (root.CONTENT.killTemplates || {}).body || []);
            const detail = root.Rng.pick(X.rnd, (root.CONTENT.killTemplates || {}).detail || []);
            const text = (tpl || '{victim}倒在{site}，{detail}。')
                .replace(/\{victim\}/g, victim.name)
                .replace(/\{site\}/g, site)
                .replace(/\{detail\}/g, detail || '');
            ev.push(X.emit('night.kill', {
                text, who: victim.id, kind: 'murder', site, mode: 'night'
            }));
            ev.push(X.emit('night.near', {
                text: root.Rng.pick(X.rnd, (root.CONTENT.killTemplates || {}).near || [])
                    || '夜里有脚步声，近了，又远了。'
            }));
            /* 尸体留在案发现场（R103）：案发格随尸体定（地名 → 最近的那块地），物证等玩家来现场搜。
               R95：夜里现场线索仍只落册不直呈——〔证〕卡不冒头，次晨统一由人嘴念出（R94） */
            const spot = root.WorldMap.nearest(root.WorldMap.tilesNamed(site), victim);
            placeCorpse(S, victim, spot.x, spot.y, site, hour, 'murder');
            const rhN = root.Rng.rint(X.rnd, Cfg.redHerringCount[0], Cfg.redHerringCount[1]);
            for (let i = 0; i < rhN; i += 1) {
                root.ClueSystem.genRedHerring(X);
            }
        }
        /* 目击者：有人在场附近看到过影子（硬证言，供投票参考）；R107 不再自动送"欲言又止"的指路牌——
           这条目击只活在当事人的 belief 里，要靠【问话】问出来或【蹲守】撞出来 */
        const wit = S.npcs.filter(function (n) {
            return n.alive && n.id !== S.killer.killerId;
        });
        if (wit.length) {
            const w2 = root.Rng.pick(X.rnd, wit);
            root.BeliefSystem.addFact(X, 'sight', S.killer.killerId, S.killer.killerId,
                site, null, hour, w2.id, true);
        }
        return ev;
    }

    /**
     * 白天死（票错后解锁）：p = dayDeathBase × 恶化度（上限 0.6）。
     * 非投票死亡（R103）：尸首留在倒下的那一格，凶手在场动手入台账（现场物证才对得上账）。
     * @returns {Array<object>} 事件 */
    function rollDayKill(X) {
        const S = X.S;
        if (!S.misvote || S.worsen <= 0) {
            return [];
        }
        const p = Math.min(Cfg.dayDeathCap, Cfg.dayDeathBase * S.worsen);
        if (X.rnd() >= p) {
            return [];
        }
        const pool = S.npcs.filter(function (n) {
            return n.alive && n.id !== S.killer.killerId;
        });
        if (!pool.length) {
            return [];
        }
        const victim = root.Rng.pick(X.rnd, pool);
        victim.alive = false;
        S.victims.push(victim.id);
        S.deathHappened = true;
        const site = root.WorldMap.tile(victim.x, victim.y).name;
        const hour = root.CausalLedger.dayBucket(S.clock);
        root.CausalLedger.record(X, {
            day: S.day, hour, site, personId: S.killer.killerId, action: 'murder', src: 'day'
        });
        placeCorpse(S, victim, victim.x, victim.y, site, hour, 'day');
        return [X.emit('daytime.death', {
            text: '白天也不安全了。' + victim.name + '在众目睽睽下倒了下去，谁都没看清是怎么回事。',
            who: victim.id
        })];
    }

    /**
     * 遇险（独立于凶杀）：按地块风险掷骰，饥饿/染病为修正；产生伤情与线索机会。
     * @returns {Array<object>} 事件 */
    function rollAccident(X, siteKind) {
        const S = X.S;
        let p = Cfg.accidentBaseChance;
        if (siteKind === 'gather') {
            p += 0.05;
        }
        if (S.player.hunger < Cfg.hungerRiskThreshold) {
            p += Cfg.sickRiskBonus;
        }
        if (S.player.sick) {
            p += Cfg.sickRiskBonus;
        }
        if (S.player.sanity < 45) {
            p += Cfg.accidentSanityExtra;
        }
        if (X.rnd() >= p) {
            return [];
        }
        S.player.injuryDays = Cfg.accidentInjuryDays;
        S.player.sanity = Math.max(0, S.player.sanity - 5);
        const tpl = root.Rng.pick(X.rnd, (root.CONTENT.accidentTemplates || ['在{site}摔了一跤。']));
        const text = tpl.replace(/\{site\}/g, siteKind === 'gather' ? '采集地' : '荒地');
        const ev = [X.emit('accident.event', { text, kind: 'injury' })];
        if (X.rnd() < 0.5) {
            const clue = root.ClueSystem.genInjuryClue(X, S.killer.killerId, '荒地');
            if (clue) {
                ev.push(X.emit('clue.discovered', {
                    text: '顺手记下：' + clue.text, clueId: clue.id,
                    kind: 'bg', weight: clue.w, refs: clue.refs
                }));
            }
        }
        return ev;
    }

    root.DeathSystem = { placeCorpse, victimWeights, rollNightKill, rollDayKill, rollAccident };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* meetingSystem.js — 晨会议程：宣布死者→共享线索→问话→投票（3.6，日志⑤⑯；R94 线索由人嘴说出；R98 删出示线索）。
   命令只有【问话】【投票】；问话每会 ≤askTotalLimit 次（R107 起 2 次，每人 1 次）；追问不休=heat。
   R98：出示线索已删——线索不再当众摆上桌对质，改由起票时附线索为指控背书（说服力见 votingSystem）。
   只在出现死亡后的清晨开会（R87），故永远是完整议程；未命案的清晨不集会。
   R94：共享线索拍由在场 NPC 把没念过的线索逐条当众讲出（原文照念）；开场不再有人念行踪套话。
   R108：问话/交谈出口文本 ≠ 线索原文（案发前交谈零线索的分流在 sim.cmdTalk，此处只守文本面）。
   R111：一场晨会只有一轮投票——投票结算即自动散会（票出/票错/平票一视同仁），没有第二轮。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;
    const Belief = root.BeliefSystem;

    /* R93：台词只说大概——{site}/{to}/{hour} 一律填模糊词，真实时空只进结构化 claim（对质走台账比对） */
    function vague(X, key) {
        return root.Rng.pick(X.rnd, (root.CONTENT.vague || {})[key] || []) || '那边';
    }

    /* R108 交谈文本 ≠ 线索原文：问话/交谈出口先过闸（话术库互不重字见 clueSystem.assertTalkClueDisjoint） */
    function sayClueFree(S, text) {
        root.ClueSystem.assertNotClueText(S, text, '交谈/问话');
        return text;
    }

    /**
     * 开议程（仅在有死者时被调用）：宣布死者→共享线索→问话→投票。
     * @returns {Array<object>} 事件 */
    function openAgenda(X) {
        const S = X.S;
        S.meet = {
            open: true, full: true,
            asked: {}, heat: 0, voted: false
        };
        const ev = [];
        const last = S.npcs.find(function (n) { return n.id === S.victims[S.victims.length - 1]; });
        ev.push(X.emit('meeting.open', {
            text: '天亮后所有人围坐在火堆边。' + (last ? last.name + '没有回来。' : '又少了人。') +
                '议程：宣布死者 → 共享线索 → 问话 → 投票（起票要附 ' + Cfg.persuade.clueMin + '~' +
                    Cfg.persuade.clueCount + ' 条线索）——投票只有这一轮，投完自动散会。',
            full: true
        }));
        shareClues(X).forEach(function (e) { ev.push(e); });
        return ev;
    }

    /**
     * 共享线索拍（R94）：没在会上念过的线索，逐条由在场 NPC 当众讲出——线索的呈现出自人嘴，
     * 不再是旁白念卡，也没人念零信息的行踪套话。发言人按名录序号 + 天数轮转，与线索指向无关（不给指向性暗示）。
     * 台词=线索卡正文逐字（精确坐标随卡保留，T7 线索卡例外），带 verbatim：证据原文禁模型改写（数字不交模型）。
     * 话术框走独立确定性流（种子+天数+序号），不占主随机流（同 R92 口径）；但删开场套话顺带抽走了旧实现每会的主流抽样，
     * 同种子对局与旧版不再逐局相同（难度侧效已复核在带内，见 R94）。
     * @returns {Array<object>} 事件 */
    function shareClues(X) {
        const S = X.S;
        const live = S.npcs.filter(function (n) { return n.alive; });
        const ev = [];
        if (!live.length) {
            return ev;
        }
        S.clues.filter(function (c) { return !c.shared; }).forEach(function (c, i) {
            const n = live[(S.day + i) % live.length];
            c.shared = true;
            const r = root.Rng.createRng(S.seed * 7331 + S.day * 97 + i);
            const tpl = root.Rng.pick(r, (root.CONTENT.meetingTemplates || {}).share || []);
            const text = (tpl || '有件事得摆到明面上——{text}').replace(/\{text\}/g, c.text);
            ev.push(X.emit('meeting.speech', {
                who: n.id, text, emotion: 'calm', credibility: 'testimony',
                refs: [c.id], clueId: c.id, verbatim: true
            }));
        });
        return ev;
    }

    /**
     * 问话：每会 ≤askTotalLimit 次、每人 1 次（问话限额）；证言来自 beliefSystem，可能含谎言。
     * 白天的【交谈】走同一张口，但不吃这场会的问话次数。
     * @returns {Array<object>} 事件 */
    function ask(X, npcId) {
        const S = X.S;
        const n = S.npcs.find(function (x) { return x.id === npcId; });
        if (!n || !n.alive) {
            return [];
        }
        if (S.phase === 'meeting' && Object.keys(S.meet.asked).length >= Cfg.askTotalLimit) {
            const done = '今天问得够多了。';
            root.ClueSystem.assertNotClueText(S, done, '问话');
            return [X.emit('testimony.diff', {
                who: npcId, text: done,
                diff: '一场晨会只有 ' + Cfg.askTotalLimit + ' 次问话——问谁，要想清楚。（问话次数已用完）',
                emotion: 'deflect', credibility: 'claim', refs: []
            })];
        }
        if (S.meet.asked[npcId]) {
            S.meet.heat += 1;
            const dodge = n.name + '不再接话。你追问得太紧——旁边有人抬起头来看你。';
            root.ClueSystem.assertNotClueText(S, dodge, '交谈');
            return [X.emit('npc.dialogue', {
                who: npcId, text: dodge,
                emotion: 'suspicious', credibility: 'claim', refs: []
            })];
        }
        S.meet.asked[npcId] = true;
        S.meet.heat += 1;
        Belief.revealFacts(S, npcId);      // 问讯开腔：亲历目击当众讲出（"欲言又止"被追问才说）
        const isKiller = npcId === S.killer.killerId;
        const wantLie = isKiller || X.rnd() < Belief.lieRate(S);
        const mine = Belief.ownFacts(S, npcId);
        const fact = root.Rng.pick(X.rnd, mine);
        let text = '';
        let claimObj = null;
        if (wantLie) {
            /* R91：谎言只许回避搪塞，禁编造行踪（编造只走假线索通道，R92） */
            const evasive = ((root.CONTENT.meetingTemplates || {}).lie || [])
                .filter(function (t) { return t.indexOf('{') < 0; });
            text = root.Rng.pick(X.rnd, evasive) || '我记不清了。';
        } else if (fact) {
            const tpl = root.Rng.pick(X.rnd, (root.CONTENT.clueTemplates || {}).sight || []);
            const who = S.npcs.find(function (x) { return x.id === fact.who; });
            text = (tpl || '{hour}，我在{site}看见{who}。')
                .replace(/\{hour\}/g, vague(X, 'hour'))
                .replace(/\{site\}/g, vague(X, 'site'))
                .replace(/\{to\}/g, vague(X, 'to'))
                .replace(/\{who\}/g, who ? who.name : '有人');
            /* act 事实的 site 存的是同伙 id（npcBehavior 字段用法），真位置在 to——立说法取对字段才对得上台账 */
            claimObj = {
                personId: fact.who, site: fact.kind === 'act' ? fact.to : fact.site,
                hour: fact.hour, day: fact.day
            };
        } else {
            const rows = root.CausalLedger.whereWas(S, npcId, S.day - 1, '')
                .filter(function (r) { return root.CausalLedger.hourKind(r.hour).kind === 'night'; });
            const row = root.Rng.pick(X.rnd, rows) || null;
            const tpl = root.Rng.pick(X.rnd, (root.CONTENT.meetingTemplates || {}).alibi || []);
            text = (tpl || '我夜里在{site}。')
                .replace(/\{site\}/g, vague(X, 'site'))
                .replace(/\{hour\}/g, vague(X, 'hour'))
                .replace(/\{who\}/g, '旁人');
            claimObj = row ? { personId: npcId, site: row.site, hour: row.hour, day: row.day } : null;
        }
        text = sayClueFree(S, text);
        const claim = Belief.addClaim(X, npcId, text, wantLie, claimObj);
        return [X.emit('npc.dialogue', {
            who: npcId, text,
            emotion: n.stress > 30 ? 'deflect' : 'calm',
            credibility: wantLie ? 'claim' : 'testimony',
            refs: [], claimId: claim.id
        })];
    }

    root.MeetingSystem = { openAgenda, ask, shareClues };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* votingSystem.js — 投票结算：起票带线索→说服力→亮票/计票/平票/放逐/恶化度（3.6，日志⑤⑯；R98）。
   NPC 各自投票依据 beliefSystem 亲历行踪与成见，非系统开天窗；票错→恶化度 +1，解锁白天死。
   R98：删出示线索，改由起票附线索——玩家投谁就得摆 1~5 条线索为自己的指控背书：
   真线索且指向被指控者=正确（+），假线索或指向别人=错误（-，扣得比加得多）。
   R110：起票附的凭据放行到日记句——线索/问话证言/札记三类（judgeCite）：
   证言按说法真假与指向判（说谎的行踪=假凭据，扣得更狠），打量家常行为札记中性（不加不罚）。
   说服力（persuasion）只在 sim 内结算，视图不下发；它决定 NPC 有多大几率跟票（投玩家所投）。
   跟票掷骰走独立确定性流（种子+天数+投票序号），不动主随机流——同 R92 口径。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;

    /**
     * 单条线索在本次起票里的对错（R98）：真线索且指向被指控者=正确；假线索（伪造/栽赃）或指向别人=错误。
     * 假线索还吃一层重罚——伪造物本就该被当场戳穿，拿它指人最伤说服力。
     * @returns {{ok:boolean,heavy:boolean}} 判定 */
    function judgeClue(X, targetId, clue) {
        if (!clue) {
            return { ok: false, heavy: false };
        }
        const forged = clue.truth === false;
        const points = (clue.tags || []).indexOf(targetId) >= 0;
        return { ok: !forged && points, heavy: forged };
    }

    /**
     * 单条凭据的对错（R110 起票全放行）：凭据＝线索 / 问话证言 / 打量家常行为札记。
     * 线索按 R98 判；证言按说法真假与指向判——说谎的行踪就是假凭据，扣得比摆错更狠；
     * 札记只是陪衬，不加不罚（neutral）。
     * @returns {{ok:boolean,heavy:boolean,neutral:boolean}} 判定 */
    function judgeCite(X, targetId, cite) {
        if (!cite) {
            return { ok: false, heavy: false, neutral: false };
        }
        if (cite.kind === 'clue') {
            return judgeClue(X, targetId, cite.clue);
        }
        if (cite.kind === 'claim') {
            const c = cite.claim;
            const forged = !!c.lie;
            const points = !!(c.claim && c.claim.personId === targetId);
            return { ok: !forged && points, heavy: forged, neutral: false };
        }
        return { ok: false, heavy: false, neutral: true };
    }

    /**
     * 起票说服力：所附凭据逐条对错加权求和（数值不给玩家看，只影响 NPC 跟票概率）。
     * V26：物品证据（物证/掉落物）加分砍半（`persuade.itemBonus`）——物件可遗落可栽赃，摆对了也不如人言拉得动票。
     * R110：札记中性（不加不罚）；证言摆对了按人言加分，说谎的行踪按假凭据重罚。
     * @returns {{value:number,correct:number,wrong:number,forged:number,picked:Array<object>}} 结算 */
    function persuasion(X, targetId, clueIds) {
        const S = X.S;
        const P = Cfg.persuade;
        let value = 0;
        let correct = 0;
        let wrong = 0;
        let forged = 0;
        const picked = [];
        (clueIds || []).forEach(function (id) {
            const cite = root.InventorySystem.cite(S, id);
            const r = judgeCite(X, targetId, cite);
            picked.push(cite || null);
            if (r.neutral) {
                return;
            }
            if (r.ok) {
                correct += 1;
                const itemLike = cite && cite.kind === 'clue' &&
                    (cite.clue.kind === 'phys' || cite.clue.kind === 'item');
                value += itemLike ? (P.itemBonus === undefined ? P.correctBonus : P.itemBonus) : P.correctBonus;
            } else {
                wrong += 1;
                value -= P.wrongPenalty;
                if (r.heavy) {
                    forged += 1;
                    value -= P.forgedPenalty;
                }
            }
        });
        return { value, correct, wrong, forged, picked };
    }

    /**
     * 说服力 → NPC 跟票概率（说服力为负即低于基线：摆错线索反而没人肯跟）。
     * @returns {number} 0..1 */
    function followChance(persuadeValue) {
        const P = Cfg.persuade;
        return Math.max(P.followFloor, Math.min(P.followCap, P.followBase + persuadeValue * P.followSlope));
    }

    /**
     * 单个投票人对目标的疑虑分（只用亲历事实 + 成见 + 当众破绽）。
     * @returns {number} 分数 */
    function ballotScore(S, voter, target) {
        const killerId = S.killer.killerId;
        if (target.id === 'player') {
            /* 追问太紧 → 有人起疑，票飘向玩家（R85：结果判定禁随机；斜率=cfg.heatVoteRisk）
               R98：起票摆一堆对不上的线索同样反噬——说服力为负按 blowbackSlope 计入玩家嫌疑 */
            const base = voter.id === killerId ? Cfg.heatVoteRisk * 0.75 : Cfg.heatVoteRisk;
            const blow = (S.persuade || 0) < 0 ? -(S.persuade) * Cfg.persuade.blowbackSlope : 0;
            return base * (S.meet ? S.meet.heat : 0) + blow;
        }
        if (voter.id === killerId) {
            /* 凶手搅局：把票推向最失态的无辜者 */
            return target.stress / 10 + (target.broke ? 2 : 0) + 1;
        }
        let s = target.stress / 12 + (target.broke ? 4 : 0);
        const belief = root.BeliefSystem.beliefOf(S, voter.id);
        belief.sightings.forEach(function (fid) {
            const f = S.facts.find(function (x) { return x.id === fid; });
            if (f && f.who === target.id && f.kind === 'sight') {
                s += f.hard ? 8 : 3;
            }
        });
        /* 晨会围坐：只有当众讲出来的硬目击，二手证言全场才听得到（3.6） */
        S.facts.forEach(function (f) {
            const heard = f.hard && f.public && f.kind === 'sight' && f.who === target.id && f.seenBy !== voter.id;
            const speaker = heard ? S.npcs.find(function (n) { return n.id === f.seenBy; }) : null;
            if (speaker && speaker.alive) {
                s += 5;
            }
        });
        /* 成见：结怨对象多挨一票 */
        if (voter.grudge && voter.grudge[target.id]) {
            s += voter.grudge[target.id];
        }
        return s;
    }

    /**
     * 一个 NPC 的选票（候选=玩家+其余活人）。
     * @returns {string} 目标 id */
    function npcBallot(S, voter) {
        /* 玩家放池尾：同分时不抢票，无证据不得让"沉默票"砸向玩家 */
        const pool = S.npcs.filter(function (n) { return n.alive && n.id !== voter.id; })
            .concat([{ id: 'player', name: '你', stress: 0, broke: false }]);
        if (!pool.length) {
            return '';
        }
        let best = pool[0];
        let bestScore = -1;
        pool.forEach(function (t) {
            const s = ballotScore(S, voter, t);
            if (s > bestScore) {
                bestScore = s;
                best = t;
            }
        });
        return best.id;
    }

    /**
     * 亮票 + 计票 + 结算（起票带线索→说服力→跟票掷骰→票中凶手/票错/平票三分支）。
     * @param {object} X 结算上下文
     * @param {string} playerTarget 玩家所投
     * @param {Array<string>} [clueIds] 起票附的线索（1~persuade.clueCount 条，sim 层已校验）
     * @returns {Array<object>} 事件 */
    function settle(X, playerTarget, clueIds) {
        const S = X.S;
        const ev = [];
        const ids = clueIds || [];
        const p = persuasion(X, playerTarget, ids);
        S.persuade = p.value;          /* 只在真相态：负分给玩家拉票（ballotScore），视图不下发 */
        /* R109：起票摆上台面的证据落档，供结局复盘写"为什么能指控"（真相态，视图不下发） */
        S.lastVote = { day: S.day, target: playerTarget, clueIds: ids.slice(), tally: null };
        S.voteSeq = (S.voteSeq || 0) + 1;
        const rnd = root.Rng.createRng(S.seed * 6151 + (S.day * 31 + S.voteSeq) * 7919);
        const chance = followChance(p.value);
        const tally = {};
        const cast = function (voterId, target, clues) {
            tally[target] = (tally[target] || 0) + 1;
            const payload = {
                who: voterId, target, text: '', emotion: 'suspicious', credibility: 'accusation'
            };
            if (clues) {
                payload.clues = clues;
            }
            ev.push(X.emit('vote.cast', payload));
        };
        cast('player', playerTarget, ids);
        S.npcs.forEach(function (n) {
            if (!n.alive) {
                return;
            }
            /* 跟票：说服力撬动的是"肯不肯跟着你投"——凶手永不跟票（他要的是搅局） */
            const follow = n.id !== S.killer.killerId && n.id !== playerTarget && rnd() < chance;
            cast(n.id, follow ? playerTarget : npcBallot(S, n));
        });
        S.lastVote.tally = Object.assign({}, tally);
        const nameOf = function (k) {
            return k === 'player' ? '你' : (S.npcs.find(function (n) { return n.id === k; }) || { name: k }).name;
        };
        const tallyTxt = Object.keys(tally).map(function (k) {
            return nameOf(k) + ' ' + tally[k] + ' 票';
        }).join('，');
        const max = Math.max.apply(null, Object.keys(tally).map(function (k) { return tally[k]; }));
        const top = Object.keys(tally).filter(function (k) { return tally[k] === max; });
        if (top.length > 1) {
            S.tieTension = true;
            S.npcs.forEach(function (n) { n.stress += Cfg.tieStressBonus; });
            ev.push(X.emit('vote.result', {
                text: '票型：' + tallyTxt + '。票数持平，僵住了——今天没人被放逐，但所有人的神经都绷紧了。',
                tie: true, tally
            }));
            return ev;
        }
        const outId = top[0];
        if (outId === 'player') {
            S.player.alive = false;
            ev.push(X.emit('vote.result', {
                text: '票型：' + tallyTxt + '。他们把票投给了你。你被推出木屋，走进荒野。',
                target: 'player', innocent: true, tally
            }));
            return ev;
        }
        const n = S.npcs.find(function (x) { return x.id === outId; });
        n.alive = false;
        S.exiled.push(outId);
        if (outId === S.killer.killerId) {
            ev.push(X.emit('vote.result', {
                text: '票型：' + tallyTxt + '。' + n.name + '被按在地上，' +
                    root.Rng.pick(X.rnd, (root.CONTENT.meetingTemplates || {}).voteWin || '不必再演了。'),
                target: outId, hitKiller: true, tally
            }));
            S.end = 'solved_vote';
        } else {
            ev.push(X.emit('vote.result', {
                text: '票型：' + tallyTxt + '。' + n.name + '被投了出去。你们杀错了人。',
                target: outId, innocent: true, tally
            }));
            /* 票错 → 恶化度 +1，解锁白天死，信任崩坏 */
            S.misvote = true;
            S.worsen = Math.min(Cfg.worsenCap, S.worsen + 1);
            ev.push(X.emit('crisis.warning', {
                text: '凶手还在营地里。从今天起，白天也不安全了（恶化度 ' + S.worsen +
                    '/' + Cfg.worsenCap + '）。',
                streak: 0
            }));
        }
        return ev;
    }

    root.VotingSystem = { judgeClue, judgeCite, persuasion, followChance, ballotScore, npcBallot, settle };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* endingSystem.js — 五种结束态复盘 + trace 导出（3.3）。任何路径置位 S.end 必须 emitEnd。
   R109 结算不给凶手档案：复盘只报身份；票出凶手那局另附参与投票的证据与指控分析
   （分析交 LLM 化妆，`analysis` 为模板兜底），坏结局与其外的结束态只报身份、一字不多说。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;

    const VERDICT = {
        solved_vote: ['好结局', '会议投票命中，凶手被放逐。'],
        murder_won: ['坏结局', '只剩下你和凶手。'],
        player_dead: ['死亡结局', '你也成了名单上的一个。'],
        crisis: ['失败', '营地断粮断水，队伍散了。'],
        timeout: ['未决', '最后一夜过去，案件封存。']
    };

    /**
     * 结束态判定（优先级：玩家死 > 凶手赢 > 生存危机 > 超时）。
     * @returns {Array<object>} 事件 */
    function checkEnd(X) {
        const S = X.S;
        const ev = [];
        if (!S.end) {
            const live = S.npcs.filter(function (n) { return n.alive; });
            const killerAlive = live.some(function (n) { return n.id === S.killer.killerId; });
            const stock = root.ResourceSystem.stockStatus(S);
            if (!S.player.alive) {
                S.end = 'player_dead';
            } else if (live.length <= 1 && killerAlive) {
                S.end = 'murder_won';
            } else if (S.crisisCount >= Cfg.crisisCountLimit || S.emptyStreakDays >= Cfg.stockEmptyStreakLimit) {
                S.end = 'crisis';
            } else if (S.day > Cfg.dayCount) {
                S.end = 'timeout';
            } else if (stock.empty.length && S.emptyStreakDays >= Cfg.stockEmptyStreakLimit) {
                S.end = 'crisis';
            }
        }
        if (S.end && !S.ended) {
            S.ended = true;
            ev.push(X.emit('game.end', {
                end: S.end, killer: S.killer.killerId,
                victims: S.victims.slice(), days: S.day
            }));
        }
        return ev;
    }

    /**
     * 参与投票的证据（R109）：玩家起票摆上台面的线索逐条 + 判定，另附票型与当众讲过的硬目击。
     * @returns {{target:string,evidence:Array<{text:string,verdict:string,ok:boolean}>,tally:string,sights:Array<string>}} 证据包 */
    function voteEvidence(S) {
        const v = S.lastVote || {};
        const nameOf = function (id) {
            if (id === 'player') {
                return '你';
            }
            const n = S.npcs.find(function (x) { return x.id === id; });
            return n ? n.name : id;
        };
        return {
            target: nameOf(v.target),
            evidence: (v.clueIds || []).map(function (id) {
                /* R110：凭据＝线索 / 日记里的证言行 / 札记行，判定与起票同源（judgeCite） */
                const cite = root.InventorySystem.cite(S, id);
                const r = root.VotingSystem.judgeCite({ S: S }, v.target, cite);
                return {
                    text: cite ? (cite.clue ? cite.clue.text : (cite.entry ? cite.entry.text : id)) : id,
                    verdict: r.neutral ? '只是札记（不加不罚）'
                        : (r.heavy ? '系伪造（说谎的行踪），不算数'
                            : (r.ok ? '指向被指控者' : '与被指控者对不上')),
                    ok: !!r.ok
                };
            }),
            tally: Object.keys(v.tally || {}).map(function (k) {
                return nameOf(k) + ' ' + v.tally[k] + ' 票';
            }).join('，'),
            sights: S.facts.filter(function (f) {
                return f.kind === 'sight' && f.hard && f.public && f.who === v.target;
            }).map(function (f) {
                return nameOf(f.seenBy) + '当众讲过：' + f.hour + '前后，在' + f.site + '一带见过' + nameOf(f.who);
            })
        };
    }

    /**
     * 复盘话术（结局页，R109）：不给凶手档案（动机/硬特征/凶案现场/突破口/旁证全删），只报身份；
     * 票出凶手（solved_vote）另附遇害者、参与投票的证据与指控分析（`analysis`=模板兜底，交 LLM 化妆）。
     * @returns {{end:?string,accused:string,lines:Array<string>,analysis:string,material:Array<string>}} 复盘 */
    function recapData(S) {
        const out = { end: S.end || null, accused: '', lines: [], analysis: '', material: [] };
        if (!S.end) {
            out.lines.push('本局尚未结束，真相不予揭晓。');
            return out;
        }
        const K = S.npcs.find(function (n) { return n.id === S.killer.killerId; }) || {};
        out.accused = K.name;
        out.lines.push('凶手是 ' + K.name + '（' + K.role + '）。');
        if (S.end !== 'solved_vote') {
            return out;
        }
        const v = voteEvidence(S);
        out.lines.push('遇害者：' + (S.victims.length ? S.victims.map(function (id) {
            const n = S.npcs.find(function (x) { return x.id === id; });
            return n ? n.name : id;
        }).join('、') : '无') + '。');
        out.lines.push('你起票摆上台面的证据（' + v.evidence.length + ' 条）：');
        v.evidence.forEach(function (e) {
            out.lines.push('「' + e.text + '」——' + e.verdict);
        });
        if (v.sights.length) {
            out.lines.push('当众讲过的硬目击（跟票的依据）：');
            v.sights.forEach(function (s) {
                out.lines.push(s + '。');
            });
        }
        const ok = v.evidence.filter(function (e) { return e.ok; }).length;
        out.analysis = ok
            ? '（模板小结）起票 ' + v.evidence.length + ' 条里 ' + ok + ' 条指向' + K.name +
                '，互相印证，足以指控；对不上或系伪造的那些不算数。'
            : '（模板小结）你起票摆的证据没有一条指向' + K.name +
                '；把他/她投出去的是当众讲过的那些目击与跟票。';
        out.material = ['被指控者：' + K.name + '（' + K.role + '）。', '票型：' + (v.tally || '不明') + '。']
            .concat(v.evidence.map(function (e, i) {
                return (i + 1) + '。「' + e.text + '」——' + e.verdict;
            }))
            .concat(v.sights);
        return out;
    }

    /**
     * trace 导出（含事件流水与线索因果链，不含任何真相以外的隐私字段）。
     * @returns {object} trace */
    function traceExport(S) {
        return {
            v: root.CONTRACT.v,
            seed: S.seed, day: S.day, end: S.end,
            clueCount: S.clues.length,
            crisisCount: S.crisisCount, worsen: S.worsen,
            completion: S.taskHistory || [],
            events: S.eventLog.map(function (e) {
                return { id: e.id, type: e.type, day: e.day, t: e.t };
            }),
            clues: S.clues.map(function (c) {
                return { id: c.id, kind: c.kind, refs: c.refs, day: c.day, redHerring: !!c.redHerring };
            })
        };
    }

    root.EndingSystem = { VERDICT, checkEnd, recapData, voteEvidence, traceExport };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* sim.js — 主入口：(state, cmd) => [state, events]，组合 sim/ 各系统。
   铁律（L3/L4）：零浏览器 API、零 LLM、零 Date.now()；真相字段（凶手/剧本/belief 全文）只存内部，
   下发走白名单视图。每个指令先克隆状态再结算，天然满足纯函数契约（R30/R42）。 */
(function (root) {
    'use strict';
    const Cfg = root.CONFIG;
    const Map = root.WorldMap;
    const Time = root.TimeSystem;
    const Res = root.ResourceSystem;
    const Inv = root.InventorySystem;
    const Task = root.SurvivalTask;
    const Roster = root.NpcRosterSystem;
    const Sched = root.NpcSchedule;
    const Behav = root.NpcBehavior;
    const Belief = root.BeliefSystem;
    const Clue = root.ClueSystem;
    const Killer = root.KillerSystem;
    const Death = root.DeathSystem;
    const Meet = root.MeetingSystem;
    const Vote = root.VotingSystem;
    const Ending = root.EndingSystem;
    const Machine = root.StateMachine;

    let S = null;      // 真相态（纯数据，可 structuredClone）
    let seedRnd = null;

    /* ── 事件发射：每个事件获得因果链 id，落 eventLog 供线索引用 ── */
    function makeX(out) {
        return {
            S, rnd: seedRnd, cfg: Cfg,
            emit: function (type, payload) {
                const ev = root.EV(type, payload, S.clock);
                S.evSeq += 1;
                ev.id = 'e' + S.evSeq;
                S.eventLog.push({ id: ev.id, type, day: S.day, t: S.clock });
                root.JournalPage.record(S, ev);   /* R101：有字迹的行才落荒原记事（今天这一页） */
                out.push(ev);
                return ev;
            }
        };
    }

    /**
     * 开新局。
     * @param {number} seed 种子
     * @param {string} difficulty 难度档
     * @returns {Array} [状态视图, 开场事件] */
    function newGame(seed, difficulty) {
        const useSeed = seed || Math.floor(Math.random() * 1e9);
        seedRnd = root.Rng.createRng(useSeed);
        const cfg = root.CONFIG_APPLY(difficulty || 'normal');
        const homes = Map.tilesOf('home');
        const home0 = homes[0];
        const roster = root.CONTENT.npcRoster.slice(0, cfg.npcCount);
        Roster.assertUniqueHardTraits(roster);
        Clue.assertTalkClueDisjoint();          /* R108：交谈话术库与线索话术库互不重字 */
        S = {
            seed: useSeed, cfg,
            day: 1, phase: 'day', clock: cfg.dayStartMinute, stepAcc: 0, diaryDebt: 0,
            evSeq: 0, factSeq: 0, ledgerSeq: 0, falseSeq: 0, falseUsed: 0,
            eventLog: [], facts: [], clues: [], claims: [], testimonyBook: [], ledger: [], stream: [],
            player: {
                x: home0.x, y: home0.y, alive: true,
                sanity: cfg.sanityInit, hunger: cfg.hungerInit,
                sick: false, injuryDays: 0, strandedToday: false,
                inventory: {}, stakeoutTarget: null
            },
            stocks: Object.assign({}, cfg.stockInit),
            tasks: [], taskHistory: [], completion: 1, taskFailStreak: 0,
            crisisCount: 0, emptyStreakDays: 0,
            worsen: 0, misvote: false, tieTension: false, lastVote: null,
            npcs: roster.map(function (n) {
                return Object.assign({}, n, {
                    alive: true, x: home0.x, y: home0.y, at: '木屋',
                    stress: 0, work: 0, hunger: 70, broke: false,
                    belief: { sightings: [], claims: [], prejudice: [] },
                    grudge: {}, stains: [], emotion: 'calm'
                });
            }),
            victims: [], exiled: [], corpses: [],
            killer: null, deathHappened: false,
            meet: { open: false, full: false, asked: {}, shown: 0, heat: 0, voted: false },
            seen: [], said: {}, dayOpenTotal: 0,
            end: null, ended: false
        };
        Killer.electKiller({ S, rnd: seedRnd });
        Sched.assignPosts(S);                           /* V24 岗位分散：13 人撒到远近各资源格 */
        Inv.init(S);                                    /* R96：开局自带日记本 + 空物证袋 */
        S.profile = root.LogicProfile.build({ S, rnd: seedRnd });   /* Architect 逻辑档案：凶手假设→逻辑树→线索配额（R90） */
        root.NpcRosterSystem.assertUniqueHardTraits(S.npcs);
        seedOpeningFacts(makeX([]));          // 私密事实只入 belief，事件不下发（L4）
        const out = [];
        const X = makeX(out);
        Task.rollDaily(X);                    // 配额表：每天开始时
        /* 首日无晨会（R87）：死亡发生前不开会，直接进入白天 */
        return [view(), uniq(out)];
    }

    /* 前夜基础事实：每人一件私密（只入各自 belief，玩家拿不到——防上帝视角） */
    function seedOpeningFacts(X) {
        S.npcs.forEach(function (n) {
            if (n.secretSite) {
                Belief.addFact(X, 'sight', n.id, n.id, n.secretSite, null, '深夜', n.id, false);
            }
        });
    }

    /* ── 视野：走近即看见；目击要等死亡发生后才入册成可对质的线索（每天每人记一次）── */
    function sightSweep(X) {
        const ev = [];
        S.npcs.forEach(function (n) {
            if (!n.alive) {
                return;
            }
            if (Map.dist({ x: S.player.x, y: S.player.y }, n) > Cfg.sightRadius) {
                return;
            }
            const key = S.day + ':' + n.id;
            if (S.seen.includes(key)) {
                return;
            }
            S.seen.push(key);
            const f = Belief.addFact(X, 'sight', 'player', n.id,
                Map.tile(n.x, n.y).name, null, Time.hhmm(S.clock), 'PLAYER', false);
            const clue = Clue.push(X, {
                kind: 'sight', k: 'sight', hard: false, truth: true,
                text: Time.hhmm(S.clock) + ' 目击 ' + n.name + ' 在' + Map.tile(n.x, n.y).name,
                tags: [n.id], w: 1, susp: 0,
                claim: { personId: n.id, site: Map.tile(n.x, n.y).name, hour: Time.hhmm(S.clock), day: S.day },
                refs: [f.id]
            });
            const payload = {
                /* R93：旁白只说大概，精确坐标只落在线索卡正文里 */
                text: '你看见' + n.name + '在' + root.Rng.pick(X.rnd, root.CONTENT.vague.site) +
                    root.Rng.pick(X.rnd, ['忙活着', '四下张望', '蹲着歇脚', '和谁摆了摆手']) + '。',
                who: n.id
            };
            if (clue) {
                S.testimonyBook.push({ source: 'self', npcId: n.id, day: S.day, text: clue.text });
                payload.clueId = clue.id;
            }
            ev.push(X.emit('map.interact', payload));
        });
        return ev;
    }

    /* ── 指令：move ── */
    function cmdMove(dir) {
        const d = Map.DIRECTIONS[dir];
        if (!d || S.phase !== 'day' || S.end) {
            return [];
        }
        const nx = S.player.x + d[0], ny = S.player.y + d[1];
        if (!Map.walkable(nx, ny)) {
            return [makeX([]).emit('map.move', { text: '那边是峭壁，绕不过去。' })];
        }
        const out = [];
        const X = makeX(out);
        const from = Map.tile(S.player.x, S.player.y).name;
        S.player.x = nx;
        S.player.y = ny;
        X.emit('map.move', {
            text: '你从' + from + '走到' + Map.tile(nx, ny).name + '。（' + Time.hhmm(S.clock) + '）'
        });
        Time.spend(X, Time.costOf(S, 'move')).forEach(push(out));
        sightSweep(X).forEach(push(out));
        Behav.roll(X).forEach(push(out));
        return finishTurn(X, out);
    }

    function push(out) {
        return function (e) { out.push(e); };
    }

    /* emit 已入 out，各收集口会二次追加；按对象同一性去重（R30 事件流一人一条、时序取首现） */
    function uniq(list) {
        const seen = [];
        list.forEach(function (e) {
            if (seen.indexOf(e) === -1) {
                seen.push(e);
            }
        });
        return seen;
    }

    /* ── 指令：act（写日记/采集/搜查/蹲守/休息/烹饪/交公/进食）── */
    function cmdAct(actId, arg, line) {
        if (actId === 'write') {
            /* R100 记日记：荒原记事里的任意一句写进日记留档，记成功花去 30 分钟（timeCost.write）——
               白天当场推时钟（NPC 走格/视野/行为照常，也可能写到天黑）；黄昏/夜里写的不打断当下，
               改从次日散会后的工时里扣。拒记（空句/超长/同句重复/已翻篇）不扣时。
               R101：只认还在荒原记事上的那行（每日清晨清空），记下的线索才算起票取得出的凭据。
               R112：晨会里写的不花时辰——会上抄一句不占工时、也不记账（原先记账散会补扣＝晚开工）。 */
            if (S.end) {
                return [];
            }
            const out = [];
            const X = makeX(out);
            const cost = Time.costOf(S, 'write');
            const at = Time.hhmm(S.clock);
            const res = Inv.write(S, arg, at, {
                line: line || '',
                clueId: line ? root.JournalPage.clueOf(S, line) : null,
                claimId: line ? root.JournalPage.claimOf(S, line) : null
            });
            if (!res.ok) {
                X.emit('task.result', { text: res.why });   /* 拒记不扣时，但得说清为什么 */
                return out;
            }
            if (S.phase === 'meeting') {
                X.emit('task.result', { text: '你把这句抄进日记，不花时辰。' });
                return out;
            }
            if (S.phase !== 'day') {
                S.diaryDebt += cost;
                X.emit('task.result', {
                    text: '你把这句抄进日记，花去 ' + cost + ' 分钟——这笔时辰记在账上，散会开工时补扣。'
                });
                return out;
            }
            X.emit('task.result', {
                text: '你把这句抄进日记，花去 ' + cost + ' 分钟。（' + at + ' → ' +
                    Time.hhmm(S.clock + cost) + '）'
            });
            Time.spend(X, cost).forEach(push(out));
            sightSweep(X).forEach(push(out));
            Behav.roll(X).forEach(push(out));
            return finishTurn(X, out);
        }
        if (S.phase !== 'day' || S.end) {
            return [];
        }
        const out = [];
        const X = makeX(out);
        const t = Map.tile(S.player.x, S.player.y);
        const here = t.name;
        if (actId === 'eat') {
            Res.eat(X, arg).forEach(push(out));
            return finishTurn(X, out);
        }
        if (actId === 'deposit' || actId === 'cook') {
            if (t.kind !== 'home') {
                out.push(X.emit('task.result', { text: '得回木屋才能' + (actId === 'cook' ? '做饭' : '交公') + '。' }));
                return out;
            }
            (actId === 'cook' ? Res.cook(X) : Res.depositAll(X)).forEach(push(out));
            return finishTurn(X, out);
        }
        /* 搜查不吃地块门槛（R103：案发格在哪都能搜），其余动作照旧查地块 */
        const okKind = { collect: 'gather', stakeout: 'watch', rest: 'home' }[actId];
        if (!okKind && actId !== 'search') {
            return out;
        }
        if (okKind && t.kind !== okKind) {
            out.push(X.emit('task.result', {
                text: '这里做不了' + ({ collect: '采集', stakeout: '蹲守', rest: '休息' })[actId] +
                    '。现在这里是' + here + '。'
            }));
            return out;
        }
        if (actId === 'collect') {
            Res.collect(X, t.key).forEach(push(out));
        } else if (actId === 'search') {
            /* R103 尸体现场搜查：搜查地块已删，物证只在案发格的尸首旁取得（死亡前没尸首=没现场，不烧时间）。
               R107 物证拆对：首搜=鞋印、再搜=衣色布片，一对锁要跑两趟现场（单条只锁 2-3 人）；
               之后再搜=翻背景旧物 + 掉落物（假线索通道仍在）。 */
            const body = S.corpses.find(function (c) {
                return c.x === S.player.x && c.y === S.player.y && (c.clueStage || 0) < 2;
            }) || S.corpses.find(function (c) {
                return c.x === S.player.x && c.y === S.player.y;
            });
            if (!body) {
                out.push(X.emit('task.result', {
                    text: '这里没有案发现场可搜。尸首留在出事的那一格——走到那儿再翻。'
                }));
                return out;
            }
            const stage = body.clueStage || 0;
            if (stage < 2) {
                body.searched = true;
                body.clueStage = stage + 1;
                out.push(X.emit('task.result', {
                    text: stage === 0
                        ? '你蹲在' + body.name + '倒下的地方，把现场细细翻了一遍。'
                        : '你又回到' + body.name + '倒下的地方，把边角和草丛再翻了一遍。'
                }));
                Clue.genHard(X, '现场', false, {
                    site: body.site, hour: body.hour, day: body.day
                }, stage === 0 ? 'shoes' : 'cloth').forEach(push(out));
            } else {
                Clue.genBg(X, '现场').forEach(push(out));
                /* 掉落物（再搜掷骰）：与背景线索通道并行，不挤占 */
                root.ItemDropSystem.drop(X, body).forEach(push(out));
            }
        } else if (actId === 'stakeout') {
            const live = S.npcs.filter(function (n) { return n.alive; });
            const target = arg && live.some(function (n) { return n.id === arg; })
                ? arg : (root.Rng.pick(X.rnd, live) || {}).id;
            S.player.stakeoutTarget = target;
            const who = S.npcs.find(function (n) { return n.id === target; });
            out.push(X.emit('task.result', {
                text: '你伏在' + here + '，盯住了' + (who ? who.name : '营地') +
                    '。入夜后就能知道这一夜他/她到底做了什么。'
            }));
        } else if (actId === 'rest') {
            S.player.sanity = Math.min(100, S.player.sanity + Cfg.restSanityGain);
            out.push(X.emit('task.result', {
                text: '你靠着墙睡了一会儿。脑子清楚了些（理智 +' + Cfg.restSanityGain + '）。'
            }));
        }
        if (actId === 'collect' || actId === 'search') {
            S.player.hunger = Math.max(0, S.player.hunger + Cfg.hungerActionExtra);
        }
        Time.spend(X, Time.costOf(S, actId === 'collect' ? 'collect' : actId)).forEach(push(out));
        sightSweep(X).forEach(push(out));
        Behav.roll(X).forEach(push(out));
        return finishTurn(X, out);
    }

    /* ── 指令：talk（白天走到人身边闲谈；晨会=问话）──
       R108 案发前交谈零线索：案件未发生（线索锁未开）时谁也没什么可交代的——交谈只给个人情报
       （打量外观/底细）与家常话，不吐行踪证言、不立说法、不把亲历讲出来；出口文本一律不与线索原文同字。
       案发前闲谈走模板原文（verbatim，不交模型改写）：零信息素材经模型之口可能编出行踪，干脆不出声。 */
    function cmdTalk(npcId) {
        const out = [];
        const X = makeX(out);
        if (S.phase === 'meeting') {
            Meet.ask(X, npcId).forEach(push(out));
            return finishTurn(X, out);
        }
        if (S.phase !== 'day' || S.end) {
            return out;
        }
        const n = S.npcs.find(function (x) { return x.id === npcId; });
        if (!n || !n.alive) {
            return out;
        }
        if (Map.dist({ x: S.player.x, y: S.player.y }, n) > Cfg.sightRadius) {
            out.push(X.emit('map.interact', {
                text: n.name + '不在你这一格。走到同一格才能搭话。', who: npcId
            }));
            return out;
        }
        /* 身份模糊化（V22）：走近搭话顺带打量外观印象（每人每天一次）——
           脚型/体格这类底细不落卡，只从交谈与蹲守的观察里来 */
        S.looked = S.looked || {};
        const firstLook = S.looked[npcId] !== S.day;
        if (!Clue.unlocked(S)) {
            if (firstLook) {
                S.looked[npcId] = S.day;
                const look = '（打量）' + Roster.impression(n);
                Clue.assertNotClueText(S, look, '交谈打量');
                out.push(X.emit('map.interact', { text: look, who: npcId }));
            } else {
                const idle = root.Rng.pick(X.rnd, root.CONTENT.smalltalk || []) || '你们没话找话地闲扯了几句。';
                Clue.assertNotClueText(S, idle, '案发前闲谈');
                out.push(X.emit('npc.dialogue', {
                    who: npcId, text: idle, emotion: 'calm', credibility: 'claim',
                    refs: [], verbatim: true
                }));
            }
            Time.spend(X, Time.costOf(S, 'talk')).forEach(push(out));
            return finishTurn(X, out);
        }
        Meet.ask(X, npcId).forEach(push(out));
        if (firstLook) {
            S.looked[npcId] = S.day;
            const look = '（打量）' + Roster.impression(n);
            Clue.assertNotClueText(S, look, '交谈打量');
            out.push(X.emit('map.interact', { text: look, who: npcId }));
        }
        Time.spend(X, Time.costOf(S, 'talk')).forEach(push(out));
        return finishTurn(X, out);
    }

    /* ── 晨会指令：问话/投票（R98 删出示线索；投票必附 persuade.clueMin~clueCount 条线索） ── */
    function guardMeeting() {
        /* R111：一场晨会只有一轮投票——voted 后问话/投票一并关门 */
        return S.phase === 'meeting' && !S.end && S.meet.open && !S.meet.voted;
    }

    function cmdAsk(npcId) {
        if (!guardMeeting()) {
            return [];
        }
        const out = [];
        Meet.ask(makeX(out), npcId).forEach(push(out));
        return out;
    }

    function cmdVote(targetId, clueIds) {
        if (!guardMeeting() || !S.meet.full) {
            return [];
        }
        const out = [];
        const X = makeX(out);
        const max = Cfg.persuade.clueCount;
        const min = Cfg.persuade.clueMin;
        const ids = (clueIds || []).filter(function (id, i, a) { return a.indexOf(id) === i; });
        /* R110：凭据 id＝线索 id 或日记条目的记事行 id——写进日记的任何一句都举得起票 */
        const known = ids.filter(function (id) {
            return !!Inv.cite(S, id);
        });
        if (ids.length < min || ids.length > max || known.length !== ids.length) {
            /* 起票至少摆 1 条、至多 max 条：0 条/超量/查无此凭据一律打回，不烧本次投票机会 */
            out.push(X.emit('task.result', {
                text: '起票要附 ' + min + '~' + max + ' 条不同的凭据（现在有效 ' + known.length + ' 条）——' +
                    '指控一个人至少得摆出一条证据，凑不出就先去搜查问话、把话写进日记。'
            }));
            return out;
        }
        if (Cfg.journal.citeNeedDiary) {
            /* 投票双轨：实物类（物证/掉落物）免记可引；话语类维持 R101——没写进日记的当没有。
               R110：日记条目本身就是凭据，写进日记的那一句天然举得起 */
            const noted = ids.filter(function (id) { return Inv.canCite(S, id); });
            if (noted.length !== ids.length) {
                out.push(X.emit('task.result', {
                    text: '这 ' + ids.length + ' 条里有 ' + (ids.length - noted.length) +
                        ' 条没写进日记——话语线索每天清晨就翻篇了，没留档的到了会上拿不出手。' +
                        '手里的实物可以免记直接举证，说的话不行；写进日记的每一句都能作凭据。'
                }));
                return out;
            }
        }
        Vote.settle(X, targetId, ids).forEach(push(out));
        Ending.checkEnd(X).forEach(push(out));
        if (S.end) {
            return out;
        }
        /* R111：一场晨会只有一轮投票——票一落地即自动散会（票出/票错/平票一视同仁），
           走的就是【散会开工】同一条路（含白天以外欠下的日记工时补扣） */
        S.meet.voted = true;
        adjourn(X, out, '投票结束，自动散会。今天各自去干活。');
        return finishTurn(X, out);
    }

    /* ── 散会开工：晨会→白天（手动【散会开工】与 R111 投票后自动散会同一条路） ── */
    function adjourn(X, out, text) {
        Machine.transition(S, 'day');
        X.emit('phase.change', { text: text, next: 'day' });
        if (S.diaryDebt > 0) {
            /* R100：白天以外欠下的日记工时在这里结算——晚开工就是少干活（R112 起晨会里写的不再欠账） */
            const debt = S.diaryDebt;
            S.diaryDebt = 0;
            Time.spend(X, debt).forEach(push(out));
            X.emit('task.result', {
                text: '写日记欠下的 ' + debt + ' 分钟在这里补上，开工已是 ' + Time.hhmm(S.clock) + '。'
            });
        }
    }

    /* ── 指令：endDay —— 仅晨会=散会开工（唯一推进按钮）。白天无收工过夜，天黑自动结算 ── */
    function cmdEndDay() {
        if (S.end || S.phase !== 'meeting') {
            return [];
        }
        const out = [];
        const X = makeX(out);
        adjourn(X, out, '散会。今天各自去干活。');
        return finishTurn(X, out);
    }

    /* 天黑结算：黄昏(留夜判定) → 夜晚(生存/凶杀/蹲守结算) → 次日晨会 */
    function settleNight(X, out) {
        Machine.transition(S, 'dusk');
        if (!Map.isHome(S.player.x, S.player.y)) {
            S.player.strandedToday = true;
            S.player.sanity = Math.max(0, S.player.sanity + Cfg.strandedSanity);
            Res.addStock(S, 'wood', Cfg.strandedWoodLoss);
            X.emit('stranded', {
                text: '天黑时你没能赶回木屋，独自在' + Map.tile(S.player.x, S.player.y).name +
                    '过了一夜。理智 ' + Cfg.strandedSanity + '，木柴 ' + Cfg.strandedWoodLoss +
                    '。夜里有人在你附近停过。'
            });
        } else {
            X.emit('phase.change', { text: '天黑了。所有人都退回木屋，门闩落下的声音很响。', next: 'dusk' });
        }
        Task.settle(X).forEach(push(out));
        Machine.transition(S, 'night');
        X.emit('phase.change', { text: '入夜。火堆压低了。', next: 'night' });
        Res.dailyConsume(X).forEach(push(out));
        Killer.planNight(X);
        Death.rollNightKill(X).forEach(push(out));
        if (S.player.stakeoutTarget) {
            Killer.stakeoutReport(X, S.player.stakeoutTarget).forEach(push(out));
            S.player.stakeoutTarget = null;
        }
        Ending.checkEnd(X).forEach(push(out));
        if (S.end) {
            return out;
        }
        /* 夜 → 次日清晨：出现过死亡才开晨会（R87），否则清晨直接开工 */
        S.day += 1;
        S.clock = Cfg.dayStartMinute;
        S.stepAcc = 0;
        S.seen = [];
        if (Cfg.journal.clearDaily) {
            /* R101 荒原记事每日清空：翻篇了，昨天的字迹抄不回来——想留档只能当天写进日记 */
            root.JournalPage.clear(S);
        }
        S.player.strandedToday = false;
        const home0 = Map.tilesOf('home')[0];
        S.player.x = home0.x;
        S.player.y = home0.y;
        S.npcs.forEach(function (n) {
            if (n.alive) {
                n.x = home0.x;
                n.y = home0.y;
                n.at = '木屋';
                n.work = 0;
                n.stress = Math.max(0, n.stress - 4);
            }
        });
        S.player.sanity = Math.max(0, S.player.sanity + Cfg.sanityNightDrop);
        S.player.hunger = Math.max(0, S.player.hunger + Cfg.hungerDaily);
        if (S.player.injuryDays > 0) {
            S.player.injuryDays -= 1;
        }
        const holdMeeting = S.victims.length > 0;
        X.emit('day.open', {
            text: '第 ' + S.day + ' 天。' +
                (holdMeeting ? '天亮得很慢，有一处铺位是空的。' : '还活着。'),
            phase: holdMeeting ? 'meeting' : 'day'
        });
        Death.rollDayKill(X).forEach(push(out));
        Ending.checkEnd(X).forEach(push(out));
        if (S.end) {
            return out;
        }
        Task.rollDaily(X).forEach(push(out));
        if (holdMeeting) {
            Machine.transition(S, 'meeting');
            Meet.openAgenda(X).forEach(push(out));
        } else {
            Machine.transition(S, 'day');
            X.emit('phase.change', {
                text: '天亮了。还没出过人命，今天不集会——各自去干活。', next: 'day'
            });
        }
        return out;
    }

    /* 白天是否到头：天黑，或连最便宜的动作（移动/交谈）都已做不起——时间见底即自动天黑 */
    function dayOver(S) {
        if (Time.isDark(S)) {
            return true;
        }
        const left = Time.leftMinutes(S);
        if (Time.costOf(S, 'move') <= left) {
            return false;
        }
        if (Cfg.timeCost.talk <= left) {
            const me = { x: S.player.x, y: S.player.y };
            return !S.npcs.some(function (n) {
                return n.alive && Map.dist(me, n) <= Cfg.sightRadius;
            });
        }
        return true;
