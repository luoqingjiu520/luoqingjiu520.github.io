    /* ── 记日记：把这一句写进日记本（R99 记事制；R100 记成功扣 30 分钟、R112 晨会里记不花时辰；R101 只认还在记事上的那行）── */
    function noteText(text, ref) {
        const before = root.SIM.state().bag.diary.entries.length;
        send({ type: 'act', actId: 'write', arg: text, line: ref && ref.line });
        render();   /* 行囊/日记计数就地刷新 */
        const S = root.SIM.state();
        return !!(S && S.bag.diary.entries.length > before);   /* 真记上了才算（拒记不打已记标记） */
    }

    /**
     * 事件批入流。晨会整批发言走合奏单次调用（D3-A，省 -92% 会议 token）。
     * @param {Array} list 事件列表 */
    function pushAll(list) {
        list = list || [];
        const speeches = list.filter(function (e) {
            return e.type === 'meeting.speech' && P.lmKind(e) && root.LlmAdapter && root.LlmAdapter.ready();
        });
        const rest = list.filter(function (e) { return !speeches.includes(e); });
        rest.forEach(function (e) {
            push(e);
            if (e.type === 'game.end') {
                showEnd(e);
            }
        });
        if (!speeches.length) {
            return;
        }
        /* 合奏：一次调用产全场发言；每条先上占位行，回来逐条换词 */
        const spans = speeches.map(function (ev) {
            push(ev, true);
            const flow = document.getElementById('flow');
            return flow.lastElementChild ? flow.lastElementChild.querySelector('.t') : null;
        });
        P.sayEnsemble(speeches, function (results) {
            const got = results || [];
            speeches.forEach(function (ev, i) {
                const hit = got.find(function (r) { return r.ev === ev; });
                if (spans[i]) {
                    /* 合奏整体失败（模型没回包）时回落模板，别把占位的省略号留在屏上 */
                    root.TextStream.swap(spans[i], hit ? hit.text : P.speak(ev));
                }
            });
            render();
        });
    }

    /* ── 幸存者名录：印章头像，点开立绘 ── */
    function renderNpcs(S) {
        const box = document.getElementById('npcs');
        box.textContent = '';
        S.npcs.forEach(function (n) {
            const row = document.createElement('div');
            row.className = 'npc' + (n.alive ? '' : ' gone');
            const av = document.createElement('div');
            av.className = 'seal';
            av.textContent = n.glyph;
            const mid = document.createElement('div');
            const nm = document.createElement('div');
            nm.className = 'nm';
            nm.textContent = n.name;
            const sub = document.createElement('div');
            sub.className = 'sub';
            sub.textContent = n.role + ' · ' + (n.alive ? n.at : '不在了');
            mid.append(nm, sub);
            const rt = document.createElement('div');
            rt.className = 'rt';
            rt.textContent = n.alive ? (n.broke ? '被戳穿' : n.stress > 30 ? '不安' : '在场') : '死亡';
            row.append(av, mid, rt);
            if (n.alive) {
                row.title = '点击查看立绘（表情/污渍=可推理细节）';
                row.onclick = function () { root.PortraitSystem.open(n.id); };
            }
            box.appendChild(row);
        });
    }

    /* 日记里举得起的凭据数（R101：只有写进日记的起得了票；R110：每一句都是一条凭据，
       带线索号的那句归到线索行算一条，其余每句算一条） */
    function citedClues(S) {
        const seen = {};
        let n = 0;
        (S.bag.diary.entries || []).forEach(function (e) {
            const key = e.clueId || e.line;
            if (key && !seen[key]) {
                seen[key] = true;
                n += 1;
            }
        });
        return n;
    }

    /* ── 行旅：玩家状态 + 背包 + 今日活计 ── */
    function renderPstat(S) {
        const box = document.getElementById('pstat');
        box.textContent = '';
        const kv = function (k, v) {
            const d = document.createElement('div');
            d.className = 'kv';
            const a = document.createElement('span');
            a.textContent = k;
            const b = document.createElement('span');
            b.textContent = v;
            d.append(a, b);
            box.appendChild(d);
        };
        kv('状态', S.player.alive ? (S.player.sick ? '染病' : S.player.injuryDays ? '带伤' : '存活') : '死亡');
        kv('今日', '第 ' + S.day + ' / ' + S.dayCount + ' 天');
        kv('理智', String(Math.round(S.player.sanity)));
        kv('饥饿', String(Math.round(S.player.hunger)));
        kv('线索', S.clues.length + ' 条');
        kv('日记凭据', citedClues(S) + ' 条（写进日记的每一句都起得了票）');
        kv('存活 NPC', String(root.SIM.aliveN().length));
        if (S.tasks.length) {
            const h = document.createElement('h3');
            h.textContent = '今日活计';
            h.style.marginTop = '8px';
            box.appendChild(h);
            S.tasks.forEach(function (t) {
                kv(t.label, (t.done ? '✓ ' : '') + t.got + '/' + t.need);
            });
        }
        if (S.player.strandedToday) {
            kv('留夜', '昨夜受罚：理智 ' + root.CONFIG.strandedSanity + '、完成度 ' +
                Math.round(root.CONFIG.strandedCompletion * 100) + '%');
        }
    }

    /** 总渲染：所有面板从同一视图重绘。 */
    function render() {
        const S = root.SIM.state();
        setLut(null);
        if (!S) {
            return;
        }
        root.StatusBoard.render(S);
        renderNpcs(S);
        renderPstat(S);
        root.MapBoard.render(S, send);
        root.InventoryBoard.render(S);
        root.CommandBar.render(S, send);
        root.MeetingRoom.render(S, send);
    }

    /* ── 结局页：复盘 + 导出 trace ── */
    function showEnd(ev) {
        const S = root.SIM.state();
        const v = (root.CONTENT.verdict || {})[ev.payload.end] || ['终局', ''];
        const endbox = document.getElementById('endbox');
        const box = document.createElement('div');
        box.className = 'end';
        const h = document.createElement('h3');
        h.textContent = v[0] + ' · ' + v[1];
        const rc = document.createElement('div');
        rc.className = 'mono';
        const recap = P.recap();
        recap.lines.forEach(function (x) {                    // R76：只经 textContent，禁 innerHTML 拼接
            const line = document.createElement('div');
            line.textContent = '· ' + x;
            rc.appendChild(line);
        });
        /* R109 指控分析：好结局先出模板小结，LLM 回来再换词；坏结局与其外只报身份、无此段 */
        if (recap.analysis) {
            const an = document.createElement('div');
            an.textContent = '〔指控分析〕' + recap.analysis;
            rc.appendChild(an);
            P.recapAnalysis(function (text) {
                if (text) {
                    an.textContent = '〔指控分析〕' + text;
                }
            });
        }
        const btns = document.createElement('div');
        btns.className = 'btns';
        const again = document.createElement('button');
        again.textContent = '重开新局';
        again.onclick = function () { location.reload(); };
        const exp = document.createElement('button');
        exp.textContent = '导出本局 trace（发回给作者调平衡）';
        exp.onclick = function () {
            const data = Object.assign(root.SIM.trace(), {
                stream: (root.TRACE || {}).events || [],
                llm: root.LlmAdapter ? root.LlmAdapter.stat() : {}
            });
            const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'trace_' + S.seed + '_' + S.day + '.json';
            a.click();
        };
        btns.append(again, exp);
        box.append(h, rc, btns);
        endbox.textContent = '';
        endbox.appendChild(box);
    }

    root.UI = { push, pushAll, render, setLut };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* main.js — 装配：sim + perform + ui 接线、模型设置弹窗、开局（目录树 v1）。
   全部 textContent 渲染（R76）；无框架、无构建即可双击 index.html 运行。 */
(function (root) {
    'use strict';

    root.TRACE = { events: [] };

    /* ── 开局：新局事件入流，随后总渲染 ── */
    function start(seed, difficulty) {
        root.TRACE = { events: [] };
        const flow = document.getElementById('flow');
        flow.textContent = '';
        document.getElementById('endbox').textContent = '';
        root.MeetingRoom.reset();
        /* 卷首：开局第一条，交代生存压力与"要问才说"的规矩 */
        const intro = document.createElement('div');
        intro.className = 'p sys';
        const span = document.createElement('span');
        span.className = 't';
        span.textContent = root.CONTENT.opening;
        intro.appendChild(span);
        flow.appendChild(intro);
        const r = root.SIM.newGame(seed, difficulty);
        root.UI.pushAll(r[1]);
        root.UI.render();
    }

    /* ── 模型设置弹窗（BYOK：base / model / key / 关思考）── */
    function openCfg() {
        closeCfg();
        const c = root.LlmAdapter.cfg();
        const mask = document.createElement('div');
        mask.className = 'modal-mask';
        mask.id = 'cfgMask';
        const box = document.createElement('div');
        box.className = 'modal-box cfg-box';

        const h = document.createElement('h3');
        h.textContent = '模型设置（BYOK：密钥只存本机浏览器）';
        box.appendChild(h);

        const fields = [
            { k: 'base', label: '接口地址 base', ph: 'https://api.example.com/v1', val: c.base || '' },
            { k: 'model', label: '模型名 model', ph: '模型名', val: c.model || '' },
            { k: 'key', label: '密钥 key', ph: 'sk-…', val: c.key || '' }
        ];
        const inputs = {};
        fields.forEach(function (f) {
            const row = document.createElement('div');
            row.className = 'cfg-row';
            const lab = document.createElement('label');
            lab.textContent = f.label;
            const inp = document.createElement('input');
            inp.value = f.val;
            inp.placeholder = f.ph;
            if (f.k === 'key') {
                inp.type = 'password';
            }
            inputs[f.k] = inp;
            row.append(lab, inp);
            box.appendChild(row);
        });

        const thinkRow = document.createElement('div');
        thinkRow.className = 'cfg-row';
        const thinkLab = document.createElement('label');
        const thinkInp = document.createElement('input');
        thinkInp.type = 'checkbox';
        thinkInp.checked = !!c.noThink;
        thinkLab.append(thinkInp, document.createTextNode(' 关闭模型思考（enable_thinking=false）'));
        thinkRow.appendChild(thinkLab);
        box.appendChild(thinkRow);

        const warn = document.createElement('p');
        warn.className = 'cfg-warn';
        box.appendChild(warn);

        const btns = document.createElement('div');
        btns.className = 'btns';
        const testBtn = document.createElement('button');
        testBtn.textContent = '测试连接';
        const saveBtn = document.createElement('button');
        saveBtn.textContent = '保存并启用';
        const closeBtn = document.createElement('button');
        closeBtn.textContent = '不连模型（模板档）';
        btns.append(testBtn, saveBtn, closeBtn);
        box.appendChild(btns);

        const readCfg = function () {
            return {
                base: inputs.base.value.trim(),
                model: inputs.model.value.trim(),
                key: inputs.key.value.trim(),
                noThink: thinkInp.checked
            };
        };
        const checkReasoner = function () {
            warn.textContent = root.LlmAdapter.isReasoner(inputs.model.value.trim())
                ? '提示：这是思考型模型——请勾选"关闭模型思考"，否则可能超时或烧双倍 token。'
                : '';
        };
        inputs.model.addEventListener('input', checkReasoner);
        checkReasoner();

        testBtn.onclick = function () {
            const nc = readCfg();
            testBtn.textContent = '测试中…';
            root.LlmAdapter.testConn(nc, function (err, out) {
                testBtn.textContent = '测试连接';
                warn.textContent = err
                    ? '连接失败：' + ((err && err.message) || err)
                    : '连接正常，回包：' + String(out || '').slice(0, 40);
            });
        };
        saveBtn.onclick = function () {
            root.LlmAdapter.saveCfg(readCfg());
            closeCfg();
            root.UI.render();
        };
        closeBtn.onclick = closeCfg;
        mask.onclick = function (e) {
            if (e.target === mask) {
                closeCfg();
            }
        };

        mask.appendChild(box);
        document.body.appendChild(mask);
    }

    function closeCfg() {
        const m = document.getElementById('cfgMask');
        if (m) {
            m.remove();
        }
    }

    /* ── 顶栏接线：种子 / 难度 / 开局 / 模型设置 ── */
    function boot() {
        root.TextStream.bind(document.getElementById('flow'));

        const diff = document.getElementById('difficulty');
        Object.keys(root.CONFIG.difficulty).forEach(function (k) {
            const o = document.createElement('option');
            o.value = k;
            o.textContent = root.CONFIG.difficulty[k].label || k;
            if (k === 'normal') {
                o.selected = true;
            }
            diff.appendChild(o);
        });

        document.getElementById('btnStart').onclick = function () {
            const raw = document.getElementById('seedInput').value.trim();
            const seed = raw ? parseInt(raw, 10) : Math.floor(Math.random() * 1e9);
            start(isNaN(seed) ? Math.floor(Math.random() * 1e9) : seed, diff.value);
        };
        document.getElementById('btnCfg').onclick = openCfg;

        start(Math.floor(Math.random() * 1e9), diff.value);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
