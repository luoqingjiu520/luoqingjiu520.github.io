   所以音频的解锁、静音、与 UI 的挂钩全部留在这一侧。

   音色走国风：拨弦（古筝/琵琶）、吹管（笛/箫）、堂鼓、木鱼。
   音乐用五声音阶（宫商角徵羽），D 宫。
   ========================================================================== */
const AUDIO = {
  ctx: null, master: null, musicBus: null, sfxBus: null, spaceIn: null,
  started: false, musicOn: false, muted: false, noiseBuf: null,
  step: 0, bar: 0, nextTime: 0, timer: null,

  BPM: 78,                                   // 92 → 78：从「激昂」回到「舒缓」，句子拉长、不急
  MUSIC_LEVEL: 0.3,                          // 背景音乐基准电平。压低是为了给音效让路 ——
                                             // 音乐是持续的、音效是瞬时的，音乐稍高一点就会盖住音效
  /** 五声音阶（宫商角徵羽 + 高八度），D 宫 */
  SCALE: [62, 64, 66, 69, 71, 74, 76, 78, 81],
  /** 各声部在第几小节登场。开场只出低音和笛，古筝、鼓、扫弦依次进来 ——
   *  点「开始」时音乐是「长出来」的，而不是「啪」地一下全砸下来。 */
  INTRO_AT: { drone: 0, flute: 0, arp: 2, drum: 4, strum: 4 },

  /* ---------- 初始化 ---------- */
  /** 只读静音偏好，不创建 AudioContext —— 免得页面一加载就建上下文（浏览器会为此报警告） */
  readPref() {
    if (this._prefRead) return this.muted;
    this._prefRead = true;
    try { this.muted = localStorage.getItem('cc-game-muted') === '1'; } catch (e) { this.muted = false; }
    return this.muted;
  },

  init() {
    if (this.ctx) return this.ctx;
    this.readPref();
    const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return null;
    this.ctx = new AC();
    // 增益结构：音符峰值 × musicBus × master 才是最终电平。
    // 之前 musicBus 0.2 × master 0.6 把声音压掉了 90%，所以「听不到」。
    this.master = this.ctx.createGain();
    this.master.gain.value = 1;
    // 限幅器兜底：音效峰值 0.7 + 音乐 0.3 就可能超过 1.0 而削波（爆音）。
    // 压缩器压到 −3dBFS 以下，之后怎么调音量都不会爆。
    const limiter = this.ctx.createDynamicsCompressor();
    limiter.threshold.value = -3;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.18;
    this.master.connect(limiter);
    limiter.connect(this.ctx.destination);
    this.musicBus = this.ctx.createGain();
    this.musicBus.gain.value = 0;
    this.musicBus.connect(this.master);
    this.sfxBus = this.ctx.createGain();
    this.sfxBus.gain.value = 1;
    this.sfxBus.connect(this.master);
    // 一点厅堂感：短延迟 + 反馈，国风不宜太干
    const delay = this.ctx.createDelay(1);
    delay.delayTime.value = 60 / this.BPM * 0.75;
    const fb = this.ctx.createGain(); fb.gain.value = 0.3;
    const damp = this.ctx.createBiquadFilter();
    damp.type = 'lowpass'; damp.frequency.value = 2200;
    delay.connect(damp); damp.connect(fb); fb.connect(delay);
    delay.connect(this.musicBus);
    this.spaceIn = this.ctx.createGain(); this.spaceIn.gain.value = 1;
    this.spaceIn.connect(delay);
    return this.ctx;
  },

  /** 从任意一次真实手势里调，用来解锁浏览器音频 */
  unlock() {
    if (!this.init()) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (!this.started) { this.started = true; this.startMusic(); }
  },

  /* ---------- 音色 ---------- */

  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },

  noise() {
    if (this.noiseBuf) return this.noiseBuf;
    const len = Math.floor(this.ctx.sampleRate * 0.3);
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return this.noiseBuf;
  },

  /** 拨弦（古筝／琵琶）。
   *  两处让「像真乐器」的关键，也是之前听起来「干净得像合成器」的原因：
   *    ① 弦有刚度，泛音**不是严格整数倍**，越高偏得越多；
   *    ② 指甲/拨子触弦的那一瞬有**噪声**，不是凭空响起来的。
   *  另外各泛音统一用正弦 —— 弦的每一个分音本来就是正弦。 */
  pluck(freq, t, dur, peak, dest) {
    const bus = dest || this.musicBus;

    // ① 触弦噪声：几毫秒，给起音一个实物感
    const n = this.ctx.createBufferSource(); n.buffer = this.noise();
    const nf = this.ctx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = freq * 5; nf.Q.value = 0.8;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(peak * 0.6, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.014);
    n.connect(nf); nf.connect(ng); ng.connect(bus);
    n.start(t); n.stop(t + 0.03);

    // ② 泛音列：低通随泛音衰减收紧，是弦振动的物理行为（不是「扫频」）
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * 6, t);
    lp.frequency.exponentialRampToValueAtTime(freq * 2.2, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(bus);
    [[1, 1], [2, 0.34], [3, 0.16], [4, 0.08]].forEach(([k, amp]) => {
      const o = this.ctx.createOscillator();
      const og = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq * k * (1 + 0.0007 * k * k);   // 弦刚度带来的不谐和
      og.gain.setValueAtTime(amp, t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + dur / k + 0.04);
      o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + dur + 0.08);
    });
  },

  /** 吹管（笛／箫）。
   *  之前是「纯正弦 + 一个理想正弦 LFO」，那是合成器长音的做法。真实的吹管有三样：
   *    ① 一点点二次泛音（不是纯正弦）；
   *    ② **气流声**，这是「像笛子」最要紧的一点；
   *    ③ 颤音是两个不同速率的振荡叠加出来的，不会那么规整。 */
  flute(freq, t, dur, peak) {
    [[1, 1], [2, 0.12]].forEach(([k, amp]) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq * k;
      // 两个不成整数比的 LFO：4.7Hz 与 6.9Hz，叠起来就不是规整颤音了
      [[4.7, 0.0045], [6.9, 0.0022]].forEach(([rate, depth]) => {
        const lfo = this.ctx.createOscillator();
        const lg = this.ctx.createGain();
        lfo.type = 'sine'; lfo.frequency.value = rate;
        lg.gain.value = freq * k * depth;
        lfo.connect(lg); lg.connect(o.frequency);
        lfo.start(t); lfo.stop(t + dur + 0.05);
      });
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * amp, t + 0.12);
      g.gain.setValueAtTime(peak * amp, t + dur * 0.66);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.musicBus);
      const send = this.ctx.createGain(); send.gain.value = 0.4;
      g.connect(send); send.connect(this.spaceIn);
      o.start(t); o.stop(t + dur + 0.05);
    });
    // 气流声：带通噪声，跟着音符起落 —— 吹管的「气」就是这个
    const bn = this.ctx.createBufferSource(); bn.buffer = this.noise();
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = freq * 2.4; bp.Q.value = 0.7;
    const bg = this.ctx.createGain();
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.exponentialRampToValueAtTime(peak * 0.3, t + 0.14);
    bg.gain.setValueAtTime(peak * 0.3, t + dur * 0.7);
    bg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    bn.connect(bp); bp.connect(bg); bg.connect(this.musicBus);
    bn.start(t); bn.stop(t + dur + 0.05);
  },

  /** 木鱼／梆子：空腔木头的「笃」。
   *  木头是一块板，振动在几个**固定**的固有频率上 —— 之前写的 1500→880Hz 正弦
   *  下滑是合成器的手法，真实木头不会边响边滑音。 */
  woodblock(t, peak, dest) {
    const bus = dest || this.sfxBus;
    const jit = 1 + (Math.random() - 0.5) * 0.1;
    // ① 击打噪声：几毫秒，木头的接触声
    const n = this.ctx.createBufferSource(); n.buffer = this.noise();
    const nf = this.ctx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 2600 * jit; nf.Q.value = 1.1;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(peak * 0.55, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.022);
    n.connect(nf); nf.connect(ng); ng.connect(bus);
    n.start(t); n.stop(t + 0.04);
    // ② 木头的固有频率：不规则排列，高频衰减快
    [[1050, 1.00, 0.075], [1640, 0.5, 0.05], [2380, 0.26, 0.03]].forEach(([f, amp, dur]) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f * jit;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * amp * 0.5, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.02);
    });
  },

  /** 刀剑碰撞。
   *
   *  和棋子一样用**模态合成**，但金属和木头是两回事：
   *
   *  ① 两组模态 —— 这是「浑厚」的关键。之前那版 7 个模态全挤在 1450Hz 以上，
   *     只有「亮」没有「厚」，所以听着又尖又薄。真实的刀剑声 = 低频的**剑身**
   *     （质量感、厚度）+ 高频的**金属振鸣**（「锵」的亮度），两组缺一不可。
   *  ② 金属是强不谐和的：两组模态的频率比都刻意避开整数倍。
   *  ③ **完全没有频率扫频** —— 上一版有 base×0.93 的下滑，那是电音最明显的特征。
   *  ④ 高频衰减快、低频衰减慢：剑身能响 0.85 秒，金属高频 0.08 秒就没了。
   *  ⑤ 两片刀刃相击，所以做了一记「双击」—— 主击后 9ms 再补一记轻的。
   */
  clash(t, peak, dest) {
    const bus = dest || this.sfxBus;
    const jit = 1 + (Math.random() - 0.5) * 0.06;

    // ① 接触噪声：刀刃相击那一瞬，20ms 宽带
    const n = this.ctx.createBufferSource(); n.buffer = this.noise();
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 6000;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(peak * 0.7, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.02);
    n.connect(lp); lp.connect(ng); ng.connect(bus);
    n.start(t); n.stop(t + 0.04);

    // ② 刮擦：刀身相错的那点「嚓」，带通噪声，给金属加质感
    const sn = this.ctx.createBufferSource(); sn.buffer = this.noise();
    const sbp = this.ctx.createBiquadFilter();
    sbp.type = 'bandpass'; sbp.frequency.value = 2400 * jit; sbp.Q.value = 1.1;
    const sg = this.ctx.createGain();
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(peak * 0.3, t + 0.006);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    sn.connect(sbp); sbp.connect(sg); sg.connect(bus);
    sn.start(t); sn.stop(t + 0.09);

    // ③ 剑身模态（低频组）：浑厚的主体，衰减最长
    const BODY = [
      [187, 1.00, 0.85],
      [294, 0.70, 0.68],
      [431, 0.50, 0.52],
      [602, 0.35, 0.38],
      [823, 0.24, 0.28],
    ];
    // ④ 金属振鸣（高频组）：亮度与「锵」，衰减快
    const RING = [
      [1487, 0.55, 0.42],
      [2131, 0.42, 0.32],
      [2917, 0.30, 0.24],
      [3803, 0.20, 0.17],
      [4987, 0.13, 0.12],
      [6413, 0.08, 0.08],
    ];
    const MODES = BODY.concat(RING);
    MODES.forEach(([f, amp, dur], i) => {
      // 第二次轻击：两片刀互击会有极短的双瞬态
      const times = i < 3 ? [t, t + 0.009] : [t];
      times.forEach((tt, k) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';                    // 一个模态就是一个正弦
        o.frequency.value = f * jit * (1 + (i - 5) * 0.0015);   // 各模态微偏
        const lvl = peak * amp * (k ? 0.4 : 0.5);
        g.gain.setValueAtTime(0.0001, tt);
        g.gain.exponentialRampToValueAtTime(lvl, tt + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, tt + dur * (k ? 0.6 : 1));
        o.connect(g); g.connect(bus);
        const send = this.ctx.createGain(); send.gain.value = 0.35;
        g.connect(send); send.connect(this.spaceIn);
        o.start(tt); o.stop(tt + dur + 0.05);
      });
    });
  },

  /** 闪避：放重要音效时把音乐临时压低，放完再回来 —— 这是「音乐不盖音效」的关键一手 */
  duck(amount, ms) {
    if (!this.ctx || this.muted || !this.musicOn) return;
    // 淡入还没结束就别插手：duck 里的 cancelScheduledValues 会把淡入掐断，
    // 音量会「唰」地跳上去，反而更突兀。
    if (this.fadeUntil && this.ctx.currentTime < this.fadeUntil) return;
    const g = this.musicBus.gain, now = this.ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(this.MUSIC_LEVEL * (amount || 0.4), now + 0.025);
    g.linearRampToValueAtTime(this.MUSIC_LEVEL, now + (ms || 320) / 1000);
  },

  /** 棋子落在棋盘上。
   *
   *  用的是**模态合成**，不是「几个振荡器叠一起」——这两者听感差别很大：
   *
   *  ① 木盘的固有频率是**固定**的。之前那版写成了 260→110Hz 的指数下滑，
   *     等于让棋子一边落一边「滑音」—— 真实撞击根本不会这样，这是「电音感」的
   *     主要来源，所以这一版**完全没有频率扫频**。
   *  ② 各模态频率**不规则排列**（1 : 1.507 : 2.236 : 3.054 : 4.142 : 5.419 …）。
   *     整数倍会听成乐器（弦是整数倍，木盘不是）。
   *  ③ **高频衰减快、低频衰减慢** —— 物理阻尼的规律，也是判断「真假」的关键。
   *  ④ 由一记 15ms 的噪声冲激激发（接触本身），噪声是撞击声不可少的一部分。
   *  ⑤ 每次落子整体做 ±4% 失谐 + 各模态再各自微偏，连续点击不会像同一样本重放。
   */
  stone(t, peak, dest) {
    const bus = dest || this.sfxBus;
    const jit = 1 + (Math.random() - 0.5) * 0.08;

    // ① 接触的噪声冲激：极短，低通到 4kHz 免得刺耳
    const n = this.ctx.createBufferSource(); n.buffer = this.noise();
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 4000;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(peak * 0.5, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.015);
    n.connect(lp); lp.connect(ng); ng.connect(bus);
    n.start(t); n.stop(t + 0.03);

    // ② 木盘的模态：[频率, 相对强度, 衰减时长]
    //    频率比刻意取无理数附近的不规则值；衰减时长随频率递减。
    const MODES = [
      [148, 1.00, 0.36],
      [223, 0.70, 0.27],
      [331, 0.50, 0.19],
      [452, 0.34, 0.13],
      [613, 0.23, 0.085],
      [802, 0.15, 0.055],
      [1049, 0.10, 0.036],
      [1361, 0.06, 0.024],
    ];
    MODES.forEach(([f, amp, dur], i) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';                       // 一个模态就是一个正弦
      // 每个模态再各自微偏，避免所有模态「同一次采样」的机械感
      o.frequency.value = f * jit * (1 + (i - 3.5) * 0.0016);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * amp * 0.42, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.02);
    });
  },

  /** 战鼓：鼓皮的模态 + 击打噪声。
   *  之前是「正弦 155→46Hz 滑音」，那是合成器做鼓的省事写法。真实的鼓是
   *  一块绷紧的皮，在几个**固定**的低频上振动，低频衰减慢、高频快。 */
  wardrum(t, peak, dest) {
    const bus = dest || this.musicBus;
    const jit = 1 + (Math.random() - 0.5) * 0.03;
    // ① 鼓皮模态：固定频率、低频长衰减
    [[82, 1.00, 0.50], [122, 0.55, 0.34], [178, 0.30, 0.22], [256, 0.16, 0.14]].forEach(([f, amp, dur]) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f * jit;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * amp * 0.5, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.02);
    });
    // ② 鼓皮被击打的那一下：低通噪声，很短
    const n = this.ctx.createBufferSource(); n.buffer = this.noise();
    const nf = this.ctx.createBiquadFilter();
    nf.type = 'lowpass'; nf.frequency.value = 1200;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(peak * 0.5, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    n.connect(nf); nf.connect(ng); ng.connect(bus);
    n.start(t); n.stop(t + 0.08);
  },

  /** 扫弦：几个音在几十毫秒内接连拨出 —— 琵琶的「扫」 */
  strum(degrees, t, gap, dur, peak) {
    degrees.forEach((d, i) =>
      this.pluck(this.mtof(this.SCALE[d]), t + i * gap, dur, peak * (1 - i * 0.12)));
  },

  /** 古琴：一记低音拨弦，余韵很长，用来收束一局。
   *  刻意**不复用**音乐里那个 pluck —— 那是古筝，音区高、余韵短、没有琴腔。
   *  古琴音区低一大截、有共鸣腔、散音能响好几秒，所以不会和背景撞在一起。 */
  qin(freq, t, peak, dest) {
    const bus = dest || this.sfxBus;
    const jit = 1 + (Math.random() - 0.5) * 0.02;

    // ① 触弦噪声：指甲拨过丝弦的那一下
    const n = this.ctx.createBufferSource(); n.buffer = this.noise();
    const nf = this.ctx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = freq * 4; nf.Q.value = 0.8;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(peak * 0.55, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.018);
    n.connect(nf); nf.connect(ng); ng.connect(bus);
    n.start(t); n.stop(t + 0.04);

    // ② 琴腔共鸣：一记低沉的木质共振，这是「厚」的来源，古筝没有
    const bo = this.ctx.createOscillator();
    const bg = this.ctx.createGain();
    bo.type = 'sine';
    bo.frequency.value = freq * 0.5 * jit;
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.exponentialRampToValueAtTime(peak * 0.4, t + 0.01);
    bg.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    bo.connect(bg); bg.connect(bus);
    bo.start(t); bo.stop(t + 2.3);

    // ③ 弦的泛音：含刚度不谐和，越高的衰减越快。余韵比古筝长得多。
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * 8, t);
    lp.frequency.exponentialRampToValueAtTime(freq * 1.6, t + 2.4);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    lp.connect(g); g.connect(bus);
    const send = this.ctx.createGain(); send.gain.value = 0.4;
    g.connect(send); send.connect(this.spaceIn);
    [[1, 1], [2, 0.42], [3, 0.22], [4, 0.12], [5, 0.06]].forEach(([k, amp]) => {
      const o = this.ctx.createOscillator();
      const og = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq * k * (1 + 0.0007 * k * k);
      og.gain.setValueAtTime(amp, t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 2.6 / k + 0.05);
      o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + 2.8);
    });
  },

  /** 编钟：一击青铜钟。
   *  和锣的差别是**本质**的 —— 锣是无音高的一片噪声（糊成一片），
   *  钟有明确的音高中心。而钟之所以「像钟」而不像铃铛，靠的是**三度音**：
   *  基音上方一个**小三度**的分音（1.19 倍），这是钟类乐器最标志性的特征。
   *  分音越高衰减越快，这是青铜钟的物理规律。 */
  bell(freq, t, peak, dest) {
    const bus = dest || this.sfxBus;
    // [倍率, 强度, 衰减秒数]
    const PARTIALS = [
      [0.50, 0.55, 2.6],   // 嗡音：最低、最长
      [1.00, 1.00, 2.0],   // 基音：听感上的音高
      [1.19, 0.62, 1.5],   // 三度音 —— 「像钟」就靠它
      [1.50, 0.40, 1.1],   // 五度音
      [2.00, 0.30, 0.75],  // 八度音
      [2.51, 0.16, 0.48],
    ];
    PARTIALS.forEach(([mult, amp, dur]) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq * mult;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * amp * 0.32, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus);
      const send = this.ctx.createGain(); send.gain.value = 0.5;
      g.connect(send); send.connect(this.spaceIn);
      o.start(t); o.stop(t + dur + 0.05);
    });
    // 被钟锤击中的那一下
    const n = this.ctx.createBufferSource(); n.buffer = this.noise();
    const nf = this.ctx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = freq * 6; nf.Q.value = 0.9;
    const ng = this.ctx.createGain();
    ng.gain.setValueAtTime(peak * 0.35, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
    n.connect(nf); nf.connect(ng); ng.connect(bus);
    n.start(t); n.stop(t + 0.05);
  },

  /* ---------- 音乐：一小段国风循环 ---------- */
  scheduleBar(barIndex, t) {
    const BEAT = 60 / this.BPM, BAR = BEAT * 4;
    const S = this.SCALE;
    // lv(k)：该声部还没到登场小节就是 0；登场后两小节内从 35% 渐强到 100%
    const IN = this.INTRO_AT;
    const lv = (k) => barIndex < IN[k] ? 0 : Math.min(1, (barIndex - IN[k]) / 2 + 0.35);

    // ① 战鼓 + 梆子：最晚进来
    const d = lv('drum');
    if (d) {
      // 只留一拍一记 —— 原来一小节三记鼓加两记梆子，太「推」了
      this.wardrum(t, 0.16 * d);
      // 第三拍留一记极轻的梆子，只为把拍子点住，不做推进
      this.woodblock(t + BEAT * 2, 0.1 * d, this.musicBus);
    }

    // ② 琵琶扫弦
    const sm = lv('strum');
    if (sm) {
      const chord = [[0, 2, 4], [1, 3, 5], [0, 2, 5], [2, 4, 6]][barIndex % 4];
      this.strum(chord, t, 0.03, 1.1, 0.1 * sm);
      this.strum(chord.map((x) => x + 1), t + BEAT * 2, 0.03, 0.9, 0.08 * sm);
    }

    // ③ 古筝琶音
    const ar = lv('arp');
    if (ar) {
      const shape = [[0, 2, 4, 3], [2, 4, 5, 4], [1, 3, 5, 6], [3, 5, 4, 2]][barIndex % 4];
      for (let i = 0; i < 8; i++) {
        const deg = shape[i % 4] + (i >= 4 ? 1 : 0);
        // 音量 0.1 → 0.17、余韵 0.55 → 0.85：让它从「底色」变成主角
        this.pluck(this.mtof(S[deg % S.length]), t + i * (BEAT / 2), 0.85, 0.17 * ar);
      }
      // 高八度对句：每小节两音，把古筝推到前景（原来完全没有这一层）
      const hi = [2, 4, 3, 5][barIndex % 4];
      this.pluck(this.mtof(S[hi % S.length] + 12), t + BEAT * 0.25, 1.3, 0.1 * ar);
      this.pluck(this.mtof(S[(hi + 1) % S.length] + 12), t + BEAT * 2.25, 1.2, 0.09 * ar);
    }

    // ④ 笛：开场就出，是最先听到的声部
    if (barIndex % 2 === 0) {
      const f = Math.max(0.5, lv('flute'));
      const mel = [[5, 7], [7, 5], [4, 6], [3, 5]][(barIndex / 2) % 4];
      this.flute(this.mtof(S[mel[0]]), t + BEAT * 0.5, BEAT * 1.5, 0.13 * f);
      this.flute(this.mtof(S[mel[1]]), t + BEAT * 2.5, BEAT * 1.3, 0.12 * f);
    }

    // ⑤ 低音：也开场就来，托住整段
    const dr = Math.max(0.5, lv('drone'));
    this.pluck(this.mtof(38), t, BAR * 0.5, 0.14 * dr);
    this.pluck(this.mtof(45), t + BEAT * 2, BAR * 0.4, 0.11 * dr);
  },

  tick() {
    if (!this.ctx || !this.musicOn) return;
    const BAR = (60 / this.BPM) * 4;
    const now = this.ctx.currentTime;
    // 掉队了就别追。休眠、切后台被节流、音频设备被系统抢占，都会让 tick 停摆一段时间，
    // 而 Web Audio 对**已经过去**的时间点是「立即发声」—— 错过的几十个小节会被一次性
    // 排在同一瞬间，叠成一声糊响（实测掉队 10 分钟能攒出 196 小节 ≈ 4000 个音符）。
    // 落后超过一节就把整节跳掉（bar 一起前进，配器才不会退回开场），
    // 不足一节的零头直接抹平 —— 总之绝不把音符排到过去。
    if (this.nextTime < now - 0.05) {
      const skipped = Math.floor((now - this.nextTime) / BAR);
      this.bar += skipped;
      this.nextTime += skipped * BAR;
      this.nextTime = Math.max(this.nextTime, now + 0.02);
    }
    while (this.nextTime < now + 0.3) {
      this.scheduleBar(this.bar, this.nextTime);
      this.bar++;
      this.nextTime += BAR;
    }
  },

  startMusic() {
    if (!this.ctx || this.musicOn) return;
    this.musicOn = true; this.bar = 0; this.step = 0;
    this.nextTime = this.ctx.currentTime + 0.1;
    this.musicBus.gain.cancelScheduledValues(this.ctx.currentTime);
    this.musicBus.gain.setValueAtTime(this.musicBus.gain.value, this.ctx.currentTime);
    this.fadeUntil = this.ctx.currentTime + 6;
    this.musicBus.gain.linearRampToValueAtTime(this.muted ? 0 : this.MUSIC_LEVEL, this.fadeUntil);
    this.timer = setInterval(() => this.tick(), 25);
    this.tick();
  },

  setMuted(v) {
    this.muted = !!v;
    try { localStorage.setItem('cc-game-muted', this.muted ? '1' : '0'); } catch (e) { /* 无痕模式，忽略 */ }
    if (!this.ctx) return;
    const c = this.ctx;
    this.musicBus.gain.cancelScheduledValues(c.currentTime);
    this.musicBus.gain.setValueAtTime(this.musicBus.gain.value, c.currentTime);
    this.musicBus.gain.linearRampToValueAtTime(this.muted ? 0 : this.MUSIC_LEVEL, c.currentTime + 0.4);
    this.sfxBus.gain.linearRampToValueAtTime(this.muted ? 0 : 1, c.currentTime + 0.2);
  },

  /* ---------- 音效 ---------- */
  play(name) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + 0.01;
    const S = this.SCALE;
    // 重要音效播放时把音乐压低一截，放完再回来 —— 这是「音乐不盖音效」的关键。
    // 点触(tap)和抽牌(draw)太频繁，压了会让音乐一直「抽气」，所以不压。
    if (name !== 'tap' && name !== 'draw') {
      // 结算音是「落定」，余韵长，音乐晚一点回来，不然收到一半就被盖住；
      // 觉醒是一次上冲，750ms 就够。
      const hold = (name === 'win' || name === 'lose') ? 1600 : (name === 'awaken' ? 750 : 300);
      this.duck(0.4, hold);
    }
    switch (name) {
      case 'tap':                                  // 点触：棋子落在棋盘上
        this.stone(t, 0.42); break;
      case 'card':                                 // 使用卡牌：木鱼 + 一声拨弦
        this.woodblock(t, 0.22);
        this.pluck(this.mtof(S[4]), t + 0.02, 0.5, 0.26, this.sfxBus);
        break;
      case 'combat':                               // 战斗牌：木鱼 + 短促拨弦，偏硬
        this.woodblock(t, 0.24);
        this.pluck(this.mtof(S[2]), t + 0.02, 0.35, 0.32, this.sfxBus);
        break;
      case 'spell':                                // 法术牌：泛音更多，飘一点
        this.flute(this.mtof(S[5]), t, 0.5, 0.2);
        this.pluck(this.mtof(S[7]), t + 0.04, 0.7, 0.2, this.sfxBus);
        break;
      case 'awaken': {
        // 觉醒：上行编钟 + 气声涌起。
        // **刻意避开锣** —— 背景音乐每四小节就有一记锣，用同一个音色会被听成背景的一部分。
        // 另外音乐里所有声音都是「衰减型」的，这里给一段**上行**姿态，一听就知道是事件。
        const run = [0, 2, 4, 5, 7];
        run.forEach((deg, i) => {
          this.bell(this.mtof(S[deg] + 12), t + i * 0.08, 0.55 + i * 0.05);
        });
        // 气声涌起：带通从低扫到高，给「觉醒」一个上冲的姿态
        const wn = this.ctx.createBufferSource(); wn.buffer = this.noise();
        const wbp = this.ctx.createBiquadFilter();
        wbp.type = 'bandpass'; wbp.Q.value = 1.2;
        wbp.frequency.setValueAtTime(420, t);
        wbp.frequency.exponentialRampToValueAtTime(3400, t + 0.75);
        const wg = this.ctx.createGain();
        wg.gain.setValueAtTime(0.0001, t);
        wg.gain.exponentialRampToValueAtTime(0.28, t + 0.32);
        wg.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
        wn.connect(wbp); wbp.connect(wg); wg.connect(this.sfxBus);
        wn.start(t); wn.stop(t + 1.0);
        break;
      }
      case 'destiny':                              // 天命牌：高音双点
        this.pluck(this.mtof(S[8]), t, 0.9, 0.28, this.sfxBus);
        this.pluck(this.mtof(S[6]), t + 0.09, 0.8, 0.24, this.sfxBus);
        break;
      case 'hit':                                  // 出击命中：刀剑相击
        this.clash(t, 0.8);
        break;
      case 'heal':                                 // 治疗：上行拨弦
        this.pluck(this.mtof(S[3]), t, 0.6, 0.24, this.sfxBus);
        this.pluck(this.mtof(S[5]), t + 0.07, 0.7, 0.22, this.sfxBus);
        break;
      case 'draw':                                 // 抽牌：一记轻木鱼
        this.woodblock(t + 0.02, 0.18); break;
      case 'turn':                                 // 回合交替：低音一记
        this.wardrum(t, 0.26, this.sfxBus); break;
      case 'win': {                                // 结算 · 胜：古琴上行，收在宫音上的一记编钟
        // 频率必须跨到中高频 —— 笔记本／手机喇叭还原不出 250 Hz 以下，
        // 全用低音写等于没响（原来的结算音就是这么丢的）。
        this.qin(this.mtof(45), t, 0.44);          // 散音 A2（徵的低八度）—— 落地
        this.qin(this.mtof(64), t + 0.16, 0.42);   // 泛音 E4（商）
        this.qin(this.mtof(69), t + 0.32, 0.38);   // 泛音 A4（徵）
        this.bell(this.mtof(74), t + 0.55, 0.5);   // 编钟 D5（宫）—— 落在终止音上，金属的「亮」
        break;
      }
      case 'lose': {                               // 结算 · 败：古琴下行，一记闷鼓收兵
        // 和「胜」构成一对反义：胜是上行 + 金属的亮，败是下行 + 皮的闷。
        // 两声高位的泛音保证小喇叭放得出来，最后才沉到低音散音上。
        this.qin(this.mtof(69), t, 0.42);          // 从 A4 起
        this.qin(this.mtof(64), t + 0.24, 0.4);    // 下行到 E4
        this.qin(this.mtof(45), t + 0.5, 0.36);    // 沉到最低的散音 A2
        this.wardrum(t + 0.52, 0.2, this.sfxBus);  // 堂鼓一记 —— 注意默认总线是 musicBus，必须显式给 sfxBus
        break;
      }
    }
  },
};

/* 解锁：游戏里第一次真实交互就打开音频（浏览器要求先有手势）。
   用捕获阶段挂在 document 上，任何按钮／卡牌／名士的点击都会先经过这里。 */
document.addEventListener('pointerdown', (ev) => {
  AUDIO.unlock();
  // 点触音效：只对真正可点的东西响，避免点空白也出声
  const t = ev.target;
  if (t && t.closest && t.closest('button, a, .card, .hero, .pick')) AUDIO.play('tap');
}, true);
/* 页面不可见、**或者整个窗口失焦**（Chrome 被别的程序挡在后面、切到了别的窗口）时，
   都把 AudioContext 挂起，回来再续上。
   只判 document.hidden 是不够的 —— 那只盖得住「同一个窗口里切标签页」这一种情况：
   Chrome 被别的软件挡住时 document.hidden 仍然 false，音乐就会一直响下去，
   人在别的程序里干活，没有任何东西能把它停下来。
   hasFocus() 是直接读真实状态，不像自己记标志位那样会过期。
   挂起只影响声音，对局本身照常推进（本地 AI 的回合不受影响）。 */
const syncAudioActive = () => {
  if (!AUDIO.ctx) return;
  if (document.hidden || !document.hasFocus()) AUDIO.ctx.suspend();
  else AUDIO.ctx.resume();
};
document.addEventListener('visibilitychange', syncAudioActive);
window.addEventListener('blur', syncAudioActive);
window.addEventListener('focus', syncAudioActive);

const UI = {
  mode: 'solo',          // 'solo' | 'net'
  localGame: null,       // 单机模式的本地 Game
  snap: null,            // 当前渲染用的快照（两种模式同构）
  selectedHeroes: [],
  armed: null,           // 等待选目标的牌
  logSeq: 0,             // 已消费到服务端日志的第几条
  pendingReady: false,   // 已发 set_deck，等 deck_ok 回来再补发 ready
  upgradeTurn: -1, upgradedSeat: -1,
  attackTurn: -1, attackedSeat: -1,
  _prev: {},                                    // "座位:名士id" → {hp, awakened}，用于对比出掉血/觉醒
  _prevHp: {},                                  // 使君血量，用于对比出血条闪烁
  _deltas: { hp: {}, awaken: {} },              // 本帧要播的特效
  _pending: [],                                 // 攒到 DOM 更新之后再播的特效（觉醒等需要量位置）

  /* ==================== 启动 ==================== */
  init() {
    this.$pick = document.getElementById('pickGrid');
    this.$msg = document.getElementById('setupMsg');
    this.$start = document.getElementById('btnStart');
    this.$log = document.getElementById('log');
    this.$roomPanel = document.getElementById('roomPanel');
    this.$roomGate = document.getElementById('roomGate');
    this.$roomInfo = document.getElementById('roomInfo');
    this.$roomStatus = document.getElementById('roomStatus');

    this.renderSetup();

    document.getElementById('btnRandom').onclick = () => this.randomPick();
    this.$start.onclick = () => this.onStartClick();
    document.getElementById('endTurn').onclick = () => this.dispatch('end_turn', {});
    document.getElementById('btnRestart').onclick = () => location.reload();
    document.getElementById('btnAgain').onclick = () => location.reload();
    document.getElementById('modeSolo').onclick = () => this.setMode('solo');
    document.getElementById('modeNet').onclick = () => this.setMode('net');
    document.getElementById('btnCreate').onclick = () => this.netCreate();
    document.getElementById('btnJoin').onclick = () => this.netJoin();
    document.getElementById('btnMatch').onclick = () => this.netMatch();
    document.getElementById('btnCopy').onclick = () => this.copyRoom();
    document.getElementById('roomInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') this.netJoin();
    });

    // 使用说明：首页「使用说明」按钮、对局中侧栏「说明」按钮，两处都能随时重看
    document.getElementById('btnManual').onclick = () => this.showManual(false);
    document.getElementById('btnHelp').onclick = () => this.showManual(false);
    // 声音开关：文案跟着状态走，title 说明点它会怎样
    // 两个位置各一个：阵容选择界面一个（侧栏对局前是隐藏的）、对局中侧栏一个
    const SOUND_IDS = ['btnSoundA', 'btnSound'];
    const syncSound = () => SOUND_IDS.forEach((id) => {
      const b = document.getElementById(id);
      if (!b) return;
      b.textContent = AUDIO.muted ? '静音' : '声音';
      b.title = AUDIO.muted ? '点击开启声音' : '点击静音';
    });
    AUDIO.readPref(); syncSound();
    SOUND_IDS.forEach((id) => {
      const b = document.getElementById(id);
      if (b) b.onclick = () => { AUDIO.unlock(); AUDIO.setMuted(!AUDIO.muted); syncSound(); };
    });
    document.getElementById('manualOk').onclick = () => this.hideManual();
    document.getElementById('manualClose').onclick = () => this.hideManual();
    document.addEventListener('keydown', e => { if (e.key === 'Escape') this.hideManual(); });

    this.bindNet();
  },

  /* ==================== 开场动画 & 使用说明 ==================== */

  /**
   * 播开场动画，播完自动打开使用说明。
   * 两种情况直接跳过动画：系统开了「减少动态效果」，或 URL 带 ?nointro=1（方便调试与自动化测试）。
   */
  showIntro() {
    const el = document.getElementById('intro');
    if (!el) { this.showManual(true); return; }

    let skipAnim = false;
    try {
      skipAnim = /[?&]nointro=1/.test(location.search) ||
        (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) { /* 环境不支持就照常播 */ }

    if (skipAnim) { el.style.display = 'none'; this.showManual(true); return; }

    el.classList.add('play');
    // 与 CSS 时间轴对齐：最后一个元素 1.7s 入场 + 0.8s 动画，再多留 0.9s 供读完标题
    this._introT = setTimeout(() => this.endIntro(), 3400);
    const skip = document.getElementById('introSkip');
    if (skip) skip.onclick = () => this.endIntro();
  },

  endIntro() {
    clearTimeout(this._introT);
    this._introT = null;
    const el = document.getElementById('intro');
    if (el) {
      el.classList.add('off');
      setTimeout(() => { el.style.display = 'none'; }, 620);   // 等淡出动画走完再摘掉
    }
    this.showManual(true);
  },

  /** first = true 时是开场首次展示，按钮文案为「开始游戏」 */
  showManual(first) {
    const box = document.getElementById('manual');
    if (!box) return;
    const body = document.getElementById('manualBody');
    if (body && !body.dataset.filled) {     // 内容只注入一次
      body.innerHTML = MANUAL_HTML;
      body.dataset.filled = '1';
    }
    const ok = document.getElementById('manualOk');
    if (ok) ok.textContent = first ? '开 始 游 戏' : '关 闭';
    box.classList.add('on');
    if (body) body.scrollTop = 0;
  },

  hideManual() {
    const box = document.getElementById('manual');
    if (box) box.classList.remove('on');
  },

  /* ==================== 头像与战斗特效 ==================== */

  /** 名士头像：内置毛笔字徽章；配好 ART 就优先用立绘 */
  avatarHTML(h) {
    const file = ART.base && ART.avatars[h.id];
    return '<span class="ava r-' + h.rarity + '">' +
      '<span class="avaChar">' + (AVA_CHAR[h.id] || h.name.slice(-1)) + '</span>' +
      (file ? '<img class="avaImg" src="' + ART.base + 'avatars/' + file + '" alt="" onerror="this.remove()">' : '') +
      '</span>';
  },

  /** 放一个一次性特效节点；动画播完自动移除，不留垃圾节点 */
  fxAt(cls, x, y, ms) {
    const d = document.createElement('div');
    d.className = 'fx ' + cls;
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), ms);
    return d;
  },

  /** 战斗区中心；量不到就退回屏幕中部（无头环境里量不到） */
  arenaCenter() {
    const a = document.getElementById('arena');
    if (a && a.getBoundingClientRect) {
      const r = a.getBoundingClientRect();
      if (r.width) return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    return { x: 420, y: 320 };
  },

  /** 找某名士在屏幕上的位置；preferMine 决定双方同名时先找哪一边 */
  heroAnchor(name, preferMine) {
    const zones = preferMine
      ? ['#myCombat', '#myHeroes', '#foeCombat', '#foeHeroes']
      : ['#foeCombat', '#foeHeroes', '#myCombat', '#myHeroes'];
    for (const sel of zones) {
      const box = document.querySelector(sel);
      if (!box || !box.querySelectorAll) continue;
      for (const el of box.querySelectorAll('.hero')) {
        const nm = el.querySelector && el.querySelector('.nm');
        if (nm && nm.textContent === name) {
          const r = el.getBoundingClientRect();
          if (r.width) return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        }
      }
    }
    return this.arenaCenter();
  },

  /** 技能特效：四种卡型四种表现 */
  cardFx(card, anchor) {
    AUDIO.play(card.type);          // 出牌音效：四类牌各有各的声音
    const p = anchor || this.arenaCenter();
    const spec = {
      combat:  ['fxSlash',  520],   // 斜向光刃
      spell:   ['fxRune',   600],   // 符文环
      awaken:  ['fxPillar', 700],   // 金色光柱
      destiny: ['fxDestiny',  780],   // 方胜印升起
    }[card.type];
    if (!spec) return;
    const d = this.fxAt(spec[0], p.x, p.y, spec[1]);
    if (card.type === 'destiny') d.innerHTML = '<svg><use href="#g-tianming"/></svg>';
  },

  /** 攻击特效：光刃由攻击者射向目标，命中处爆冲击环，战斗区震一下 */
  attackFx(attackerName, defenderName) {
    AUDIO.play('hit');              // 打击音效：出击命中
    const a = this.heroAnchor(attackerName, true);
    const b = defenderName ? this.heroAnchor(defenderName, false) : this.arenaCenter();
    const dx = b.x - a.x, dy = b.y - a.y;
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    const len = Math.max(70, Math.min(190, Math.hypot(dx, dy) * 0.75));

    const blade = this.fxAt('fxBlade', (a.x + b.x) / 2, (a.y + b.y) / 2, 420);
    blade.style.width = len + 'px';
    blade.animate([
      { opacity: 0, transform: `translate(-50%,-50%) rotate(${ang}deg) scaleX(.25)` },
      { opacity: 1, offset: .25 },
      { opacity: 0, transform: `translate(-50%,-50%) rotate(${ang}deg) scaleX(1.15)` },
    ], { duration: 340, easing: 'ease-out' });

    setTimeout(() => this.fxAt('fxHit', b.x, b.y, 520), 140);
    this.shakeArena();
  },

  shakeArena() {
    const arena = document.getElementById('arena');
    if (!arena) return;
    arena.classList.remove('shake');
    void arena.offsetWidth;              // 强制重排，连续受击也能重放
    arena.classList.add('shake');
    setTimeout(() => arena.classList.remove('shake'), 380);
  },

  /** 觉醒动画：全屏金雾 + 名士放大发光 + 光粒上升 + 名号浮现 */
  awakenFx(heroEl, heroName) {
    const veil = document.getElementById('awakenVeil');
    if (veil) { veil.classList.remove('on'); void veil.offsetWidth; veil.classList.add('on'); }

    const r = heroEl && heroEl.getBoundingClientRect ? heroEl.getBoundingClientRect() : null;
    const c = (r && r.width) ? { x: r.left + r.width / 2, y: r.top + r.height / 2 } : this.arenaCenter();

    const nm = this.fxAt('fxAwakenName', c.x, c.y - 8, 1400);
    nm.textContent = heroName + ' · 觉醒';

    for (let i = 0; i < 10; i++) {
      const sp = this.fxAt('fxSpark', c.x + (Math.random() * 72 - 36), c.y + 22, 1200);
      sp.style.animation = 'sparkRise ' + (0.7 + Math.random() * 0.5).toFixed(2) + 's ease-out '
        + (i * 0.04).toFixed(2) + 's forwards';
    }
  },

  /**
   * 从战报文本里认出攻守双方（格式：X 迎战 Y —— N 点伤害 / X 反击 Y（N 点））。
   * 联机模式靠它触发攻击特效 —— 结算在服务端，客户端只能从日志还原。
   *
   * 必须**按名字在文本里出现的先后**配对，不能拿双方名单去 filter：
   * 双方可能选到同一名士（都带辛弃疾），filter 会把它算两次，配对就串了。
   */
  attackFxFromText(text) {
    const names = [...new Set([...this.foe().heroes, ...this.me().heroes].map(h => h.name))];
    const hits = names
      .map(n => ({ n, at: text.indexOf(n) }))
      .filter(x => x.at >= 0)
      .sort((a, b) => a.at - b.at);
    if (!hits.length) return;
    if (hits.length >= 2) this.attackFx(hits[0].n, hits[1].n);
    else if (text.indexOf('使君') >= 0) this.attackFx(hits[0].n, null);
  },

  /**
   * 播掉本帧攒下的特效。**必须等 DOM 更新之后再播**：
   * heroEl 里拿到的元素还没插进文档，getBoundingClientRect 全是 0，特效会跑到左上角。
   */
  playPendingFx() {
    const list = this._pending;
    this._pending = [];
    for (const item of list) {
      if (item.type === 'awaken') {
        this.awakenFx(document.querySelector(`[data-key="${item.key}"]`), item.name);
      }
    }
  },

  /* ==================== 联机消息路由 ==================== */
  bindNet() {
    Net.on('welcome', msg => { this.serverInfo = msg; });

    Net.on('room_created', msg => this.onRoomEntered(msg, '房间已创建，把房号发给好友'));
    Net.on('room_joined', msg => this.onRoomEntered(msg, '已加入房间'));
    Net.on('matching', msg => this.setRoomStatus(`匹配中，当前队列第 ${msg.position} 位…`, 'warn'));
    Net.on('opponent_joined', msg => this.setRoomStatus(`${msg.name} 已加入，选好阵容后点「准备」`, 'ok'));
    Net.on('opponent_deck', msg => this.setRoomStatus(`${msg.name} 已选好阵容，等你准备`));
    Net.on('opponent_online', msg => {
      this.banner(`${msg.name} 重新连接`);
      this.setRoomStatus(`${msg.name} 回来了`, 'ok');
    });
    Net.on('opponent_offline', msg => {
      this.banner(`${msg.name} 掉线了`);
      this.toast(`${msg.name} 断线，${Math.round(msg.graceMs / 1000)} 秒内可重连`);
      this.setRoomStatus(`${msg.name} 掉线，等待重连…`, 'warn');
    });

    Net.on('deck_ok', () => {
      if (!this.pendingReady) return;
      this.pendingReady = false;
      Net.send('ready');
      this.setRoomStatus('已准备，等待对手…', 'ok');
    });

    Net.on('room_closed', msg => this.onRoomClosed(
      msg && msg.reason === 'idle_timeout'
        ? '房间长时间没有活动，已自动解散'
        : '对手已离开，房间已关闭'));
    Net.on('left_room', () => this.onRoomClosed('你已离开房间'));
    Net.on('game_start', msg => this.onGameStart(msg));
    Net.on('state', msg => this.onNetState(msg));
    Net.on('game_over', msg => this.onGameOver(msg));
    Net.on('error', msg => this.onNetError(msg));
  },

  /* ==================== 模式切换 ==================== */
  setMode(mode) {
    if (mode === 'solo' && this.mode === 'net') { Net.close(); Net.forget(); }
    this.mode = mode;
    document.getElementById('modeSolo').classList.toggle('on', mode === 'solo');
    document.getElementById('modeNet').classList.toggle('on', mode === 'net');
    this.$roomPanel.hidden = mode !== 'net';

    if (mode === 'net') {
      const inRoom = !!Net.roomId;
      this.$roomGate.hidden = inRoom;
      this.$roomInfo.hidden = !inRoom;
      if (inRoom) {
        document.getElementById('roomCodeText').textContent = Net.roomId;
        this.setRoomStatus('已回到房间');
      } else {
        this.setRoomStatus('创建房间，或输入房号加入');
      }
      Net.connect();          // 提前连上，点按钮时不用干等
    }
    this.validateSetup();
  },

  /* ==================== 阵容选择 ==================== */
  renderSetup() {
    this.$pick.innerHTML = '';
    for (const h of HERO_LIST) {
      const on = this.selectedHeroes.includes(h);
      const el = document.createElement('button');
      el.className = 'pick' + (on ? ' on' : '');
      el.innerHTML = `
        <span class="tick">✦</span>
        <div class="nm ${'r-' + h.rarity}">${h.name}</div>
        <div class="rl">${h.rarity} · ${h.role}</div>
        <div class="st"><span>力 <b>${h.basePower}</b></span><span>命 <b>${h.baseHealth}</b></span></div>
        <div class="mk">${h.mechanic.name}　${h.mechanic.stack ? '· 层数机制' : ''}</div>`;
      el.onclick = () => this.togglePick(h);
      this.$pick.appendChild(el);
    }
    this.validateSetup();
  },

  togglePick(h) {
    const i = this.selectedHeroes.indexOf(h);
    if (i >= 0) this.selectedHeroes.splice(i, 1);
    else this.selectedHeroes.push(h);
    this.renderSetup();
  },

  validateSetup() {
    const sel = this.selectedHeroes;
    const tian = sel.filter(h => h.rarity === '天').length;
    const di = sel.filter(h => h.rarity === '地').length;
    let ok = false, msg = `已选 ${sel.length} / 4　（天 ${tian}/1，地 ${di}/2）`;

    if (sel.length === 4 && tian > 1) msg = '天级最多 1 名';
    else if (sel.length === 4 && di > 2) msg = '地级最多 2 名';
    else if (sel.length === 4) { ok = true; msg = '阵容已就绪'; }

    if (this.mode === 'net') {
      this.$start.textContent = '准 备';
      if (ok && !Net.roomId) { ok = false; msg = '阵容已就绪 —— 先创建或加入房间'; }
      else if (ok && !Net.connected) { ok = false; msg = '阵容已就绪 —— 正在连接服务器…'; }
      else if (ok) msg = '阵容已就绪，点「准备」等待对手';
    } else {
      this.$start.textContent = '开 始 对 战';
    }
    this.$msg.textContent = msg;
    this.$start.disabled = !ok;
    return ok;
  },

  randomPick() {
    for (let i = 0; i < 400; i++) {
      const pick = shuffle([...HERO_LIST]).slice(0, 4);
      if (pick.filter(h => h.rarity === '天').length <= 1 &&
          pick.filter(h => h.rarity === '地').length <= 2) {
        this.selectedHeroes = pick;
        this.renderSetup();
        return;
      }
    }
  },

  /* ==================== 开局 ==================== */
  onStartClick() {
    if (this.mode === 'solo') { this.startSolo(); return; }
    if (!Net.connected) { this.toast('尚未连接到服务器'); return; }
    if (!Net.roomId) { this.toast('请先创建或加入房间'); return; }
    // 先发 set_deck，收到 deck_ok 再发 ready —— 否则阵容校验失败也照样开局
    this.pendingReady = true;
    Net.send('set_deck', { heroes: this.selectedHeroes.map(h => h.name) });
    this.setRoomStatus('正在提交阵容…');
  },

  startSolo() {
    let ai = null;
    for (let i = 0; i < 400 && !ai; i++) {
      const pick = shuffle([...HERO_LIST]).slice(0, 4);
      if (pick.filter(h => h.rarity === '天').length <= 1 &&
          pick.filter(h => h.rarity === '地').length <= 2) ai = pick;
    }
    this.mode = 'solo';
    this.localGame = new Game(this.selectedHeroes, ai);
    window.G = this.localGame;
    this.$log.innerHTML = '';
    this.logSeq = 0;
    this.resetFxState();
    this.showBoard();
    this.localGame.start();
    this.render();
  },

  showBoard() {
    document.getElementById('setup').style.display = 'none';
    document.getElementById('board').classList.add('on');
  },

  /* ==================== 房间操作 ==================== */
  /** 连上之后再执行动作；没连上就先连、等最多 5 秒 */
  withConn(fn) {
    if (Net.connected) { fn(); return; }
    this.toast('正在连接服务器…');
    Net.connect();
    const t0 = Date.now();
    const tick = () => {
      if (Net.connected) { fn(); return; }
      if (Date.now() - t0 > 5000) { this.toast('连接服务器超时，请检查地址与端口'); return; }
      setTimeout(tick, 120);
    };
    tick();
  },

  nickname() {
    if (!this._nick) {
      const A = '甲乙丙丁戊己庚辛壬癸';
      this._nick = '使君' + A[Math.floor(Math.random() * A.length)] + (10 + Math.floor(Math.random() * 90));
    }
    return this._nick;
  },

  netCreate() { this.withConn(() => Net.send('create_room', { nickname: this.nickname() })); },

  netJoin() {
    const code = (document.getElementById('roomInput').value || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{6}$/.test(code)) { this.toast('请输入 6 位房号'); return; }
    this.withConn(() => Net.send('join_room', { roomId: code, nickname: this.nickname() }));
  },

  netMatch() { this.withConn(() => Net.send('match', { nickname: this.nickname() })); },

  copyRoom() {
    const code = Net.roomId || '';
    const fallback = () => this.toast(`房号：${code}`);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(() => this.toast('房号已复制')).catch(fallback);
    } else fallback();
  },

  setRoomStatus(text, cls) {
    this.$roomStatus.textContent = text;
    this.$roomStatus.className = 'roomStatus' + (cls ? ' ' + cls : '');
  },

  onRoomEntered(msg, text) {
    Net.roomId = msg.roomId;
    Net.token = msg.token;
    Net.seat = msg.seat;
    this.$roomGate.hidden = true;
    this.$roomInfo.hidden = false;
    document.getElementById('roomCodeText').textContent = msg.roomId;
    this.setRoomStatus(`${text}（你是座位 ${msg.seat + 1}）`, 'ok');
    this.validateSetup();
  },

  onRoomClosed(text) {
    if (this.mode !== 'net') return;
    Net.forget();
    this.$roomGate.hidden = false;
    this.$roomInfo.hidden = true;
    this.setRoomStatus(text, 'warn');
    // 对局进行中房间没了 → 退回大厅
    if (document.getElementById('board').classList.contains('on')) {
      document.getElementById('board').classList.remove('on');
      document.getElementById('setup').style.display = '';
      this.snap = null;
      this.localGame = null;
    }
    this.validateSetup();
  },

  /** 开新局前清空特效追踪，否则第一帧会把「从无到有」当成掉血/觉醒播一遍 */
  resetFxState() {
    this._prev = {};
    this._prevHp = {};
    this._deltas = { hp: {}, awaken: {} };
    this._pending = [];
    this._pulseT = null;
    // 待选目标的 document 监听器也要摘掉，否则跨局残留
    if (this._armHandler) {
      document.removeEventListener('click', this._armHandler, true);
      this._armHandler = null;
    }
    this.armed = null;
  },

  onGameStart(msg) {
    this.mode = 'net';
    this.localGame = null;
    this.snap = null;
    this.logSeq = 0;
    this.upgradeTurn = this.attackTurn = -1;
    this.resetFxState();
    this.$log.innerHTML = '';
    this.showBoard();
    this.toast(msg.seat === 0 ? '对局开始 —— 你先手' : '对局开始 —— 对手先手');
  },

  /* ==================== 联机状态 ==================== */
  onNetState(msg) {
    // 还没开局：只是房间状态更新
    if (!msg.started) { this.readyFlags = msg.ready; this.validateSetup(); return; }

    if (this.mode !== 'net') this.mode = 'net';
    if (!document.getElementById('board').classList.contains('on')) this.showBoard();

    const wasMine = this.snap ? (this.snap.activeIdx === this.snap.you && !this.snap.over) : false;
    this.snap = msg;
    this.consumeLog(msg);

    const isMine = msg.activeIdx === msg.you && !msg.over;
    if (isMine && !wasMine) {
      this.upgradeTurn = this.attackTurn = -1;   // 新一轮，本回合的次数限制重置
      this.toast('轮到你行动');
    }
    this.render();
  },

  /**
   * 服务端只推最近 60 条日志，但 logSeq 是累计条数 —— 靠差值算出「这次新增了哪几条」。
   * 比按数组长度diff稳，日志满 60 条之后也不会出错。
   */
  consumeLog(msg) {
    const total = msg.logSeq || 0;
    const freshCount = Math.max(0, total - this.logSeq);
    this.logSeq = total;
    if (!freshCount || !msg.log || !msg.log.length) return;

    const fresh = msg.log.slice(-Math.min(freshCount, msg.log.length));
    const oppName = this.foe() ? this.foe().name : '';
    for (const line of fresh) {
      this.pushLog(line);
      if (oppName && line.text.indexOf(oppName) === 0) this.reactToOpponent(line);
    }
  },

  /** 对手每做一件事：战斗区弹提示条；涉及名士的伤害/治疗/气绝再闪一下那个人 */
  reactToOpponent(line) {
    // 「抽了 1 张牌」这类例行日志只进右侧战报，不弹战场提示，否则一直闪
    const routine = line.kind === 'sys' && line.text.indexOf('进入战斗区') < 0;
    if (!routine) this.banner(line.text);
    // 攻击 / 反击：从战报文本还原攻守双方，打一道光刃过去
    if (line.kind === 'dmg') this.attackFxFromText(line.text);
    if (line.kind !== 'dmg' && line.kind !== 'heal' && line.kind !== 'kill') return;
    for (const pv of [this.foe(), this.me()]) {
      const hit = pv.heroes.find(h => line.text.indexOf(h.name) >= 0);
      if (hit) { this.pulseHero(pv.idx, hit.id); return; }
    }
  },

  /** 让某个名士闪一下。键用 "座位:名士id" —— 双方都带李白时，只用 id 会闪错人 */
  pulseHero(ownerIdx, id) {
    this.retrigger(document.querySelector(`[data-key="${ownerIdx}:${id}"]`), 'pulse', 700);
  },

  onGameOver(msg) {
    const me = this.snap ? this.snap.you : (Net.seat == null ? 0 : Net.seat);
    if (msg.winner === null || msg.winner === undefined) { this.showOver(false); return; }
    const iWon = msg.winner === me;
    if (msg.reason === 'opponent_left') this.log('对手离开了对局', 'sys');
    else if (msg.reason === 'reconnect_timeout') this.log('对手重连超时', 'sys');
    this.showOver(iWon);
  },

  onNetError(msg) {
    const code = msg.code;
    if (code === 'bad_deck') this.pendingReady = false;
    if (code === 'bad_token' || code === 'no_such_room' || code === 'seat_taken') Net.forget();
    this.toast(msg.message || code);
    this.validateSetup();
  },

  setConn(state, text) {
    const bar = document.getElementById('connBar');
    if (!bar) return;
    if (state === 'ok') { bar.hidden = true; return; }
    bar.hidden = false;
    bar.textContent = text || (state === 'connecting' ? '正在连接服务器…' : '连接中断，正在重连…');
  },

  /* ==================== 渲染（两种模式共用） ==================== */
  me() { return this.snap.players[this.snap.you]; },
  foe() { return this.snap.players[1 - this.snap.you]; },

  /**
   * 对比上一帧，找出掉血的名士和刚觉醒的名士。
   * 键用 "座位:名士id" —— 双方可能选到同一名士（比如都带李白），只用 id 会串。
   * 首次见到某名士时只记录不触发，否则刚开局或重连回来会满屏乱闪。
   */
  computeDeltas(s) {
    const out = { hp: {}, awaken: {} };
    for (const pv of s.players) {
      for (const h of pv.heroes) {
        const key = pv.idx + ':' + h.id;
        const prev = this._prev[key];
        if (prev) {
          if (h.hp < prev.hp) out.hp[key] = true;
          if (h.awakened && !prev.awakened) out.awaken[key] = true;
        }
        this._prev[key] = { hp: h.hp, awakened: h.awakened };
      }
    }
    return out;
  },

  /** 给元素挂一次动画类（先移除再强制重排，保证连续触发也能重放） */
  retrigger(el, cls, ms) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), ms);
  },

  /**
   * 渲染入口。渲染出错不能把调用方一起带崩 —— 引擎的每个动作、
   * Net 的每条 state 都在调它，一帧画不出来下一帧还能补上。
   */
  render() {
    try {
      this.renderFrame();
      // 回合交替音：放在渲染之后，此时 this.snap 已是新快照
      const turn = this.snap && this.snap.turn;
      if (turn !== undefined && turn !== this._lastTurn) {
        if (this._lastTurn !== undefined) AUDIO.play('turn');
        this._lastTurn = turn;
      }
    } catch (err) {
      console.error('[UI] 渲染出错（跳过这一帧）：', err);
    }
  },

  renderFrame() {
    if (this.mode === 'solo') {
      if (!this.localGame) return;
      this.snap = VIEW.snapshot(this.localGame, 0);   // 单机每帧重建快照，和联机共用一套渲染
    }
    const s = this.snap;
    if (!s) return;

    // 先算出这一帧「谁掉血了 / 谁刚觉醒」，再开始画。
    // 不能放在 heroEl 里算：同一名士一次渲染会被画两遍（名士行 + 战斗区），
    // 第二个元素会以为「状态没变」而丢掉特效标记。
    this._deltas = this.computeDeltas(s);

    const me = this.me(), foe = this.foe();
    this.renderLord(foe, 'foe');
    this.renderLord(me, 'my');
    this.renderHeroRow(document.getElementById('foeHeroes'), foe, false);
    this.renderDestiny('foeDestiny', foe);
    this.renderHeroRow(document.getElementById('myHeroes'), me, true);
    this.renderDestiny('myDestiny', me);
    this.renderCombat();
    this.renderHand();

    const myTurn = s.activeIdx === s.you && !s.over;
    const btn = document.getElementById('endTurn');
    btn.disabled = !myTurn || (this.mode === 'net' && !Net.connected);
    btn.textContent = s.over ? '对 局 结 束' : (myTurn ? '结 束 回 合' : '对 方 回 合…');
    document.getElementById('myDeck').textContent = me.deckCount;

    this.playPendingFx();   // DOM 已更新，可以量位置了
  },

  /** 天命区：已打出的天命牌。成员气绝时整块变灰 —— 效果是暂停不是失效，复活后恢复 */
  renderDestiny(id, pv) {
    const box = document.getElementById(id);
    box.innerHTML = '';
    const list = pv.destinyZone || [];
    box.hidden = !list.length;
    if (!list.length) return;

    const label = document.createElement('span');
    label.className = 'dzLabel';
    label.textContent = '天命';
    box.appendChild(label);

    for (const d of list) {
      const el = document.createElement('span');
      el.className = 'dz' + (d.active ? '' : ' paused');
      el.title = `${d.name}：${d.text}${d.active ? '' : '（成员气绝，已暂停）'}`;
      el.innerHTML = '<svg aria-hidden="true"><use href="#g-tianming"/></svg><span>' + d.name + '</span>';
      box.appendChild(el);
    }
  },

  renderLord(pv, side) {
    document.getElementById(side + 'Hp').innerHTML = `${pv.lordHp}<small>/${RULES.lordHp}</small>`;
    document.getElementById(side + 'HpFill').style.width = Math.max(0, pv.lordHp / RULES.lordHp * 100) + '%';

    // 使君掉血 → 血条红光闪烁
    const key = 'lord:' + side;
    const prev = this._prevHp[key];
    this._prevHp[key] = pv.lordHp;
    if (prev !== undefined && pv.lordHp < prev) {
      this.retrigger(document.getElementById(side + 'HpTrack'), 'flash', 620);
    }

    const zy = document.getElementById(side + 'Zy');
    zy.innerHTML = '';
    const cap = Math.max(RULES.zhenyuanPerTurn, pv.zhenyuan);
    for (let i = 0; i < cap; i++) {
      const i2 = document.createElement('i');
      i2.className = 'pip' + (i < pv.zhenyuan ? ' on' : '');
      zy.appendChild(i2);
    }
  },

  heroEl(h, mine, ownerIdx) {
    const el = document.createElement('div');
    el.dataset.hero = h.id;
    el.className = `hero ${mine ? 'my' : 'foe'} r-${h.rarity}`;
    if (!h.alive) el.classList.add('dead');
    if (h.inCombat) el.classList.add('combat');

    const pct = Math.max(0, h.hp / h.maxHp * 100);
    const tags = [];
    for (const [k, v] of Object.entries(h.stacks || {})) {
      const st = config.stacks[k];
      if (!st || !v) continue;
      tags.push(`<span class="tg ${st.hostile ? 'debuff' : 'stack'}">${st.name}×${v}</span>`);
    }
    if (h.permPower) tags.push(`<span class="tg buff">力+${h.permPower}</span>`);
    if (h.turnPower) tags.push(`<span class="tg buff">力${h.turnPower > 0 ? '+' : ''}${h.turnPower}·本回合</span>`);
    if (h.turnReduce) tags.push(`<span class="tg buff">减伤${h.turnReduce}</span>`);
    if (h.statuses && h.statuses.cannotAttack) tags.push(`<span class="tg status">无法出击</span>`);
    if (h.statuses && h.statuses.cannotPlaySpell) tags.push(`<span class="tg status">无法施法</span>`);

    // 天命徽记：这个名士参与了几组羁绊就画几枚方胜印，气绝暂停时变灰
    const tmBadges = (h.tianMing && h.tianMing.length)
      ? '<span class="tmWrap">' + h.tianMing.map(x =>
          `<span class="tm${x.active ? '' : ' paused'}" title="${x.name}（与${x.partner}）：${x.text}">` +
          '<svg aria-hidden="true"><use href="#g-tianming"/></svg></span>').join('') + '</span>'
      : '';

    el.innerHTML = `
      ${tmBadges}
      ${h.awakened ? '<span class="awakened">觉醒</span>' : ''}
      <div class="hTop">${this.avatarHTML(h)}<span class="nm">${h.name}</span><span class="lv">Lv.${h.level}</span></div>
      <div class="roleTag">${h.rarity} · ${h.role}</div>
      <div class="stats">
        <span class="st pw"><span class="k">力</span><span class="v">${h.power}</span></span>
        <span class="st hp"><span class="k">命</span><span class="v">${h.hp}</span></span>
      </div>
      <div class="hpBar"><i style="width:${pct}%"></i></div>
      <div class="tags">${tags.join('')}</div>
      ${!h.alive ? `<div class="deadTag">气绝 · ${h.faintTimer}</div>` : ''}`;

    // ---- 特效 ----
    const key = ownerIdx + ':' + h.id;
    el.dataset.key = key;
    if (this._deltas.hp[key]) this.retrigger(el.querySelector('.hpBar'), 'flash', 620);
    if (this._deltas.awaken[key]) {
      this.retrigger(el, 'awakening', 1500);
      // 觉醒动画要量元素位置，必须等它插进文档之后再播 —— 名字相同的名士只排一次
      if (!this._pending.some(x => x.key === key)) {
        this._pending.push({ type: 'awaken', key, name: h.name });
      }
    }
    if (h.awakened) el.classList.add('awakenedHero');   // 觉醒后常驻暗金描边

    if (mine && h.alive) {
      const s = this.snap;
      const myTurn = s && s.activeIdx === s.you && !s.over;
      el.draggable = !!myTurn;
      el.addEventListener('dragstart', ev => {
        if (!myTurn) { ev.preventDefault(); return; }
        ev.dataTransfer.setData('text/plain', h.id);
        el.classList.add('dragging');
        document.getElementById('arena').classList.add('drop');
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('dragging');
        document.getElementById('arena').classList.remove('drop');
      });
      el.onclick = () => {
        if (!myTurn) { this.toast('不是你的回合'); return; }
        // 出击已包含上场：不论在准备区还是战斗区，点一下都是「出击」
        this.dispatch('attack', { heroId: h.id });
      };
    }
    return el;
  },

  renderHeroRow(container, pv, mine) {
    container.innerHTML = '';
    for (const h of pv.heroes) container.appendChild(this.heroEl(h, mine, pv.idx));
    if (!mine) return;
    // 可升级时在名士卡下方挂一个升级按钮
    for (const el of container.children) {
      const h = pv.heroes.find(x => x.id === el.dataset.hero);
      if (!h || !h.alive || this.canUpgradeHero(h) !== null) continue;
      const b = document.createElement('span');
      b.className = 'tg';
      b.style.cssText = 'position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);' +
        'cursor:pointer;background:#e6e2d6;color:#5a5245;border-color:#c6c2b4';
      b.textContent = '↑ 升级';
      b.onclick = ev => { ev.stopPropagation(); this.dispatch('upgrade', { heroId: h.id }); };
      el.appendChild(b);
    }
  },

  renderCombat() {
    const me = this.me(), foe = this.foe();
    for (const [id, pv] of [['foeCombat', foe], ['myCombat', me]]) {
      const slot = document.getElementById(id);
      slot.innerHTML = '';
      const h = pv.heroes.find(x => x.inCombat) || null;
      slot.classList.toggle('empty', !h);
      if (h) slot.appendChild(this.heroEl(h, pv.idx === this.snap.you, pv.idx));
    }

    const arena = document.getElementById('arena');
    if (arena.dataset.bound) return;
    arena.dataset.bound = '1';
    arena.addEventListener('dragover', ev => ev.preventDefault());
    arena.addEventListener('drop', ev => {
      ev.preventDefault();
      arena.classList.remove('drop');
      const s = this.snap;
      if (!s || s.over || s.activeIdx !== s.you) { this.toast('不是你的回合'); return; }
      const h = this.me().heroes.find(x => x.id === ev.dataTransfer.getData('text/plain'));
      if (!h || !h.alive) return;
      // 拖到战斗区 = 出击（出击自带上场），一条意图即可
      this.dispatch('attack', { heroId: h.id });
    });
  },

  renderHand() {
    const box = document.getElementById('myHand');
    box.innerHTML = '';
    box.classList.toggle('armed', !!this.armed);
    for (const c of this.snap.hand) {
      const reason = this.canPlayCard(c);
      const el = document.createElement('div');
      el.className = `card c-${c.type}` + (reason ? ' unplay' : '');
      const kws = (c.keywords || []).map(k => `<span class="kw">【${k}】</span>`).join('');
      el.innerHTML = `
        <div class="cHead">
          <span class="cShape t-${c.type}">${TYPE_SHAPE[c.type] || '◆'}</span>
          <span class="cName">${c.name}</span>
          <span class="cCost">${[0, 1, 2].map(i => `<i class="${i < c.cost ? 'on' : ''}"></i>`).join('')}</span>
        </div>
        <div class="cSub"><span class="t-${c.type}">${TYPE_CN[c.type] || c.type}</span>
          <span>Lv.${c.level}</span><span>${c.owner || '羁绊'}</span></div>
        <div class="cTxt">${kws}${c.text}</div>
        <div class="cFoot">${reason ? '⚠ ' + reason : '可打出'}</div>`;
      // 卡名过长时卡面会用省略号截断（手牌卡只有 128px 宽，7 字名在可读字号下放不下），
      // 悬停提示里带上全名，信息不丢。
      el.title = c.name + '\n' + c.text;
      el.onclick = () => this.onCardClick(c, reason);
      box.appendChild(el);
    }
  },

  /* ==================== 合法性：只是客户端预判 ==================== */
  /**
   * 单机模式直接问引擎；联机模式按快照做本地近似判断，只用于置灰卡面。
   * 真正的裁决永远在服务端 —— 判错了顶多是多弹一个 toast。
   */
  /**
   * 出牌是否合法。裁决**全部来自引擎**：快照里的 card.playable 就是引擎 canPlay 的结果
   * （单机模式每帧重建快照，联机模式用服务端推来的那份）。
   * 客户端不再自己重写一套判断 —— 之前那么做，只要和引擎有一点出入，就会变成
   * 「客户端说能打 → 服务端拒绝 → 客户端仍认为能打」的死循环，而且重发快照也救不回来。
   */
  canPlayCard(card) {
    if (this.mode === 'net' && !Net.connected) return '连接中断';
    return card.playable || null;
  },

  canUpgradeHero(h) {
    const s = this.snap;
    if (s.over) return '对局已结束';
    if (s.activeIdx !== s.you) return '不是你的回合';
    if (!h.alive) return '名士已气绝';
    if (h.level >= 3) return '已满级';
    const target = h.level + 1;
    // 与引擎 Game.canUpgrade 同一条规则：气绝的名士不计入前置。
    // 这份是重复实现，而且它在最前面就 return —— 不同步改的话，引擎放行了按钮也不会渲染。
    if (!this.me().heroes.filter(x => x.alive).every(x => x.level >= target - 1)) {
      return `需存活名士全员达到 ${target - 1} 级`;
    }

    if (this.mode === 'net') {
      if (!Net.connected) return '连接中断';
      if (this.upgradeTurn === s.turn && this.upgradedSeat === s.you) return '本回合已升级过';
      return null;
    }
    const g = this.localGame, p = g.players[0];
    const local = p.heroes.find(x => x.id === h.id);
    return local ? g.canUpgrade(p, local) : '名士不在场';
  },

  canAttackHero(h) {
    const s = this.snap;
    if (s.over) return '对局已结束';
    if (s.activeIdx !== s.you) return '不是你的回合';
    if (!h.alive) return '名士已气绝';
    if (!h.inCombat) return '需先进入战斗区';
    if (h.statuses && h.statuses.cannotAttack) return '本回合无法出击';

    if (this.mode === 'net') {
      if (!Net.connected) return '连接中断';
      if (this.attackTurn === s.turn && this.attackedSeat === s.you) return '本回合已出击';
      return null;
    }
    const g = this.localGame, p = g.players[0];
    const local = p.heroes.find(x => x.id === h.id);
    return local ? g.canAttack(p, local) : '名士不在场';
  },

  /* ==================== 动作派发 ==================== */
  dispatch(type, payload) {
    const s = this.snap;
    payload = payload || {};
    if (!s || s.over) return false;
    if (s.activeIdx !== s.you) { this.toast('不是你的回合'); return false; }

    if (this.mode === 'solo') {
      const g = this.localGame, p = g.players[0];
      const h = payload.heroId ? p.heroes.find(x => x.id === payload.heroId) : null;
      if (type === 'upgrade') return g.upgrade(p, h);
      if (type === 'attack') { const hero = h || p.combatHero; return hero ? g.attack(p, hero) : false; }
      if (type === 'end_turn') { if (g.busy) return false; g.endTurn(); return true; }
      return false;
    }

    // 联机：只发意图，结算全在服务端
    if (!Net.connected) { this.toast('连接中断，无法操作'); return false; }
    if (type === 'upgrade') { this.upgradeTurn = s.turn; this.upgradedSeat = s.you; }
    if (type === 'attack') { this.attackTurn = s.turn; this.attackedSeat = s.you; }
    return Net.send(type, payload);
  },

  /* ==================== 出牌 ==================== */
  onCardClick(card, reason) {
    if (reason) { this.toast(reason); return; }
    if (card.target !== 'allyAny' && card.target !== 'enemyAny') { this.doPlay(card, null, null); return; }

    this.armed = card;
    this.toast('请点击一名友方名士作为目标');
    this.render();

    // 上一次待选还没落地就又点了张牌 → 先摘掉旧监听。
    // 不摘的话每点一次就多绑一个 document 捕获监听器，整局攒下来是实打实的泄漏。
    if (this._armHandler) {
      document.removeEventListener('click', this._armHandler, true);
      this._armHandler = null;
    }

    const handler = ev => {
      const el = ev.target.closest('[data-hero]');
      if (!el || !this.snap) return;
      const h = this.me().heroes.find(x => x.id === el.dataset.hero);
      if (!h || !h.alive) return;
      ev.stopPropagation();          // 别让名士自己的点击（站位/出击）跟着触发
      ev.preventDefault();
      document.removeEventListener('click', handler, true);
      this._armHandler = null;
      this.armed = null;
      try {
        this.doPlay(card, h, el);
        this.render();
      } catch (err) {
        console.error('[UI] 选定目标后出牌出错：', err);
      }
    };
    this._armHandler = handler;
    document.addEventListener('click', handler, true);
  },

  doPlay(card, chosenHero, targetEl) {
    const src = [...document.querySelectorAll('#myHand .card')]
      .find(el => el.querySelector('.cName').textContent === card.name);
    const dest = targetEl
      || document.querySelector('#myCombat [data-hero], #myCombat')
      || document.getElementById('arena');
    if (src) this.fly(src, dest, { gold: card.type === 'awaken' });   // 觉醒牌飞的时候带金光
    // 技能特效打在落点上，四种卡型四种表现
    const dr = dest && dest.getBoundingClientRect ? dest.getBoundingClientRect() : null;
    this.cardFx(card, dr && dr.width ? { x: dr.left + dr.width / 2, y: dr.top + dr.height / 2 } : null);

    if (this.mode === 'solo') {
      setTimeout(() => {
        try {
          const g = this.localGame, p = g.players[0];
          const local = p.hand.find(x => x.id === card.id);
          if (!local) return;
          const chosen = chosenHero ? p.heroes.find(x => x.id === chosenHero.id) : null;
          g.playCard(p, local, pickCaster(p.heroes, local), chosen);
        } catch (err) {
          console.error('[UI] 出牌失败：', err);
        }
      }, 130);
      return;
    }
    const payload = { cardId: card.id };
    if (chosenHero) payload.targetHeroId = chosenHero.id;
    setTimeout(() => Net.send('play_card', payload), 130);
  },

  /* ==================== 表现 ==================== */
  /**
   * 卡牌从手牌飞向战场。opts.gold = 觉醒牌，飞行途中带金色光效。
   * 抛物线靠三段关键帧实现：直线位移 + 中间帧上抬，看起来就是一道弧。
   */
  fly(fromEl, toEl, opts) {
    opts = opts || {};
    const a = fromEl.getBoundingClientRect();
    const target = toEl || document.getElementById('arena');
    const b = target.getBoundingClientRect();

    const ghost = fromEl.cloneNode(true);
    ghost.classList.add('ghost');
    if (opts.gold) ghost.classList.add('gold');
    Object.assign(ghost.style, {
      left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px',
    });
    document.body.appendChild(ghost);

    const dx = b.left + b.width / 2 - (a.left + a.width / 2);
    const dy = b.top + b.height / 2 - (a.top + a.height / 2);
    // 弧度随水平距离变化，但夹在一个区间里，免得近距离飞得像蹦极、远距离又看不出弧
    const lift = Math.max(52, Math.min(118, Math.abs(dx) * 0.26 + 44));

    const anim = ghost.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1, offset: 0 },
      { transform: `translate(${dx * .5}px,${dy * .5 - lift}px) scale(.86) rotate(-7deg)`, opacity: 1, offset: .5 },
      { transform: `translate(${dx}px,${dy}px) scale(.5) rotate(-14deg)`, opacity: 0, offset: 1 },
    ], { duration: 520, easing: 'cubic-bezier(.34,.06,.28,1)' });

    // onfinish 只在动画自然播完时触发；被 cancel（切标签页、元素被移除、动画被打断）时不会。
    // 只挂 onfinish 的话，ghost 会永久留在 DOM 里 —— 每一张被打断的牌泄漏一个节点。
    const dropGhost = () => ghost.remove();
    anim.onfinish = dropGhost;
    anim.oncancel = dropGhost;

    // 落地瞬间晕开一团墨
    this.inkSplash(b.left + b.width / 2, b.top + b.height / 2, opts.gold);
  },

  /** 落点水墨扩散：一个径向渐变的圆迅速放大并淡出；觉醒牌用金色 */
  inkSplash(x, y, gold) {
    const d = document.createElement('div');
    d.className = 'ink';
    const size = gold ? 136 : 112;
    d.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;` +
      (gold ? 'background:radial-gradient(circle, rgba(168,135,62,.9) 0%, rgba(168,135,62,.45) 40%, rgba(168,135,62,0) 72%);' : '');
    d.style.animation = 'inkSpread .55s ease-out forwards';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 700);
  },

  floatOn(sel, val, color) {
    const el = document.querySelector(sel);
    if (!el) return;
    const r = el.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'float';
    d.textContent = (val > 0 ? '-' : '') + Math.abs(val);
    d.style.cssText += `left:${r.left + r.width / 2 - 12}px;top:${r.top - 6}px;color:${color}`;
    d.style.animation = 'rise .6s ease-out forwards';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 700);
  },

  banner(text) {
    const b = document.getElementById('banner');
    if (!b) return;
    // 对手出牌的播报文本里带「使用了《》」—— 给它一个比自己出牌更闷的声音，便于分辨
    if (text && text.indexOf('使用了《') >= 0) AUDIO.play('draw');
    b.textContent = text;
    b.classList.add('on');
    clearTimeout(this._bt);
    this._bt = setTimeout(() => b.classList.remove('on'), 1200);
  },

  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(this._tt);
    this._tt = setTimeout(() => t.classList.remove('on'), 1600);
  },

  log(text, kind) { this.pushLog({ text, kind: kind || 'sys', turn: this.snap ? this.snap.turn : 0 }); },

  pushLog(line) {
    if (!this.$log) return;
    const d = document.createElement('div');
    d.className = 'ln ' + (line.kind || 'sys');
    d.textContent = line.text;
    this.$log.appendChild(d);
    this.$log.scrollTop = this.$log.scrollHeight;
    while (this.$log.children.length > 300) this.$log.removeChild(this.$log.firstChild);
  },

  showOver(won) {
    // 胜、败各一个音效：结算这个时刻最该一听就知道结果，不用先看弹窗上的字。
    AUDIO.play(won ? 'win' : 'lose');
    const o = document.getElementById('over');
    o.className = 'on ' + (won ? 'win' : 'lose');
    document.getElementById('overTitle').textContent = won ? '使君胜利' : '使君败北';
    document.getElementById('overSub').textContent =
      won ? '敌方使君已然倒下。' : '我方使君已然倒下。';
  },
};

/* 调试开关：打开页面时 URL 加 ?debug=1，引擎日志与 WebSocket 收发日志都打到控制台。
   例：春秋弈.html?debug=1&server=ws://192.168.1.7:8080 */
if (/[?&]debug=1/.test(location.search)) {
  Game.DEBUG = true;
  Net._debug = true;
  console.log('[百闻] 调试日志已开启：引擎结算 + WebSocket 收发');
}

UI.init();
UI.showIntro();     // 开场动画；播完自动打开使用说明，之后可从「说明」按钮重看
</script>
