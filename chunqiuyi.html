const { config, heroes: HERO_DATA, cards: CARD_DATA, bonds: BOND_DATA } = GAME_DATA;
const HERO_LIST = HERO_DATA.heroes;

/* ---------- 可调规则（规格要求固定 3 真元；改这两行即可切回规则文档 v0.1） ---------- */
const RULES = {
  lordHp: 30,
  zhenyuanPerTurn: 3,      // 规格：每回合 3 点。规则文档 v0.1 为 min(回合数, 4)
  attackCost: 1,           // 出击耗 1 真元。原为 0；实测直接改成 1 会让 AI 把真元全花在
                           // 卡牌上、整局不出击（对局拖到 40 回合以上），所以同一版里给
                           // SimpleAI 补了出击预留（reserveZY）与排序权重，让它先留这 1 点。
  attacksPerTurn: 1,       // 每回合只允许一名名士「主动出击」（玩家点击发起的那种）。
                           // 战斗牌的立即出击走 ATTACK_NOW / isCardAttack，既不受此限、
                           // 也不耗真元 —— 这就是「技能牌造成的出场不受限制」。
  upgradesPerTurn: 1,      // 规格未提；沿用规则文档。去掉会让升级在第 1 回合就失去意义
  handLimit: 8,
  startHandFirst: 4,
  startHandSecond: 5,
  faintTurns: 3,
  fatigueStart: 1,
  destinyCap: 3,
  deckCardsPerHero: 8,
  aiThinkMs: 1000,         // AI 每步之间的思考延迟。调小可加快对局（一回合约 6~10 步）
  logKeep: 400,            // 战报最多保留多少条（超出丢最老的，防止长对局内存一直涨）
};

/* ==========================================================================
   通用工具
   ========================================================================== */
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const TYPE_CN = { combat: '战斗', spell: '法术', awaken: '觉醒', destiny: '天命' };
const TYPE_SHAPE = { combat: '▲', spell: '▰', awaken: '◠', destiny: '❖' };

/* ==========================================================================
   Card —— 卡牌（薄封装，字段直接来自 data/cards.json）
   ========================================================================== */
class Card {
  constructor(def) {
    Object.assign(this, clone(def));   // 注意：shape/type 等字段来自数据，展示用的派生值另起名字
  }
  get typeCN() { return TYPE_CN[this.type] || this.type; }
  get glyph() { return TYPE_SHAPE[this.type] || '◆'; }
  has(kw) { return (this.keywords || []).includes(kw); }
}

/* ==========================================================================
   MingShi —— 名士
   ========================================================================== */
class MingShi {
  constructor(def, owner) {
    this.id = def.id;
    this.name = def.name;
    this.rarity = def.rarity;
    this.role = def.role;
    this.basePower = def.basePower;
    this.baseHealth = def.baseHealth;
    this.mechanic = def.mechanic;
    this.owner = owner;

    this.level = 1;
    this.permPower = 0;      // 永久力量增益
    this.permHp = 0;         // 永久生命上限增益
    this.turnPower = 0;      // 本回合力量增益
    this.turnReduce = 0;     // 本回合减伤
    this.stacks = {};        // { jianyi: 2, ... }
    this.statuses = {};      // { cannotAttack: true }
    this.zone = 'prep';      // prep | combat | faint
    this.faintTimer = 0;
    this.awakened = false;
    this.tianMing = [];            // 该名士参与的天命羁绊，由 Player.bindBond 填充
    this.attacksThisTurn = 0;      // 本次出击已用次数（普通出击用）
    this.attackedThisTurn = false; // 本回合是否出击过（含卡牌出击）
    this.hp = this.maxHp;
  }

  get maxHp() { return this.baseHealth + this.permHp; }
  get alive() { return this.zone !== 'faint'; }
  get inCombat() { return this.zone === 'combat'; }

  /** 有效力量 = 基础 + 永久 + 本回合 + 层数加成 */
  get power() {
    let p = this.basePower + this.permPower + this.turnPower;
    for (const [k, v] of Object.entries(this.stacks)) {
      const st = config.stacks[k];
      if (st && st.powerPerStack) p += st.powerPerStack * v;
    }
    return Math.max(0, p);
  }

  /** 受到伤害时的减免量（层数护甲 + 本回合减伤） */
  get damageReduce() {
    let r = this.turnReduce;
    for (const [k, v] of Object.entries(this.stacks)) {
      const st = config.stacks[k];
      if (st && st.damageReducePerStack) r += st.damageReducePerStack * v;
    }
    return r;
  }

  /** 受到伤害时的额外加成（讽喻等敌方施加的标记） */
  get damageTakenBonus() {
    let b = 0;
    for (const [k, v] of Object.entries(this.stacks)) {
      const st = config.stacks[k];
      if (st && st.damageTakenBonusPerStack) b += st.damageTakenBonusPerStack * v;
    }
    return b;
  }

  stackCount(id) { return this.stacks[id] || 0; }

  /**
   * 生命上限变化后必须调一次：把当前生命夹回上限以内。
   *
   * 不夹的后果不止是「血条画出框外」—— 治疗量算的是 `maxHp - hp`，
   * 血量超过上限时这个差值变负数，`healHero` 直接 return，**这个名士再也治不回来**。
   * 触发路径有三条：负的 BUFF_HP、CLEAR_BUFFS（焚书坑儒）、觉醒时上限反而变小。
   */
  clampHp() {
    if (this.hp > this.maxHp) this.hp = this.maxHp;
    else if (this.hp < 0) this.hp = 0;
    return this.hp;
  }

  addStack(id, val, max) {
    const def = config.stacks[id];
    const cap = max != null ? max : (def ? def.max : 99);
    const before = this.stackCount(id);
    this.stacks[id] = Math.min(cap, before + val);
    return this.stacks[id] - before;
  }

  /**
   * 回合开始时的重置：只清「本回合的行动次数」。
   *
   * 「本回合的力量 / 减伤 / 状态」**不在这里清** —— 它们可能是上一回合贴到这名
   * 名士身上的（《八阵图》《可怜白发生》《锦瑟》…），必须活到他自己这一回合结束。
   * 本函数在 Game.beginTurn 里对「当前行动方」调用；如果连状态一起清，对手的回合
   * 才刚开始、谁都还没出击，贴在他名士身上的「无法出击」就已经没了。
   */
  clearTurnState() {
    this.attacksThisTurn = 0;
    this.attackedThisTurn = false;
  }

  /**
   * 清掉本名士名下所有「本回合」的东西：临时力量 / 减伤 / 状态。
   * **只在它的主人结束回合时调用**（Game.endTurn），于是：
   *   - 贴给自己的 → 本回合结束就没了（《观星》）；
   *   - 贴给对手的 → 留到对手自己的回合结束才失效（《八阵图》）。
   * 出牌只可能发生在出牌者自己的回合（Game.canPlay），所以「本回合」= 被贴名士
   * 自己的下一个回合 —— 这一条就够表达归属，不需要在状态里记回合号。
   * 另一处调用点是 faint()：气绝的名士不该把过期状态带进复活后的回合。
   */
  clearTurnMods() {
    this.turnPower = 0;
    this.turnReduce = 0;
    this.statuses = {};
  }

  /** 出战区的显示信息（供 UI 与日志用） */
  get label() { return `${this.name}(力${this.power}/命${Math.max(0, this.hp)})`; }
}

/* ==========================================================================
   Player —— 牌手
   ========================================================================== */
class Player {
  constructor(name, isHuman, heroDefs, game) {
    this.name = name;
    this.isHuman = isHuman;
    this.game = game;
    this.lordHp = RULES.lordHp;
    this.zhenyuan = 0;
    this.heroes = heroDefs.map(d => new MingShi(d, this));
    this.deck = [];
    this.hand = [];
    this.discard = [];
    this.destinyZone = [];
    this.bonds = [];
    this.listeners = [];
    this.upgradesThisTurn = 0;
    this.attacksThisTurn = 0;   // 玩家级的「主动出击」已用次数（区别于名士级的同名计数）
    this.fatigue = 0;
    this.activateBonds();   // 必须先激活羁绊，天命牌才入池
    this.buildDeck();
  }

  get foe() { return this.game.players[1 - this.game.players.indexOf(this)]; }
  get aliveHeroes() { return this.heroes.filter(h => h.alive); }
  get combatHero() { return this.heroes.find(h => h.inCombat) || null; }

  buildDeck() {
    const pool = [];
    for (const h of this.heroes) {
      const own = CARD_DATA.filter(c => c.owner === h.name).slice(0, RULES.deckCardsPerHero);
      own.forEach(c => pool.push(new Card(c)));
    }
    // 天命牌：羁绊激活后自动入池（规则文档第 3.4 节，天命牌是独立卡池）
    for (const b of this.bonds) {
      const d = BOND_DATA.destinyCards.find(d => d.bond === b.id);
      if (d) pool.push(new Card(d));
    }
    this.deck = shuffle(pool);
  }

  /** 羁绊检测（模块 9 BondChecker）：阵容快照 → 自动激活 */
  activateBonds() {
    const names = this.heroes.map(h => h.name);
    for (const b of BOND_DATA.bonds) {
      if (b.members.every(m => names.includes(m))) this.bonds.push(b);
    }
  }

  heroByName(n) { return this.heroes.find(h => h.name === n) || null; }

  /**
   * 羁绊结算（模块 9 BondChecker）
   * 常驻型（trigger: passive）立即执行效果；触发型注册为监听器。
   * 由 Game 构造完成后统一调用 —— 此处需要 player.foe 已就绪。
   */
  bindBond(b) {
    const g = this.game;
    const ctx = {
      bondA: this.heroByName(b.members[0]),
      bondB: this.heroByName(b.members[1]),
      bond: b,
    };
    // 挂到两位名士身上 —— UI 靠 hero.tianMing 在名士卡上画天命图标
    for (const [h, mate] of [[ctx.bondA, ctx.bondB], [ctx.bondB, ctx.bondA]]) {
      if (h) h.tianMing.push({
        id: b.id, name: b.name, text: b.text, trigger: b.trigger,
        partner: mate ? mate.name : null,
      });
    }
    if (b.trigger === 'passive') {
      g.log(`羁绊激活：${b.name} —— ${b.text}`, 'turn');
      g.resolver.run(b.effects, {
        game: g, player: this, opponent: this.foe, caster: ctx.bondA,
        bondA: ctx.bondA, bondB: ctx.bondB, bond: b, mods: {},
      });
    } else {
      g.log(`羁绊待命：${b.name}（${b.trigger}）—— ${b.text}`, 'sys');
      this.listeners.push({
        trigger: b.trigger,
        once: b.once || null,
        condition: null,
        effects: b.effects,
        stackFilter: null,
        ownerExpr: b.actor || null,
        firedTurn: -1,
        sourceType: 'bond', owner: this, bond: b, ctx,
      });
    }
  }

  /** 打出天命牌：进入天命区（上限 3），满则顶替最早的一张 */
  playDestiny(card, caster) {
    const bond = this.bonds.find(b => b.id === card.bond);
    if (!bond) return false;
    const ctx = {
      bondA: this.heroByName(bond.members[0]),
      bondB: this.heroByName(bond.members[1]),
      bond, card,
    };
    if (this.destinyZone.length >= RULES.destinyCap) {
      const old = this.destinyZone.shift();
      this.listeners = this.listeners.filter(l => l.entry !== old);
    }
    const entry = { card, bond, ctx };
    this.destinyZone.push(entry);
    this.registerListeners(card.effects, { sourceType: 'destiny', owner: this, entry, ctx });
    return true;
  }

  /** 统一监听器注册（模块 8 EventBus）—— 觉醒被动与天命牌共用 */
  registerListeners(effects, meta) {
    for (const e of effects) {
      if (e.op !== 'REGISTER') continue;
      this.listeners.push({
        trigger: e.trigger,
        once: e.once || null,
        condition: e.condition || null,
        effects: e.effects,
        stackFilter: e.stack || null,
        ownerExpr: e.owner || null,   // self | bond | bondA | bondB | bondSurvivor
        firedTurn: -1,
        ...meta,
      });
    }
  }

  /** 把 ownerExpr 解析成具体名士；返回 null 表示不限定名士 */
  resolveListenerHero(l) {
    if (l.sourceType === 'awaken') return l.hero || null;
    const bag = l.ctx || {};
    if (l.ownerExpr === 'bondA') return bag.bondA || null;
    if (l.ownerExpr === 'bondB') return bag.bondB || null;
    return null;
  }

  /**
   * 监听器是否暂停：源名士（或羁绊成员）气绝时暂停而非注销 —— 复活后自动恢复。
   * onFaint 例外：羁绊成员气绝本身就是它的触发条件，暂停会导致永不触发。
   */
  isListenerPaused(l) {
    if (l.trigger === 'onFaint') return false;
    if (l.sourceType === 'awaken') return !l.hero || !l.hero.alive;
    const bag = l.ctx || {};
    if (l.sourceType === 'destiny' || l.sourceType === 'bond') {
      const a = bag.bondA, b = bag.bondB;
      return !(a && a.alive) || !(b && b.alive);
    }
    return false;
  }
}

/* ==========================================================================
   Resolver —— 效果指令执行器（模块 6 卡牌结算引擎）
   ========================================================================== */
class Resolver {
  constructor(game) { this.game = game; }

  /** 严格按数组顺序串行执行（schema.md 结算约定 1） */
  run(effects, ctx) {
    if (!effects) return;
    for (const e of effects) this.exec(e, ctx);
  }

  exec(e, ctx) {
    const g = this.game;
    switch (e.op) {
      case 'DAMAGE': {
        const amt = this.value(e, ctx);
        for (const t of this.targets(e.target, ctx)) {
          if (t.kind === 'lord') g.damageLord(t.player, amt, ctx, e);
          else g.damageHero(t.hero, amt, ctx, e);
        }
        break;
      }
      case 'HEAL': {
        const amt = this.value(e, ctx);
        for (const t of this.targets(e.target, ctx)) {
          if (t.kind === 'hero') g.healHero(t.hero, amt, ctx);
        }
        break;
      }
      case 'BUFF_POWER': {
        const v = this.value(e, ctx);
        for (const t of this.targets(e.target, ctx)) {
          if (t.kind !== 'hero') continue;
          if (e.duration === 'permanent') t.hero.permPower += v;
          else t.hero.turnPower += v;
          // onEnemyPowerDown：使敌方名士力量降低时（注意先判空，否则会读到 null.owner）
          if (v < 0 && ctx.caster && t.hero.owner !== ctx.caster.owner) {
            g.fireEvent('onEnemyPowerDown', { ...ctx, victim: t.hero, actor: ctx.caster });
          }
        }
        break;
      }
      case 'BUFF_HP': {
        const v = this.value(e, ctx);
        for (const t of this.targets(e.target, ctx)) {
          if (t.kind !== 'hero') continue;
          t.hero.permHp += v;
          if (v > 0) t.hero.hp += v;
          t.hero.clampHp();          // 上限变小（v<0）时把血夹回来
        }
        break;
      }
      case 'DRAW': {
        for (let i = 0; i < e.count; i++) g.drawCard(ctx.player);
        break;
      }
      case 'GAIN_ZHENYUAN': {
        ctx.player.zhenyuan += e.value;
        g.log(`${ctx.caster ? ctx.caster.name + ' ' : ''}获得 ${e.value} 点真元`, 'play');
        break;
      }
      case 'ATTACK_NOW': {
        const src = ctx.caster;
        if (!src || !src.alive || !src.owner) break;
        if (src.statuses.cannotAttack) break;   // 被【无法出击】封锁
        // 战斗牌：名士不在战斗区时先自动入场，否则战斗牌根本无法使用
        if (!src.inCombat) {
          const cur = src.owner.combatHero;
          if (cur && cur !== src) cur.zone = 'prep';
          src.zone = 'combat';
        }
        const bonus = (e.bonus || 0) + (ctx.mods.attack || 0);
        g.resolveAttack(src, { bonus, card: ctx.card, isCardAttack: true });
        ctx.killed = g.lastAttackKilled;   // 供同一张卡的 IF(killedThisAttack) 判定
        break;
      }
      case 'SET_STATUS': {
        for (const t of this.targets(e.target, ctx)) {
          if (t.kind === 'hero') t.hero.statuses[e.status] = true;
        }
        break;
      }
      case 'CLEAR_BUFFS': {
        for (const t of this.targets(e.target, ctx)) {
          if (t.kind !== 'hero') continue;
          t.hero.permPower = 0;
          t.hero.turnPower = 0;
          t.hero.permHp = Math.min(t.hero.permHp, 0);
          t.hero.statuses = {};
          t.hero.clampHp();           // 生命上限被清掉后，血可能超过上限
        }
        break;
      }
      case 'ADD_STACK': {
        const v = this.value(e, ctx);
        for (const t of this.targets(e.target, ctx)) {
          if (t.kind !== 'hero') continue;
          const gained = t.hero.addStack(e.stack, v, e.max);
          const st = config.stacks[e.stack];
          if (gained > 0) {
            g.log(`${t.hero.name} 获得 ${gained} 层【${st ? st.name : e.stack}】`, 'play');
            g.fireEvent('onStackAdded', { ...ctx, host: t.hero, stackId: e.stack, actor: ctx.caster });
          }
        }
        break;
      }
      case 'CONSUME_STACK': {
        for (const t of this.targets(e.target, ctx)) {
          if (t.kind !== 'hero') continue;
          const n = t.hero.stackCount(e.stack);
          if (n <= 0) continue;
          const st = config.stacks[e.stack];
          t.hero.stacks[e.stack] = 0;
          g.log(`${t.hero.name} 消耗 ${n} 层【${st ? st.name : e.stack}】`, 'play');
          for (let i = 0; i < n; i++) this.run(e.perStack, ctx);
        }
        break;
      }
      case 'AWAKEN': {
        const h = ctx.caster;
        if (!h || h.awakened) break;
        h.basePower = e.power;
        h.baseHealth = e.health;
        // 生命上限涨了就同步补血（避免觉醒反而掉血），上限跌了则夹回血 —— clampHp 两头都管
        h.hp += Math.max(0, e.health - (ctx.prevBaseHealth != null ? ctx.prevBaseHealth : 0));
        h.clampHp();
        h.awakened = true;
        g.trace('觉醒', h.name, `面板 力${e.power}/命${e.health}`, `当前血 ${h.hp}/${h.maxHp}`);
        g.log(`${h.name} 觉醒！面板变为 力${e.power} / 命${e.health}`, 'kill');
        break;
      }
      case 'REGISTER': {
        ctx.player.registerListeners([e], {
          sourceType: 'awaken', owner: ctx.player, hero: ctx.caster, ctx: {},
        });
        break;
      }
      case 'IF': {
        const ok = g.checkCondition(e.condition, ctx);
        this.run(ok ? e.then : e.else, ctx);
        break;
      }
      /* 战斗过程修正：只在对应 trigger 的上下文里有意义 */
      case 'MODIFY_ATTACK': ctx.mods.attack = (ctx.mods.attack || 0) + this.value(e, ctx); break;
      case 'MODIFY_DAMAGE': ctx.mods.damage = (ctx.mods.damage || 0) + this.value(e, ctx); break;
      case 'MODIFY_HEAL': ctx.mods.heal = (ctx.mods.heal || 0) + this.value(e, ctx); break;
      case 'SET_ATTACK_FLAG': (ctx.mods.flags = ctx.mods.flags || []).push(e.flag); break;
      case 'BUFF_DAMAGE_REDUCE': {
        for (const t of this.targets(e.target, ctx)) {
          if (t.kind === 'hero') t.hero.turnReduce += e.value;
        }
        break;
      }
      case 'MODIFY_COST': break; // 由 Game.effectiveCost 读取，执行期无操作
      default:
        console.warn('未实现指令', e.op);
    }
  }

  /** 取数值：支持 valueFrom（数值 = 层数） */
  value(e, ctx) {
    if (e.valueFrom) {
      const h = this.targets(e.valueFrom.target || 'self', ctx)[0];
      return h && h.kind === 'hero' ? h.hero.stackCount(e.valueFrom.stack) : 0;
    }
    return e.value || 0;
  }

  /** 目标解析（schema.md 第四节目标词表） */
  targets(t, ctx) {
    const me = ctx.player, foe = ctx.opponent;
    const H = h => (h ? [{ kind: 'hero', hero: h }] : []);
    const L = p => [{ kind: 'lord', player: p }];
    switch (t) {
      case 'self': return H(ctx.caster);
      case 'target': return H(ctx.chosen);
      case 'allyAny': return H(ctx.chosen);
      case 'enemyCombat': return H(foe.combatHero);
      case 'allyCombat': return H(me.combatHero);
      case 'enemyAll': return foe.aliveHeroes.map(h => ({ kind: 'hero', hero: h }));
      case 'allyAll': return me.aliveHeroes.map(h => ({ kind: 'hero', hero: h }));
      case 'allyPrepAll': return me.aliveHeroes.filter(h => h.zone === 'prep').map(h => ({ kind: 'hero', hero: h }));
      case 'lowestHpAlly': {
        const s = [...me.aliveHeroes].sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp);
        return H(s[0]);
      }
      case 'eventTarget': return H(ctx.eventTarget || ctx.victim);
      case 'eventSource': return H(ctx.eventSource || ctx.attacker);
      case 'attacker': return H(ctx.attacker);
      case 'bondA': return H(ctx.bondA);
      case 'bondB': return H(ctx.bondB);
      case 'bondSurvivor': {
        const s = [ctx.bondA, ctx.bondB].filter(h => h && h.alive);
        return H(s[0]);
      }
      case 'none': return [];
      default: return [];
    }
  }
}

/* ==========================================================================
   Game —— 游戏主控
   ========================================================================== */
class Game {
  constructor(p0Heroes, p1Heroes) {
    this.resolver = new Resolver(this);   // 必须在 Player 之前：羁绊开局就要结算
    this.turn = 0;
    this.activeIdx = 0;
    this.over = false;
    this.busy = false;          // 动画/结算中，屏蔽输入
    this.logLines = [];
    this.logSeq = 0;            // 战报累计条数（单调递增，不随截断倒退）
    this.players = [
      new Player('你', true, p0Heroes, this),
      new Player('敌方', false, p1Heroes, this),
    ];
    this.ai = new SimpleAI(this);
    // 羁绊结算必须等两名玩家都建好（要用到 player.foe）
    for (const p of this.players) for (const b of p.bonds) p.bindBond(b);
  }

  get active() { return this.players[this.activeIdx]; }
  get waiting() { return this.players[1 - this.activeIdx]; }
  get human() { return this.players[0]; }

  /* ---------- 日志 ---------- */
  /**
   * 调试日志开关。服务端用 `DEBUG=1 node server.js` 打开，客户端 URL 加 `?debug=1`。
   * 引擎两端共用，所以不能直接读 window / process —— 开关由外面写到 Game.DEBUG。
   */
  trace(...args) {
    if (Game.DEBUG) console.log('[百闻]', ...args);
  }

  log(text, kind = 'sys') {
    const line = { text, kind, turn: this.turn, seq: ++this.logSeq };
    this.logLines.push(line);
    // 只留最近 logKeep 条。注意 seq 是独立单调计数器，**不能**用 logLines.length 当序号：
    // 一旦这里开始截断，length 会倒退，而客户端是靠 logSeq 差值算「这次新增了哪几条」的。
    if (this.logLines.length > RULES.logKeep) {
      this.logLines.splice(0, this.logLines.length - RULES.logKeep);
    }
    if (typeof UI !== 'undefined') UI.pushLog(line);
  }

  /* ---------- 起始 ---------- */
  start() {
    const [a, b] = this.players;
    // 先手 4 张 / 后手 5 张
    for (let i = 0; i < RULES.startHandFirst; i++) this.drawCard(a, true);
    for (let i = 0; i < RULES.startHandSecond; i++) this.drawCard(b, true);
    this.log('对局开始 —— 先手 4 张，后手 5 张', 'turn');
    if (typeof UI !== 'undefined') UI.render();
    this.beginTurn();
  }

  /* ---------- 抽牌（模块 3） ---------- */
  drawCard(p, silent) {
    if (!p.deck.length) {
      p.fatigue++;
      const dmg = RULES.fatigueStart + p.fatigue - 1;
      p.lordHp -= dmg;
      this.log(`${p.name} 牌库已空，受到 ${dmg} 点疲劳伤害`, 'dmg');
      if (typeof UI !== 'undefined') UI.floatOn(`#${p.isHuman ? 'myHp' : 'foeHp'}`, dmg, 'var(--zhusha)');
      this.checkWin();
      return null;
    }
    const c = p.deck.pop();
    p.hand.push(c);
    if (!silent) this.log(`${p.name} 抽了 1 张牌`, 'sys');
    return c;
  }

  /* ---------- 回合开始（模块 10：六阶段状态机） ---------- */
  beginTurn() {
    if (this.over) return;
    this.turn++;
    const p = this.active;
    this.log(`—— 第 ${this.turn} 回合 · ${p.name} ——`, 'turn');

    // ① 准备阶段：真元回满
    p.zhenyuan = RULES.zhenyuanPerTurn;
    p.upgradesThisTurn = 0;
    p.attacksThisTurn = 0;

    // 气绝倒计时 −1，归零则复活（生命回满、等级保留、觉醒保留）
    for (const h of p.heroes) {
      if (h.zone === 'faint') {
        h.faintTimer--;
        if (h.faintTimer <= 0) {
          h.zone = 'prep';
          h.faintTimer = 0;
          h.hp = h.maxHp;
          this.log(`${h.name} 复活，生命回满`, 'heal');
        }
      }
      h.clearTurnState();
    }
    for (const l of p.listeners) l.firedTurn = -1;

    // 回合开始触发（天命 / 觉醒被动）
    this.fireEvent('onTurnStart', this.ctx(p, null));

    // ② 抽牌阶段
    this.drawCard(p);

    if (typeof UI !== 'undefined') UI.render();

    // AI 接管（延迟 1 秒，模拟思考）
    if (!p.isHuman) setTimeout(() => this.aiTurn(), RULES.aiThinkMs);
  }

  /** 构造一个效果上下文 */
  ctx(player, caster, extra = {}) {
    return {
      game: this, player, opponent: player.foe, caster,
      mods: {}, ...extra,
    };
  }

  /* ---------- 天命羁绊（模块 9 BondChecker） ---------- */

  /**
   * 检测某个牌手当前的天命羁绊状态。
   *
   * 「哪些羁绊能激活」由阵容快照在开局时定死（见 Player.activateBonds），
   * 这里只负责报告**此刻**的状态：成员气绝时 active 变 false，复活后自动恢复。
   * 所以羁绊是**暂停**而不是失效 —— 不需要在气绝/复活时重新检测，随用随算即可。
   */
  checkTianMing(player) {
    return player.bonds.map(b => {
      const a = player.heroByName(b.members[0]);
      const c = player.heroByName(b.members[1]);
      return {
        id: b.id, name: b.name, text: b.text,
        trigger: b.trigger, members: b.members,
        active: !!(a && a.alive && c && c.alive),   // 两人都在场才算生效
      };
    });
  }

  /* ---------- AI 回合入口（模块 12） ---------- */
  /**
   * AI 回合一键推进，由 beginTurn 在轮到 AI 时调用。
   * 具体决策全部交给 SimpleAI，每一步之间隔 RULES.aiThinkMs（默认 1 秒）模拟思考。
   */
  aiTurn() {
    const p = this.active;
    if (this.over || p.isHuman) return;
    this.busy = true;   // 只挡人类的输入：canPlay/canUpgrade/canAttack 已特判 isHuman
    this.ai.takeTurn(p);
  }

  /** 战场提示条：AI 行动时在战斗区中央显示一行字（人类操作不显示，免得挡视线） */
  announce(text) {
    if (typeof UI !== 'undefined') UI.banner(text);
  }

  /* ---------- 出牌（模块 6 + 11 合法性校验） ---------- */
  canPlay(p, card, caster) {
    if (this.over) return '对局已结束';
    if (p !== this.active) return '不是你的回合';   // 先判回合，否则会显示出「结算中」这种误导性提示
    // busy 只用来挡人类玩家在动画/结算中的输入 —— 不能挡 AI 自己，否则 AI 一张牌都打不出
    if (this.busy && p.isHuman) return '结算中';
    if (p.zhenyuan < this.effectiveCost(p, card)) return '真元不足';
    if (!caster || !caster.alive) return '名士不在场';

    if (card.type === 'destiny') {
      if (!p.bonds.some(b => b.id === card.bond)) return '羁绊未激活';
      if (p.destinyZone.length >= RULES.destinyCap) return '天命区已满';
      const bond = p.bonds.find(b => b.id === card.bond);
      const lv = Math.max(...bond.members.map(n => (p.heroByName(n) || {}).level || 0));
      if (lv < card.level) return `名士等级不足（需 ${card.level}）`;
    } else {
      if (caster.level < card.level) return `等级不足（需 ${card.level}）`;
    }
    // 每位名士每局只能觉醒一次（config.deck.maxAwakenPerHeroPerGame）。不在这里拦的话，
    // 第二张觉醒牌会被 Resolver 里的 `if (h.awakened) break` 整个吞掉：真元照扣、面板
    // 不动，玩家只看到「打出去了但什么都没发生」。拦在 canPlay 里，UI 会置灰并写明原因，
    // 一分真元都不花；AI 与联机服务端也都读这个函数，一处修改三处受益。
    if (card.type === 'awaken' && caster.awakened) return '该名士本局已觉醒';
    if (card.type === 'spell' && caster.statuses.cannotPlaySpell) return '本回合无法施法';

    // 法术牌若引用了「target」，必须有合法目标，否则会白付真元
    if (this.usesChosenTarget(card)) {
      if (card.target === 'enemyCombat' && !p.foe.combatHero) return '对方战斗区没有名士';
      if (card.target === 'allyAny' && !p.aliveHeroes.length) return '没有合法目标';
    }
    return null;
  }

  /** 卡牌效果里是否引用了「本次选定目标」—— 实现在 VIEW 里，客户端置灰要共用 */
  usesChosenTarget(card) {
    return VIEW.usesChosenTarget(card);
  }

  /** 真元消耗，含羁绊的 MODIFY_COST（身后之托：法术牌 −1） */
  effectiveCost(p, card) {
    let cost = card.cost;
    for (const b of p.bonds) {
      for (const e of b.effects) {
        if (e.op === 'MODIFY_COST' && e.cardType === card.type) cost += e.value;
      }
    }
    return Math.max(0, cost);
  }

  /** 该卡是否需要玩家选择目标 */
  needsChoice(card) { return card.target === 'allyAny' || card.target === 'enemyAny'; }

  playCard(p, card, caster, chosen) {
    const reason = this.canPlay(p, card, caster);
    if (reason) { if (typeof UI !== 'undefined') UI.toast(reason); return false; }

    const cost = this.effectiveCost(p, card);
    p.zhenyuan -= cost;
    const hi = p.hand.indexOf(card);
    if (hi >= 0) p.hand.splice(hi, 1);

    // 战斗区只有 1 人，enemyCombat / allyCombat 无需玩家选择，直接解析
    if (!chosen) {
      if (card.target === 'enemyCombat') chosen = p.foe.combatHero;
      else if (card.target === 'allyCombat') chosen = p.combatHero;
    }

    this.log(`${p.name} 打出《${card.name}》（${card.typeCN}·${cost} 真元）`, 'play');
    this.trace('出牌', p.name, '→', card.name, `费${cost} 余${p.zhenyuan}`,
      caster ? `施放=${caster.name}` : '', `觉醒=${caster && caster.awakened}`);
    if (!p.isHuman) this.announce(`敌方 ${caster ? caster.name + ' ' : ''}使用了《${card.name}》`);

    if (card.type === 'destiny') {
      p.playDestiny(card, caster);
      p.discard.push(card);
    } else {
      const prevBaseHealth = caster.baseHealth;
      const c = this.ctx(p, caster, { card, chosen, prevBaseHealth, actor: caster });
      this.resolver.run(card.effects, c);
      if (card.type === 'spell') this.fireEvent('onPlaySpell', c);
      p.discard.push(card);
    }

    this.checkWin();
    if (typeof UI !== 'undefined') UI.render();
    return true;
  }

  /* ---------- 升级（模块 10 阶段③） ---------- */
  /** 规则：升级不耗真元；目标等级 N 要求全员等级 ≥ N−1；每回合 1 次 */
  canUpgrade(p, hero) {
    if (this.over) return '对局已结束';
    if (this.busy && p.isHuman) return '结算中';
    if (p !== this.active) return '不是你的回合';
    if (!hero.alive) return '名士已气绝';
    if (hero.level >= 3) return '已满级';
    if (p.upgradesThisTurn >= RULES.upgradesPerTurn) return '本回合已升级过';
    const target = hero.level + 1;
    // 只数「未气绝」的名士：气绝那位要等 3 回合才复活，让他卡住全队升级等于把升级
    // 按钮锁死。这只是延后不是绕过 —— 复活时等级保留，回来照样计入前置。
    if (!p.aliveHeroes.every(h => h.level >= target - 1)) return `需存活名士全员达到 ${target - 1} 级`;
    return null;
  }

  upgrade(p, hero) {
    const reason = this.canUpgrade(p, hero);
    if (reason) { if (typeof UI !== 'undefined') UI.toast(reason); return false; }
    hero.level++;
    p.upgradesThisTurn++;
    this.log(`${hero.name} 升级至 ${hero.level} 级`, 'play');
    if (!p.isHuman) this.announce(`敌方 ${hero.name} 升级至 ${hero.level} 级`);
    if (typeof UI !== 'undefined') UI.render();
    return true;
  }

  /* ---------- 站位（阶段④） ---------- */
  moveToCombat(p, hero) {
    if (this.over) return false;
    if (p !== this.active) { if (typeof UI !== 'undefined') UI.toast('不是你的回合'); return false; }
    if (!hero.alive) { if (typeof UI !== 'undefined') UI.toast('名士已气绝'); return false; }
    const cur = p.combatHero;
    if (cur === hero) return false;
    if (cur) cur.zone = 'prep';       // 战斗区同时仅 1 名，原站位退回准备区
    hero.zone = 'combat';
    this.log(`${hero.name} 进入战斗区`, 'sys');
    if (!p.isHuman) this.announce(`敌方 ${hero.name} 进入战斗区`);
    if (typeof UI !== 'undefined') UI.render();
    return true;
  }

  /* ---------- 出击与伤害结算（模块 7 战斗结算器） ---------- */
  canAttack(p, hero) {
    if (this.over) return '对局已结束';
    if (this.busy && p.isHuman) return '结算中';
    if (p !== this.active) return '不是你的回合';
    if (!hero.alive) return '名士已气绝';
    if (hero.statuses.cannotAttack) return '本回合无法出击';
    if (hero.attacksThisTurn >= 1) return '本回合已出击';
    // 每回合只允许一名名士主动出击。出击已包含「上场」，所以不要求先站进战斗区 ——
    // 在准备区也能直接点。战斗牌走 ATTACK_NOW，根本不经过这里，天然不受限。
    if (p.attacksThisTurn >= RULES.attacksPerTurn) return '本回合已有一名名士出击';
    if (p.zhenyuan < RULES.attackCost) return '真元不足';
    return null;
  }

  /**
   * 玩家主动出击（消耗真元与次数）
   * 「上场」已并进来：不在战斗区时会先自动入场（顶掉原站位）再结算这一击，
   * 所以玩家只需要「出击」一个动作。战斗牌的立即出击走 ATTACK_NOW，同样自动入场。
   */
  attack(p, hero) {
    const reason = this.canAttack(p, hero);
    if (reason) { if (typeof UI !== 'undefined') UI.toast(reason); return false; }
    p.zhenyuan -= RULES.attackCost;
    p.attacksThisTurn++;
    if (!hero.inCombat) this.moveToCombat(p, hero);
    if (!p.isHuman) this.announce(`敌方 ${hero.name} 出击（${hero.power} 点）`);
    this.resolveAttack(hero, { bonus: 0, isCardAttack: false });
    return true;
  }

  /**
   * 一次出击的完整结算（规则文档阶段⑤）
   * isCardAttack=true 时由战斗牌触发：不检查出击次数，但非【迅捷】会占用次数
   */
  resolveAttack(attacker, opts = {}) {
    const p = attacker.owner, foe = p.foe;
    const card = opts.card || null;
    const swift = card ? card.has('迅捷') : false;
    const ranged = card ? card.has('远程') : false;
    const pierce = card ? card.has('贯通') : false;

    // 「每回合首次出击」必须在置位之前判定，否则觉醒被动永远不会触发
    const firstAttack = !attacker.attackedThisTurn;
    if (!(opts.isCardAttack && swift)) attacker.attacksThisTurn++;
    attacker.attackedThisTurn = true;

    // 1. 结算出击方加成（onAttack 监听器）
    const c = this.ctx(p, attacker, { card, attacker, firstAttack, actor: attacker });
    this.fireEvent('onAttack', c);
    const flags = c.mods.flags || [];
    const isRanged = ranged || flags.includes('ranged');
    const bonus = (opts.bonus || 0) + (c.mods.attack || 0);

    const lordSel = foe.isHuman ? '#myHp' : '#foeHp';
    const defender = foe.combatHero;
    this.trace('出击', attacker.name, `力${attacker.power}+${bonus}`,
      defender ? `目标=${defender.name}(${defender.hp}血)` : '目标=使君',
      isRanged ? '远程' : '', pierce ? '贯通' : '');
    // 攻击特效（单机模式在这里触发；联机模式结算在服务端，客户端从战报文本还原）
    if (typeof UI !== 'undefined') UI.attackFx(attacker.name, defender ? defender.name : null);

    // 3. 对方战斗区为空 → 直接打使君
    if (!defender) {
      const dmg = Math.max(0, attacker.power + bonus);
      this.log(`${attacker.name} 直接攻击${foe.name}使君（${dmg} 点）`, 'dmg');
      this.damageLord(foe, dmg, c, null);
      if (typeof UI !== 'undefined') UI.floatOn(lordSel, dmg, 'var(--zhusha)');
      this.lastAttackKilled = false;
      this.checkWin();
      if (typeof UI !== 'undefined') UI.render();
      return;
    }

    // 2. 与对方战斗区名士互伤（溢出量先记下 —— 气绝会把 hp 归零，事后算不出来）
    const dmg = this.calculateDamage(attacker, defender, bonus);
    const hpBefore = defender.hp;
    this.log(`${attacker.name} 迎战 ${defender.name} —— ${dmg} 点伤害`, 'dmg');
    if (typeof UI !== 'undefined') UI.floatOn(`[data-hero="${defender.id}"]`, dmg, 'var(--zhusha)');
    // 溢出要按「实扣伤害」算，不能用上面的面板值 —— 面板值还没过 onDamaged 的
    // MODIFY_DAMAGE（如嬴政「金龙护体」受伤 −1、花木兰「替父从军」−2），那样会高估。
    const dealt = this.damageHero(defender, dmg, c, null);

    // 4. 贯通：溢出伤害由对方使君承受
    if (pierce) {
      const ov = Math.max(0, dealt - hpBefore);
      if (ov > 0) {
        this.log(`【贯通】溢出 ${ov} 点伤害转由${foe.name}使君承受`, 'dmg');
        this.damageLord(foe, ov, c, null);
        if (typeof UI !== 'undefined') UI.floatOn(lordSel, ov, 'var(--zhusha)');
      }
    }

    // 5. 反击（【远程】跳过）
    if (defender.alive && !isRanged) {
      const back = this.calculateDamage(defender, attacker, 0);
      this.log(`${defender.name} 反击 ${attacker.name}（${back} 点）`, 'dmg');
      this.damageHero(attacker, back, this.ctx(foe, defender, { attacker: defender }), null);
    }

    // 6. 击杀事件
    this.lastAttackKilled = !defender.alive;
    if (this.lastAttackKilled) {
      this.fireEvent('onKill', { ...c, eventSource: attacker, victim: defender, actor: attacker, killed: true });
    }

    this.checkWin();
    if (typeof UI !== 'undefined') UI.render();
  }

  /** 伤害公式（模块 7）：力量 + 加成 − 目标减伤 + 目标受伤加成 */
  calculateDamage(attacker, defender, bonus = 0) {
    const raw = attacker.power + bonus;
    const final = raw - defender.damageReduce + defender.damageTakenBonus;
    return Math.max(0, final);
  }

  /**
   * 对名士造成伤害。onDamaged / onAllyDamaged 的 MODIFY_DAMAGE 在这里结算。
   * @returns {number} 实际打出的伤害（减免/加成已计入，**未按剩余生命截断**）。
   *   【贯通】要的是「超出剩余生命多少」，所以必须用这个未截断的值 —— 不能改用
   *   `hpBefore - hero.hp`：气绝时 hp 被 faint() 归零，那个差值永远等于 hpBefore。
   *   不关心伤害数字的调用方忽略返回值即可（等同旧行为）。
   */
  damageHero(hero, amount, ctx, e) {
    const base = {
      ...(ctx || this.ctx(hero.owner, null)),
      mods: {}, eventTarget: hero, victim: hero, listenerOwner: hero.owner,
    };
    // onDamaged 只对「受伤者本人」的觉醒被动生效；onAllyDamaged 是全局光环，不限定名士
    this.fireEvent('onDamaged', { ...base, actor: hero });
    this.fireEvent('onAllyDamaged', base);
    const dmg = Math.max(0, amount + (base.mods.damage || 0));
    hero.hp -= dmg;
    if (dmg > 0) this.log(`${hero.name} 受到 ${dmg} 点伤害（剩余 ${Math.max(0, hero.hp)}）`, 'dmg');
    if (hero.hp <= 0) this.faint(hero);
    return dmg;
  }

  damageLord(p, amount, ctx, e) {
    const dmg = Math.max(0, amount);
    if (!dmg) return;
    p.lordHp -= dmg;
    this.log(`${p.name} 使君受到 ${dmg} 点伤害（剩余 ${Math.max(0, p.lordHp)}）`, 'dmg');
  }

  healHero(hero, amount, ctx) {
    if (!hero.alive) return;
    const healer = (ctx && ctx.caster) || null;
    const c = {
      ...(ctx || {}), mods: {}, eventTarget: hero, healer,
      actor: healer, listenerOwner: hero.owner,
    };
    this.fireEvent('onHeal', c);
    const amt = Math.max(0, amount + (c.mods.heal || 0));
    const real = Math.min(amt, hero.maxHp - hero.hp);
    if (real <= 0) return;
    hero.hp += real;
    this.log(`${hero.name} 恢复 ${real} 点生命`, 'heal');
    if (typeof UI !== 'undefined') UI.floatOn(`[data-hero="${hero.id}"]`, real, '#4a6640');
  }

  /** 气绝：倒计时 3 回合，等级与觉醒状态保留 */
  faint(hero) {
    const wasCombat = hero.inCombat;      // 必须在改 zone 之前判断
    hero.hp = 0;
    hero.zone = 'faint';
    hero.faintTimer = RULES.faintTurns;
    // 气绝即洗掉「本回合」的临时状态与力量/减伤 —— beginTurn 已经不再清这些了，
    // 不洗的话它们会跨过 3 回合的倒计时、跟着复活一起回来
    hero.clearTurnMods();
    this.log(`${hero.name} 气绝，${RULES.faintTurns} 回合后复活`, 'kill');
    this.trace('气绝', hero.owner.name, hero.name, `力${hero.power}`, `觉醒=${hero.awakened}`, `等级=${hero.level}`);
    if (wasCombat) this.log(`${hero.owner.name} 的战斗区空出`, 'sys');
    this.fireEvent('onFaint', {
      ...this.ctx(hero.owner, hero),
      eventTarget: hero, victim: hero, actor: hero,
    });
  }

  /* ---------- 事件总线（模块 8） ---------- */
  fireEvent(trigger, ctx) {
    const owner = ctx.listenerOwner || (ctx.caster ? ctx.caster.owner : null) || ctx.player;
    if (!owner) return;
    for (const l of [...owner.listeners]) {
      if (l.trigger !== trigger) continue;
      if (owner.isListenerPaused(l)) continue;
      if (l.stackFilter && l.stackFilter !== ctx.stackId) continue;
      if (l.once === 'perTurn' && l.firedTurn === this.turn) continue;
      // 名士限定的监听器：只有该名士本人作为行动者时才响应
      if (ctx.actor) {
        const lh = owner.resolveListenerHero(l);
        if (lh && lh !== ctx.actor) continue;
      }
      if (l.condition && !this.checkCondition(l.condition, ctx)) continue;
      if (l.once === 'perTurn') l.firedTurn = this.turn;
      this.resolver.run(l.effects, {
        ...ctx,
        mods: ctx.mods || {},
        player: owner,
        opponent: owner.foe,
        caster: l.hero || ctx.caster || ctx.attacker || null,
        bondA: l.ctx ? l.ctx.bondA : ctx.bondA,
        bondB: l.ctx ? l.ctx.bondB : ctx.bondB,
        listenerOwner: owner,
      });
    }
  }

  /* ---------- 条件判定（schema.md 第五节） ---------- */
  checkCondition(cond, ctx) {
    if (!cond) return true;
    const me = ctx.caster, foe = ctx.opponent || (ctx.player ? ctx.player.foe : null);
    const tgt = () => ctx.chosen || ctx.victim || null;
    if (cond.targetPowerGt) {
      const t = tgt(), r = cond.targetPowerGt === 'attacker' ? ctx.attacker : me;
      return !!(t && r && t.power > r.power);
    }
    if (cond.targetPowerLt) {
      const t = tgt(), r = cond.targetPowerLt === 'attacker' ? ctx.attacker : me;
      return !!(t && r && t.power < r.power);
    }
    if (cond.targetLevelLt) {
      const t = tgt();
      return !!(t && me && t.level < me.level);
    }
    if (cond.selfStack) {
      return !!(me && me.stackCount(cond.selfStack.stack) >= cond.selfStack.gte);
    }
    if (cond.targetStack) {
      const t = tgt() || (foe && foe.combatHero);
      return !!(t && t.stackCount(cond.targetStack.stack) >= cond.targetStack.gte);
    }
    if (cond.targetHpFull) {
      const t = tgt();
      return !!(t && t.hp >= t.maxHp);
    }
    if (cond.selfHpBelowHalf) return !!(me && me.hp < me.maxHp / 2);
    if (cond.killedThisAttack) return !!ctx.killed;
    if (cond.attackedThisTurn) return !!(me && me.attackedThisTurn);
    if (cond.isFirstAttackThisTurn) return !!ctx.firstAttack;
    return true;
  }

  /* ---------- 结束回合（阶段⑥） ---------- */
  endTurn() {
    if (this.over || this.busy) return;
    const p = this.active;
    this.fireEvent('onTurnEnd', this.ctx(p, null));

    // 清除本回合临时增益 / 减益 / 状态。只清**正在结束回合这一方**的名士 ——
    // 贴到对手名士身上的「本回合」效果，要等对手自己的回合结束才失效。
    for (const h of p.heroes) { h.clearTurnState(); h.clearTurnMods(); }
    for (const l of p.listeners) l.firedTurn = -1;

    // 手牌弃至上限
    while (p.hand.length > RULES.handLimit) {
      const c = p.hand.pop();
      p.discard.push(c);
      this.log(`${p.name} 弃置《${c.name}》（手牌上限）`, 'sys');
    }
    // 真元清零
    p.zhenyuan = 0;

    this.activeIdx = 1 - this.activeIdx;
    if (typeof UI !== 'undefined') UI.render();
    this.beginTurn();
  }

  checkWin() {
    const dead = this.players.find(p => p.lordHp <= 0);
    if (!dead || this.over) return;
    this.over = true;
    this.busy = false;
    const humanWon = !dead.isHuman;
    this.trace('对局结束', `${dead.name} 使君血量 ${dead.lordHp}`, `第 ${this.turn} 回合`, `胜者=${humanWon ? '人类' : 'AI/对手'}`);
    this.log(humanWon ? '敌方使君倒下 —— 你赢了！' : '我方使君倒下 —— 你输了', 'kill');
    if (typeof UI !== 'undefined') UI.showOver(humanWon);
  }
}

Game.DEBUG = false;   // 调试日志总开关：服务端 DEBUG=1 打开，客户端 ?debug=1 打开

/* ==========================================================================
   SimpleAI —— 启发式评分（模块 12）：先解场 → 再升级 → 后打脸
   ========================================================================== */
/** canPlay / canUpgrade / canAttack 返回 null 表示可行，返回字符串表示被拦下的原因 */
function canGo(reason) { return reason === null || reason === undefined; }

class SimpleAI {
  constructor(game) { this.g = game; }

  /* ---------- 回合循环 ---------- */

  /**
   * 逐步推进 AI 的回合：每次只做一个动作，然后隔 RULES.aiThinkMs（默认 1 秒）
   * 再做下一个。拆成一步一停，一是让人类看清 AI 在干什么，二是避免一帧内
   * 把所有效果一次结算完、动画全糊在一起。
   */
  takeTurn(p) {
    const foe = p.foe;
    const step = () => {
      if (this.g.over) return;
      let acted = false;
      try { acted = this.oneAction(p, foe); }
      catch (err) { console.error('AI 出错', err); acted = false; }
      if (typeof UI !== 'undefined') UI.render();
      if (acted) setTimeout(step, RULES.aiThinkMs);   // 还有事可做 → 想 1 秒再来一步
      else this.finish(p);
    };
    step();
  }

  /**
   * 一个动作。按规格的四条优先级：
   *   ① 升级核心名士 —— 免费且每回合限 1 次，先做不吃亏：解锁高费牌之后才打得出来
   *   ② 能直接击败玩家就击败
   *   ③ 高性价比卡牌（收益点数 ÷ 真元消耗 最大）
   *   ④ 真元不足 / 无事可做 → 交回合
   * 中间插了两条固定战术：觉醒牌单独优先（长期投资），对方前排值得处理时先解场。
   */
  oneAction(p, foe) {
    // ① 升级核心名士：手上有高费牌等着解锁的那位
    const ups = p.heroes.filter(h => canGo(this.g.canUpgrade(p, h)));
    if (ups.length) {
      ups.sort((a, b) => this.levelHunger(p, b) - this.levelHunger(p, a));
      this.g.upgrade(p, ups[0]);
      return true;
    }

    // ② 斩杀：本回合能直接把对方使君打到 0，就立刻动手，不再算别的
    const lethal = this.findLethal(p, foe);
    if (lethal) return this.execute(p, lethal);

    // ③ 觉醒牌：中后期核心，越早打出越赚，在收益排序里给它单独让路
    const aw = p.hand.find(c => c.type === 'awaken' && this.playable(p, c));
    if (aw) return this.play(p, aw, null);

    // ④ 解场：对方战斗区站着人，且值得花牌处理
    const block = foe.combatHero;
    if (block) {
      const nuke = this.pickSpell(p, block);
      if (nuke) return this.play(p, nuke, block);
    }

    // ⑤ 性价比最高的牌
    const best = this.pickBest(p, foe);
    if (best) return this.play(p, best, null);

    // ⑥ 普通出击（打脸）。出击自带上场，准备区的名士也能直接打 ——
    //    优先用已经站在战斗区的（免得白顶掉一个），没有就挑最强的那个。
    const pick = p.combatHero || [...p.aliveHeroes].sort((a, b) => b.power - a.power)[0];
    if (pick && canGo(this.g.canAttack(p, pick))) { this.g.attack(p, pick); return true; }

    // ⑦ 真元不足 / 确实没事可做 → 交回合
    return false;
  }

  finish(p) {
    this.g.busy = false;
    this.g.endTurn();
  }

  /* ---------- 斩杀判定 ---------- */

  /** 本次出击能造成的伤害候选：普通出击 + 手里能立刻出击的战斗牌 */
  lethalOptions(p, foe) {
    const hero = p.combatHero;
    if (!hero || hero.statuses.cannotAttack) return [];
    const opts = [];
    if (hero.attacksThisTurn < 1 && p.attacksThisTurn < RULES.attacksPerTurn
        && p.zhenyuan >= RULES.attackCost) {
      opts.push({ kind: 'attack', hero, dmg: hero.power });
    }
    for (const c of p.hand) {
      if (c.type !== 'combat') continue;
      // ATTACK_NOW 会把该名士推上战斗区，所以只考虑战斗区那位本人的战斗牌
      if (this.casterFor(p, c) !== hero) continue;
      if (!this.playable(p, c)) continue;
      opts.push({ kind: 'card', hero, card: c, dmg: hero.power + this.attackBonusOf(c) });
    }
    return opts.sort((a, b) => b.dmg - a.dmg);
  }

  /**
   * 本回合能否直接击杀玩家。
   * 对方战斗区空着 → 伤害直接落到使君身上；否则只有【贯通】的溢出部分能打到使君。
   */
  findLethal(p, foe) {
    const best = this.lethalOptions(p, foe)[0];
    if (!best) return null;
    const block = foe.combatHero;
    if (!block) return best.dmg >= foe.lordHp ? best : null;
    if (best.kind === 'card' && best.card.has('贯通')) {
      const effHp = block.hp + block.damageReduce - block.damageTakenBonus;
      if (best.dmg - effHp >= foe.lordHp) return best;
    }
    return null;
  }

  execute(p, opt) {
    return opt.kind === 'attack' ? this.g.attack(p, opt.hero) : this.play(p, opt.card, null);
  }

  /** 战斗牌本次出击的力量加成（IF 取收益更大的分支；层数部分粗估为 0，不追求精确） */
  attackBonusOf(card) {
    const walk = arr => {
      let b = 0;
      for (const e of (arr || [])) {
        if (!e || typeof e !== 'object') continue;
        if (e.op === 'ATTACK_NOW') b += e.bonus || 0;
        else if (e.op === 'MODIFY_ATTACK') b += e.value || 0;
        else if (e.op === 'IF') b += Math.max(walk(e.then), walk(e.else));
        else if (e.op === 'CONSUME_STACK') b += walk(e.perStack);
      }
      return b;
    };
    return walk(card.effects);
  }

  /* ---------- 收益评估（只用于排序，不求精确） ---------- */

  /**
   * 一张牌的收益点数。权重：伤害 1 点 = 1 分，治疗 = 0.6，抽 1 张 = 2，真元 1 点 = 1，
   * 增益 1 点 = 0.8，层数 1 层 = 1.2。IF 取收益更大的分支，免得把《长恨歌》这类条件牌估低。
   */
  cardScore(p, card) {
    return this.effectsScore(card.effects, this.casterFor(p, card));
  }

  effectsScore(effects, caster) {
    let s = 0;
    for (const e of (effects || [])) {
      if (!e || typeof e !== 'object') continue;
      switch (e.op) {
        case 'ATTACK_NOW':    s += (caster ? caster.power : 0) + (e.bonus || 0); break;
        case 'DAMAGE':        s += e.target === 'self' ? -(e.value || 0) * 0.5 : Math.max(0, e.value || 0); break;
        case 'HEAL':          s += (e.value || 0) * 0.6; break;
        case 'DRAW':          s += (e.count || 0) * 2; break;
        case 'GAIN_ZHENYUAN': s += (e.value || 0); break;
        case 'BUFF_POWER': case 'BUFF_HP': case 'BUFF_DAMAGE_REDUCE':
                              s += Math.abs(e.value || 0) * 0.8; break;
        case 'ADD_STACK':     s += (e.value || 0) * 1.2; break;
        case 'CONSUME_STACK': s += (caster ? caster.stackCount(e.stack) : 0) * 1.2
                                 + this.effectsScore(e.perStack, caster); break;
        case 'IF':            s += Math.max(this.effectsScore(e.then, caster),
                                            this.effectsScore(e.else, caster)); break;
        case 'AWAKEN':        s += 6; break;   // 觉醒是长期投资，给个固定高分
        default:              s += 1;          // 层数 / 状态 / 杂项，给个基础分
      }
    }
    return s;
  }

  /** 性价比 = 收益点数 ÷ 真元消耗，取最高的一张 */
  pickBest(p, foe) {
    const reserve = this.reserveZY(p);
    let best = null, bestRatio = -1;
    for (const c of p.hand) {
      const cost = this.g.effectiveCost(p, c);
      if (p.zhenyuan - cost < reserve) continue;   // 给本回合的出击留出真元
      if (!this.playable(p, c)) continue;
      let ratio = this.cardScore(p, c) / Math.max(1, cost);
      // 战斗牌会强制把名士推上战斗区：要顶掉现有前排时打个折
      if (c.type === 'combat' && p.combatHero && p.combatHero !== this.casterFor(p, c)) ratio *= 0.5;
      if (ratio > bestRatio) { bestRatio = ratio; best = c; }
    }
    return best;
  }

  /** 解场：优先挑「能一击解掉对方前排」的伤害法术，其次挑最便宜的 */
  pickSpell(p, target) {
    const worth = target.power >= 3 || target.hp <= 5;
    if (!worth) return null;
    const cands = p.hand.filter(c => c.type === 'spell' && this.playable(p, c) && this.hasDamage(c));
    if (!cands.length) return null;
    const effHp = target.hp + target.damageReduce - target.damageTakenBonus;
    cands.sort((a, b) => {
      const ka = this.cardScore(p, a) >= effHp ? 0 : 1;
      const kb = this.cardScore(p, b) >= effHp ? 0 : 1;
      return ka - kb || this.g.effectiveCost(p, a) - this.g.effectiveCost(p, b);
    });
    return cands[0];
  }

  hasDamage(card) {
    let found = false;
    const walk = arr => (arr || []).forEach(e => {
      if (!e || typeof e !== 'object') return;
      if (e.op === 'DAMAGE' || e.op === 'ATTACK_NOW') found = true;
      walk(e.then); walk(e.else); walk(e.perStack);
    });
    walk(card.effects);
    return found;
  }

  /* ---------- 小工具 ---------- */

  /** 该名士手上被等级卡住的高费牌越多，越该先升级它（规格：「手中有高费卡牌的名士」） */
  levelHunger(p, h) {
    return p.hand.reduce((s, c) => {
      if (c.owner !== h.name || c.level <= h.level) return s;
      return s + c.cost;      // 费用越高，解锁它的价值越大
    }, 0);
  }

  casterFor(p, card) {
    if (card.type === 'destiny') return p.heroes.find(h => h.alive) || p.heroes[0];
    return p.heroByName(card.owner);
  }

  playable(p, card) {
    const caster = this.casterFor(p, card);
    return !!caster && canGo(this.g.canPlay(p, card, caster));
  }

  /** 本回合还留着「主动出击」名额，就为它预留真元（attackCost 为 0 时自然无影响） */
  reserveZY(p) {
    const h = p.combatHero;
    const wantAttack = !!(h && !h.statuses.cannotAttack
      && h.attacksThisTurn < 1 && p.attacksThisTurn < RULES.attacksPerTurn);
    return wantAttack ? RULES.attackCost : 0;
  }

  play(p, card, chosen) {
    const caster = this.casterFor(p, card);
    // allyAny 需要选目标：治疗挑血最少的，增益挑力量最高的
    if (!chosen && card.target === 'allyAny') {
      const pool = [...p.aliveHeroes];
      const isHeal = card.effects.some(e => e.op === 'HEAL' || e.op === 'IF');
      chosen = isHeal
        ? pool.sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0]
        : pool.sort((a, b) => b.power - a.power)[0];
    }
    return this.g.playCard(p, card, caster, chosen);
  }
}

/* --------------------------------------------------------------------------
   VIEW —— 视图模型
   把 Game 归一化成可 JSON 序列化的快照。单机版直接拿它渲染，服务器拿它生成
   发给客户端的 state。两边共用同一套结构，于是 UI 只有一条渲染路径。
   （本段刻意不用 ==== 分隔线：server.js 抽取引擎时靠那个定位，用它会被切掉。）
   -------------------------------------------------------------------------- */
const VIEW = {
  hero: h => ({
    id: h.id, name: h.name, rarity: h.rarity, role: h.role, level: h.level,
    hp: Math.max(0, h.hp), maxHp: h.maxHp, power: h.power,
    zone: h.zone, faintTimer: h.faintTimer, awakened: h.awakened,
    alive: h.alive, inCombat: h.inCombat,
    stacks: { ...h.stacks }, statuses: { ...h.statuses },
    permPower: h.permPower, turnPower: h.turnPower, turnReduce: h.turnReduce,
    // 该名士参与的天命羁绊；任一成员气绝则 active=false（暂停，复活后自动恢复）
    tianMing: (h.tianMing || []).map(x => {
      const mate = x.partner ? h.owner.heroByName(x.partner) : null;
      return {
        id: x.id, name: x.name, text: x.text, trigger: x.trigger, partner: x.partner,
        active: !!(h.alive && mate && mate.alive),
      };
    }),
  }),
  card: (game, p, c) => ({
    id: c.id, name: c.name, owner: c.owner, level: c.level,
    cost: game.effectiveCost(p, c),          // 已计入羁绊的减费
    type: c.type, shape: c.shape, bond: c.bond || null,
    keywords: c.keywords || [], target: c.target, text: c.text,
  }),
  player: (p, idx, game) => ({
    idx, name: p.name,
    lordHp: Math.max(0, p.lordHp), zhenyuan: p.zhenyuan,
    deckCount: p.deck.length, handCount: p.hand.length, discardCount: p.discard.length,
    // 天命区：已打出的天命牌。active 表示它对应的羁绊是否还在生效（成员气绝即暂停）
    destinyZone: p.destinyZone.map(d => {
      const b = p.bonds.find(x => x.id === d.card.bond);
      const live = b ? b.members.every(n => { const h = p.heroByName(n); return h && h.alive; }) : false;
      return { name: d.card.name, text: d.card.text, bond: d.card.bond, active: live };
    }),
    // 羁绊状态走 Game.checkTianMing()，保证「检测」只有一份实现
    bonds: game && game.checkTianMing ? game.checkTianMing(p) : [],
    heroes: p.heroes.map(VIEW.hero),
  }),
  /** 卡牌效果里是否引用了「本次选定目标」（target: "target"）。
      服务端校验和客户端置灰都用它，必须只有一份实现，否则两边会判断不一致。 */
  usesChosenTarget: card => {
    let found = false;
    const walk = arr => (arr || []).forEach(e => {
      if (!e || typeof e !== 'object') return;
      if (e.target === 'target') found = true;
      walk(e.then); walk(e.else); walk(e.perStack);
    });
    walk(card.effects);
    return found;
  },

  /** 这张牌由哪位名士施放：天命牌归羁绊，其余归 owner */
  casterFor: (p, card) => (card.type === 'destiny'
    ? (p.heroes.find(h => h.alive) || p.heroes[0] || null)
    : p.heroByName(card.owner)),

  /** seat 是「看的人」的座位号：只有他自己的 hand 是明牌，对手只给张数 */
  snapshot: (game, seat) => {
    const p = game.players[seat];
    return {
      started: true,                  // 快照存在就意味着对局已开始；联机模式下由服务器的房间字段覆盖
      you: seat,
      turn: game.turn, activeIdx: game.activeIdx, over: game.over,
      players: game.players.map((p, i) => VIEW.player(p, i, game)),
      hand: p.hand.map(c => {
        const cv = VIEW.card(game, p, c);
        // 出牌裁决由引擎给出，客户端直接拿它置灰卡面。
        // 让客户端自己重写一套 canPlay 判断，必然和引擎产生出入 —— 一出错就是
        // 「客户端说能打 → 服务端拒绝 → 客户端还认为能打」的死循环。
        cv.playable = game.canPlay(p, c, VIEW.casterFor(p, c));
        return cv;
      }),
      log: game.logLines.slice(-60),
      logSeq: game.logSeq,            // 单调递增，客户端靠它算出「这次新增了哪几条」
    };
  },
};

/* ==========================================================================
   Net —— 联机客户端（WebSocket）
   只负责连接、重连、收发报文；怎么处理消息由 UI 订阅。
   ========================================================================== */
const Net = {
  ws: null,
  url: '',
  roomId: null,
  token: null,
  seat: null,
  connected: false,
  manual: false,       // 主动断开时不自动重连
  retry: 0,
  _debug: false,       // URL 加 ?debug=1 打开收发日志
  _timer: null,
  _h: {},

  /** 默认连本机 8080；页面地址带 ?server=ws://x.x.x.x:8080 时用它 */
  defaultUrl() {
    let q = null;
    try { q = new URLSearchParams(location.search).get('server'); } catch (e) { q = null; }
    if (q) return q;
    return `ws://${location.hostname || 'localhost'}:8080`;
  },

  on(type, fn) { (this._h[type] = this._h[type] || []).push(fn); },

  emit(type, msg) {
    if (this._debug) console.log('[ws←]', type, msg);
    for (const fn of (this._h[type] || [])) {
      // 单条消息处理出错不能拖垮整个客户端
      try { fn(msg); } catch (err) { console.error('联机消息处理出错：', type, err); }
    }
  },

  connect(url) {
    this.manual = false;
    if (url) this.url = url;
    if (!this.url) this.url = this.defaultUrl();
    // 已经在连或已连上就别重复开
    if (this.ws && (this.ws.readyState === 0 || this.ws.readyState === 1)) return;
    UI.setConn('connecting');

    let ws;
    try { ws = new WebSocket(this.url); }
    catch (err) { UI.setConn('down', `服务器地址无效：${this.url}`); return; }
    this.ws = ws;

    ws.onopen = () => {
      this.connected = true;
      this.retry = 0;
      UI.setConn('ok');
      // 手里还留着房间凭证就自动认领回原座位 —— 客户端不需要自己缓存棋局
      if (this.roomId && this.token) this.send('resume', { roomId: this.roomId, token: this.token });
    };

    ws.onmessage = ev => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }   // 脏报文直接丢
      if (msg && typeof msg.type === 'string') this.emit(msg.type, msg);
    };

    ws.onclose = () => {
      this.connected = false;
      if (!this.manual) this.scheduleReconnect();
    };

    // onerror 之后紧接着一定会触发 onclose，重连逻辑统一放在那里
    ws.onerror = () => {};
  },

  scheduleReconnect() {
    if (this.manual) return;
    this.retry++;
    const delay = Math.min(8000, 600 * Math.pow(2, Math.min(this.retry - 1, 4)));
    UI.setConn('down', `连接中断，${(delay / 1000).toFixed(1)} 秒后重连（第 ${this.retry} 次）…`);
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.connect(), delay);
  },

  send(type, payload) {
    if (!this.ws || this.ws.readyState !== 1) { UI.toast('尚未连接到服务器'); return false; }
    const msg = Object.assign({ type }, payload || {});
    if (this._debug) console.log('[ws→]', type, msg);
    try { this.ws.send(JSON.stringify(msg)); return true; }
    catch (e) { UI.toast('发送失败'); return false; }
  },

  /** 彻底断开且不重连 */
  close() {
    this.manual = true;
    clearTimeout(this._timer);
    if (this.ws) { try { this.ws.close(); } catch (e) { /* ignore */ } }
    this.ws = null;
    this.connected = false;
  },

  forget() { this.roomId = null; this.token = null; this.seat = null; },
};

/* ==========================================================================
   音频 —— 全部用 Web Audio API 现场合成，不依赖任何音频文件

   为什么放 UI 段而不是引擎段：引擎段会被 sync-engine 抽进 server.js 在 Node 里跑，
