    <meta name="description" content="马学敏的个人主页 - 电子信息类本科生" />
    <meta name="theme-color" content="#070d16" />
    <script>
      // 首屏脚本：在样式生效前定好主题，避免「先闪深色、再切浅色」
      ;(function () {
        try {
          var t = localStorage.getItem('cc-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'light' ? '#f6f1e7' : '#070d16')
        } catch (e) {}
      })()
    </script>
