<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="马学敏的个人主页 - 电子信息类本科生" />
    <meta name="theme-color" content="#070d16" />
    <script>
      // 首屏脚本：在样式生效前定好主题，避免「先闪深色、再切浅色」
      // 支持 ?theme=light|dark 临时指定（用于分享/截图），不写入存储
      ;(function () {
        try {
          var q = /[?&]theme=(light|dark)/.exec(location.search)
          var t = q ? q[1] : localStorage.getItem('cc-theme')
          // 默认深空（原风格）——不跟随系统；只有手动点过主题按钮才用米纸浅色
          if (t !== 'light' && t !== 'dark') t = 'dark'
          document.documentElement.dataset.theme = t
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'light' ? '#f6f1e7' : '#070d16')
        } catch (e) {}
      })()
    </script>
